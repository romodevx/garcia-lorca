<style>
  :root { --pg-bg: #E9EDE8; --pg-card: #fff; --pg-ink: #16241B; --pg-mut: #5E6E63; --pg-line: #d8e0d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--pg-bg);
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--pg-ink);
    -webkit-font-smoothing: antialiased;
  }
  .pg { max-width: 1120px; margin: 0 auto; padding: 30px 22px 70px; }

  .pg-head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .pg-mark {
    width: 54px; height: 54px; border-radius: 18px; flex-shrink: 0;
    background: linear-gradient(150deg, #7AC400, #0A7A2F);
    display: flex; align-items: center; justify-content: center;
    font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 24px; color: #fff;
    box-shadow: 0 12px 26px -10px rgba(10,122,47,.6);
  }
  .pg-head h1 { font-family: "Baloo 2", sans-serif; font-size: 24px; margin: 0; letter-spacing: -.4px; }
  .pg-head p { margin: 3px 0 0; color: var(--pg-mut); font-weight: 700; font-size: 13.5px; }

  /* hero */
  .pg-hero {
    background: var(--pg-card); border-radius: 28px; border: 1px solid var(--pg-line);
    padding: 26px; margin-bottom: 34px;
    box-shadow: 0 2px 8px rgba(16,42,25,.05), 0 24px 50px -28px rgba(16,42,25,.25);
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .pg-controls { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; width: 100%; }
  .pg-ctl { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .pg-ctl-lab { font-size: 11.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--pg-mut); }
  .pg-ctl-lab em { font-style: normal; text-transform: none; letter-spacing: 0; color: #9aa89e; font-weight: 700; }
  .pg-seg { display: inline-flex; background: #eef3ec; border-radius: 13px; padding: 4px; gap: 3px; }
  .pg-seg button {
    border: none; background: none; cursor: pointer; font-family: inherit;
    padding: 8px 15px; border-radius: 10px; font-size: 13.5px; font-weight: 800; color: var(--pg-mut);
    transition: all .16s ease;
  }
  .pg-seg button.active { background: #fff; color: #0A7A2F; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 5px 14px rgba(16,42,25,.1); }

  .pg-stage { padding: 6px; }
  .pg-hint { max-width: 460px; text-align: center; color: var(--pg-mut); font-weight: 700; font-size: 13.5px; line-height: 1.5; margin: 0; }

  /* overview */
  .pg-overview h2 { font-family: "Baloo 2", sans-serif; font-size: 21px; margin: 0 0 4px; letter-spacing: -.3px; }
  .pg-sub { color: var(--pg-mut); font-weight: 700; font-size: 13.5px; margin: 0 0 22px; }
  .pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 26px 30px; }
  .pg-cell { display: flex; flex-direction: column; gap: 12px; }
  .pg-cell-label { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 15px; }
  .pg-pair { display: flex; gap: 18px; }
  .pg-one { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pg-tag { font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: #9aa89e; }

  .pg-foot { text-align: center; color: #9aa89e; font-weight: 700; font-size: 12.5px; margin-top: 44px; }

  @media (max-width: 520px) {
    .pg-grid { grid-template-columns: 1fr; }
    .pg-pair { justify-content: center; }
  }
</style>
</head>
