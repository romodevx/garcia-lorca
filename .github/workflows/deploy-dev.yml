# Auto-deploy to the dev demo environment on every push to `dev`.
#
# Keyless: no service-account JSON lives in this repository. GitHub mints a
# short-lived OIDC token, Google exchanges it for a scoped access token, and the
# exchange is bound to THIS repository by an attribute condition on the Workload
# Identity provider (deploy/terraform/cicd.tf).
#
# This deploys IMAGES ONLY. Terraform owns the infrastructure and is applied
# deliberately by a human, because an apply can destroy a database and a push
# should never be able to. `gcloud run deploy` swaps the container on an existing
# service, which is reversible in one command.
name: Deploy dev

# Runs AFTER CI finishes on dev, not in parallel with it.
#
# This used to trigger on push and then poll for CI with a third-party action.
# That action failed on every single real run — it needs permissions the job
# does not obviously need, and reports a 403 as a Ruby backtrace from octokit,
# so each failure cost a diagnosis. workflow_run is the native mechanism for
# exactly this and removes both the dependency and the polling.
#
# NOTE: a workflow_run workflow always runs the version of THIS FILE on the
# default branch, not the version in the commit that triggered it. Editing it on
# a feature branch has no effect until it lands there.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# Never let two deploys race onto the same services. A newer push supersedes an
# in-flight one rather than interleaving with it.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

# Declaring a permissions block opts OUT of the defaults, so every scope the job
# needs must be listed. `checks: read` used to be here for the polling step; the
# workflow_run trigger replaced it and needs no check access at all.
permissions:
  contents: read
  id-token: write # mint the OIDC token for keyless auth to Google

env:
  PROJECT_ID: garcia-lorca
  REGION: us-central1
  AR_REPO: garcia-lorca

jobs:
  deploy:
    name: build images and roll out
    runs-on: ubuntu-latest
    # A red CI must never reach the demo. workflow_dispatch has no triggering
    # run, so it is allowed through deliberately — a manual deploy is a human
    # decision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Check out the commit CI actually tested, not whatever dev points at now.
      # They differ the moment two pushes land close together, and deploying an
      # untested tree is the exact thing this gate exists to prevent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the commit being deployed
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - id: auth
        name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the ten images
        run: |
          set -euo pipefail
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=deploy/cloudbuild/cloudbuild.yaml \
            --substitutions=_TAG="$SHA",_DEPLOY=false \
            --service-account="projects/$PROJECT_ID/serviceAccounts/${{ vars.GCP_DEPLOY_SA }}"

      - name: Roll out the new revisions
        run: |
          set -euo pipefail
          for svc in gateway iam students config finance grades attendance comms uniforms web; do
            echo "--- $svc"
            gcloud run services update "$svc" \
              --project="$PROJECT_ID" --region="$REGION" --quiet \
              --image="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$svc:$SHA"
          done

      - name: Smoke test — the demo must actually answer
        run: |
          set -euo pipefail
          WEB=$(gcloud run services describe web --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          echo "web: $WEB"
          # /healthz proves the container serves; /login proves Next rendered.
          for path in /healthz /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$WEB$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: Confirm nothing was left warm
        run: |
          # A deploy must never quietly raise min-instances. This is the cost
          # guardrail the whole environment exists to have, checked after every
          # rollout rather than trusted.
          set -euo pipefail
          warm=$(gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.metadata.annotations["autoscaling.knative.dev/minScale"])' \
            | grep -vE '^(0)?$' || true)
          if [ -n "$warm" ]; then
            echo "::error::a service is running with min-instances > 0 — that bills 24/7"
            exit 1
          fi
          echo "all services at zero"
