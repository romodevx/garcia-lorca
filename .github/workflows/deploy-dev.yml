# Auto-deploy to the dev demo environment on every push to `dev`.
#
# Keyless: no service-account JSON lives in this repository. GitHub mints a
# short-lived OIDC token, Google exchanges it for a scoped access token, and the
# exchange is bound to THIS repository by an attribute condition on the Workload
# Identity provider (deploy/terraform/cicd.tf).
#
# This deploys IMAGES ONLY. Terraform owns the infrastructure and is applied
# deliberately by a human, because an apply can destroy a database and a push
# should never be able to. `gcloud run services update` swaps the container on an
# existing service, which is reversible in one command.
#
# Shape of the job, and why (see .claude/docs/PLAN-minutos-ci.md):
#   1. refuse the commit unless CI is green on that exact SHA  <- the only gate
#   2. submit the Cloud Build async, poll it, cancel it if this runner dies
#   3. migrations, THEN the rollout, THEN the smoke test
# Cloud Build builds images and nothing else. It no longer re-runs the quality
# gates on a commit CI already approved, which was 25.5 min of every build and
# was billed a second time by this runner watching the stream.
name: Deploy dev

# Runs AFTER CI finishes on dev, not in parallel with it.
#
# This used to trigger on push and then poll for CI with a third-party action.
# That action failed on every single real run — it needs permissions the job
# does not obviously need, and reports a 403 as a Ruby backtrace from octokit,
# so each failure cost a diagnosis. workflow_run is the native mechanism for
# exactly this and removes both the dependency and the polling.
#
# NOTE: a workflow_run workflow always runs the version of THIS FILE on the
# default branch, not the version in the commit that triggered it. Editing it on
# a feature branch has no effect until it lands there.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# Never let two deploys race onto the same services. A newer push supersedes an
# in-flight one rather than interleaving with it.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

# Declaring a permissions block opts OUT of the defaults, so every scope the job
# needs must be listed.
permissions:
  contents: read
  id-token: write # mint the OIDC token for keyless auth to Google
  # Back, for a different reason than last time. Cloud Build no longer re-runs
  # the quality gates (T10), so the ONLY thing standing between an unverified
  # commit and the school's demo is the check-run assertion below. Without this
  # scope that assertion 403s and every deploy stops.
  checks: read

env:
  PROJECT_ID: garcia-lorca
  REGION: us-central1
  AR_REPO: garcia-lorca
  ENVIRONMENT: dev
  SQL_INSTANCE: garcia-lorca-dev

jobs:
  deploy:
    name: build images and roll out
    runs-on: ubuntu-latest
    # A red CI must never reach the demo. workflow_dispatch still gets in here —
    # a manual deploy is a human decision — but it no longer skips verification:
    # the check-run guard below runs for EVERY path and fails a dispatch whose
    # SHA has no green CI. That hole was survivable while Cloud Build re-ran the
    # gates itself; now that it does not (T10), it would ship code that no
    # source-map gate and no vulnerability scan has ever seen.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Check out the commit CI actually tested, not whatever dev points at now.
      # They differ the moment two pushes land close together, and deploying an
      # untested tree is the exact thing this gate exists to prevent.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the commit being deployed
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refuse to deploy a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The aggregate job in ci.yml is named `ci`; that is the check-run
          # that means "every gate passed on this exact tree".
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
                   --jq '[.check_runs[] | select(.name == "ci")]')
          verdict=$(printf '%s' "$runs" \
                    | jq -r 'sort_by(.completed_at // .started_at) | last | .conclusion // "pending"')
          if [ "$verdict" = "success" ]; then
            echo "CI is green on ${SHA}."
            exit 0
          fi
          if [ "$(printf '%s' "$runs" | jq 'length')" = "0" ]; then
            echo "::error::No CI check-run named 'ci' exists for ${SHA}."
            echo "::error::Nothing has verified this commit. Push it to a branch and let CI run,"
            echo "::error::or open a PR — do not deploy it."
          else
            echo "::error::The CI check-run for ${SHA} concluded '${verdict}', not 'success'."
          fi
          echo "::error::Cloud Build no longer re-runs the gates, so this is the only verification there is."
          exit 1

      - id: auth
        name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the ten images
        env:
          # Identity Platform, for the WEB bundle only. NEXT_PUBLIC_* is inlined
          # at build time, so which door the panel uses is decided HERE and
          # nowhere else: turning the provider on or off is a rebuild, never a
          # console switch, and going back is the same operation as going
          # forward.
          #
          # They come from repository variables rather than literals so the
          # cutover is a settings change plus a re-run, and so the (public,
          # by-design) Firebase web key does not sit in the tree tripping the
          # secret scanner. UNSET means empty means provider OFF — the default,
          # and the safe one: providerLoginEnabled() needs BOTH the mode and the
          # key before it turns anything on.
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          # --async, then poll. NOT fire-and-forget.
          #
          # Submitting without waiting looks like it saves 58 billed minutes,
          # and it does not — it hands back three things instead:
          #   1. The red X. A failed build would leave this run GREEN, and the
          #      fallback (a Cloud Build email) is known broken: this project's
          #      outbound mail lands in spam and is blocked on an SMTP credential.
          #   2. The concurrency lock. `cancel-in-progress` above only works
          #      because the runner holds the build for its whole duration. Let
          #      go, and two pushes in a row race to `gcloud run services update`
          #      with the OLDER build free to land last. That is exactly how the
          #      demo ran the wrong commit for two days.
          #   3. The rollout. Migrations and the image swap happen in the steps
          #      below, which cannot run if this step has already exited.
          #
          # The minutes come from making the BUILD shorter — the gates moved out
          # of cloudbuild (T10) and the images now reuse their layers — not from
          # refusing to watch it. What --async buys over the synchronous form is
          # robustness: a 55-minute log stream that drops takes the old command
          # down with it even when the build succeeds.
          BUILD_ID=$(gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=deploy/cloudbuild/cloudbuild.yaml \
            --substitutions=_TAG="$SHA",_AUTH_PROVIDER="$AUTH_PROVIDER",_FIREBASE_API_KEY="$FIREBASE_API_KEY",_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN",_FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --service-account="projects/$PROJECT_ID/serviceAccounts/${{ vars.GCP_DEPLOY_SA }}" \
            --async --format='value(id)')
          # An empty id here would send the loop below into 45 minutes of
          # `gcloud builds describe ""` before anybody learned the submit never
          # landed. Fail on the line that actually broke.
          if [ -z "${BUILD_ID:-}" ]; then
            echo "::error::gcloud builds submit returned no build id — nothing was submitted"
            exit 1
          fi
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          CONSOLE="https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          echo "build:   $BUILD_ID"
          echo "console: $CONSOLE"

          # `cancel-in-progress` cancels the RUNNER. The build it submitted keeps
          # going on Google's side, finishes, and its images sit in Artifact
          # Registry ready for whatever rolls out next — an orphan with the
          # authority to change what the school sees. Kill it with the runner.
          #
          # Best effort by nature: GitHub does not promise the shell gets a
          # signal on cancellation. It usually does, and an orphan we tried to
          # cancel beats one we never tried to.
          BUILD_DONE=0
          cleanup() {
            rc=$?
            if [ "$BUILD_DONE" != "1" ] && [ -n "${BUILD_ID:-}" ]; then
              echo "::warning::runner is exiting (rc=$rc) while build $BUILD_ID is still in flight — cancelling it"
              gcloud builds cancel "$BUILD_ID" --project="$PROJECT_ID" --quiet 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          # Deadline slightly above cloudbuild.yaml's own 2400s timeout, so a
          # build that hangs is reported by Cloud Build as TIMEOUT (with a
          # failing step to name) rather than by this loop as a mystery.
          DEADLINE=$(( SECONDS + 2700 ))
          while :; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" --format='value(status)' 2>/dev/null || echo UNKNOWN)
            case "$STATUS" in
              SUCCESS)
                BUILD_DONE=1
                echo "build $BUILD_ID: SUCCESS"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                BUILD_DONE=1
                echo "::error::build $BUILD_ID finished as $STATUS"
                # Replacing a streamed log with a status string would be a
                # diagnostics regression, and the email that used to cover for
                # it does not arrive. Say what broke, here, in the run.
                # A FAILURE names its own step. A CANCELLED or TIMEOUT build has
                # no step in FAILURE at all — every step is CANCELLED — so asking
                # only for FAILURE printed "failing step: unknown", which is
                # honest and useless. Verified 2026-09-20 by cancelling a live
                # build (74df1eaf). Fall back to the step that was still running,
                # because on a timeout or a cancel THAT is the one you want.
                # A step that ran out of time is marked TIMEOUT, not CANCELLED
                # (only the cancel path was observed live), so it is asked for
                # right after FAILURE: it is the culprit, not a bystander.
                step=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" --format=json 2>/dev/null \
                       | jq -r '(([.steps[]? | select(.status == "FAILURE")] | .[0].id)
                                 // ([.steps[]? | select(.status == "TIMEOUT")] | .[0].id)
                                 // ([.steps[]? | select(.status == "WORKING")] | .[0].id)
                                 // ([.steps[]? | select(.status == "CANCELLED")] | .[0].id)
                                 // "unknown")')
                echo "::error::failing step: $step"
                echo "::error::console: $CONSOLE"
                {
                  echo "## El build falló"
                  echo
                  echo "- Estado: \`$STATUS\`"
                  echo "- Paso que falló: \`$step\`"
                  echo "- Build: [\`$BUILD_ID\`]($CONSOLE)"
                  echo
                  echo "<details><summary>Últimas 100 líneas del log</summary>"
                  echo
                  echo '```'
                  gcloud builds log "$BUILD_ID" --project="$PROJECT_ID" 2>/dev/null | tail -100 || echo "(el log no se pudo leer; ver la consola)"
                  echo '```'
                  echo "</details>"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              QUEUED|WORKING|PENDING|UNKNOWN)
                : ;;
              *)
                echo "unexpected status: $STATUS" ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::gave up waiting on build $BUILD_ID after 45 min (last status: $STATUS)"
              echo "::error::the build is STILL RUNNING — it is about to be cancelled: $CONSOLE"
              exit 1
            fi
            sleep 20
          done

      # SCHEMA FIRST, THEN THE CODE THAT NEEDS IT.
      #
      # This step exists because it was missing. Applying migrations to dev was a
      # manual script, so the deployed code ran ahead of the schema for NINE DAYS
      # and eleven migrations, and the way anybody found out was a colegiatura
      # refusing to save in front of the school (2026-09-07): the finance service
      # answered 500 because `tuition_plans.schedule` did not exist. The calendar
      # was 500ing too, and the outbox poller had been erroring every thirty
      # seconds the whole time.
      #
      # Local could never drift like that — docker-compose makes every service
      # wait on the migrator — so the gap only ever existed in the deployed
      # environment, which is the one the school looks at.
      #
      # BEFORE the rollout, not after: new code needs the new schema, and the
      # migrations are additive by convention so the running (old) revision keeps
      # working across the gap. If this step fails the job stops here and NOTHING
      # is rolled out — the demo stays on the previous version, which works.
      - name: Apply the migrations (schema before code)
        run: |
          set -euo pipefail
          . deploy/cloudbuild/retry.sh

          # psql is what migrate-cloud.sh drives. Preinstalled on the current
          # runner image, checked rather than assumed: an image change would
          # otherwise fail here with "psql: not found" and read like a database
          # problem.
          command -v psql >/dev/null || retry sudo apt-get install -y --no-install-recommends postgresql-client

          # Into the runner's own temp dir, not /usr/local/bin: writability there
          # is a property of the current image, and this step must not be the
          # thing that breaks when that changes.
          PROXY="$RUNNER_TEMP/cloud-sql-proxy"
          retry curl -sfL -o "$PROXY" \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x "$PROXY"

          # The proxy authenticates with the same short-lived token this job
          # already holds; no key material anywhere.
          "$PROXY" --port 5432 "$PROJECT_ID:$REGION:$SQL_INSTANCE" &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          # Fail HERE with a sentence, rather than thirty seconds later with a
          # connection refused that reads like the database is down.
          [ "$ready" = "1" ] || { echo "::error::the Cloud SQL proxy never came up"; exit 1; }

          # As the MIGRATOR role, not the app role: scripts/migrate-cloud.sh runs
          # the role setup and the migrations under one identity on purpose (see
          # its header — ALTER DEFAULT PRIVILEGES is per-grantor).
          PW=$(retry gcloud secrets versions access latest \
                 --secret="garcia-lorca-db-migrator-password-$ENVIRONMENT" --project="$PROJECT_ID")
          ENCODED=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))' <<< "$PW")
          DATABASE_URL="postgresql://migrator:$ENCODED@127.0.0.1:5432/garcia_lorca?sslmode=disable" \
            sh scripts/migrate-cloud.sh

      # LAST thing that changes what the school sees, and the only rollout that
      # exists. `gcloud run services update` (not `run deploy`) because that is
      # what dev has always used; the never-executed `run deploy` copy that used
      # to sit in cloudbuild.yaml is gone.
      - name: Roll out the new revisions
        run: |
          set -euo pipefail
          SERVICES="gateway iam students config finance grades attendance comms uniforms web"

          # Ten services, one at a time, and a cancel can land between any two of
          # them — leaving dev running half the new commit and half the old one,
          # silently. Whatever happens, say which services are on what.
          report() {
            rc=$?
            [ "$rc" = "0" ] && return 0
            echo "::error::the rollout did not finish — dev may be split across two commits"
            {
              echo "## Rollout interrumpido"
              echo
              echo "Commit objetivo: \`$SHA\`"
              echo
              echo "| servicio | imagen en ejecución |"
              echo "| --- | --- |"
              for svc in $SERVICES; do
                img=$(gcloud run services describe "$svc" --project="$PROJECT_ID" --region="$REGION" \
                        --format='value(spec.template.spec.containers[0].image)' 2>/dev/null | sed 's|.*:||')
                mark=""; [ "$img" = "$SHA" ] && mark=" ← nuevo"
                echo "| $svc | \`${img:-desconocida}\`$mark |"
              done
              echo
              echo "Para terminarlo: vuelve a lanzar este workflow sobre el mismo commit."
              echo "Para volver atrás: lánzalo sobre el commit anterior (ambas cosas son"
              echo "la misma operación — el rollout es idempotente)."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap report EXIT

          for svc in $SERVICES; do
            echo "--- $svc"
            # Idempotent: re-running this on a service already on $SHA is a
            # no-op worth nothing, which is what makes "run it again" a valid
            # answer to both a half-finished rollout and a rollback.
            gcloud run services update "$svc" \
              --project="$PROJECT_ID" --region="$REGION" --quiet \
              --image="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$svc:$SHA"
          done

      - name: Smoke test — the demo must actually answer
        run: |
          set -euo pipefail
          WEB=$(gcloud run services describe web --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          GW=$(gcloud run services describe gateway --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          echo "web:     $WEB"
          echo "gateway: $GW"

          # NOT /healthz. Cloud Run RESERVES that path: it answers 404 from its
          # own front end and the request never reaches the container, so no
          # service deployed here can ever pass a public check on it. Measured:
          # /healthz came back 404 with no `server` header and left no entry in
          # the container's request log, while its neighbours /health and
          # /healthzz returned the app's own 404 with `server: Google Frontend`.
          # The startup probe in deploy/terraform/modules/cloud_run/main.tf still
          # uses /healthz and still works — Cloud Run probes the container port
          # directly, below the front end doing the interception.
          #
          # /login proves Next rendered a page. /readyz proves more than the old
          # check ever did: the gateway calls iam end to end to answer it, so a
          # green smoke test now means the API is actually reachable, not just
          # that the web container served HTML over a dead backend.
          # `|| echo 000` is load-bearing. Under `set -euo pipefail` a transport
          # failure — DNS, a reset, --max-time expiring against a cold-starting
          # gateway — makes curl exit non-zero, which aborts the step INSIDE this
          # function: the ::error:: line never prints and the second endpoint is
          # never probed, defeating the accumulator below. Turning it into 000
          # keeps a dead service reported as a failed check rather than a silent
          # exit.
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$1$2" || echo 000)
            echo "  $1$2 -> $code"
            [ "$code" = "200" ] || { echo "::error::$1$2 returned $code"; fail=1; }
          }
          check "$WEB" /login
          check "$GW" /readyz
          [ "$fail" = "0" ] || exit 1

      # Answers the one question a "Deploy dev failed" email cannot: is the
      # demo up, and on WHICH commit? A failed build rolls nothing out, so dev
      # keeps serving the previous revision — it is not broken, it is just not
      # updated. That distinction was invisible until now: the email looked the
      # same either way, and the honest reading of it was "the demo is down".
      #
      # always() on purpose: the summary is worth MORE on a failure than on a
      # success, and this step must never be the thing that turns a green run
      # red, hence the trailing `|| true`.
      - name: Say what dev is actually running
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Estado de dev"
            echo
            echo "Commit que se intentaba desplegar: \`${SHA:-desconocido}\`"
            echo
            echo "| servicio | imagen en ejecución | responde |"
            echo "| --- | --- | --- |"
            for svc in web gateway iam; do
              img=$(gcloud run services describe "$svc" --project="$PROJECT_ID" --region="$REGION" \
                      --format='value(spec.template.spec.containers[0].image)' 2>/dev/null | sed 's|.*:||')
              url=$(gcloud run services describe "$svc" --project="$PROJECT_ID" --region="$REGION" \
                      --format='value(status.url)' 2>/dev/null)
              path=/login; [ "$svc" = "gateway" ] && path=/readyz; [ "$svc" = "iam" ] && path=""
              code=""
              [ -n "$path" ] && code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url$path" || echo 000)
              echo "| $svc | \`${img:0:8}\` | ${code:-—} |"
            done
            echo
            if [ "${SHA:-}" != "" ] && gcloud run services describe web --project="$PROJECT_ID" --region="$REGION" \
                 --format='value(spec.template.spec.containers[0].image)' 2>/dev/null | grep -q "$SHA"; then
              echo "**dev está en este commit.** El despliegue llegó hasta el final."
            else
              echo "**dev NO está en este commit: sigue en la versión anterior, y sigue funcionando.**"
              echo "Un build que falla no despliega nada, así que la demo no se rompe — sólo se queda atrás."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Confirm nothing was left warm
        run: |
          # A deploy must never quietly raise min-instances. This is the cost
          # guardrail the whole environment exists to have, checked after every
          # rollout rather than trusted.
          set -euo pipefail
          warm=$(gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.metadata.annotations["autoscaling.knative.dev/minScale"])' \
            | grep -vE '^(0)?$' || true)
          if [ -n "$warm" ]; then
            echo "::error::a service is running with min-instances > 0 — that bills 24/7"
            exit 1
          fi
          echo "all services at zero"
