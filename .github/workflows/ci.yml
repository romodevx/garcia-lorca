# García Lorca — CI (GitHub Actions).
#
# THE quality gate. Not "a mirror of" one — the only one.
#
# Cloud Build used to re-run vet, test -race, govulncheck, the web build and the
# source-map gate on the very commit this workflow had just approved. That copy
# is gone (T10): deploy/cloudbuild/cloudbuild.yaml now builds images and nothing
# else, and deploy-dev.yml refuses to submit a build unless THIS workflow is
# green on that exact SHA. So a gate deleted here is a gate that no longer
# exists anywhere — weigh removals accordingly.
#
# Gate order (cheap first):
#   proto  : buf lint -> buf breaking -> buf generate -> openapi lint ->
#            actionlint -> build govulncheck once -> derive the module matrix
#   vet    : go vet ONCE across the whole workspace
#   go     : 4 SHARDS of workspace modules — test -race -> integration ->
#            govulncheck -> mod verify, every module, just fewer jobs
#   web    : pnpm install -> turbo test/lint/build -> source-map hardening gate
#
# `gen/` is 100% generated and gitignored (except gen/go/go.mod + go.sum, which
# are hand-maintained). The proto job generates it once and hands it to the go
# and web jobs as an artifact instead of re-running buf in every job.
#
# COST DESIGN (see .claude/docs/PLAN-minutos-ci.md — this workflow was 1,942 of
# the 2,739 billed min/cycle that took the repo to 90% of its allowance):
#   - The Go cache is managed by hand, per module, and saved ONLY on push.
#     actions/setup-go derives its key from hashFiles('**/go.sum'), which is
#     IDENTICAL across all 14 matrix legs: the first leg to finish wrote a
#     near-empty cache, Actions cache entries are immutable, and every run since
#     restored a 7,599-byte tombstone while reporting "Cache hit". It could not
#     self-repair, because the key already existed.
#   - Nothing rotating (github.sha, github.run_id) may enter a cache key.
#     GOMODCACHE is ~6 GB and GOCACHE ~1 GB against a 10 GB per-repo LRU budget;
#     a key that rotates per run fills and evicts the budget within a day.
#     Use CACHE_EPOCH below to invalidate on purpose.
#   - Every job costs a WHOLE billed minute however short it is, so cheap checks
#     are folded into an existing job rather than given one of their own. This
#     is the dominant cost once the cache works: measured on the warm run
#     35462895886, the Go matrix did 1,558 s of real work across 14 legs and was
#     billed 33 minutes. Across a cycle the job-count floor alone was ~1,044 min,
#     the largest single line in the budget — larger than the whole deploy. Hence
#     the shards: same gates, same modules, fewer billed minutes.

name: CI

# Cost controls (private repo, billed Actions minutes):
#  - push runs only on `dev` (master gets the same tree via the dev->master merge).
#    Note this is NOT redundant with the PR run: merges to dev are squash merges,
#    so the SHA that gets deployed is one no PR run ever saw, and the heavy legs
#    below are PR-only. The push gate is the only verification of the exact tree
#    that reaches the school.
#  - markdown and .claude-only changes skip CI entirely (no code impact).
#  - the heavy legs (-race, integration/testcontainers, govulncheck) run on PRs
#    only; pushes get a fast unit gate (unit tests + mod verify). Open a PR
#    (e.g. dev -> master) to trigger the full gate before a release.
on:
  pull_request:
    branches: [dev, master]
    # An inclusion list, not paths-ignore, because paths-ignore cannot express
    # "ignore docs/ EXCEPT the contract". Order matters: a later pattern wins.
    #
    # DUPLICATED verbatim under `push:` on purpose. GitHub Actions does not
    # resolve YAML anchors in workflow files, so a `&anchor`/`*alias` pair here
    # would leave the push trigger silently unfiltered. Keep the two lists equal.
    paths:
      - '**'
      - '!.claude/**'
      - '!docs/**'
      # The OpenAPI contract is not documentation. It is the source of truth the
      # clients are generated from (api-standards canon), and while docs/** was
      # ignored wholesale a contract-only change skipped CI entirely — so the
      # one gate that exists for it never ran on the one change that needs it.
      - 'docs/api/**'
      # Last, so it wins: markdown never triggers CI, not even under docs/api.
      - '!**/*.md'
  push:
    branches: [dev]
    # Keep EQUAL to the pull_request list above (anchors are not supported).
    paths:
      - '**'
      - '!.claude/**'
      - '!docs/**'
      - 'docs/api/**'
      - '!**/*.md'

permissions:
  contents: read

# One run per ref; a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchains. buf matches cloudbuild's bufbuild/buf:1.50.0 image and
  # deploy/README.md's ">= 1.50" prerequisite; Go 1.26.9 (exact: "1.26.x" resolves to the runner's cached 1.26.8, which lacks the HTTP/2 fixes) is required by the
  # pre-shared-env checklist (item 1) for a clean govulncheck.
  BUF_VERSION: "1.50.0"
  GO_VERSION: "1.26.9"
  NODE_VERSION: "22"
  # THE ONLY vulnerability scan in the pipeline now. Cloud Build used to run a
  # second one on the same commit; that copy is gone (T10), so there is no twin
  # to keep this equal to any more — and no way for two versions to disagree.
  # Pinned: `@latest` needing a newer Go than GO_VERSION is exactly what broke
  # the deploy on 2026-09-10. v1.7.0 runs on Go 1.26.
  GOVULNCHECK_VERSION: "v1.7.0"
  # Pinned for the same reason govulncheck is. `@latest` moving under us has
  # already cost this repo one broken deploy; security.md says pin versions.
  REDOCLY_VERSION: "2.53.3"
  ACTIONLINT_VERSION: "v1.7.12"
  # Bump this by hand to throw away every Go cache entry at once. It exists so
  # that invalidating the cache never requires putting something rotating (a SHA,
  # a run id) into the key, which is what destroys the 10 GB budget.
  CACHE_EPOCH: "1"
  # A restored Go cache below this is the 7,599-byte tombstone, not a cache.
  # Deliberately far under the real sizes (GOMODCACHE ~6 GB, GOCACHE ~1 GB
  # measured locally) so it catches the failure without flapping on a partial
  # restore. The real sizes are printed on every run; tighten once Linux
  # numbers have been observed for a few cycles.
  CACHE_MIN_BYTES: "52428800" # 50 MiB

jobs:
  # ---------------------------------------------------------------------------
  # 1. Proto: lint, breaking-change detection, codegen, and every other check
  #    that costs seconds. They live here because a job of its own would cost a
  #    whole billed minute each: openapi lint was 57 min/cycle for 9s of work.
  # ---------------------------------------------------------------------------
  proto:
    name: proto (lint / breaking / generate / contract / actionlint)
    runs-on: ubuntu-latest
    outputs:
      # The `go` job matrix: one entry per SHARD, each carrying the modules it
      # owns. Built from go.work, never from a list kept by hand here.
      go-shards: ${{ steps.modules.outputs.shards }}
      # False only when EVERY changed file is under apps/mobile/, which cannot
      # affect a line of Go. Deliberately conservative: this is not T4's
      # per-service selection, it is the one case that is provably safe.
      go-changed: ${{ steps.changes.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `buf breaking --against` can resolve the base branch,
          # and so the changed-file diff below has something to compare against.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # Managed by hand below. Left on, this emits the shared key that every
          # matrix leg also computes — the race that created the tombstone.
          cache: false

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      # Restore-only: this job never writes the module cache, so it cannot race
      # the vet job that owns it. A miss here just means a slower govulncheck build.
      - name: Restore Go module cache
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-

      - name: buf lint
        run: buf lint

      # Breaking-change detection only makes sense against a base revision, so
      # it is scoped to pull requests. A breaking contract change requires a
      # version bump + ADR (api-standards canon) — CI refuses it silently.
      # ADVISORY during the pre-release era. Every module still enters as a
      # FASE-0 proto stub and its first real slice intentionally breaks that stub
      # (removes placeholder messages, renumbers fields) — the flag is default
      # OFF and never shipped, so nothing consumes the old contract. buf breaking
      # still RUNS and surfaces the diff in the PR log, but must not fail the
      # build while stubs are being cleaned up. FOLLOW-UP: flip to blocking
      # (drop continue-on-error) once the module contracts are frozen post-MVP.
      - name: buf breaking (vs. ${{ github.base_ref }}) — advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          buf breaking --against ".git#ref=origin/${BASE_REF}"

      - name: buf generate
        run: buf generate

      - name: Assert codegen produced Go and TS output
        run: |
          set -euo pipefail
          for d in gen/go/garcialorca gen/ts; do
            if [ ! -d "$d" ]; then
              echo "ERROR: buf generate did not produce $d"
              exit 1
            fi
          done
          echo "OK: gen/go and gen/ts present."

      # The canon is spec-first: the REST contract is written and linted BEFORE
      # the handlers exist. A contract nobody validates drifts from the code
      # within a sprint, at which point the generated clients start lying.
      # Folded in from a job of its own, which cost 57 billed min/cycle for 9
      # seconds of linting plus 3 seconds re-downloading the CLI every run.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Lint the REST contract
        run: npx --yes "@redocly/cli@${REDOCLY_VERSION}" lint docs/api/openapi.yaml

      # These workflows are the only thing standing between a typo and a day of
      # burnt minutes, and nothing was checking them. go install rather than the
      # upstream curl|bash: the module proxy verifies checksums, and this job
      # already has Go. It is free in billed minutes — the job is under a minute
      # either way and GitHub bills the whole minute regardless.
      - name: actionlint
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color

      # Built once here instead of `go install`ed inside all 14 matrix legs.
      - name: Build govulncheck once
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          mkdir -p dist-tools
          cp "$(go env GOPATH)/bin/govulncheck" dist-tools/govulncheck
          dist-tools/govulncheck -version

      # The single source of truth for "which Go modules exist" is go.work.
      # Parsing it here keeps the matrix from drifting when a service is added.
      # The rule that makes sharding safe to adopt at all: every go.work module
      # lands in exactly one shard. Collapsing the matrix trades a list Go
      # maintains for one a human maintains, and the failure mode is SILENT —
      # a service added later simply stops being tested and nothing goes red.
      # Asserted before the matrix is built, not trusted.
      - name: Test the shard assignment
        run: sh scripts/ci-shards_test.sh

      # Same silent failure, other list: the demo wipe must empty every table
      # added after it was written (it derives them from pg_tables).
      - name: Test the demo wipe keeps only what login needs
        run: sh scripts/reset-demo-db_test.sh

      - name: Derive the Go shard matrix from go.work
        id: modules
        run: |
          set -euo pipefail
          shards="$(sh scripts/ci-shards.sh)"
          echo "shards:"
          printf '%s' "${shards}" | jq -r '.[] | "  shard \(.shard)  \(.weight)s  \(.modules)"'
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

      # A mobile-only change runs 14 Go legs today. This is NOT `paths-ignore`:
      # that is an `on:` key, so it would skip the WHOLE workflow, and a workflow
      # that does not run is a workflow that never reports — which deadlocks any
      # required status check instead of satisfying it. Filtering here leaves the
      # legs skipped and the workflow reporting.
      - name: Decide whether the Go legs can be skipped
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No usable base (first push to a branch, force push, shallow history):
          # run everything. Guessing cheap is how a real regression gets skipped.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No resolvable base commit; running every Go leg."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "changed files:"
          # shellcheck disable=SC2001 # per-LINE prefix; ${x//s/r} cannot anchor to ^
          echo "${changed}" | sed 's/^/  /'
          if [ -z "${changed}" ]; then
            echo "Empty diff; running every Go leg."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep -qv would report "some line is not mobile". We need "EVERY line
          # is mobile", so invert the question: is there any non-mobile file?
          if echo "${changed}" | grep -qv '^apps/mobile/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Non-mobile files changed; running every Go leg."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Only apps/mobile/ changed; the Go legs cannot be affected."
          fi

      # Stays on v4 deliberately. v5 is ALSO node20, so bumping it buys
      # nothing and only churns the file — the artifact actions have no
      # node24 release yet, and will keep warning until they do.
      - uses: actions/upload-artifact@v4
        with:
          name: gen
          path: gen
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: dist-tools
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. vet: ONCE for the whole workspace, not once per module.
  #
  #    `go vet ./...` does NOT work in this repo: there is no root go.mod, and
  #    the command dies with "pattern ./...: directory prefix . does not contain
  #    modules listed in go.work". go.work is the source of truth, so ask it.
  #
  #    Per-module vet cost 109s x 14 legs x 50 runs and found ZERO defects in 58
  #    runs, because `go test` already runs vet's high-confidence subset. This
  #    job also owns the shared module cache, so exactly one job writes it.
  # ---------------------------------------------------------------------------
  vet:
    name: vet (workspace)
    needs: proto
    # Same guard as the matrix: a change confined to apps/mobile/ cannot affect
    # a line of Go. Skipping this also skips the cache save for that run, which
    # is harmless — the next push that touches Go writes it.
    if: needs.proto.outputs.go-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen

      - name: Restore Go module cache
        id: gomod
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-

      - name: Restore workspace build cache
        id: gobuild
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-workspace-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-workspace-

      # A cache that silently degrades is how the 7,599-byte tombstone survived
      # for months: a miss and a hit look identical in the log. Print the real
      # size every run (this is also the measurement T1 asked for), and go red
      # on `dev` if something was restored and it is a tombstone.
      - name: Report restored cache sizes
        id: cachesize
        env:
          MOD_KEY: ${{ steps.gomod.outputs.cache-matched-key }}
          BUILD_KEY: ${{ steps.gobuild.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mod_bytes=$(du -sb ~/go/pkg/mod 2>/dev/null | cut -f1 || echo 0)
          build_bytes=$(du -sb ~/.cache/go-build 2>/dev/null | cut -f1 || echo 0)
          printf 'GOMODCACHE  %12s bytes  (matched key: %s)\n' "${mod_bytes}" "${MOD_KEY:-<none>}"
          printf 'GOCACHE     %12s bytes  (matched key: %s)\n' "${build_bytes}" "${BUILD_KEY:-<none>}"
          {
            echo "### Go cache"
            echo "| cache | restored bytes | matched key |"
            echo "| --- | ---: | --- |"
            echo "| GOMODCACHE | ${mod_bytes} | \`${MOD_KEY:-<none>}\` |"
            echo "| GOCACHE | ${build_bytes} | \`${BUILD_KEY:-<none>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Only assert when something was actually restored. A guard that goes
          # red on the bootstrap run is a guard somebody deletes in week two.
          if [ -z "${MOD_KEY:-}" ]; then
            echo "No module cache restored (cold start) — nothing to assert."
            exit 0
          fi
          if [ "${mod_bytes}" -lt "${CACHE_MIN_BYTES}" ]; then
            echo "::error::Restored GOMODCACHE is ${mod_bytes} B, under the ${CACHE_MIN_BYTES} B floor."
            echo "::error::That is a tombstone, not a cache: every leg is recompiling from scratch."
            echo "::error::Bump CACHE_EPOCH in .github/workflows/ci.yml to force a clean save."
            exit 1
          fi
          echo "OK: restored cache is a real cache."

      - name: go vet (whole workspace, once)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # word splitting is the point: one pattern per module
          go vet $(go work edit -json | jq -r '.Use[].DiskPath + "/..."')

      # Saved only on push. PRs restore and never write, so a branch cannot
      # evict the 10 GB budget — and cannot poison the cache the base branch
      # feeds to every other PR either.
      - name: Save Go module cache
        if: github.event_name == 'push' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('**/go.sum') }}

      - name: Save workspace build cache
        if: github.event_name == 'push' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-workspace-${{ hashFiles('**/go.sum') }}

  # ---------------------------------------------------------------------------
  # 3. Go: one leg per SHARD, each running the gates for every module it owns.
  #    fail-fast is off so one bad shard does not hide the state of the others.
  #    Shard membership comes from scripts/ci-shards.sh, which reads go.work —
  #    go.work stays the source of truth for WHICH modules exist.
  #
  #    govulncheck and the integration tests are the ONLY Go steps that have gone
  #    red in 58 runs (runs 35394352750, 35395204982). They stay on the PR path.
  # ---------------------------------------------------------------------------
  go:
    name: go (shard ${{ matrix.shard }})
    needs: proto
    if: needs.proto.outputs.go-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.proto.outputs.go-shards) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # gen/ is gitignored; restore the codegen the proto job produced.
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen

      - uses: actions/download-artifact@v4
        with:
          name: tools
          path: dist-tools

      - name: Make tools executable
        run: chmod +x dist-tools/govulncheck

      # Restore-only. The vet job owns the write, so 14 legs do not race to save
      # the same key (13 of which would fail as "already exists" anyway).
      - name: Restore Go module cache
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ env.CACHE_EPOCH }}-

      # Per SHARD, which is the whole point: one shared key across every leg is
      # what let the first finisher freeze a near-empty entry for everyone.
      - name: Restore module build cache
        id: gobuild
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-shard${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-shard${{ matrix.shard }}-

      # Push: fast unit tests only (no -race). PRs get the full -race pass below.
      # Each of these loops the shard's modules. The list arrives through env:,
      # never interpolated into the script body — `${{ }}` substitutes before
      # the shell ever sees it, and that is a habit worth keeping even when the
      # value comes from go.work rather than from a pull request.
      - name: go test (unit)
        if: github.event_name != 'pull_request'
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          for m in $MODULES; do
            echo "::group::go test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

      - name: go test -race
        if: github.event_name == 'pull_request'
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          for m in $MODULES; do
            echo "::group::go test -race $m"
            (cd "$m" && go test ./... -race -count=1)
            echo "::endgroup::"
          done

      # Integration tests are behind `//go:build integration` and need a real
      # Postgres via testcontainers-go. GitHub's ubuntu runners ship a working
      # Docker daemon, so they run here rather than being skipped. PR-only: they
      # are the slowest leg and would dominate every push otherwise.
      - name: go test -tags=integration
        if: github.event_name == 'pull_request'
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          for m in $MODULES; do
            if (cd "$m" && grep -rlq --include='*.go' '//go:build integration' .); then
              echo "::group::go test -tags=integration $m"
              (cd "$m" && go test ./... -tags=integration -count=1)
              echo "::endgroup::"
            else
              echo "No integration-tagged files in $m; skipping."
            fi
          done

      # Security gate (cloudbuild step 3): reachable-vulnerability scan plus a
      # dependency audit (checksums match go.sum). The binary comes from the
      # proto job — built once, not installed 14 times.
      - name: govulncheck
        if: github.event_name == 'pull_request'
        env:
          MODULES: ${{ matrix.modules }}
          GOVULN: ${{ github.workspace }}/dist-tools/govulncheck
        run: |
          set -euo pipefail
          for m in $MODULES; do
            echo "::group::govulncheck $m"
            (cd "$m" && "$GOVULN" ./...)
            echo "::endgroup::"
          done

      - name: go mod verify
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          for m in $MODULES; do (cd "$m" && go mod verify); done

      - name: Save module build cache
        if: github.event_name == 'push' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ env.CACHE_EPOCH }}-shard${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}

  # ---------------------------------------------------------------------------
  # 4. Web: pnpm is the ONLY package manager (repo CLAUDE.md §7). The job ends
  #    on the build-hardening gate — source maps must never ship.
  # ---------------------------------------------------------------------------
  web:
    name: web (test / lint / build / source-map gate)
    needs: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package-manager-cache is OFF on purpose. v5 turned it on by default: it
      # reads package.json#packageManager, sees pnpm, and shells out to `pnpm`
      # to find the store — one step BEFORE corepack puts pnpm on the PATH, so
      # it dies with "Unable to locate executable file: pnpm". This job already
      # caches that store itself, a few steps down, with a key it controls.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # corepack pins pnpm to package.json#packageManager. `npm`/`yarn` are
      # forbidden here and the root `preinstall` guard (only-allow pnpm) enforces it.
      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm --version

      # packages/api-client consumes gen/ts, so the web build needs the codegen.
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The key used to be turbo-<os>-<github.sha>, which wrote a BRAND NEW
      # entry on every single run and evicted the Go caches out of the same
      # 10 GB per-repo budget. Keyed on the lockfile + turbo config now, and
      # written only on push, like every other cache here.
      #
      # Honest trade-off: this entry is now written once per lockfile change, so
      # turbo's hit rate decays between dependency bumps instead of tracking
      # every commit. That is deliberate — entry CHURN, not entry size, is what
      # evicted the Go caches, and the plan leaves `web` (150 min/cycle) as-is.
      # Revisit with a remote turbo cache if web ever becomes the top cost.
      - name: Restore turbo cache
        id: turbo
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # test + lint run across the whole workspace (web, mobile, shared packages).
      # build is scoped to the web app + its workspace deps: the only production
      # artifact CI ships/gates here. apps/mobile's build (`expo export`) needs
      # native/EAS tooling and joins CI in Phase 9 when the family app is real.
      - name: turbo test / lint (all) + build (web + deps)
        run: |
          pnpm turbo run test lint
          pnpm turbo run build --filter=@garcia-lorca/web...

      # Build-hardening gate (cloudbuild step 5). Prefers the frontend-owned
      # check; falls back to the pipeline-owned grep gate. Either FAILS CI if a
      # *.map file or a sourceMappingURL comment reaches a client artifact.
      - name: Source-map gate (no source maps in production artifacts)
        run: |
          set -euo pipefail
          if [ -f apps/web/scripts/check-no-sourcemaps.mjs ] || [ -f apps/web/scripts/check-no-sourcemaps.sh ]; then
            echo "Using frontend-owned source-map check (pnpm --filter @garcia-lorca/web check:no-sourcemaps)."
            pnpm --filter @garcia-lorca/web run check:no-sourcemaps
          else
            echo "Frontend check script absent; using pipeline fallback gate."
            bash deploy/cloudbuild/check-no-sourcemaps.sh
          fi

      - name: Save turbo cache
        if: github.event_name == 'push' && steps.turbo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}

  # ---------------------------------------------------------------------------
  # 5. Single aggregated status check.
  #
  #    DO NOT DELETE THIS JOB. The plan's T6 said to drop it "once shard names
  #    are fixed", which sharding has now done — but T10b landed in between and
  #    made it load-bearing for a different reason: deploy-dev.yml refuses to
  #    deploy a commit unless a check-run NAMED `ci` concluded success on that
  #    exact SHA. Delete this job and every deploy stops, with an error that
  #    points at the deploy rather than at here. If it ever does go, the guard
  #    in deploy-dev.yml has to change in the same commit.
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    if: always()
    needs: [proto, vet, go, web]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all gates passed
        env:
          # Quoted into the environment rather than interpolated into the script:
          # ${{ }} inside a run: block substitutes before the shell sees it.
          PROTO: ${{ needs.proto.result }}
          VET: ${{ needs.vet.result }}
          GO: ${{ needs.go.result }}
          WEB: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            # $1 = gate name, $2 = its result.
            case "$2" in
              success) echo "  ok       $1" ;;
              # vet and go are skipped by design when only apps/mobile/ changed.
              # A skipped gate is not a passed gate, so say so out loud rather
              # than letting it read as green in the log.
              skipped) echo "  skipped  $1 (nothing for it to check)" ;;
              *)       echo "  FAILED   $1 -> $2"; failed=1 ;;
            esac
          }
          check proto "${PROTO}"
          check vet   "${VET}"
          check go    "${GO}"
          check web   "${WEB}"
          if [ "${failed}" -ne 0 ]; then
            echo "FAILED: at least one CI gate did not pass."
            exit 1
          fi
          echo "OK: proto, vet, go and web gates passed."
