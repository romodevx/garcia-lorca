# García Lorca CI/CD — Cloud Build.
#
# Fail-fast order (cheap gates first): lint -> contracts -> vet -> tests ->
# frontend -> security -> build-hardening gate -> images -> deploy.
#
# Trigger substitutions (set on the trigger):
#   _REGION       deployment region                (e.g. us-central1)
#   _AR_REPO      Artifact Registry repo id         (e.g. garcia-lorca)
#   _DEPLOY       "true" to run gcloud run deploy   (only on main / release)
# Built-ins: $PROJECT_ID, ${_TAG}.
#
# Images are tagged with ${_TAG}. The same tag is what Terraform receives via
# image_tags so infra and the deployed revision always agree.

substitutions:
  _REGION: us-central1
  _AR_REPO: garcia-lorca
  _DEPLOY: "false"
  # Image tag. ${_TAG} is populated ONLY for commit-triggered builds; a manual
  # `gcloud builds submit` leaves it EMPTY, which used to produce refs like
  # "gateway:" and fail on the first docker push ~20 minutes into the build.
  # Default "latest" so a manual bootstrap build works out of the box; the commit
  # trigger overrides it with _TAG=${_TAG} so infra and revision agree.
  _TAG: latest

  # Identity Platform, for the web bundle. ALL EMPTY BY DEFAULT: an image built
  # without them has the provider sign-in off, because providerLoginEnabled()
  # requires the flag AND an api key — a half-set build cannot half-enable it.
  #
  # NEXT_PUBLIC_* is inlined at build time, so switching the provider on is a
  # REBUILD, not a redeploy. That is the property worth having for the door
  # everybody comes through: no console toggle can turn it on or off, and going
  # back is the same operation as going forward.
  _AUTH_PROVIDER: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # COST: no machineType set, so builds run on the DEFAULT machine (e2-medium),
  # which is the only pool eligible for the 120 free build-minutes/day. This
  # trades some wall-clock time on the parallel image builds for ~$0 dev builds
  # (see deploy/COST-AND-DEPLOY.md §C5). For faster prod builds, re-add a bigger
  # machineType (e.g. E2_HIGHCPU_8) on the prod trigger — it forfeits free minutes.

steps:
  # ---- 1. Proto: lint + generate (gen/ is regenerated, never committed) ----
  - id: buf-lint
    name: bufbuild/buf:1.50.0
    entrypoint: buf
    args: ["lint"]

  - id: buf-generate
    name: bufbuild/buf:1.50.0
    entrypoint: buf
    args: ["generate"]
    waitFor: ["buf-lint"]

  # ---- 2. Go: vet + tests across the workspace ----------------------------
  - id: go-vet
    name: golang:1.25-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go work sync
        # There is NO root go.mod — only go.work — so `go vet ./...` from the
        # repo root fails with "directory prefix . does not contain modules
        # listed in go.work" and, under `set -e`, kills this step before a
        # single image is built. Iterate the workspace members instead, the
        # same way .github/workflows/ci.yml does with its per-module matrix.
        for dir in $(go list -m -f '{{.Dir}}'); do
          echo "--- go vet: $$dir"
          (cd "$$dir" && go vet ./...)
        done
    waitFor: ["buf-generate"]

  - id: go-test
    name: golang:1.25-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Per workspace module — see the go-vet step for why `./...` cannot be
        # used from the repo root.
        for dir in $(go list -m -f '{{.Dir}}'); do
          echo "--- go test: $$dir"
          (cd "$$dir" && go test ./... -race -count=1)
        done
    waitFor: ["go-vet"]

  # ---- 3. Security gate: govulncheck + module audit -----------------------
  - id: govulncheck
    name: golang:1.25-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go install golang.org/x/vuln/cmd/govulncheck@latest
        # Per workspace module — see the go-vet step. `go mod verify` also needs
        # a module directory; there is no root go.mod to verify.
        for dir in $(go list -m -f '{{.Dir}}'); do
          echo "--- govulncheck: $$dir"
          (cd "$$dir" && "$$(go env GOPATH)/bin/govulncheck" ./... && go mod verify)
        done
    waitFor: ["buf-generate"]

  # ---- 4. Frontend: install + turbo test/lint/build -----------------------
  - id: web-build
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable pnpm
        pnpm install --frozen-lockfile
        # Scoped to web + its workspace deps: apps/mobile is an Expo app whose
        # build needs native tooling this image does not have. Mirrors
        # .github/workflows/ci.yml.
        pnpm turbo run test lint build --filter=@garcia-lorca/web...
    waitFor: ["buf-generate"]

  # ---- 5. Build-hardening gate: NO source maps in client artifacts --------
  # Prefer the frontend-owned check script when present; otherwise use the
  # grep-based fallback shipped alongside this pipeline. Either FAILS the build
  # if *.map files or sourceMappingURL comments exist in production bundles.
  - id: sourcemap-gate
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable pnpm
        if [ -f apps/web/scripts/check-no-sourcemaps.mjs ]; then
          echo "Using frontend-owned source-map check (pnpm --filter web check:no-sourcemaps)."
          pnpm --filter @garcia-lorca/web run check:no-sourcemaps
        else
          echo "Frontend check script absent; using pipeline fallback gate."
          bash deploy/cloudbuild/check-no-sourcemaps.sh
        fi
    waitFor: ["web-build"]

  # ---- 6. Build + push images (parallel; only the wired services here) ----
  # Build context is the repo root; -f points at each service Dockerfile.
  - id: image-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/gateway:${_TAG}"
        docker build -f services/gateway/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-iam
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/iam:${_TAG}"
        docker build -f services/iam/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-students
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/students:${_TAG}"
        docker build -f services/students/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-config
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/config:${_TAG}"
        docker build -f services/config/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-finance
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/finance:${_TAG}"
        docker build -f services/finance/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-grades
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/grades:${_TAG}"
        docker build -f services/grades/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-attendance
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/attendance:${_TAG}"
        docker build -f services/attendance/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-comms
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/comms:${_TAG}"
        docker build -f services/comms/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  - id: image-uniforms
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/uniforms:${_TAG}"
        docker build -f services/uniforms/Dockerfile -t "$$IMG" .
        docker push "$$IMG"
    waitFor: ["go-test", "govulncheck", "sourcemap-gate"]

  # The web image builds from the repo root like the Go services, but the root
  # .dockerignore excludes apps/ and packages/ for them — so this relies on
  # BuildKit preferring apps/web/Dockerfile.dockerignore. DOCKER_BUILDKIT=1 is
  # not optional here.
  - id: image-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        IMG="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}"
        # NEXT_PUBLIC_* is inlined at BUILD time, so the provider cannot be
        # switched on by redeploying: it needs a rebuild. Empty substitutions
        # (the default) produce an image with the provider sign-in off.
        docker build -f apps/web/Dockerfile -t "$$IMG" \
          --build-arg NEXT_PUBLIC_AUTH_PROVIDER="${_AUTH_PROVIDER}" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${_FIREBASE_PROJECT_ID}" \
          .
        docker push "$$IMG"
    waitFor: ["web-build", "sourcemap-gate"]

  # ---- 7. Deploy (only when _DEPLOY=true; main/release triggers) ----------
  # Cloud Run deploy preserves each service's scaling profile set by Terraform.
  # Terraform owns the desired-state config; this updates the running image to
  # the freshly built ${_TAG}. New images roll out; rollback = redeploy a
  # prior SHA (see deploy/README.md).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Skipping deploy (_DEPLOY != true)."
          exit 0
        fi
        for svc in gateway iam students config finance grades attendance comms uniforms web; do
          gcloud run deploy "$$svc" \
            --project="$PROJECT_ID" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/$$svc:${_TAG}"
        done
    waitFor:
      - image-gateway
      - image-iam
      - image-students
      - image-config
      - image-finance
      - image-grades
      - image-attendance
      - image-comms
      - image-uniforms
      - image-web

# Record built images in the build metadata.
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/gateway:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/iam:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/students:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/config:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/finance:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/grades:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/attendance:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/comms:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/uniforms:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}"

# 10 images plus vet/test-race/govulncheck/turbo on the default machine.
# 1800s was optimistic; a timeout on demo day is a hard stop.
timeout: 3600s
