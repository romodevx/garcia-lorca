  # The web image builds from the repo root like the Go services, but the root
  # .dockerignore excludes apps/ and packages/ for them — so this relies on
  # BuildKit preferring apps/web/Dockerfile.dockerignore. DOCKER_BUILDKIT=1 is
  # not optional here.
  - id: image-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        BASE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web"
        IMG="$$BASE:${_TAG}"
        CACHE="$$BASE:cache"
        # NEXT_PUBLIC_* is inlined at BUILD time, so the provider cannot be
        # switched on by redeploying: it needs a rebuild. Empty substitutions
        # (the default) produce an image with the provider sign-in off.
        #
        # The cache source is keyed only by layer content, and the NEXT_PUBLIC_*
        # build args sit in a late layer — so flipping the auth provider still
        # rebuilds from that layer down, exactly as it must.
        docker build -f apps/web/Dockerfile \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$CACHE" \
          --build-arg NEXT_PUBLIC_AUTH_PROVIDER="${_AUTH_PROVIDER}" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${_FIREBASE_PROJECT_ID}" \
          -t "$$IMG" -t "$$CACHE" .
        docker push "$$IMG"
        docker push "$$CACHE"
    waitFor: ["image-comms"]

# The rollout is NOT here.
#
# The `_DEPLOY=true` path that used to live at this spot had never executed once
# — deploy-dev.yml has always passed _DEPLOY=false and rolled out from the
# runner afterwards — and it used `gcloud run deploy` where dev has always used
# `gcloud run services update`. Two rollout implementations, one of them dead
# and subtly different from the live one, is how a deploy behaves differently on
# the day somebody finally flips the flag.
#
# There is one rollout, it lives in .github/workflows/deploy-dev.yml, and it is
# the one that has actually run.

# Record built images in the build metadata.
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/gateway:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/iam:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/students:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/config:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/finance:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/grades:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/attendance:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/comms:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/uniforms:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}"

# 10 images on the default machine, with the gates gone and layer caching on.
# A warm build should land far inside this; a cold one (go.sum changed, so every
# cache-from misses) is what the headroom is for. Kept well above the expected
# time because a timeout on demo day is a hard stop — but BELOW the old 3600s,
# because the GitHub runner now polls this build and every minute it runs is a
# billed Actions minute. See .claude/docs/PLAN-minutos-ci.md.
timeout: 2400s
