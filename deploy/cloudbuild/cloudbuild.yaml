# García Lorca CI/CD — Cloud Build.
#
# This pipeline BUILDS IMAGES. It does not gate and it does not deploy.
#
# It used to re-run go vet, go test -race, govulncheck, the web build and the
# source-map gate on the very commit CI had just approved — 25.5 min of the
# critical path, paid twice, and paid a THIRD time by the GitHub runner sitting
# there watching the stream. CI is the gate; deploy-dev.yml refuses to submit a
# build unless CI is green on that exact SHA. The rollout lives on the runner.
#
# Step order: lint -> generate -> images, in THREE LANES of one image at a time:
#   A: gateway -> config -> uniforms
#   B: iam -> students -> finance
#   C: grades -> attendance -> comms -> web
# All ten used to start together on the default e2-medium (2 vCPU, 4 GB). That
# box is CPU-bound either way — each image took ~20 min because ten builds
# shared two cores — so lanes cost little wall-clock time, but ten concurrent
# BuildKit builds plus the web's Next build ran the machine out of memory: on
# 2026-09-28 the gateway step died twice at the same point with only
# "unexpected EOF" from the Docker daemon, while the identical build (same code,
# same --cache-from) passed locally. Three at a time keeps peak memory at about
# a third. Lanes are balanced by count. Cloud Build only lets a step wait for a
# step DEFINED ABOVE it (anything else is rejected at submit as "has not been
# defined"), so each lane's order follows the order of the steps in this file —
# which is why the web, defined last, closes lane C instead of opening it.
#
# Trigger substitutions (set on the trigger):
#   _REGION       deployment region                (e.g. us-central1)
#   _AR_REPO      Artifact Registry repo id         (e.g. garcia-lorca)
# Built-ins: $PROJECT_ID, ${_TAG}.
#
# Images are tagged with ${_TAG}. The same tag is what Terraform receives via
# image_tags so infra and the deployed revision always agree.

substitutions:
  _REGION: us-central1
  _AR_REPO: garcia-lorca
  # Image tag. ${_TAG} is populated ONLY for commit-triggered builds; a manual
  # `gcloud builds submit` leaves it EMPTY, which used to produce refs like
  # "gateway:" and fail on the first docker push ~20 minutes into the build.
  # Default "latest" so a manual bootstrap build works out of the box; the commit
  # trigger overrides it with _TAG=${_TAG} so infra and revision agree.
  _TAG: latest

  # Identity Platform, for the web bundle. ALL EMPTY BY DEFAULT: an image built
  # without them has the provider sign-in off, because providerLoginEnabled()
  # requires the flag AND an api key — a half-set build cannot half-enable it.
  #
  # NEXT_PUBLIC_* is inlined at build time, so switching the provider on is a
  # REBUILD, not a redeploy. That is the property worth having for the door
  # everybody comes through: no console toggle can turn it on or off, and going
  # back is the same operation as going forward.
  _AUTH_PROVIDER: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # COST: no machineType set, so builds run on the DEFAULT machine (e2-medium),
  # which is the only pool eligible for the 120 free build-minutes/day. This
  # trades some wall-clock time on the parallel image builds for ~$0 dev builds
  # (see deploy/COST-AND-DEPLOY.md §C5). For faster prod builds, re-add a bigger
  # machineType (e.g. E2_HIGHCPU_8) on the prod trigger — it forfeits free minutes.

steps:
  # ---- 1. Proto: lint + generate (gen/ is regenerated, never committed) ----
  - id: buf-lint
    name: bufbuild/buf:1.50.0
    entrypoint: buf
    args: ["lint"]

  - id: buf-generate
    name: bufbuild/buf:1.50.0
    entrypoint: buf
    args: ["generate"]
    waitFor: ["buf-lint"]

  # ---- 6. Build + push images (parallel; only the wired services here) ----
  # Build context is the repo root; -f points at each service Dockerfile.
  - id: image-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Cloud Build hands every build a COLD Docker daemon, so without a cache
        # source each image re-downloads its modules and recompiles the whole
        # dependency graph from zero. Measured on build 667ce1bd: 27.9 min for
        # one Go service, with the 10 images contending for an e2-medium's two
        # vCPUs. The Dockerfiles are already layered for this (go.mod, then
        # `go mod download`, then the source) — the layers just had nowhere to
        # come from. BUILDKIT_INLINE_CACHE makes the pushed image carry its own
        # cache metadata; --cache-from reads it back off Artifact Registry next
        # time. A miss (first build, or a go.sum change) warns and builds cold.
        export DOCKER_BUILDKIT=1
        BASE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/gateway"
        IMG="$$BASE:${_TAG}"
        CACHE="$$BASE:cache"
        docker build -f services/gateway/Dockerfile \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$CACHE" \
          -t "$$IMG" -t "$$CACHE" .
        docker push "$$IMG"
        # Moving the :cache tag is what makes the NEXT build fast. Pushed after
        # the real tag so a failure here never loses the deployable image.
        docker push "$$CACHE"
    waitFor: ["buf-generate"]

  - id: image-iam
