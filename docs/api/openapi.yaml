openapi: 3.1.0

# García Lorca — REST contract served by the gateway/BFF.
#
# SCOPE. This file starts with the uniform shop (M12) because that is the first
# module written contract-first, as the canon requires. The modules that shipped
# before it are NOT described here yet; adding them is tracked as tech debt, and
# the intent is that every path the gateway serves ends up in this file.
#
# ERRORS. Every operation here answers failures with the SAME envelope
# (#/components/schemas/Error). The gateway's older handlers still answer with
# text/plain, which is why the shared web client reads JSON first and falls back
# to text: one module moving to the envelope must not fork error handling. The
# rest migrating is the tech-debt item above. Until a route migrates, its entry
# documents what it really answers with the Plain* responses below, never the
# envelope it does not send (the teaching-load routes are the first to do so).
#
# AUTH. The routes here are the staff panel's, authenticated with a session
# cookie (Secure, HttpOnly, SameSite=Strict), which is why every state-changing
# call also carries a CSRF header. The family routes (/api/v1/family/*)
# authenticate with a bearer token instead (familyBearer) and have no cookie to
# forge, so they carry no CSRF header.
#
# MODULE FLAG. Every path below sits behind `module_uniforms`. With the flag off
# the routes answer 404 — not 403 — because a disabled module must be invisible,
# not merely refused.

info:
  title: García Lorca API
  version: 0.18.0
  license:
    name: Proprietary
    url: https://garcialorca.edu.mx/legal
  description: |
    School management API. Currently describes the uniform shop (M12);
    other modules are added as they are brought under contract-first.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garcialorca.edu.mx
    description: Production

tags:
  - name: activities
    description: >
      T17 — Actividades (extracurriculares) with their own charge. An activity
      has a weekly schedule (several days, each with its own hours), price
      options (by days per week attended, or a flat fee), a periodicity
      (monthly, weekly or once per cycle), the first billing date and the
      first due date, and an optional fixed late fee. Pupils are enrolled with
      the price option chosen per pupil. The billing run issues one charge per
      period, `activity:<activityId>:<studentId>:<period>`, on its billing date;
      it then shows in the counter, the statement and the parents' app like any
      other debt, and several activities add up. Behind `module_activities`
      (and `module_finance`); reads `activities:read`, writes
      `activities:write`.
  - name: scholarships
    description: >
      T18 — Becas, computed by finance (ADR 0022). A scholarship is a percent
      off, a fixed amount off, or a fixed amount to pay, applied to any of:
      the inscription, the monthly tuition, specific concepts of the catalog,
      and activities. It is worked out when a debt is READ or PAID (the
      counter, the statement, the parents' app, the receipts): base price →
      level discount → scholarship → early payment. It holds only while the
      charge is paid by its own due date; paid later, the charge is owed at
      full price with the normal surcharge. Several scholarships on one
      charge do not stack: the one most favourable to the family applies.
      Behind `module_scholarships` (and `module_finance`); reads
      `scholarships:read`, writes `scholarships:write`.
  - name: expenses
    description: >
      T10 — Egresos: expenses, categories, receipts, the period's money and
      its reports, and closing the cash cut. module_expenses; `expenses:read` /
      `expenses:write`.
  - name: uniforms-catalogue
    description: Garments and their sizes. Requires `uniforms:stock`.
  - name: uniforms-inventory
    description: Stock levels, goods receipts and adjustments. Requires `uniforms:stock`.
  - name: uniforms-sales
    description: The counter sale. Requires `uniforms:write` AND `finance:write`.
  - name: uniforms-orders
    description: The order list. Requires `uniforms:orders`, which is owner-only.
  - name: uniforms-settings
    description: Per-school limits and windows.
  - name: teachers
    description: >
      Staff roster and who teaches what ("carga académica"). Behind
      `module_teachers`; writes require `teachers:write`.
  - name: iam-users
    description: >
      Login accounts. Behind `module_iam`. Only the deletion route is described
      here so far (T2); the rest of the user and role admin predates the
      contract and is tracked with the other undescribed routes.
  - name: config-levels
    description: >
      The school's levels (Preescolar, Primaria…). Behind `module_config`;
      reads require `config:read`, writes `config:write`.
  - name: schedule
    description: >
      T16 — the school timetable (Horarios). A base weekly timetable per cycle
      (Monday–Friday), built ONLY from the cycle's teaching assignments, plus
      date-specific changes (substitute, swap, cancel) that never touch the
      base. A teacher is never in two groups at once and a group never has two
      classes at once — enforced by the database on the base and by config on
      each date's effective timetable. Behind `module_schedule` (and
      `module_config`); reads `schedule:read`, writes `schedule:write`; the
      teacher's own timetable under `/api/v1/teaching/schedule` needs
      `teaching:read`.
  - name: student-import
    description: >
      ADR 0033 — migrating pupils from the school's previous system, one .xlsx
      per level. The preview writes nothing; the commit re-sends the same file
      and the preview's `planHash`, and writes only what the preview showed.
      Behind `module_students`, `module_config` and `module_student_import`
      (404 when any is off) and the owner-only `students:import`.
  - name: config-evaluation-periods
    description: >
      T14 — the evaluation periods (trimesters, bimesters…) of each GRADE in a
      cycle, with editable start and end dates (both inclusive). A grade's
      periods never overlap and lie inside the cycle; the database enforces the
      overlap rule too (EXCLUDE), so concurrent editors cannot break it.
  - name: config-terms
    description: >
      The periods (trimesters) of each cycle and level, and the calendar months
      each one covers — configured per cycle and level, never hard-coded.
      Behind `module_config`; reads require `config:read`, writes
      `config:write`.
  - name: attendance
    description: >
      Pass lists (T3). Behind `module_attendance`. A list is keyed by
      (group, date, subject): the group's LEVEL decides its attendance mode —
      `daily` (one list per group per day, no subject) or `per_class` (one per
      group, subject and day). Storage is default-present: only absences,
      lates and excused absences are stored. A saved list records a session
      (who took it, when), so an all-present day is distinguishable from a day
      nobody took. The director routes (`attendance:read` / `attendance:write`)
      reach any group on any date; the teacher routes under
      `/api/v1/teaching/attendance` (`attendance_own:read` /
      `attendance_own:write`) reach only the caller's own lists, and saving is
      allowed for today and up to 7 days back, never the future. "Today" is the
      system's UTC date (a known fleet-wide offset: the school is UTC-6).

  - name: grades
    description: >
      Period grades (T15). The school captures one WHOLE-NUMBER grade per
      student, subject and EVALUATION PERIOD of the group's grade (the periods
      config holds per cycle and grade, T14), autosaved per cell. Monthly
      capture (T6) was retired: its routes are gone (404) and the
      monthly_grades rows stay in the database, untouched and unread. The
      group's LEVEL decides the scale (`GradingScale`: range and passing mark —
      its `decimals` no longer apply to capture, which is integers only) and
      whether it takes numeric grades at all (Preescolar does not). Every rule
      is judged by the grades service, so the director routes (`grades:read` /
      `grades:write`, any assignment of the school) and the teacher routes
      under `/api/v1/teaching/grades` (`teaching:read` / `teaching:write`, only
      the assignments the caller teaches in the active cycle — any other id is
      404) refuse with the same sentences. A grade is a JSON NUMBER whose exact
      text is judged (9.5 is refused with `GRADE_NOT_INTEGER`, never rounded).
      Averages the system computes (report cards, the parents' app, the
      sheet's counters) are the EXACT mean truncated to 2 decimals (8.666… →
      8.66). "Today" is the school's local day (America/Mexico_City). A period
      whose level term (same cycle, level and ordinal) is closed is read-only
      for everyone (`PERIOD_LOCKED`).

  - name: family
    description: >
      The family app (T5). Bearer-authenticated, `family:read`. Self-scoped by
      construction: the caller is the principal, and a child the caller is not
      linked to answers 404 — never 403 — so nothing says whether it exists.
      Each route is guarded on every module it composes (either flag OFF ⇒ 404).

  - name: auth
    description: >
      Signing in and the caller's own credentials. Only the routes whose error
      contract a client branches on are described here.

paths:
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the caller's own password
      description: >
        Verifies `currentPassword` and sets `newPassword` (at least 8
        characters). Reachable while a forced change is pending. The change
        revokes every session issued before it, the caller's included; the
        gateway then signs the caller in again with the new password and sets
        fresh cookies (200). If that re-login fails the password IS changed but
        no session comes back (204): the client must send the person to sign
        in. Throttled per signed-in user on the re-authentication bucket (429).
      operationId: changePassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
            example: { currentPassword: '••••••••', newPassword: '••••••••••' }
      responses:
        '200':
          description: Changed; a fresh session is set in the cookies.
          content:
            application/json:
              schema:
                type: object
                required: [expiresIn, mustChangePassword]
                properties:
                  expiresIn: { type: integer, description: Access token lifetime in seconds. }
                  mustChangePassword: { type: boolean }
              example: { expiresIn: 900, mustChangePassword: false }
        '204': { description: 'Changed, but no fresh session; sign in again.' }
        '400':
          description: >
            A malformed body, or a new password under 8 characters (the body is
            then a Spanish sentence a client may show as-is).
          content:
            text/plain:
              schema: { type: string }
              example: La nueva contraseña debe tener al menos 8 caracteres.
        '401':
          description: >
            `REAUTH_FAILED`: the current password is not the caller's. Without
            the header, the session itself is missing or expired.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: La contraseña actual no es correcta.
        '429':
          description: Too many attempts; wait before trying again.
          content:
            text/plain:
              schema: { type: string }
              example: too many requests
        '500':
          description: iam failed.
          content:
            text/plain:
              schema: { type: string }
              example: Internal Server Error

  /api/v1/family/devices:
    post:
      tags: [family]
      summary: Register this phone for push notifications
      description: >
        Registers (or refreshes) the Expo push token of the caller's phone. The
        app calls it on every launch; it is idempotent (upsert by token). The
        device owner is ALWAYS the caller: a token previously registered by
        someone else (a phone handed over) moves to the caller, who alone
        receives on it from then on. Pushes go out only for absences, lates,
        excused absences and corrections of those. Behind `module_comms` and
        `module_students`.
      operationId: registerFamilyDevice
      security: [{ familyBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyDeviceRequest' }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/devices/{token}:
    delete:
      tags: [family]
      summary: Stop pushing to this phone (logout)
      description: >
        Removes the token only when the caller owns it. Another user's token,
        or an unknown one, is left alone and answers the same 204: the call is
        idempotent and reveals nothing. Behind `module_comms` and
        `module_students`.
      operationId: unregisterFamilyDevice
      security: [{ familyBearer: [] }]
      parameters:
        - name: token
          in: path
          required: true
          description: The Expo push token, URL-encoded.
          schema: { $ref: '#/components/schemas/ExpoPushToken' }
      responses:
        '204': { description: Removed (or was not the caller's). }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/attendance:
    get:
      tags: [family]
      summary: A child's attendance, one row per day
      description: >
        The child's month, newest first. A day appears when a list was taken
        for the child's group that day (while the child was in it) or an
        exception is stored for it; TODAY always appears in the current month
        (`not_taken` until a list is taken). "While the child was in it" is the
        group window: the enrollment's school year intersected with its active
        period (from enrollment, until the day before a withdrawal), split by
        transfers (the move day belongs to the new group). A `daily` day
        carries the list's status (`present` when taken with no exception). A
        `per_class` day lists every class taken that day with the child's
        status; the day's status follows the day rule (see
        `FamilyDayStatus`). A day with both a daily list and classes is
        `per_class`: absent on the daily list is `absent`, otherwise the day
        rule over every list taken. The summary counts DAYS by that status
        (`partial` in its own counter). "Today" and the default month
        are the system's UTC date (the school is UTC-6), consistently with
        every other date the system shows. Behind `module_attendance` and
        `module_students`.
      operationId: getFamilyAttendance
      security: [{ familyBearer: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: >
            The month to read; defaults to the current UTC month. From 2000-01
            up to the month after the current one; outside that range is 400.
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-09' }
      responses:
        '200':
          description: The month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyAttendanceMonth' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/statement:
    get:
      tags: [family]
      summary: A child's account statement (ledger)
      description: >
        T7. The same ledger the school reads (see `getStudentStatement`), in
        the family's view: charges that have not opened are left out and
        voided deposits are not shown. The balance is the same number.
        A child that is not the caller's is 404. Behind `module_finance` AND
        `module_students`. Requires `family:read`.
      operationId: getFamilyStatement
      security: [{ familyBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/FamilyStudentIdPath' }]
      responses:
        '200':
          description: The ledger.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/statement/pdf:
    get:
      tags: [family]
      summary: A child's account statement as a PDF
      description: >
        The family's ledger as a PDF, same rules as the JSON. Behind
        `module_finance` AND `module_students`. Requires `family:read`.
      operationId: getFamilyStatementPdf
      security: [{ familyBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/FamilyStudentIdPath' }]
      responses:
        '200': { $ref: '#/components/responses/StatementPDF' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students:
    get:
      tags: [family]
      summary: The caller's own children
      description: >
        Phase 9b. Every child the CALLER is linked to as a guardian, derived
        from the principal alone (no request field widens it; ADR 0004). An
        unlinked guardian gets an empty list. Behind `module_students`.
        Requires `family:read`.
      operationId: listFamilyStudents
      security: [{ familyBearer: [] }]
      responses:
        '200':
          description: The caller's children.
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items: { $ref: '#/components/schemas/FamilyStudent' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/profile:
    get:
      tags: [family]
      summary: A child's record and current enrollment
      description: >
        The child's core record plus the active enrollment, if any. A child
        that is not the caller's is 404. Behind `module_students`. Requires
        `family:read`.
      operationId: getFamilyStudentProfile
      security: [{ familyBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/FamilyStudentIdPath' }]
      responses:
        '200':
          description: The child.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyStudentProfile' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/receipts/{depositId}:
    get:
      tags: [family]
      summary: The receipt of one of a child's payments
      description: >
        ISSUE-T14-107. The same receipt the office prints (see the
        statement's `depositId` on a payment line), for a deposit of the
        caller's OWN child. A child that is not the caller's, a deposit of
        another pupil, one that does not exist, and a voided or superseded
        one (the family's statement does not show them either) are all
        404 — never 403, so nothing tells whether it exists. Behind
        `module_finance` AND `module_students`.
        Requires `family:read`.
      operationId: getFamilyPaymentReceipt
      security: [{ familyBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/FamilyStudentIdPath' }
        - { $ref: '#/components/parameters/FamilyDepositIdPath' }
      responses:
        '200':
          description: The receipt.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/receipts/{depositId}/pdf:
    get:
      tags: [family]
      summary: The receipt of one of a child's payments, as a PDF
      description: >
        The receipt above as a PDF, same rules. Behind `module_finance` AND
        `module_students`. Requires `family:read`.
      operationId: getFamilyPaymentReceiptPdf
      security: [{ familyBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/FamilyStudentIdPath' }
        - { $ref: '#/components/parameters/FamilyDepositIdPath' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptPDF' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/uniforms/items:
    get:
      tags: [uniforms-catalogue]
      summary: List garments
      operationId: listUniformItems
      security: [{ sessionCookie: [] }]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
          description: Retired garments are hidden by default; issued orders still point at them.
        - name: levelId
          in: query
          schema: { $ref: '#/components/schemas/LevelId' }
          description: |
            Narrows to what a student of that level may buy: garments scoped to
            it PLUS garments scoped to no level at all. Omitted returns everything.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
              examples:
                mixed:
                  summary: A garment for every level (no levelId)
                  value:
                    items:
                      - id: 6f1c9a2e-1111-4e2b-9a11-000000000001
                        name: Playera blanca
                        priceCents: 32000
                        active: true
                        sizes:
                          - id: 8a2b1c3d-0000-4000-8000-000000000006
                            itemId: 6f1c9a2e-1111-4e2b-9a11-000000000001
                            sizeLabel: "6"
                            sizeOrder: 1
                            onHand: 12
                            reserved: 2
                            available: 10
                            minStock: 5
                            belowMinimum: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [uniforms-catalogue]
      summary: Create a garment
      operationId: createUniformItem
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
            examples:
              everyLevel:
                summary: A garment the whole school wears
                value: { name: Suéter verde, priceCents: 65000 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409': { $ref: '#/components/responses/LevelBeingDeleted' }

  /api/v1/uniforms/items/{id}/sizes:
    post:
      tags: [uniforms-catalogue]
      summary: Add or update a garment's sizes in one call
      description: |
        A school opening the module has six garments and eight sizes each. Asking
        for forty-eight separate calls is how a module gets abandoned on its first
        afternoon, so this takes the whole size run at once and reports created
        and updated separately — the panel can then say "8 sizes created, 2 already
        existed" instead of upserting in silence.
      operationId: upsertUniformSizes
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sizes]
              properties:
                sizes:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [sizeLabel]
                    properties:
                      sizeLabel: { type: string, minLength: 1, maxLength: 12 }
                      sizeOrder: { type: integer, default: 0 }
                      minStock: { type: integer, minimum: 0, default: 0 }
            examples:
              numericRun:
                summary: Trousers, sizes 4 to 12
                value:
                  sizes:
                    - { sizeLabel: "4", sizeOrder: 1, minStock: 3 }
                    - { sizeLabel: "6", sizeOrder: 2, minStock: 3 }
                    - { sizeLabel: "8", sizeOrder: 3, minStock: 5 }
                    - { sizeLabel: "10", sizeOrder: 4, minStock: 5 }
                    - { sizeLabel: "12", sizeOrder: 5, minStock: 3 }
              letterRun:
                summary: A jumper, CH to G
                value:
                  sizes:
                    - { sizeLabel: CH, sizeOrder: 1 }
                    - { sizeLabel: M, sizeOrder: 2 }
                    - { sizeLabel: G, sizeOrder: 3 }
      responses:
        '200':
          description: The garment's sizes after the call.
          content:
            application/json:
              schema:
                type: object
                required: [createdCount, updatedCount, sizes]
                properties:
                  createdCount: { type: integer }
                  updatedCount: { type: integer }
                  sizes:
                    type: array
                    items: { $ref: '#/components/schemas/StockLevel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/uniforms/stock:
    get:
      tags: [uniforms-inventory]
      summary: List stock levels
      operationId: listUniformStock
      security: [{ sessionCookie: [] }]
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: onlyBelowMinimum
          in: query
          schema: { type: boolean, default: false }
          description: Powers the "below minimum" tab, which is how the storeroom decides what to reorder.
      responses:
        '200':
          description: Stock by garment and size.
          content:
            application/json:
              schema:
                type: object
                required: [stock]
                properties:
                  stock:
                    type: array
                    items: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/uniforms/stock/receive:
    post:
      tags: [uniforms-inventory]
      summary: Book a delivery from the supplier
      description: |
        Books the units in, and in the same transaction allocates them to the
        lines that have been waiting for those sizes, oldest first. The guardians
        of the allocated lines are notified: "the size you asked for is here".
      operationId: receiveUniformStock
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [stockId, qty]
                    properties:
                      stockId: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500 }
            examples:
              oneBox:
                summary: A box of forty pieces across six sizes
                value:
                  note: Factura 8871, proveedor Uniformes del Bajío
                  lines:
                    - { stockId: 8a2b1c3d-0000-4000-8000-000000000006, qty: 6 }
                    - { stockId: 8a2b1c3d-0000-4000-8000-000000000008, qty: 12 }
      responses:
        '200':
          description: Stock after the receipt, plus any waiting lines it satisfied.
          content:
            application/json:
              schema:
                type: object
                required: [stock, allocatedLineIds]
                properties:
                  stock:
                    type: array
                    items: { $ref: '#/components/schemas/StockLevel' }
                  allocatedLineIds:
                    type: array
                    items: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/uniforms/stock/adjust:
    post:
      tags: [uniforms-inventory]
      summary: Correct a stock count
      description: |
        Breakage, loss, a miscount. The note is REQUIRED because this is the one
        write that can conceal a shortfall; it is recorded in the append-only
        ledger with the actor, and a negative adjustment raises an alert.
      operationId: adjustUniformStock
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockId, qtyDelta, note]
              properties:
                stockId: { type: string, format: uuid }
                qtyDelta:
                  type: integer
                  description: Signed. Negative is the shortfall case.
                note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: The corrected stock level.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The correction would push the count below what is already held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/uniforms/counter-sale:
    post:
      tags: [uniforms-sales]
      summary: Sell and hand over in one act
      description: |
        The parent who walks in without an order. The goods are sold, handed over
        and charged in one call, and the resulting delivery is born terminal so no
        expiry sweep can ever "return" stock that has physically left.

        `Idempotency-Key` is REQUIRED and must be minted when the till drawer
        opens, not when the button is pressed. This is the only call that moves
        physical goods and money together; a double click or a retried timeout
        without it is a second sale of goods that left once.

        `studentId` may be omitted for a sale to someone who is not a student.
        The money is still recorded — against the school's counter account — so
        the till reconciles; the note must then say who bought it.

        Requires `uniforms:write` AND `finance:write`. A caller holding only the
        first gets 403 with a message naming the missing one, so the panel can
        disable the entry point and say why rather than failing after six lines
        have been keyed in.
      operationId: uniformCounterSale
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                studentId: { type: [string, 'null'], format: uuid }
                cycleId:
                  type: [string, 'null']
                  format: uuid
                  description: Required when studentId is present, forbidden when it is not.
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SaleLine' }
                method:
                  type: string
                  enum: [cash, card, transfer, credit_note]
                  description: The single method. Required unless `tenders` is sent, which replaces it.
                reference:
                  type: string
                  maxLength: 120
                  description: Voucher or transfer id. Only meaningful when method is not cash.
                tenders:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { $ref: '#/components/schemas/Tender' }
                  description: >
                    A combined payment (T8): a credit note completed with cash,
                    say. Must add up exactly to the sale's total as the server
                    prices it, or the sale is refused (400) before anything moves.
                note: { type: string, maxLength: 500 }
            examples:
              toAStudent:
                summary: Two garments to an enrolled student, cash
                value:
                  studentId: 3d5f8a10-0000-4000-8000-000000000042
                  cycleId: 70000000-0000-0000-0000-000000000001
                  method: cash
                  lines:
                    - { itemId: 6f1c9a2e-1111-4e2b-9a11-000000000001, sizeLabel: "8", qty: 1 }
                    - { itemId: 6f1c9a2e-1111-4e2b-9a11-000000000002, sizeLabel: "8", qty: 1 }
              creditNoteAndCash:
                summary: A credit note completed with cash (T8)
                value:
                  studentId: 3d5f8a10-0000-4000-8000-000000000042
                  cycleId: 70000000-0000-0000-0000-000000000001
                  tenders:
                    - { method: credit_note, amountCents: 30000, reference: NC-0012 }
                    - { method: cash, amountCents: 55000 }
                  lines:
                    - { itemId: 6f1c9a2e-1111-4e2b-9a11-000000000001, sizeLabel: "8", qty: 1 }
              toSomeoneElse:
                summary: A sale to an uncle
                value:
                  method: cash
                  note: Tío de Zoe Villalobos, 3B
                  lines:
                    - { itemId: 6f1c9a2e-1111-4e2b-9a11-000000000001, sizeLabel: M, qty: 1 }
      responses:
        '201':
          description: Sold and handed over.
          content:
            application/json:
              schema:
                type: object
                required: [order, replayed]
                properties:
                  order: { $ref: '#/components/schemas/Order' }
                  replayed:
                    type: boolean
                    description: true when the key matched an earlier sale and nothing was collected again.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing `uniforms:write` or `finance:write`. The message names which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missingFinance:
                  value:
                    error:
                      code: forbidden
                      message: Necesitas permiso de cobros para vender en mostrador
                      details: { missingPermission: finance:write }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Not enough stock for one of the lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/uniforms/orders:
    get:
      tags: [uniforms-orders]
      summary: List orders
      description: |
        Requires `uniforms:orders`, which is OWNER-ONLY: each row carries a
        student's name and what the family bought, for the whole school, with no
        per-object scoping.

        Defaults to LIVE deliveries only. Reading the full history requires an
        explicit date range — a cheap limit on how much of the school's purchase
        record one screen hands over at once.
      operationId: listUniformOrders
      security: [{ sessionCookie: [] }]
      parameters:
        - name: levelId
          in: query
          schema: { $ref: '#/components/schemas/LevelId' }
          description: The student's level at order time.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: |
            A folio if it matches `U-YYYY-NNNNNN`, otherwise a student name.
            Wildcards in the input are escaped, not interpreted.
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/FulfillmentStatus' }
          style: form
          explode: true
        - name: requiresAttention
          in: query
          schema: { type: boolean }
          description: The deliveries no rule could settle on its own.
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, deadline, status], default: createdAt }
        - name: desc
          in: query
          schema: { type: boolean, default: true }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: pageToken
          in: query
          schema: { type: string }
      responses:
        '200':
          description: |
            Orders with their lines and deliveries. Ties break on id, so paging
            stays stable while the expiry sweep mutates rows underneath.
          content:
            application/json:
              schema:
                type: object
                required: [orders, totalCount]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextPageToken: { type: [string, 'null'] }
                  totalCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/uniforms/orders/{id}:
    get:
      tags: [uniforms-orders]
      summary: Read one order
      operationId: getUniformOrder
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: The order with its lines and deliveries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/uniforms/settings:
    get:
      tags: [uniforms-settings]
      summary: Read the shop's limits
      operationId: getUniformSettings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    put:
      tags: [uniforms-settings]
      summary: Update the shop's limits
      operationId: updateUniformSettings
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Settings after the update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/contacts:
    post:
      tags: [students]
      summary: Record somebody the school can call
      description: >
        A contact is a person, not an account: a grandmother who may collect the
        child, or the phone that actually answers. Most of a pupil's contacts are
        these.


        Separate from linking a guardian, because the two answer different
        questions — one grants access to the family app, the other writes down
        the number that answers. Conflating them is why the second number stayed
        on paper and the system showed one contact per pupil as though that were
        the truth.
      operationId: addContact
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, relationship, fullName]
              properties:
                studentId: { type: string, format: uuid }
                relationship: { type: string, enum: [mother, father, guardian, other] }
                fullName:
                  type: string
                  minLength: 1
                  description: >
                    Required. A phone number with no name attached is a number
                    nobody can use.
                phone: { type: string }
                email: { type: string }
                isEmergency: { type: boolean }
      responses:
        '201':
          description: The stored contact. hasAccount is false unless they can open the family app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/students/{studentId}/guardians/{contactId}/invite:
    post:
      tags: [students]
      summary: Give a contact access to the family app
      description: >
        Turns a contact the school already recorded into a family that can open
        the app. It does NOT create a second person: the account is attached to
        the contact row that is already there, so the pupil still has one list of
        contacts and the office still reads one name.


        Until this existed there was no way at all. Creating the account by hand
        and assigning the `guardian` role is refused for everybody — the
        anti-escalation guard lets a caller assign only roles whose permissions
        it already holds, and `family:read` was held by nobody. So no family
        could be given the app without writing SQL.


        The contact needs an email: it is where the invitation goes. The school
        chooses no password — the family sets its own through the link, the same
        posture as every other invited account.


        IDEMPOTENT by email. Inviting a contact whose address already has an
        account attaches that account rather than creating a duplicate, so a
        retry after a failed send is safe and a mother of two children signs in
        once for both.
      operationId: inviteContactToApp
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            The contact, now carrying an account.


            `invitation` is present when an account was created for this
            address. Read `invitation.sent` before telling anybody the mail went
            out: when it is false, `invitation.url` is the link to hand over by
            other means.


            `invitation` is NULL when the address already had an account — the
            mother of two children signs in once for both — and the contact was
            simply attached to it. Nothing was sent, and nothing needed to be.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: '#/components/schemas/Contact' }
                  invitation:
                    # 3.1 spells nullability as a union with the null type; the
                    # 3.0 `nullable: true` keyword does not exist here.
                    description: Null when the address already had an account.
                    oneOf:
                      - $ref: '#/components/schemas/Invitation'
                      - type: 'null'
        '400':
          description: >
            The contact has no email, or already has an account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >
            No such contact for that pupil — or the students module is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/students:
    post:
      tags: [students]
      summary: Register a new pupil (quick add)
      description: >
        Creates an applicant in admission "pending". The level is a config
        level id; the group is assigned later by capacity (enrollment by
        grade). birthDate is optional (T11): captured here, the pupil is
        greeted on their birthday without a second visit to the file. It must
        be YYYY-MM-DD and not after today.
      operationId: createStudent
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [curp, firstName, lastName, levelId, guardianName]
              properties:
                curp: { type: string, minLength: 18, maxLength: 18, example: "LOAA190312MDFVDA01" }
                firstName: { type: string, minLength: 1, example: "ADA" }
                lastName: { type: string, minLength: 1, example: "LOVELACE", description: "Paternal surname." }
                maternalLastName: { type: string, example: "BYRON", description: "Maternal surname; optional." }
                levelId: { type: string, format: uuid }
                gradeGroup: { type: string, example: "", description: "Left empty: capacity assigns the group." }
                guardianName: { type: string, minLength: 1, example: "AUGUSTA BYRON" }
                birthDate: { type: string, format: date, example: "2019-03-12", description: "Optional." }
      responses:
        '201':
          description: The new applicant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentWithProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Another pupil already has that CURP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/enrollments:
    post:
      tags: [students]
      summary: Enroll a pupil into a group
      description: >
        Places the pupil in the chosen group; the cycle is derived from the
        group. Requires students:enroll. Group capacity is not checked here
        (the by-grade route fills groups by capacity).
        enrolledOn is the pupil's entry day (YYYY-MM-DD, the school's
        calendar); omitted means today. It must lie between the start of the
        group's cycle and today in the school's configured timezone (400
        otherwise). Billing starts in that month: no tuition is charged for the
        months before it. A day before today also requires finance:write,
        because it creates charges for months already past (403 otherwise).
      operationId: enrollStudent
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, groupId]
              properties:
                studentId: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000003" }
                groupId: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000004" }
                termId: { type: string, format: uuid, description: "Optional term of the same cycle.", example: "e3b0c442-98fc-1c14-9afb-000000000005" }
                enrolledOn: { type: string, format: date, description: "Optional entry day; omitted means today.", example: "2026-08-24" }
      responses:
        '201':
          description: The new enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/PlainTextError' }
        '403': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/PlainTextError' }
        '409': { $ref: '#/components/responses/PlainTextError' }

  /api/v1/enrollments/by-grade:
    post:
      tags: [students]
      summary: Enroll a pupil into a grade, the group chosen by capacity
      description: >
        Places the pupil in the first group of the grade (active cycle) that
        still has a seat. Requires students:enroll.
        enrolledOn is the pupil's entry day (YYYY-MM-DD, the school's
        calendar); omitted means today. It must lie between the start of the
        group's cycle and today in the school's configured timezone (400
        otherwise). Billing starts in that month: no tuition is charged for the
        months before it. A day before today also requires finance:write,
        because it creates charges for months already past (403 otherwise).
      operationId: enrollStudentIntoGrade
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, gradeLevelId]
              properties:
                studentId: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000003" }
                gradeLevelId: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000006" }
                enrolledOn: { type: string, format: date, description: "Optional entry day; omitted means today.", example: "2026-08-24" }
      responses:
        '201':
          description: Where the pupil landed.
          content:
            application/json:
              schema:
                type: object
                required: [enrollment, groupName]
                properties:
                  enrollment: { $ref: '#/components/schemas/Enrollment' }
                  groupName: { type: string, example: "1° B" }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/PlainTextError' }
        '403': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/PlainTextError' }
        '409': { $ref: '#/components/responses/PlainTextError' }

  /api/v1/enrollments/withdraw:
    post:
      tags: [students]
      summary: Withdraw a pupil from a cycle
      description: >
        Withdraws the enrollment. withdrawnOn is the effective date in
        YYYY-MM-DD; when omitted, today is used. The optional reason is free
        text of at most 500 characters. Requires students:enroll. A date before
        today in the school's configured timezone also requires finance:write
        because overdue charges may be cancelled.
      operationId: withdrawEnrollment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId]
              properties:
                enrollmentId: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000001" }
                withdrawnOn: { type: string, format: date, description: "Optional effective date; omitted means today.", example: "2026-10-15" }
                reason: { type: string, maxLength: 500, description: Optional free-text reason., example: "La familia se muda de ciudad." }
      responses:
        '200':
          description: The withdrawn enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/PlainTextError' }
        '403': { $ref: '#/components/responses/PlainTextError' }
        '404': { $ref: '#/components/responses/PlainTextError' }
        '409': { $ref: '#/components/responses/PlainTextError' }

  /api/v1/enrollments/{id}/withdrawal-preview:
    get:
      tags: [students]
      summary: Preview the financial effect of a withdrawal
      description: Requires students:enroll and either finance:read or collections:read because the preview exposes per-pupil charge amounts and remaining debt. Unknown enrollments return 404.
      operationId: previewEnrollmentWithdrawal
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Enrollment id.
          schema: { type: string, format: uuid }
        - name: withdrawnOn
          in: query
          required: false
          description: Effective withdrawal date (YYYY-MM-DD); omitted defaults to today in the school's configured timezone.
          schema: { type: string, format: date, example: "2026-10-15" }
      responses:
        '200':
          description: Charges that would be cancelled and debt remaining.
          content:
            application/json:
              schema:
                type: object
                required: [toCancel, toCancelCents, remainingDebtCents]
                properties:
                  toCancel:
                    type: array
                    items:
                      type: object
                      required: [id, description, dueDate, amountCents]
                      properties:
                        id: { type: string, format: uuid, example: "e3b0c442-98fc-1c14-9afb-000000000002" }
                        description: { type: string, example: "Colegiatura noviembre" }
                        dueDate: { type: string, format: date, example: "2026-11-01" }
                        amountCents: { type: integer, format: int64, example: 450000 }
                  toCancelCents: { type: integer, format: int64, example: 450000 }
                  remainingDebtCents: { type: integer, format: int64, example: 450000 }
              example:
                toCancel:
                  - id: "e3b0c442-98fc-1c14-9afb-000000000002"
                    description: "Colegiatura noviembre"
                    dueDate: "2026-11-01"
                    amountCents: 450000
                toCancelCents: 450000
                remainingDebtCents: 450000
        '400': { $ref: '#/components/responses/PlainTextError' }
        '401': { $ref: '#/components/responses/PlainTextError' }
        '403':
          description: Missing students:enroll, finance:read, or collections:read permission.
          content:
            text/plain:
              schema: { $ref: '#/components/schemas/PlainTextError' }
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/PlainTextError' }
        '409': { $ref: '#/components/responses/PlainTextError' }

  /api/v1/students/{id}:
    get:
      tags: [students]
      summary: A pupil's file
      description: >
        The pupil with the profile, and whether the pupil has a photo, so the
        file page asks GET /api/v1/students/{id}/photo only when there is one.
      operationId: getStudent
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/StudentIdPath' }]
      responses:
        '200':
          description: The pupil, profile included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentWithProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [students]
      summary: Correct a pupil's file
      description: >
        Names, CURP and the profile (birth date, sex, the pupil's own email and
        phones, address). Every profile field is optional, but what is sent must
        be well formed. Level and group are NOT editable here: a group changes by
        transfer. The response carries the profile; GET /api/v1/students (the
        list) never does.
      operationId: updateStudent
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, curp, profile]
              properties:
                firstName: { type: string, minLength: 1, example: "ADA" }
                lastName: { type: string, minLength: 1, example: "LOVELACE", description: "Paternal surname." }
                maternalLastName: { type: string, example: "BYRON", description: "Maternal surname; optional (empty = not captured)." }
                curp: { type: string, minLength: 18, maxLength: 18, example: "LOAA190312MDFVDA01" }
                profile: { $ref: '#/components/schemas/StudentProfile' }
                bankReference: { type: string, pattern: '^[0-9]{0,20}$', example: "231076", description: "BBVA payment reference (ADR 0033), unique per school. Absent keeps the stored one; empty clears it." }
      responses:
        '200':
          description: The corrected pupil, profile included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentWithProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Another pupil already has that CURP (no code), or the pupil is
            withdrawn and the file no longer changes (`X-Error-Code:
            STUDENT_WITHDRAWN`, T14). Both are 409: the code tells them apart.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: "ese alumno está dado de baja: su ficha ya no se corrige"

  /api/v1/students/{id}/medical:
    get:
      tags: [students]
      summary: A pupil's medical record
      description: >
        Under its own permission (medical:read), which only the owner holds:
        reading the class list does not entitle anybody to its allergies. Served
        with Cache-Control no-store.
      operationId: getStudentMedical
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/StudentIdPath' }]
      responses:
        '200':
          description: The record; empty fields when nothing was captured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [students]
      summary: Write a pupil's medical record
      operationId: updateStudentMedical
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalRecord' }
      responses:
        '200':
          description: The stored record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StudentWithdrawn' }

  /api/v1/students/{id}/photo:
    get:
      tags: [students]
      summary: A pupil's photo
      description: >
        The image bytes, read from a private bucket and served only after the
        permission check. No public or signed URL exists. Cache-Control
        "private, no-store" and X-Content-Type-Options nosniff.
      operationId: getStudentPhoto
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/StudentIdPath' }]
      responses:
        '200':
          description: The photo.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The pupil has no photo, or photos are not enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [students]
      summary: Upload or replace a pupil's photo
      description: >
        The raw image as the body. What it IS is decided from its bytes (JPEG or
        PNG magic numbers), never from the Content-Type or a file name. At most
        2 MB; the web shrinks it to 800 px before sending.
      operationId: uploadStudentPhoto
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [contentType, sizeBytes]
                properties:
                  contentType: { type: string, enum: [image/jpeg, image/png] }
                  sizeBytes: { type: integer, example: 48213 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StudentWithdrawn' }
        '413':
          description: Larger than 2 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [students]
      summary: Remove a pupil's photo
      operationId: deleteStudentPhoto
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StudentWithdrawn' }

  /api/v1/students/{studentId}/contacts/{contactId}:
    put:
      tags: [students]
      summary: Edit a contact
      description: >
        Relationship, name, phone (ten digits), email and the emergency mark.
        The account column is never written here. A contact of another pupil is
        404, which never confirms it exists. A contact with an account may go
        without a name.
      operationId: updateContact
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relationship, fullName]
              properties:
                relationship: { type: string, enum: [mother, father, guardian, other] }
                fullName: { type: string, example: "ROSA MÉNDEZ" }
                phone: { type: string, pattern: '^$|^[0-9]{10}$', example: "5512345678" }
                email: { type: string, example: "rosa@correo.mx" }
                isEmergency: { type: boolean, example: true }
      responses:
        '200':
          description: The stored contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [students]
      summary: Remove a contact
      description: >
        Refused (409) while the contact can open the family app: its access is
        revoked first, rather than disappearing with a phone number. The check
        rides in the DELETE itself, so access granted a moment earlier is not
        removed by a stale page.
      operationId: removeContact
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The contact can open the family app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/students/{id}/notes:
    get:
      tags: [students]
      summary: A pupil's notes, newest first
      description: >
        Reading them is reading the pupil (students:read). Voided notes are
        listed, marked `voided`, only for a caller holding students:notes_void
        (the owner); everyone else sees the ordinary history. Sent no-store.
      operationId: listStudentNotes
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/StudentIdPath' }]
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/StudentNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [students]
      summary: Write a note about a pupil
      description: >
        Needs students:notes_write. The author is the signed-in caller (named
        from iam, or by email when the account has no name); any author field
        in the body is ignored. A note can be edited later (PATCH); every edit
        keeps the text it replaced.
      operationId: addStudentNote
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000, example: "Llegó con fiebre; se avisó a la mamá." }
      responses:
        '201':
          description: The stored note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/students/{id}/notes/{noteId}:
    patch:
      tags: [students]
      summary: Edit a note
      description: >
        Replaces the note's text. The text it replaced is kept as a revision
        (who replaced it, and when), so the history is never lost. Its author
        may edit it at any time (students:notes_write); anyone else's note only
        a holder of students:notes_void (the owner). A voided note is not
        edited (404 to whoever cannot see voided notes, 409 to the owner). The editor is the signed-in caller; any editor field in the
        body is ignored.
      operationId: editStudentNote
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000, example: "Llegó con fiebre; se avisó a la mamá a las 9:10." }
                previousBody:
                  type: string
                  maxLength: 2000
                  example: "Llegó con fiebre; se avisó a la mamá."
                  description: >
                    The text the editor started from. When given, a note that no
                    longer says it (edited by someone else meanwhile) is refused
                    with 409 instead of being overwritten.
      responses:
        '200':
          description: The edited note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not the author, and no students:notes_void.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The note changed since it was read (previousBody no longer matches).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/students/{id}/notes/{noteId}/void:
    post:
      tags: [students]
      summary: Void a note
      description: >
        A voided note is kept and marked, never deleted. Its author may void it
        within 15 minutes of writing it (students:notes_write); after that, or
        for anyone else's note, only a holder of students:notes_void.
      operationId: voidStudentNote
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StudentIdPath'
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The voided note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not the author within 15 minutes, and no students:notes_void.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The note was already voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/comms/announcements:
    post:
      tags: [comms]
      summary: Tell a group, a level, or the whole school
      description: >
        One message, one audience: every ACTIVE pupil of a group, of every group
        under a level, or of the cycle. A pupil who left mid-year is not in the
        group any more — sending them the junta is how a school looks like it
        does not know who its pupils are.


        The audience is resolved here at the edge, because config and students
        already answer "who is in 1° A". Comms receives a list of pupils and does
        not know what a group is.


        Send an idempotencyKey. One announcement can reach four hundred families,
        and a phone buzzing twice for the same junta is what makes a school turn
        notifications off for good.
      operationId: announce
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, cycleId, title, body, idempotencyKey]
              properties:
                scope: { type: string, enum: [student, group, level, cycle] }
                targetId:
                  type: string
                  format: uuid
                  description: >
                    The pupil, group or level. Unused for a whole-cycle
                    announcement, and ignored when targetIds carries a list.
                targetIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: >
                    Several groups (or levels) at once — "1° A y 1° B" is one
                    message the school writes once, not two it writes twice and
                    sends at different times. A pupil in two of them hears it
                    once.
                cycleId: { type: string, format: uuid }
                title: { type: string, minLength: 1 }
                body: { type: string, minLength: 1 }
                idempotencyKey: { type: string, minLength: 1 }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [created, audience]
                properties:
                  created:
                    type: integer
                    description: >
                      How many families it actually reached. A retry reports
                      zero: it delivered nothing new.
                  audience:
                    type: integer
                    description: How many pupils the scope named.
        '400':
          description: >
            A malformed body, an unknown scope, or an audience of nobody. An
            empty audience is refused rather than reported as sent — otherwise
            the office believes a message went out that never did.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/comms/birthday-template:
    get:
      tags: [comms]
      summary: The school's birthday greeting
      description: >
        The text comms sends every morning (07:00 America/Mexico_City) to the
        families of the pupils whose birthday it is (T11). `{nombre}` is
        replaced by the pupil's first name. While the school has not written
        its own, the default text comes back with isDefault=true. Needs
        comms:write — the same permission that sends announcements.
      operationId: getBirthdayTemplate
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The greeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    put:
      tags: [comms]
      summary: Change the school's birthday greeting
      description: >
        Replaces the greeting. Title up to 80 characters, message up to 500;
        both required. `{nombre}` is optional and may appear several times.
        Applies from the next run; greetings already sent are not rewritten.
      operationId: updateBirthdayTemplate
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 80, example: "¡Feliz cumpleaños, {nombre}!" }
                body: { type: string, minLength: 1, maxLength: 500, example: "Toda la comunidad le desea a {nombre} un feliz día." }
      responses:
        '200':
          description: The saved greeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/config/events:
    get:
      tags: [config]
      summary: The school's agenda
      description: >
        What the school DOES: festivals, parents' meetings, exam weeks. A
        different list from the closed days, and deliberately so — finance reads
        the closed days to move a due date and stop a surcharge, and an activity
        must never do either. A festival on the 10th does not mean nobody could
        pay on the 10th.
      operationId: listSchoolEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cycleId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The cycle's agenda, earliest first.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/SchoolEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [config]
      summary: Put something on the agenda
      description: >
        A one-day event needs only startsOn. The audience is one level, one
        group, or — with neither — the whole school.
      operationId: createSchoolEvent
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, title, startsOn]
              properties:
                cycleId: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
                levelId: { type: string, format: uuid }
                groupId: { type: string, format: uuid }
      responses:
        '201':
          description: The stored event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/config/events/{id}:
    delete:
      tags: [config]
      summary: Take something off the agenda
      operationId: deleteSchoolEvent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/config/calendar:
    get:
      tags: [config]
      summary: The days the school is closed
      description: >
        Holidays, vacations and suspensions for one cycle. Not decoration: the
        early-payment window is counted in WORKING days, so a holiday nobody
        entered moves a family's deadline — quietly, and in the school's favour.
      operationId: listNonWorkingPeriods
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cycleId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The cycle's closed days, earliest first.
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/NonWorkingPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [config]
      summary: Close a day, or a run of days
      description: >
        A single holiday needs only startsOn — the edge fills in the end. Asking
        for the same date twice is how a calendar stops being maintained.
      operationId: createNonWorkingPeriod
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, label, kind, startsOn]
              properties:
                cycleId: { type: string, format: uuid }
                label:
                  type: string
                  minLength: 1
                  description: What a person reads on the calendar, and in the explanation of a moved deadline.
                kind: { type: string, enum: [holiday, vacation] }
                startsOn: { type: string, format: date }
                endsOn:
                  type: string
                  format: date
                  description: Inclusive. Omitted for a single day.
      responses:
        '201':
          description: The stored period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NonWorkingPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: This cycle already has a closure with that name.

  /api/v1/config/calendar/{id}:
    delete:
      tags: [config]
      summary: Remove a day entered by mistake
      description: >
        A calendar that cannot be corrected stops being trusted, and the school
        goes back to a sheet on the wall.
      operationId: deleteNonWorkingPeriod
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [iam-users]
      summary: Delete a login account (soft delete)
      description: >
        The account can no longer sign in by any road (password, identity
        provider, refresh) and leaves `GET /api/v1/users`; its row stays,
        because payments, grades and the audit trail reference it by id and a
        name snapshot. Every session it held is revoked (its refresh tokens die
        at once; an access token already issued lives out its short life), its
        pending invitation and reset links are revoked, and it is disabled at
        the identity provider. Refused: deleting your own account (403) and the
        last active account holding the owner role (409). An id that is not a
        uuid or names no account is 404. Deleting an account that is already
        deleted repeats only the link-revocation and identity-provider steps
        (204) — that is the retry after a `DELETION_PENDING`. Inviting the same address
        again (`POST /api/v1/users/invite`) restores THIS account as `invited`,
        history attached, with only the roles of the new invitation and a
        fresh credential at the identity provider — the old password does not
        work again; the account opens from the new link. Requires `users:delete` (owner only), checked by the gateway
        and again by iam against the caller as they are now; `module_iam`.
      operationId: deleteUser
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204':
          description: Deleted. Nothing to return.
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403':
          description: >
            The caller lacks `users:delete`, is not active, or is deleting their
            own account.
          content:
            text/plain:
              schema: { type: string }
              example: no puedes eliminar tu propia cuenta
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The account is the last active one holding the owner role.
          content:
            text/plain:
              schema: { type: string }
              example: no se puede eliminar al último director activo
        '500':
          description: >
            With `DELETION_PENDING`: the account is deleted and can no longer
            sign in here, but its pending links could not be revoked or the
            identity provider could not be reached to disable it. Repeat the
            request to finish. Without a code the deletion may or may not have
            happened (e.g. a connection cut after the row was written):
            repeating the request is always safe.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: internal error

  /api/v1/teachers/{id}/access:
    post:
      tags: [teachers]
      summary: Give a teacher access to the system (Maestro role)
      description: >
        "Dar acceso al sistema". One action for the school, two services
        underneath: iam invites the teacher's email into the `maestro` role
        (exactly `teaching:read`, `teaching:write`, `attendance_own:read`,
        `attendance_own:write` — Calificaciones and Asistencias, and only for
        the teacher's own assignments of the active cycle), and config links
        the account to the teacher. The body is optional: send none, or
        `{"confirmReuse": true}` after the user confirmed a reuse (see 409).


        IDEMPOTENT. A teacher already linked keeps its account (a link to an
        account iam no longer has counts as no link and is rewritten); an
        account still `invited` gets a fresh link. Pressing it again after a
        failed link heals the orphaned account by matching its address.


        REUSING AN EXISTING ACCOUNT. When the teacher's address already has an
        account that is not exactly a maestro-only one (it signs somebody in as
        something else, or holds no role), it is never reused silently: the
        answer is 409 with `X-Confirm-Required: reuse-account` and a Spanish
        question naming the account's roles. Resending with
        `{"confirmReuse": true}` links it and adds the maestro role (its other
        roles stay). The caller-subset guard still applies: the caller must hold
        every permission of the account's CURRENT roles, otherwise 403 — decided
        before the confirmation is asked for.


        AUTHORIZATION. `module_teachers` AND `module_iam` (either off ⇒ 404), a
        session with a rotated password, `teachers:write` AND `users:write`. On top of that the caller-subset
        guard: the caller must itself hold every permission of the maestro role,
        and may only resend the link of an existing account whose roles it could
        have assigned (a resent link hands the account over). Every refusal
        happens before the first write.
      operationId: grantTeacherAccess
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: id
          in: path
          required: true
          description: The teacher.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirmReuse:
                  type: boolean
                  description: >
                    True once the user agreed to link the account that already
                    exists under the teacher's address (answer to the 409 with
                    `X-Confirm-Required: reuse-account`).
            example:
              confirmReuse: true
      responses:
        '200':
          description: >
            The teacher, now linked, and the account it signs in with.
            `invitation` is present when a link was minted (a new account, or an
            existing one still `invited`); read `invitation.sent` before telling
            anybody the mail went out — when it is false (every time in local,
            with no mail relay), `invitation.url` is the link to hand over.
            `invitation` is NULL when the account is `active` (nothing to send)
            or `suspended` (lifted in Usuarios, not here).
          content:
            application/json:
              schema:
                type: object
                required: [teacher, userId, email, status, invitation]
                properties:
                  teacher: { $ref: '#/components/schemas/Teacher' }
                  userId: { type: string, format: uuid }
                  email: { type: string, format: email }
                  status:
                    type: string
                    enum: [invited, active, suspended]
                  invitation:
                    description: Null when nothing was sent.
                    oneOf:
                      - $ref: '#/components/schemas/Invitation'
                      - type: 'null'
              example:
                teacher:
                  id: 3f1c1a52-8d1e-4c1b-9a47-0d6f3b8f2a10
                  firstName: Gabriela
                  lastName: Rojas
                  email: gabriela.rojas@garcialorca.edu.mx
                  userId: 7d0b2c3e-1f4a-4b5c-8d6e-9f0a1b2c3d4e
                userId: 7d0b2c3e-1f4a-4b5c-8d6e-9f0a1b2c3d4e
                email: gabriela.rojas@garcialorca.edu.mx
                status: invited
                invitation:
                  url: http://localhost:3002/invitacion/abc123
                  expiresAt: '2026-10-02T18:00:00Z'
                  sent: false
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403':
          description: >
            Missing `teachers:write` or `users:write`, or the caller-subset guard
            refused (the caller does not hold a maestro permission, or the
            existing account holds a permission the caller does not).
          content:
            text/plain:
              schema: { type: string }
              example: "forbidden: cannot assign a role granting a permission you do not hold: attendance_own:write"
        '404':
          description: >
            No such teacher (a teacher of another school is invisible, so it
            answers the same), or `module_teachers` or `module_iam` is off.
          content:
            text/plain:
              schema: { type: string }
              example: teacher not found
        '400':
          description: >
            The teacher has no email to send the invitation to, or the body is
            not valid JSON of the declared shape.
          content:
            text/plain:
              schema: { type: string }
              example: El docente no tiene correo
        '409':
          description: >
            Nothing was written. Either the account under that address is
            already linked to ANOTHER teacher (final; no header), or it exists
            and is not a maestro-only account: then `X-Confirm-Required:
            reuse-account` is set and the body is the question to show — resend
            with `{"confirmReuse": true}` to proceed.
          headers:
            X-Confirm-Required:
              description: Present (value `reuse-account`) only when the conflict is resolved by confirming.
              schema: { type: string, enum: [reuse-account] }
          content:
            text/plain:
              schema: { type: string }
              example: "Ya existe una cuenta con ese correo (owner). ¿Vincularla y darle acceso de maestro?"
        '500':
          description: The maestro role is missing from this deployment (migrations/iam/0022 not applied).
          content:
            text/plain:
              schema: { type: string }

  /api/v1/teaching-assignments/bulk:
    post:
      tags: [teachers]
      summary: Give one teacher a whole teaching load at once
      description: >
        Assigns every (group, subject) item to the teacher in ONE transaction.
        One bad item (malformed id, unknown group/subject/teacher, a subject of
        another grade level, the same slot twice) rejects the whole request and
        the message names it as items[i]. Otherwise the answer is always 200 and
        says, per item, what happened: created (the slot was free), skipped (it
        was already this teacher's), conflicts (another teacher holds it and it
        was left untouched) or — with replaceConflicts — reassigned (handed to
        this teacher, keeping its id). A slot still has exactly one teacher per
        cycle: replacing is explicit, never co-teaching. Ids are
        case-insensitive (answered in lower case). At most 500 items per
        request, a technical bound on one transaction enforced by the config
        service — not a limit on how many classes a teacher may hold. Requires
        `teachers:write`.
      operationId: assignTeachingLoad
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherId, items]
              properties:
                teacherId: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TeachingLoadItem' }
                replaceConflicts: { type: boolean, default: false }
            example:
              teacherId: 3f1c1a52-8d1e-4c1b-9a47-0d6f3b8f2a10
              items:
                - groupId: 8a2b6c1e-4f5d-4e3a-9b1c-2d3e4f5a6b7c
                  subjectId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
              replaceConflicts: false
      responses:
        '200':
          description: What happened to each item, in request order within each list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeachingLoadResult' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            A free slot was taken by someone else between reading and writing;
            nothing was written. Retrying answers against the new state.
          content:
            text/plain:
              schema: { type: string }
              example: a teacher is already assigned to this group and subject in the cycle

  /api/v1/teaching-assignments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teachers]
      summary: Free a slot
      description: Removes the assignment; the (group, subject) slot can then be given to anyone. Requires `teachers:write`.
      operationId: deleteTeachingAssignment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    patch:
      tags: [teachers]
      summary: Hand a slot to another teacher
      description: >
        Same assignment id, same group and subject, a different teacher.
        An unknown teacher is 400; an unknown assignment is 404. Requires
        `teachers:write`.
      operationId: reassignTeachingAssignment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherId]
              properties:
                teacherId: { type: string, format: uuid }
            example:
              teacherId: 3f1c1a52-8d1e-4c1b-9a47-0d6f3b8f2a10
      responses:
        '200':
          description: The assignment, now held by teacherId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeachingAssignment' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/levels:
    get:
      tags: [config-levels]
      summary: List the school's levels
      operationId: listLevels
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Every level, with how it takes attendance.
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/levels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [config-levels]
      summary: Change a level's attendance mode and/or grading scale
      description: >
        `attendanceMode`: `daily` — one pass list per group per day, taken by
        any teacher of the group; `per_class` — one per group, subject and day,
        taken only by that subject's teacher. `grading` (T6): the WHOLE scale
        (every field required), marks in the units a person types with at most
        two decimals; config enforces 0 <= min < passing <= max <= 100 and
        decimals 0..2 and answers its own sentence otherwise. Send either field
        or both: they are applied in ONE config transaction, validated whole
        before anything changes (a half-valid body changes nothing). A scale
        may be LOOSENED freely (lower min, higher max, more decimals, another
        passing mark); TIGHTENING it (higher min, lower max, fewer decimals) or
        disabling grading is 409 `X-Error-Code: SCALE_TIGHTENING` when grades
        already captured in the level's active cycle would not fit. An unknown
        level is 404. Requires `config:write`.
      operationId: patchLevel
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                attendanceMode: { $ref: '#/components/schemas/AttendanceMode' }
                grading: { $ref: '#/components/schemas/LevelGrading' }
            examples:
              attendance: { value: { attendanceMode: per_class } }
              grading: { value: { grading: { enabled: true, min: 5, max: 10, decimals: 1, passing: 6 } } }
      responses:
        '200':
          description: The level, updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            Grades already captured in the level's active cycle would not fit
            the tightened (or disabled) scale.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Ya hay calificaciones capturadas en este ciclo que no cumplirían la nueva escala

  /api/v1/config/levels/order:
    put:
      tags: [config-levels]
      summary: Put the levels in school order
      description: >
        The WHOLE order, first level first: `levelIds` must be exactly the
        school's levels, each once. A list with one missing, one extra or one
        repeated is 400 `X-Error-Code: LEVEL_ORDER_MISMATCH` and changes
        nothing; otherwise every level's `sortOrder` is rewritten in ONE
        transaction (first = 1) and `GET /config/levels` answers in that
        order. Requires `config:write`.
      operationId: reorderLevels
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [levelIds]
              properties:
                levelIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, format: uuid }
            example:
              levelIds:
                - 2c8e4f10-0000-4000-8000-000000000001
                - 2c8e4f10-0000-4000-8000-000000000002
      responses:
        '200':
          description: Every level, in its new order.
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '400':
          description: The list is not exactly the school's levels; nothing changed.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: La lista de niveles no coincide con los niveles del colegio. Recarga la página e inténtalo de nuevo.
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/levels/{id}/deletion-preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [config-levels]
      summary: What deleting a level would reach (step 1 of 3)
      description: >
        Resolves the level across EVERY cycle and every service (ADR 0021):
        its structure (grade levels, groups, subjects, terms, teaching
        assignments, school events aimed at it or its groups), its pupils (kept,
        their level cleared), their enrollments in its groups, attendance,
        monthly grades and report cards, the level's tuition plans and the
        garments scoped to it (kept, left unresolved). `keeps` is the money that
        STAYS untouched: charges and payments of those pupils. `empty` is true
        when nothing academic hangs off the level (no grade levels, no pupils,
        no enrollments). `confirmToken` signs exactly these counts for this
        school and level for ten minutes; the delete refuses it once anything
        changed. Changes nothing. Requires `levels:delete` (owner only);
        `module_config`.
      operationId: previewLevelDeletion
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The counts and the token to confirm them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LevelDeletionPreview' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: '`DELETION_IN_PROGRESS`: this level is already being deleted, or its deletion failed half-way and waits in the trash.'
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Ya se está eliminando este nivel; espera un momento y revisa la Papelera.

  /api/v1/config/levels/{id}/delete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [config-levels]
      summary: Delete a level into the 7-day trash (steps 2 and 3 of 3)
      description: >
        Checks on the server, in this order: the preview token is well-formed
        and unexpired (409 `PREVIEW_STALE`), `confirmName` is the level's name,
        trimmed and case-insensitive (400 `NAME_MISMATCH`), and `password` is
        the caller's, verified by iam exactly as sign-in verifies it in the
        active mode — the local hash, or Identity Platform when it owns
        credentials (401 `REAUTH_FAILED`). Throttled like a login (429). Then
        the level is locked FIRST and, under the lock, the token must still
        sign what would be deleted now; if anything changed the lock is
        released and the answer is 409 `PREVIEW_STALE` (the token is spent).
        Then a saga moves every service's rows into its own archive —
        grades, attendance, finance (tuition plans only), uniforms, students
        (enrollments; pupils kept with no level), config (structure, level last)
        — and records the batch. The saga's first step locks the level in
        config: while it runs, every write that resolves the level answers 409
        `LEVEL_BEING_DELETED`, a second deletion answers 409
        `DELETION_IN_PROGRESS`, and the confirm token cannot open another saga
        (single use). If any step fails, the steps already done are restored on
        a fresh context; when that fully succeeds the answer is 500 with nothing
        deleted, otherwise 500 `DELETION_INCOMPLETE` naming the batch (folio),
        which then shows in the trash as `failed_partial`. Charges, payments,
        deposits, receipts and concepts are never touched. Requires
        `levels:delete` (owner only); `module_config`.
      operationId: deleteLevel
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteLevelRequest' }
            example: { confirmName: Maternal, confirmToken: '<token-del-resumen>', password: '••••••••' }
      responses:
        '200':
          description: Deleted into the trash; restorable until `restorableUntil`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LevelDeletionResult' }
        '400':
          description: >
            `NAME_MISMATCH` when the typed name is not the level's; a malformed
            body or id otherwise.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: El nombre no coincide con el del nivel
        '401':
          description: >
            `REAUTH_FAILED`: the password is not the caller's. Without the
            header, the session itself is missing or expired.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: La contraseña no es correcta
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            `PREVIEW_STALE`: the data changed since the preview, the preview
            expired (10 minutes), or its token already opened a deletion.
            Preview again. `DELETION_IN_PROGRESS`: this level is already being
            deleted (a double click), or its deletion failed half-way and waits
            in the trash.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Los datos cambiaron; revisa el resumen de nuevo
        '429':
          description: Too many attempts; wait before trying again.
          content:
            text/plain:
              schema: { type: string }
              example: too many requests
        '500':
          description: >
            A service failed mid-way. Without a code: everything already
            archived was restored and nothing is deleted. `DELETION_INCOMPLETE`:
            the undo did not fully succeed; the sentence names the folio and the
            batch is in the trash as `failed_partial` — restoring it recovers
            what was deleted.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: No se pudo eliminar el nivel; no se borró nada. Intenta de nuevo

  /api/v1/config/level-trash:
    get:
      tags: [config-levels]
      summary: The deleted levels still in the trash
      description: >
        Batches in the trash, newest first: `deleted`, `failed_partial` (a
        deletion that failed and could not be fully undone — restoring it
        recovers what was deleted), `restored_partial` (restored, but some
        rows did not fit; they stay here and a retry tries them again) and
        `restoring` (a restore is running; it is never swept meanwhile). The
        gateway sweeps the trash hourly and before this listing, on config's
        `restorableUntil` (the database's clock). Requires `levels:delete` (owner only);
        `module_config`.
      operationId: listLevelTrash
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The trash.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LevelTrashItem' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/level-trash/{batchId}/restore:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [config-levels]
      summary: Bring a deleted level back
      description: >
        Restores config first (the structure must exist before anything that
        points at it), then students, uniforms, finance, attendance and grades,
        each in one transaction. Rows that now conflict are skipped and reported
        in `skipped`, never forced: a pupil re-enrolled elsewhere in that cycle
        keeps the new enrollment, a pupil given another level keeps it, a
        garment re-scoped keeps its new level. Skipped rows stay in the trash
        (`restored_partial`) until the window closes, so a retry after fixing
        the clash brings them back; grades and attendance of enrollments that
        could not come back stay archived too. Idempotent: a retry after a
        partial failure (500) restores only what is missing. A
        `failed_partial` batch restores only the services its deletion
        reached. The batch is marked `restoring` before the first step, so the
        retention sweep never purges it mid-way; a restore that fails puts it
        back where it was. Requires
        `levels:delete` (owner only); `module_config`.
      operationId: restoreLevel
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: What came back and what was skipped, with why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LevelRestoreResult' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            `LEVEL_NAME_TAKEN`: another level now has this name. Nothing was
            restored. `RESTORE_IN_PROGRESS`: another restore of this batch is
            running.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Ya existe un nivel con ese nombre; renómbralo antes de restaurar
        '410':
          description: >
            `TRASH_EXPIRED`: more than 7 days passed, or the batch was purged
            (no service holds it any more).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Pasaron más de 7 días; este nivel ya no se puede restaurar
        '500':
          description: >
            A service failed mid-way; the batch stays in the trash and a retry
            finishes it without duplicating what already came back.
            `RESTORE_INCOMPLETE`: a service no longer holds its part of the
            batch — never a silent success; the sentence names it and what did
            come back stays restored.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: 'La restauración quedó a medias; vuelve a intentarlo: lo ya restaurado no se duplica'

  /api/v1/config/subjects:
    get:
      tags: [config]
      summary: The subjects of a grade
      description: >
        Subjects are per grade (T13): "Matemáticas" of 1° and of 2° are two
        rows. Without gradeLevelId the whole school's subjects come back.
        Requires `config:read`.
      operationId: listSubjects
      security: [{ sessionCookie: [] }]
      parameters:
        - name: gradeLevelId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The grade's subjects, by name.
          content:
            application/json:
              schema:
                type: object
                required: [subjects]
                properties:
                  subjects:
                    type: array
                    items: { $ref: '#/components/schemas/Subject' }
              example:
                subjects:
                  - id: 5b7a1c2e-0000-4000-8000-00000000000a
                    gradeLevelId: 2c8e4f10-0000-4000-8000-000000000001
                    name: Matemáticas
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [config]
      summary: Add a subject to a grade
      description: >
        One row per grade; the name is trimmed and unique within the grade
        whatever its case. The web's "several grades at once" sends one request
        per grade, so a grade that already has the name answers 409 alone and
        the others are created. Requires `config:write`.
      operationId: createSubject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradeLevelId, name]
              properties:
                gradeLevelId: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
            example:
              gradeLevelId: 2c8e4f10-0000-4000-8000-000000000001
              name: Matemáticas
      responses:
        '201':
          description: The stored subject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The grade already has a subject with this name.
          content:
            text/plain:
              schema: { type: string }
              example: a subject with this name already exists in the grade level

  /api/v1/config/subjects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [config]
      summary: Rename a subject
      description: >
        Same id, same grade: grades, attendance and teaching assignments point
        at the id, so they follow the new name. Requires `config:write`.
      operationId: renameSubject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
            example:
              name: Matemáticas I
      responses:
        '200':
          description: The subject under its new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The grade already has a subject with this name.
          content:
            text/plain:
              schema: { type: string }
              example: a subject with this name already exists in the grade level
    delete:
      tags: [config]
      summary: Delete a subject that was never taught
      description: >
        A subject that is, or ever was, in a teacher's load (any cycle) is
        refused with 409 — grades and attendance keep its id — and can only be
        renamed. Requires `config:write`.
      operationId: deleteSubject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The subject has been in a teaching load; nothing was deleted.
          content:
            text/plain:
              schema: { type: string }
              example: the subject has been in a teaching load; it can be renamed but not deleted

  /api/v1/config/grade-levels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [config]
      summary: Rename a grade
      description: >
        Same id, level and ordinal: groups, subjects and periods follow it.
        The name is trimmed and unique within the level whatever its case
        (409 `X-Error-Code: GRADE_NAME_TAKEN`). Requires `config:write`.
      operationId: renameGradeLevel
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
            example:
              name: 3°
      responses:
        '200':
          description: The grade under its new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeLevel' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The level already has a grade with this name.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Ya existe un grado con ese nombre en este nivel.
    delete:
      tags: [config]
      summary: Delete a grade that holds nothing
      description: >
        Config-only: nothing outside config keeps a grade id. A grade with
        groups (any cycle), subjects or evaluation periods is refused with 409
        `X-Error-Code: GRADE_LEVEL_IN_USE`, and the sentence says what blocks
        it and how many. The level and its other grades are untouched.
        Requires `config:write`.
      operationId: deleteGradeLevel
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The grade still holds groups, subjects or evaluation periods; nothing was deleted.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: 'No se puede borrar el grado 3°: tiene 2 grupos y 8 materias. Bórralos primero; si alguna materia ya tiene calificaciones, puedes cambiarle el nombre al grado.'

  /api/v1/config/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [config]
      summary: Rename a group
      description: >
        Same id, cycle and grade, so it is allowed with pupils in it:
        enrollments, attendance and report cards key on the id. The name is
        trimmed and unique within its grade and cycle (409
        `X-Error-Code: GROUP_NAME_TAKEN`). The pupils actively enrolled in it
        get the new name on their file (receipts, card, family app) in the
        same request. Requires `config:write`.
      operationId: renameGroup
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
            example:
              name: B
      responses:
        '200':
          description: The group under its new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The grade already has a group with this name in the cycle.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Ya existe un grupo con ese nombre en este grado y ciclo.
        '503':
          description: >
            Renamed in config, but the pupils' files could not be relabelled
            (`X-Error-Code: GROUP_RELABEL_PENDING`). Sending the same request
            again finishes it: both steps are idempotent.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: El grupo ya se llama B, pero no se pudo actualizar en la ficha de sus alumnos. Guarda otra vez para terminar.
    delete:
      tags: [config]
      summary: Delete a group that was never used
      description: >
        Refused with 409 `X-Error-Code: GROUP_IN_USE` while anything keeps the
        group: teaching assignments or timetable blocks (config), any
        enrollment ever placed in it or any transfer from or to it (students),
        pass lists or marks (attendance), or report cards (grades) — whatever
        those modules' flags. The sentence names each blocker with its count.
        Every service is asked before config deletes (ADR 0036). Requires
        `config:write`.
      operationId: deleteGroup
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: Something still keeps the group; nothing was deleted.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: 'No se puede borrar el grupo A: tiene 25 inscripciones y 40 listas de asistencia. Ese historial se conserva; puedes cambiarle el nombre.'

  /api/v1/config/terms:
    get:
      tags: [config-terms]
      summary: The terms of a cycle, optionally of one level
      description: >
        Ordered by ordinal. Every term carries `months` — the calendar months
        it covers ("YYYY-MM", ascending; `[]` when none are set). Requires
        `config:read`.
      operationId: listConfigTerms
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: levelId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The terms.
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigTerm' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/terms/{id}/months:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [config-terms]
      summary: Set the calendar months a term covers (T7)
      description: >
        Replaces the term's month set (`{"months": []}` clears it); duplicates
        are folded and the answer is sorted. Every month must touch the term's
        cycle — else 400 `X-Error-Code: MONTH_OUTSIDE_CYCLE` ("El mes está
        fuera del ciclo: 2027-09"). A month belongs to at most one term of the
        same cycle and level — else 409 `X-Error-Code: MONTH_IN_OTHER_TERM`
        ("Ese mes ya pertenece a otro periodo del nivel: 2026-12", naming the
        earliest clashing month). A term covers at most six months — else 400
        `X-Error-Code: TERM_TOO_LONG` ("Un periodo puede tener hasta 6
        meses"). A month not shaped YYYY-MM is 400 `X-Error-Code:
        MONTH_INVALID` at the edge. A CLOSED period's months are frozen: the
        gateway asks grades first and answers 409 `X-Error-Code: TERM_CLOSED`
        ("El periodo está cerrado; reábrelo para cambiar sus meses") without
        touching config. Nothing is written on any refusal. An unknown term is
        404. Requires `config:write`.
      operationId: setTermMonths
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [months]
              properties:
                months:
                  type: array
                  items: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-09' }
            example: { months: ['2026-09', '2026-10', '2026-11'] }
      responses:
        '200':
          description: The term with its new months.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTerm' }
        '400':
          description: >
            A malformed body; a month not shaped YYYY-MM (`MONTH_INVALID`); a
            month outside the cycle (`MONTH_OUTSIDE_CYCLE`); more than six
            months (`TERM_TOO_LONG`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                outsideCycle: { value: 'El mes está fuera del ciclo: 2027-09' }
                tooLong: { value: Un periodo puede tener hasta 6 meses }
                invalid: { value: Mes inválido (usa AAAA-MM) }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            A month another term of the same cycle and level already covers
            (`MONTH_IN_OTHER_TERM`), or the term is a closed period
            (`TERM_CLOSED`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                otherTerm: { value: 'Ese mes ya pertenece a otro periodo del nivel: 2026-12' }
                closed: { value: El periodo está cerrado; reábrelo para cambiar sus meses }

  /api/v1/config/terms/copy-months:
    post:
      tags: [config-terms]
      summary: Copy one level's trimester months onto other levels (T7)
      description: >
        For each target level of the cycle, in ONE transaction: terms are
        matched by `ordinal`; a matched term keeps its own name and dates and
        takes the source's months; a missing one is created from the source
        (name, ordinal, dates, months); a target term the source has no ordinal
        for is kept (it may carry grades) but its months are cleared. Targets
        are de-duplicated. 400 when `toLevelIds` is empty or contains the
        source, a level or the cycle does not exist, or the source level has no
        terms in the cycle; 400 `TERM_TOO_LONG` when a copied term would cover
        more than six months. When any term of a TARGET level is a closed
        period, the gateway answers 409 `TERM_CLOSED` ("El periodo está
        cerrado; reábrelo para cambiar sus meses") before config is asked.
        Returns the target levels' terms, level by level in request order, then
        by ordinal. Requires `config:write`.
      operationId: copyTermMonths
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, fromLevelId, toLevelIds]
              properties:
                cycleId: { type: string, format: uuid }
                fromLevelId: { type: string, format: uuid }
                toLevelIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The target levels' terms.
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigTerm' }
        '400':
          description: >
            A malformed body or scope (no sentence code), or a copied term
            longer than six months (`TERM_TOO_LONG`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Un periodo puede tener hasta 6 meses
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: >
            A target level's term is a closed period (`TERM_CLOSED`), or a
            concurrent change took one of the months first
            (`MONTH_IN_OTHER_TERM`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                closed: { value: El periodo está cerrado; reábrelo para cambiar sus meses }
                otherTerm: { value: Ese mes ya pertenece a otro periodo del nivel }

  /api/v1/imports/students/preview:
    post:
      tags: [student-import]
      summary: Preview a legacy student file (ADR 0033)
      description: >
        Reads the first sheet (columns by header; "Estado" twice = the pupil's
        status, then the address's state), decides every row, resolves each
        level of the file (an existing level of the same name ignoring case,
        accents and spacing; the office's choice in `levels`; otherwise
        `unresolved` — a level is never created unless `create` is chosen), and
        asks config (dry run) and students (validate only) what the commit would
        do. Writes nothing. Requires `students:import`.
      operationId: previewStudentImport
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentImportRequest' }
            example:
              fileName: Bachillerato.xlsx
              fileBase64: UEsDBBQABgAIAAAAIQA=
              levels: { Preparatoria: { levelId: 6f1c0e2a-0000-4000-8000-000000000001 } }
      responses:
        '200':
          description: What the commit would do, row by row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentImportResult' }
        '400': { $ref: '#/components/responses/StudentImportFileError' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: "`NO_ACTIVE_CYCLE`: create and activate a cycle first."
          content:
            text/plain:
              schema: { type: string }
              example: there is no active school cycle
        '413': { $ref: '#/components/responses/StudentImportTooLarge' }

  /api/v1/imports/students/commit:
    post:
      tags: [student-import]
      summary: Import the pupils of a previewed legacy file (ADR 0033)
      description: >
        Plans the file again and refuses when the result differs from the
        preview the office approved (409 `PREVIEW_STALE`) or a level is still
        unresolved (422 `LEVELS_UNRESOLVED`). Then creates the missing
        level/grade/group (one transaction in config) and each pupil in its own
        transaction in students: ENROLLED, enrolment origin `import`, no
        inscription charge, tuition and fees from the import month. A commit cut
        halfway is finished by sending the same file again: what went in reads
        `already`. Requires `students:import`.
      operationId: commitStudentImport
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentImportRequest' }
      responses:
        '200':
          description: What was written, row by row, under `batchId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentImportResult' }
        '400': { $ref: '#/components/responses/StudentImportFileError' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: "`NO_ACTIVE_CYCLE`, or `PREVIEW_STALE`: something changed since the preview."
          content:
            text/plain:
              schema: { type: string }
              example: the preview changed; review it again
        '413': { $ref: '#/components/responses/StudentImportTooLarge' }
        '422':
          description: "`LEVELS_UNRESOLVED`: names the levels still without a destination."
          content:
            text/plain:
              schema: { type: string }
              example: "choose where these levels go: Preparatoria"

  /api/v1/config/evaluation-periods:
    get:
      tags: [config-evaluation-periods]
      summary: The evaluation periods of a cycle, by grade (T14)
      description: >
        The periods of `cycleId`, narrowed to the grades of `levelId` and/or to
        `gradeLevelId` when given; ordered by grade ordinal, then period
        ordinal. A grade with no periods simply does not appear. Requires
        `config:read`.
      operationId: listEvaluationPeriods
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: levelId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: gradeLevelId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The periods.
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigEvaluationPeriod' }
        '400':
          description: A missing or malformed `cycleId`, `levelId` or `gradeLevelId`.
          content:
            text/plain:
              schema: { type: string }
              example: cycleId is required
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/config/grade-levels/{id}/evaluation-periods:
    parameters:
      - name: id
        in: path
        required: true
        description: The grade whose periods are replaced.
        schema: { type: string, format: uuid }
    put:
      tags: [config-evaluation-periods]
      summary: Replace one grade's evaluation periods in a cycle (T14)
      description: >
        `periods` becomes the grade's COMPLETE set in `cycleId`. A row carrying
        the `id` of one of the grade's periods keeps that id (and its term
        link); any other row is a new period; a period no row names is
        removed; `[]` clears the grade. A save that lost a race with another
        save of the same grade is 409 `PERIODS_CHANGED` (reload and retry). Every period needs a name (≤ 60
        characters), an ordinal 1–12 and dates `YYYY-MM-DD` with
        `startsOn ≤ endsOn` (400 `PERIOD_ENDS_BEFORE_START`), inside the cycle
        (400 `PERIOD_OUTSIDE_CYCLE`); at most 12 periods
        (`TOO_MANY_PERIODS`), each ordinal once (`PERIOD_ORDINAL_TAKEN`). Two
        periods sharing a day is 409 `PERIOD_OVERLAP` ("El periodo 1 (1.er
        trimestre) se encima con el periodo 2 (2.º trimestre)"), also when a
        concurrent change caused it. Nothing is written on any refusal. A
        grade of a level being deleted is 409 `LEVEL_BEING_DELETED`. Returns
        the grade's periods by ordinal. Requires `config:write`.
      operationId: putGradeEvaluationPeriods
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, periods]
              properties:
                cycleId: { type: string, format: uuid }
                periods:
                  type: array
                  maxItems: 12
                  items: { $ref: '#/components/schemas/ConfigEvaluationPeriodInput' }
            example:
              cycleId: 6f1c2b8e-0000-4000-8000-000000000001
              periods:
                - { ordinal: 1, name: 1.er trimestre, startsOn: '2026-08-24', endsOn: '2026-11-30' }
                - { ordinal: 2, name: 2.º trimestre, startsOn: '2026-12-01', endsOn: '2027-03-31' }
                - { ordinal: 3, name: 3.er trimestre, startsOn: '2027-04-01', endsOn: '2027-07-09' }
      responses:
        '200':
          description: The grade's periods, by ordinal.
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigEvaluationPeriod' }
        '400':
          description: >
            A malformed body or date; a period outside the cycle, ending before
            it starts, with no name, a repeated ordinal or more than 12 periods;
            an unknown cycle or grade.
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                outsideCycle: { value: '«3.er trimestre» queda fuera del ciclo (2026-08-24 a 2027-07-09)' }
                backwards: { value: «1.er trimestre» termina antes de empezar }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: Two periods of the grade share a day (`PERIOD_OVERLAP`), another save of the grade won a race (`PERIODS_CHANGED`), the save would remove a period that already holds grades (`PERIOD_HAS_GRADES` "«1.er trimestre» ya tiene calificaciones; no se puede quitar", T15), or the level is being deleted (`LEVEL_BEING_DELETED`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: El periodo 1 (1.er trimestre) se encima con el periodo 2 (2.º trimestre)

  /api/v1/config/evaluation-periods/copy:
    post:
      tags: [config-evaluation-periods]
      summary: Copy one grade's evaluation periods onto other grades (T14)
      description: >
        Each target grade takes the source grade's periods (names and dates)
        in ONE transaction, matched by `ordinal` like a replace: a target's
        existing ordinal keeps its id, a missing one is created, an extra one
        is removed. "Apply to the whole level" is this call with every other
        grade of the level. Targets are de-duplicated. 400 when
        `toGradeLevelIds` is empty or contains the source, a grade or the cycle
        does not exist, or the source has no periods in the cycle. Returns the
        targets' periods, grade by grade in request order, then by ordinal.
        Requires `config:write`.
      operationId: copyEvaluationPeriods
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, fromGradeLevelId, toGradeLevelIds]
              properties:
                cycleId: { type: string, format: uuid }
                fromGradeLevelId: { type: string, format: uuid }
                toGradeLevelIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The target grades' periods.
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigEvaluationPeriod' }
        '400':
          description: A malformed body or scope.
          content:
            text/plain:
              schema: { type: string }
              example: El grado de origen no tiene periodos en el ciclo
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: A concurrent change made two periods of a target overlap (`PERIOD_OVERLAP`), the copy would remove a target period that already holds grades (`PERIOD_HAS_GRADES`, T15), or a target's level is being deleted (`LEVEL_BEING_DELETED`).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: Los periodos de un grado no pueden encimarse

  /api/v1/attendance/roster:
    get:
      tags: [attendance]
      summary: A pass list (director)
      description: >
        One row per active enrollment of the group; a row with no stored mark
        reads `present`. The director has no date window, so `editable` is
        always true. The level's mode still applies: a `per_class` group needs
        `subjectId` (400 "Esta lista es por clase: elige la asignatura"), a
        `daily` group refuses one (400 "Esta lista es por día"), and the
        subject must be taught in the group (400 "La asignatura no se imparte
        en este grupo"). The mode governs NEW lists only: a list that already
        exists for the exact (group, date, subject-or-none) key — it has a
        session or a stored mark — stays readable and correctable after its
        level changes mode, and answers in its own shape. An unknown group is
        404. Requires `attendance:read`.
      operationId: getAttendanceRoster
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttendanceGroupId'
        - $ref: '#/components/parameters/AttendanceDate'
        - $ref: '#/components/parameters/AttendanceSubjectId'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceList' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/attendance:
    post:
      tags: [attendance]
      summary: Save a pass list (director)
      description: >
        Reconciles the whole list: `marks` is the COMPLETE set of exceptions,
        so every enrollment missing from it (or marked `present`) ends present.
        Stored rows are corrected in place and events go out only for what
        changed, so re-saving never re-notifies the family. The caller is
        stamped as the list's taker. Same mode rules as the roster; any date
        with classes: a weekend, a date outside the group's cycle or a day the
        school calendar closes is 400 `X-Error-Code: NO_CLASSES` ("Ese día no
        hay clases.", with the closed period's name in parentheses when there
        is one). Requires `attendance:write`.
      operationId: saveAttendance
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAttendanceRequest' }
            example:
              groupId: 7a1c2e3d-0000-4000-8000-000000000001
              date: "2026-09-15"
              subjectId: 5b7a1c2e-0000-4000-8000-00000000000a
              marks:
                - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, status: absent, note: "" }
      responses:
        '200': { $ref: '#/components/responses/AttendanceSaved' }
        '400': { $ref: '#/components/responses/AttendanceSaveRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    get:
      tags: [attendance]
      summary: One enrollment's stored exceptions
      description: >
        Only exceptions are stored, so present days never appear. A per-class
        school has one record per subject for the same day; `subjectId` tells
        them apart (empty for a daily mark). At most 500 rows, newest first.
        Requires `attendance:read`.
      operationId: listAttendance
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: enrollmentId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecord' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/attendance/reports:
    get:
      tags: [attendance]
      summary: Attendance report of a group over a date range
      description: >
        T12. For every pupil who was in the group during the range (one who
        withdrew included, with `active: false`), how many of the group's lists
        taken WHILE THEY WERE IN IT — from enrolling, or their latest move into
        the group, to leaving it — found them present, absent, late (retardo)
        or excused, plus the totals. Only exceptions are stored (default-present
        model), so `present` = those lists − absent − late − excused (never
        below zero). Daily and per-class lists count alike. A pupil's marks held
        by another group's list, or from before they joined, are not this
        group's. `/pdf` and `/xlsx` export the
        same report. An unknown group is 404; a missing or reversed range, or one
        longer than 366 days, is 400. Requires `attendance:read`.
      operationId: attendanceReport
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: query, required: true, schema: { type: string, format: uuid }, example: 7a1c2e3d-0000-4000-8000-000000000001 }
        - { name: from, in: query, required: true, description: First day (inclusive)., schema: { type: string, format: date }, example: "2026-09-01" }
        - { name: to, in: query, required: true, description: Last day (inclusive); at most 366 days after `from`., schema: { type: string, format: date }, example: "2026-09-30" }
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceReport' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/attendance/reports/pdf:
    get:
      tags: [attendance]
      summary: The attendance report as a PDF
      description: Letter pages, the T10 report engine. Requires `attendance:read`.
      operationId: attendanceReportPdf
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: query, required: true, schema: { type: string, format: uuid }, example: 7a1c2e3d-0000-4000-8000-000000000001 }
        - { name: from, in: query, required: true, description: First day (inclusive)., schema: { type: string, format: date }, example: "2026-09-01" }
        - { name: to, in: query, required: true, description: Last day (inclusive); at most 366 days after `from`., schema: { type: string, format: date }, example: "2026-09-30" }
      responses:
        '200':
          description: reporte-asistencia-<from>-<to>.pdf
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/attendance/reports/xlsx:
    get:
      tags: [attendance]
      summary: The attendance report as an Excel workbook
      description: Counts are number cells; text never becomes a formula. Requires `attendance:read`.
      operationId: attendanceReportXlsx
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: query, required: true, schema: { type: string, format: uuid }, example: 7a1c2e3d-0000-4000-8000-000000000001 }
        - { name: from, in: query, required: true, description: First day (inclusive)., schema: { type: string, format: date }, example: "2026-09-01" }
        - { name: to, in: query, required: true, description: Last day (inclusive); at most 366 days after `from`., schema: { type: string, format: date }, example: "2026-09-30" }
      responses:
        '200':
          description: reporte-asistencia-<from>-<to>.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/attendance/scan:
    post:
      tags: [attendance]
      summary: Resolve a scanned card to a list row (director)
      description: >
        T4, attendance by QR. Resolves the scanned virtual card (task 13) to
        the row of the (group, subject-or-none) list of the body's `date` — the
        list on screen, not the server's school day — and it NEVER writes
        attendance: the screen marks the row and the list is saved with
        `POST /api/v1/attendance`. A missing or malformed `date` is 400. The
        list is checked first, with the roster's rules (unknown group 404; mode
        and subject errors 400), so a list the caller may not read never looks
        the card up. The director has no date window. A card counts unless the
        office revoked it, whatever the pupil's admission status: the group's
        roster already decides who belongs to the list. The verdict
        travels in `X-Scan-Result` (`ok` | `invalid` | `foreign` | `suspended`)
        because two refusals share 422. Every answer carries
        `Cache-Control: no-store`. Behind `module_attendance` AND
        `module_student_card`. Requires `attendance:read`.
      operationId: scanAttendanceCard
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/AttendanceScan' }
      responses:
        '200': { $ref: '#/components/responses/AttendanceScanResolved' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/AttendanceScanSuspended' }
        '422': { $ref: '#/components/responses/AttendanceScanRefused' }

  /api/v1/teaching/attendance/classes:
    get:
      tags: [attendance]
      summary: The lists the caller takes (teacher)
      description: >
        Active cycle only. One entry per DAILY group the caller teaches (once,
        however many subjects) and one per PER_CLASS assignment. Derived from
        the authenticated principal, so no parameter can widen it; a caller
        with no linked teacher gets an empty list. Behind `module_attendance`
        AND `module_config`. Requires `attendance_own:read`.
      operationId: listTeachingAttendanceClasses
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The caller's lists, sorted by group label then subject.
          content:
            application/json:
              schema:
                type: object
                required: [classes]
                properties:
                  classes:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceClass' }
              example:
                classes:
                  - { groupId: 7a1c2e3d-0000-4000-8000-000000000001, groupLabel: "1° PRIMARIA · A", levelName: Primaria, mode: daily }
                  - groupId: 7a1c2e3d-0000-4000-8000-000000000002
                    groupLabel: "1° SECUNDARIA · A"
                    levelName: Secundaria
                    mode: per_class
                    subjectId: 5b7a1c2e-0000-4000-8000-00000000000a
                    subjectName: Matemáticas I
                    assignmentId: 9c3d1e2f-0000-4000-8000-000000000003
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/attendance/roster:
    get:
      tags: [attendance]
      summary: One of the caller's pass lists (teacher)
      description: >
        Any date may be read; `editable` says whether the caller may still save
        it (`today` and up to `windowDays` back, never the future) and
        `readOnlyReason` why not. As on the director route, a list taken before
        its level changed mode stays readable and correctable. A group the
        caller does not teach — or, for a `per_class` list, a subject that is
        not the caller's (another teacher's class in the same group) — is 404,
        exactly like a group that does not exist. Mode errors are 400 as on the
        director route. Rows carry the students' names (a teacher holds no
        `students:read`). Requires `attendance_own:read`.
      operationId: getTeachingAttendanceRoster
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttendanceGroupId'
        - $ref: '#/components/parameters/AttendanceDate'
        - $ref: '#/components/parameters/AttendanceSubjectId'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceList' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/attendance:
    post:
      tags: [attendance]
      summary: Save one of the caller's pass lists (teacher)
      description: >
        Same reconcile as the director route, restricted to the caller's own
        lists (404 otherwise) and to today (the school's day, America/Mexico_City) and up
        to 7 days back: 400 "No puedes registrar una fecha futura" for a date
        after today, "Solo puedes corregir hasta 7 días atrás" for one before
        the window. An enrollment of another group is refused by the attendance
        service (400). A day without classes is 400 `X-Error-Code:
        NO_CLASSES` ("Ese día no hay clases."), as on the director route. The
        caller is stamped as the list's taker. Requires
        `attendance_own:write`.
      operationId: saveTeachingAttendance
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAttendanceRequest' }
            example:
              groupId: 7a1c2e3d-0000-4000-8000-000000000001
              date: "2026-09-15"
              marks:
                - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, status: late, note: "8:15" }
      responses:
        '200': { $ref: '#/components/responses/AttendanceSaved' }
        '400': { $ref: '#/components/responses/AttendanceSaveRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/attendance/scan:
    post:
      tags: [attendance]
      summary: Resolve a scanned card to a row of one of the caller's lists (teacher)
      description: >
        Same resolve and verdicts as `POST /api/v1/attendance/scan`, restricted
        to the caller's OWN lists with the roster's ownership rule: a group the
        caller does not teach, or a `per_class` subject that is not the
        caller's, is 404 before any card is looked up. The `date` obeys the
        save's window: a future day is 400 "No puedes registrar una fecha
        futura", a day more than 7 back is 400 "Solo puedes corregir hasta 7
        días atrás". Never writes attendance
        (the list is saved with `POST /api/v1/teaching/attendance`). Behind
        `module_attendance` AND `module_student_card`. Requires
        `attendance_own:read`.
      operationId: scanTeachingAttendanceCard
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/AttendanceScan' }
      responses:
        '200': { $ref: '#/components/responses/AttendanceScanResolved' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/AttendanceScanSuspended' }
        '422': { $ref: '#/components/responses/AttendanceScanRefused' }

  /api/v1/finance/tuition-plans:
    get:
      tags: [finance-tuition]
      summary: The tuition table of a school year
      description: >
        What each level costs in the given cycle. A level with no row is not free —
        it is unpriced, and the billing run reports it rather than charging zero.
      operationId: listTuitionPlans
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cycleId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The cycle's tuition table.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/TuitionPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    put:
      tags: [finance-tuition]
      summary: Price one level of one school year
      description: >
        Replaces the table for a (cycle, level). A PUT because stating the price
        twice must mean the same as stating it once: there is exactly one table
        per level per cycle.
      operationId: upsertTuitionPlan
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TuitionPlanInput' }
      responses:
        '200':
          description: The stored table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TuitionPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409': { $ref: '#/components/responses/PlainLevelBeingDeleted' }

  /api/v1/finance/charges:
    get:
      tags: [finance-payments]
      summary: One page of charges of a pupil and/or a school year
      description: >
        Charges in (dueDate, id) order with their collected and remaining
        totals, priced as of the school's today. Pass a student and/or a cycle:
        an unscoped read is refused with 400. A cycle holds thousands of charges
        (pupils times months), so the read is PAGED: follow `nextPageToken`
        until it comes back empty or absent. Never treat the first page as the
        whole ledger. Requires `finance:read` (or `collections:read` scoped to
        one pupil).
      operationId: listCharges
      security: [{ sessionCookie: [] }]
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
        - name: cycleId
          in: query
          schema: { type: string, format: uuid }
        - name: pageToken
          in: query
          description: The `nextPageToken` of the previous page; opaque. Omit for the first page.
          schema: { type: string, maxLength: 128 }
        - name: pageSize
          in: query
          description: Charges per page. Defaults to 500, the maximum.
          schema: { type: integer, format: int32, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: One page of charges.
          content:
            application/json:
              schema:
                type: object
                required: [charges]
                properties:
                  charges:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceCharge' }
                  nextPageToken:
                    type: string
                    description: Absent on the last page.
              examples:
                firstOfMany:
                  summary: A page with more to come
                  value:
                    charges:
                      - id: 61000000-0000-4000-8000-000000000011
                        studentId: 51000000-0000-4000-8000-000000000001
                        cycleId: 41000000-0000-4000-8000-000000000001
                        conceptId: 31000000-0000-4000-8000-000000000001
                        description: Colegiatura septiembre
                        amountCents: 250000
                        discountCents: 0
                        dueDate: '2026-09-10'
                        status: partially_paid
                        paidCents: 100000
                        remainingCents: 150000
                        scholarshipCents: 0
                    nextPageToken: MjAyNi0wOS0xMHw2MTAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMTE
        '400': { $ref: '#/components/responses/PagedFinanceBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /api/v1/finance/overdue:
    get:
      tags: [finance-payments]
      summary: One page of overdue charges
      description: >
        Charges past their due date (before the school's today) that still owe
        money, in (dueDate, id) order. Each page EXAMINES up to pageSize
        candidates and returns the ones still owed, so a page can be shorter
        than pageSize, even empty, while more remain: stop when `nextPageToken`
        is empty or absent, never on a short page. Requires `finance:read` or
        `collections:read`.
      operationId: listOverdue
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cycleId
          in: query
          description: Optional; empty spans every cycle.
          schema: { type: string, format: uuid }
        - name: pageToken
          in: query
          description: The `nextPageToken` of the previous page; opaque. Omit for the first page.
          schema: { type: string, maxLength: 128 }
        - name: pageSize
          in: query
          description: Candidates examined per page. Defaults to 500, the maximum.
          schema: { type: integer, format: int32, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: One page of overdue charges.
          content:
            application/json:
              schema:
                type: object
                required: [overdue]
                properties:
                  overdue:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceCharge' }
                  nextPageToken:
                    type: string
                    description: Absent once every candidate has been examined.
              examples:
                lastPage:
                  summary: The last page
                  value:
                    overdue:
                      - id: 61000000-0000-4000-8000-000000000012
                        studentId: 51000000-0000-4000-8000-000000000001
                        cycleId: 41000000-0000-4000-8000-000000000001
                        conceptId: 31000000-0000-4000-8000-000000000001
                        description: Colegiatura agosto
                        amountCents: 250000
                        discountCents: 0
                        dueDate: '2026-08-10'
                        status: pending
                        paidCents: 0
                        remainingCents: 250000
                        scholarshipCents: 0
        '400': { $ref: '#/components/responses/PagedFinanceBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /api/v1/finance/payments:
    post:
      tags: [finance-payments]
      summary: Pay one charge, possibly combining methods
      description: >
        Money straight against one named charge (Finanzas' "Registrar pago").
        With `tenders` (T8) the payment combines methods — a credit note the
        school issued by hand completed with cash, say — and is stored as one
        payment row per tender in a single transaction. The tenders must add up
        exactly to amountCents, and amountCents may not exceed what the charge
        still owes; otherwise 400 and nothing is written.


        Send an idempotencyKey: a retry returns every row stored the first time
        and collects nothing. Requires `finance:write`.
      operationId: registerPayment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargeId, amountCents]
              properties:
                chargeId: { type: string, format: uuid }
                amountCents:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The amount to pay ("Monto a pagar").
                method:
                  type: string
                  enum: [cash, card, transfer, credit_note]
                  description: The single method. Required unless `tenders` is sent.
                reference: { type: string }
                tenders:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { $ref: '#/components/schemas/Tender' }
                idempotencyKey: { type: string }
                paidAt:
                  type: string
                  format: date
                  description: The day the money changed hands. Empty means today; a day after the school's today (Morelia, ADR 0035) is refused.
            examples:
              creditNoteAndTransfer:
                summary: A credit note completed with a transfer (T8)
                value:
                  chargeId: 61000000-0000-4000-8000-000000000011
                  amountCents: 100000
                  tenders:
                    - { method: credit_note, amountCents: 40000, reference: NC-0003 }
                    - { method: transfer, amountCents: 60000, reference: SPEI 8841 }
      responses:
        '201':
          description: The payment rows and the charge as they left it.
          content:
            application/json:
              schema:
                type: object
                required: [payment, payments, charge]
                properties:
                  payment:
                    type: object
                    description: The first row (the only one for a single method).
                  payments:
                    type: array
                    description: One row per tender, in order.
                    items: { type: object }
                  charge:
                    type: object
                    description: The charge with its recomputed paid, remaining and status.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /api/v1/finance/deposits:
    post:
      tags: [finance-payments]
      summary: Take money without being told what it pays for
      description: >
        A parent hands over an amount and says nothing else. The split lands on
        the oldest debt first, then the surcharge that debt earned, then the next
        month, and whatever is left over stays as the family's credit. The
        response carries the whole split so a receipt can be printed without a
        second call while the parent waits.


        Send an idempotencyKey: the retry a lost response provokes must not cost
        the family twice.
      operationId: registerDeposit
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, amountCents]
              properties:
                studentId: { type: string, format: uuid }
                amountCents:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The amount to pay ("Monto a pagar").
                method:
                  type: string
                  enum: [cash, card, transfer, credit_note]
                  description: The single method. Required unless `tenders` is sent, which replaces method, cardType and reference.
                tenders:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { $ref: '#/components/schemas/Tender' }
                  description: >
                    A combined payment (T8). The tenders must add up exactly to
                    amountCents — otherwise 400 and nothing is registered.
                cardType:
                  type: string
                  enum: [debit, credit]
                  description: Only on a card. A card type on cash is refused.
                reference: { type: string }
                paidAt:
                  type: string
                  format: date
                  description: >
                    The day the money changed hands, which is not always the day
                    it was keyed — every collection rule is a function of it. A
                    date, not an instant: a time zone on a cashier's clock is a
                    bug waiting to move a payment across a due date. Empty means
                    today; a day after the school's today (Morelia, ADR 0035)
                    is refused.
                idempotencyKey: { type: string }
                grantEarlyPayment:
                  type: boolean
                  description: >
                    Honours the early-payment reward after the window closed,
                    because the school decided to — the parent who is always
                    punctual and slipped once. Recorded under its own discount
                    reason so a report can tell a decision from the rule firing.
                chargeIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: >
                    The charges the money may pay, chosen at the counter: paid
                    oldest first, each month with its surcharge; what is left is
                    the family's credit. Empty or absent means every charge,
                    oldest first. A charge that is not the student's is refused.
            examples:
              creditNoteAndCash:
                summary: A credit note completed with cash (T8)
                value:
                  studentId: 3d5f8a10-0000-4000-8000-000000000042
                  amountCents: 350000
                  tenders:
                    - { method: credit_note, amountCents: 200000, reference: NC-0007 }
                    - { method: cash, amountCents: 150000 }
      responses:
        '201':
          description: The deposit and what it covered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    get:
      tags: [finance-payments]
      summary: A family's deposits, newest first
      operationId: listDeposits
      security: [{ sessionCookie: [] }]
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The deposits.
          content:
            application/json:
              schema:
                type: object
                required: [deposits]
                properties:
                  deposits:
                    type: array
                    items: { $ref: '#/components/schemas/Deposit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/expected:
    get:
      tags: [finance-payments]
      summary: What a family must hand over today
      description: >
        The months already due — plus the one due later THIS month, which is how
        the early-payment reward is earned — what being late has cost, and what
        paying early saves. The counter shows it as "Monto esperado" and never
        lets anybody edit it; the captured amount is compared against it and the
        difference is recorded rather than blocking the payment.


        Not the same question as the annual balance, which is returned beside it.
      operationId: expectedToday
      security: [{ sessionCookie: [] }]
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: on
          in: query
          required: false
          schema: { type: string, format: date }
          description: The day to work it out for. Empty means today.
        - name: withBalance
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: >
            false leaves the year's balance out (annualBalanceCents and
            onTimeBalanceCents come back 0) and spares the service two reads:
            for lists that show only amountCents, such as the counter's search.
      responses:
        '200':
          description: What is due today, and what makes it up.
          content:
            application/json:
              schema:
                type: object
                required: [amountCents, surchargeCents, discountCents, annualBalanceCents, onTimeBalanceCents]
                properties:
                  amountCents: { type: integer, format: int64, minimum: 0 }
                  surchargeCents: { type: integer, format: int64, minimum: 0 }
                  discountCents: { type: integer, format: int64, minimum: 0 }
                  annualBalanceCents:
                    type: integer
                    format: int64
                    example: 3200000
                    description: >
                      THE balance (T5), as of today: the lines inBalance, the
                      surcharge accrued, less every peso received. Negative
                      when the school holds the family's money.
                  onTimeBalanceCents:
                    type: integer
                    format: int64
                    example: 3000000
                    description: >
                      annualBalanceCents if every month in it is paid in time:
                      less the early-payment rewards (discountCents) of the
                      lines inBalance. A projection, not a debt; a line not yet
                      open takes nothing off it.
                  lines:
                    type: array
                    description: >
                      The debt concept by concept, oldest due date first. The
                      lines marked due add up to amountCents.
                    items:
                      type: object
                      required: [chargeId, description, dueDate, owedCents, surchargeCents, discountCents, totalCents, due, inBalance]
                      properties:
                        chargeId: { type: string, format: uuid }
                        description: { type: string, example: "Colegiatura septiembre" }
                        dueDate: { type: string, format: date }
                        owedCents: { type: integer, format: int64, example: 320000 }
                        surchargeCents: { type: integer, format: int64, example: 30000 }
                        discountCents: { type: integer, format: int64, example: 0 }
                        scholarshipCents:
                          type: integer
                          format: int64
                          example: 160000
                          description: >
                            The scholarship that day takes off (T18), already
                            out of owedCents; 0 when none applies, or when it
                            was lost by paying after the due date.
                        totalCents: { type: integer, format: int64, example: 350000 }
                        due: { type: boolean, description: "Asked for that day: due, or falling due later that month — and already open (T5)." }
                        inBalance:
                          type: boolean
                          description: >
                            Counted in annualBalanceCents today. false for a
                            charge not yet open (T5) with nothing paid on it:
                            listed so it can be paid ahead, not part of the debt.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/deposits/preview:
    post:
      tags: [finance-payments]
      summary: What an amount would cover, without taking it
      description: >
        Same rule, same order, same arithmetic as taking the deposit, and it
        writes nothing — so a cashier can tell a parent what their money pays for
        before it changes hands.


        A projection, not a promise: the charges are read without the lock the
        real call takes, so a payment landing in between changes the answer.
      operationId: previewDeposit
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, amountCents]
              properties:
                studentId: { type: string, format: uuid }
                amountCents: { type: integer, format: int64, minimum: 1 }
                paidAt: { type: string, format: date }
                chargeIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: >
                    The charges the money may pay, chosen at the counter: paid
                    oldest first, each month with its surcharge; what is left is
                    the family's credit. Empty or absent means every charge,
                    oldest first. A charge that is not the student's is refused.
      responses:
        '200':
          description: The projected split.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/deposits/{id}/void:
    post:
      tags: [finance-payments]
      summary: Cancel a deposit and release what it settled
      description: >
        A cashier who keys $67,000 instead of $6,700 has to be able to undo it.
        The row survives with its reason — a school that deletes money rows
        cannot explain its own ledger — and the debts it paid go back to being
        owed.
      operationId: voidDeposit
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: >
                    Required. Without one, a cancelled deposit is an unexplained
                    hole in the day's takings.
      responses:
        '204': { description: Cancelled. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: The deposit was already cancelled.

  /api/v1/finance/deposits/{id}/correct:
    post:
      tags: [finance-payments]
      summary: Correct a registered payment
      description: >
        T9. A payment keyed wrong ($500 for $1,000, the wrong day, cash for a
        transfer, the wrong months) is corrected, never edited in place. The
        original deposit is kept and marked superseded — it counts for nothing
        and its receipt prints "Sustituido por P-…" — and a NEW deposit with its
        own folio carries the corrected amount, date, methods and concepts,
        split by the same rule as any deposit on the corrected date, so
        surcharges and the early-payment reward are worked out again. Who
        received the money stays the original cashier; who corrected it, when
        and why go to the history. The family is notified with the corrected
        amount. Requires `payments:edit` (the owner's by default, delegable).


        Send an idempotencyKey: a retried correction under the same key
        changes nothing and answers with the stored one (`replayed`).
      operationId: correctDeposit
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents, tenders, reason]
              properties:
                amountCents:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The amount the family really handed over.
                  example: 100000
                paidAt:
                  type: string
                  format: date
                  description: The corrected day. Empty keeps the original's day; a day after the school's today (Morelia) is refused.
                  example: '2026-09-09'
                tenders:
                  type: array
                  minItems: 1
                  maxItems: 4
                  description: The methods, adding up exactly to amountCents (ADR 0025).
                  items: { $ref: '#/components/schemas/Tender' }
                chargeIds:
                  type: array
                  maxItems: 100
                  description: The charges the money may pay; empty is oldest debt first.
                  items: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Required — why the payment is corrected.
                  example: Se capturó $500 y la familia entregó $1,000
                idempotencyKey: { type: string, maxLength: 120, example: corr-6f1c }
      responses:
        '200':
          description: Corrected (or replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositCorrectionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: The deposit was cancelled, or already corrected (correct its replacement).

  /api/v1/finance/deposits/{id}/corrections:
    get:
      tags: [finance-payments]
      summary: A payment's correction history
      description: >
        T9. Every correction in the receipt's chain, oldest first, whichever
        link is asked about: before and after (amount, date, methods, concepts),
        who, when and why. Requires `payments:edit` or `finance:read`.
      operationId: listDepositCorrections
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [corrections]
                properties:
                  corrections:
                    type: array
                    items: { $ref: '#/components/schemas/DepositCorrection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/accounts/{studentId}/statement:
    get:
      tags: [finance-payments]
      summary: A student's account statement (ledger)
      description: >
        T7. The student's ledger, worked out ONCE in finance (`GetStatement`)
        and read unchanged by this drawer, the parents' app and the PDF: every
        movement in date order with the running balance after it, the totals,
        and the counter's figures for today.


        Movements: `charge`, `surcharge` (written down, or `accrued` — earned
        by the daily rule up to today and not yet written; it counts, it is
        what the counter would collect), `discount`, `scholarship` (what a
        scholarship takes off the charge, T18), `payment` (one line per deposit — money as it arrived, with
        its folio and method — plus payments made straight against a charge),
        `credit_note` (reserved for T8). Cancelled charges, and surcharges of a
        cancelled month, are not movements.


        A charge that has not opened yet (T5, `startsOn` in the future, no
        money on it) is listed with `notYetDue: true` and is NOT counted: the
        balance is the same number the family reads. A voided deposit is
        listed with `voided: true` and its reason, struck through, and is NOT
        counted.


        `totals.balanceCents` = charged − discounts − paid; negative is credit
        the school holds for the family. `dueTodayCents` is exactly what
        Registrar pago asks for today (same function), already carrying the
        accrued surcharge and net of the early-payment reward.
        Requires `finance:read` or `collections:read`.
      operationId: getStudentStatement
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/FamilyStudentIdPath'
      responses:
        '200':
          description: The ledger.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/accounts/{studentId}/statement/pdf:
    get:
      tags: [finance-payments]
      summary: A student's account statement as a PDF
      description: >
        The same ledger on letter pages (the receipts' engine): the school,
        the pupil, every movement with its running balance, the totals and
        today's figure. Runs onto as many pages as it needs. Requires
        `finance:read` or `collections:read`.
      operationId: getStudentStatementPdf
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/FamilyStudentIdPath'
      responses:
        '200': { $ref: '#/components/responses/StatementPDF' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/cash-up:
    get:
      tags: [finance-payments]
      summary: The day's takings
      description: >
        What came in on one day and in what form — cash, card, transfer — with
        the list behind each number. This is what a school closes the day with,
        instead of adding up a notebook.


        Cancelled deposits count for nothing and are listed anyway: a cash-up
        that hid them could not explain why the drawer holds less than the
        receipts say.
      operationId: dailyCashUp
      security: [{ sessionCookie: [] }]
      parameters:
        - name: day
          in: query
          required: false
          schema: { type: string, format: date }
          description: The day the money changed hands. Empty means today.
      responses:
        '200':
          description: The day's takings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashUp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/income:
    get:
      tags: [finance-payments]
      summary: What the school earned, by what it charged for
      description: >
        Income between two days, biggest line first. Counted on the day the
        money changed hands, not the day the charge was issued: for anyone
        paying late the two are months apart, and reporting on the charge date
        credits October with September's arrears.


        Both dates are required. A report over "everything since the beginning"
        is almost never what was meant, and it is the kind of mistake that gets
        read as a real number.
      operationId: incomeByConcept
      security: [{ sessionCookie: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive.
      responses:
        '200':
          description: The period's income.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/cash-up/close:
    post:
      tags: [expenses]
      summary: Close the day's cash cut
      description: >
        T10. Closes a day with the cash counted in the drawer. The closure is a
        snapshot of the cut as it stands — income and expenses by method, what
        credit notes settled, the cash expected (cash in − cash out), the cash
        counted and the difference (counted − expected; negative is money
        missing) — and who closed it, when. Who closes is the signed-in caller.
        If a movement of that day changes afterwards (a correction, a void, a
        late capture, an expense edited or cancelled) the cut reports
        `modifiedAfterClose` (receipts and reworded descriptions do not count:
        they move no figure). Send the cut's `day`. Requires `expenses:write`
        and module_expenses.
      operationId: closeCashCut
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedCashCents]
              properties:
                day:
                  type: string
                  format: date
                  description: The day to close; empty is today. A future day is refused.
                  example: '2026-10-01'
                countedCashCents: { type: integer, format: int64, minimum: 0, example: 165000 }
                note: { type: string, maxLength: 500, example: Faltan $50 de cambio }
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCutClosure' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The day is already closed (reopen it first).
          content:
            text/plain:
              schema: { type: string }

  /api/v1/finance/cash-up/reopen:
    post:
      tags: [expenses]
      summary: Reopen a closed cash cut
      description: >
        T10. Reopens a closed day so it can be closed again (with a reason).
        The earlier closure stays in the day's history (`reopened`). The
        director's decision: requires `finance:write` and module_expenses.
      operationId: reopenCashCut
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                day: { type: string, format: date, example: '2026-10-01' }
                reason: { type: string, minLength: 1, maxLength: 500, example: Se corrigió un pago de ese día }
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCutClosure' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: The day is not closed, or the module is off.
          content:
            text/plain:
              schema: { type: string }
        '409':
          description: The closure was reopened in between.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/schedule:
    get:
      tags: [schedule]
      summary: The school timetable of a cycle, with everything needed to draw it (T16)
      description: >
        The base weekly timetable (Monday–Friday) of `cycleId` — or of the
        ACTIVE cycle when omitted — together with the catalog the calendar
        needs to name and filter it (levels, grades, groups, subjects,
        teachers, the cycle's teaching assignments) and each level's time
        grid. A user with `schedule:read` and no `config:read` can draw the
        whole screen from this one call. `started` is true once the cycle's
        first day has arrived in the school's time zone
        (America/Mexico_City): from then on every base edit needs a `reason`
        and is recorded in the history. Requires `schedule:read`.
      operationId: getSchedule
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The timetable and its catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleBoard' }
        '400':
          description: A malformed `cycleId`.
          content:
            text/plain:
              schema: { type: string }
              example: cycleId must be an id
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: The module is off, the cycle does not exist, or there is no active cycle and none was named.
          content:
            text/plain:
              schema: { type: string }
              example: No hay un ciclo activo

  /api/v1/schedule/blocks:
    post:
      tags: [schedule]
      summary: Add a class block to the base timetable (T16)
      description: >
        A class is ALWAYS one of the cycle's teaching assignments (teacher +
        group + subject, T13) placed on a weekday (1 = Monday … 5 = Friday)
        between `startsAt` and `endsAt` (`HH:MM`, 5-minute steps, end after
        start, inside the level's grid). A teacher cannot be in two groups at
        the same time and a group cannot have two classes at the same time:
        409 `SCHEDULE_TEACHER_BUSY` / `SCHEDULE_GROUP_BUSY` naming the
        conflicting class ("Ana Ruiz ya da Matemáticas a 3.º A de 08:00 a
        08:50"); the database enforces both rules too (EXCLUDE), so two
        editors racing cannot double-book. A class that would collide with a
        date-specific change already recorded (a substitute on a future date)
        is 409 `SCHEDULE_OVERRIDE_CONFLICT`. Once the cycle has started the
        new class goes to the history; `reason` is optional (adding a class
        changes nothing already relied on). Requires `schedule:write`.
      operationId: createScheduleBlock
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleBlockInput' }
            example: { assignmentId: 6f1c2b8e-0000-4000-8000-000000000031, weekday: 1, startsAt: '08:00', endsAt: '08:50' }
      responses:
        '201':
          description: The new class.
          content:
            application/json:
              schema:
                type: object
                required: [block]
                properties:
                  block: { $ref: '#/components/schemas/ScheduleBlock' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }

  /api/v1/schedule/blocks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [schedule]
      summary: Move or change a class of the base timetable (T16)
      description: >
        Same rules as creating one, except that once the cycle has started a
        `reason` is required (400 `SCHEDULE_REASON_REQUIRED`). Moving a class
        to another weekday while it has date-specific changes on future dates
        is 409 `SCHEDULE_BLOCK_HAS_OVERRIDES` (remove those changes first).
        Requires `schedule:write`.
      operationId: updateScheduleBlock
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleBlockInput' }
      responses:
        '200':
          description: The class as saved.
          content:
            application/json:
              schema:
                type: object
                required: [block]
                properties:
                  block: { $ref: '#/components/schemas/ScheduleBlock' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
    delete:
      tags: [schedule]
      summary: Remove a class from the base timetable (T16)
      description: >
        Removes the class and its date-specific changes. Once the cycle has
        started `reason` is required (400 `SCHEDULE_REASON_REQUIRED`) and the
        removal goes to the history. Requires `schedule:write`.
      operationId: deleteScheduleBlock
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: reason, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/day:
    get:
      tags: [schedule]
      summary: The timetable as it really is on one date — base plus that day's changes (T16)
      description: >
        The classes of `date` (`YYYY-MM-DD`): the base classes of its weekday
        with that date's changes applied — a substitute teacher, two classes
        swapped, a cancelled class (returned with `status: cancelled` so the
        screen can show it struck through). A Saturday or Sunday has no
        classes. "¿Qué está pasando ahora?" is this call for today, filtered
        by the time on the screen. Requires `schedule:read`.
      operationId: getScheduleDay
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The effective classes of the date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleDay' }
        '400':
          description: A malformed `cycleId` or `date`.
          content:
            text/plain:
              schema: { type: string }
              example: date must be YYYY-MM-DD
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/overrides:
    post:
      tags: [schedule]
      summary: Change one class for ONE date without touching the base timetable (T16)
      description: >
        `kind`: `substitute` (another teacher gives the class that day —
        `teacherId`), `swap` (the class trades its time with another class of
        the SAME group that day — `swapBlockId`), or `cancel`. The date must
        fall on the class's weekday (400 `SCHEDULE_DATE_WRONG_WEEKDAY`) and
        inside the cycle (400 `SCHEDULE_DATE_OUTSIDE_CYCLE`); a class takes at
        most one change per date (409 `SCHEDULE_BLOCK_TAKEN`). The conflict
        rules are judged on the EFFECTIVE timetable of that date (base +
        changes): a substitute or a swapped teacher who already teaches at
        that time that day is 409 `SCHEDULE_TEACHER_BUSY` naming the class.
        `reason` is required. Every change goes to the history with who made
        it. Requires `schedule:write`.
      operationId: createScheduleOverride
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleOverrideInput' }
            example: { blockId: 6f1c2b8e-0000-4000-8000-000000000041, date: '2026-10-05', kind: substitute, teacherId: 6f1c2b8e-0000-4000-8000-000000000021, reason: La maestra de música llegó tarde }
      responses:
        '201':
          description: The change.
          content:
            application/json:
              schema:
                type: object
                required: [override]
                properties:
                  override: { $ref: '#/components/schemas/ScheduleOverride' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }

  /api/v1/schedule/overrides/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [schedule]
      summary: Undo a date-specific change (T16)
      description: The class goes back to its base timetable for that date; the undo goes to the history. Requires `schedule:write`.
      operationId: deleteScheduleOverride
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: reason, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '204': { description: Undone. }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/available-teachers:
    get:
      tags: [schedule]
      summary: Teachers free in a slot, the best fits first (T16)
      description: >
        Every teacher with no class in the slot — on `date` when given
        (effective timetable: base + that day's changes, substitutes
        included), otherwise in the base timetable of `weekday`. Ordered:
        those who teach that subject (same name, any grade) first
        (`match: subject`), then those who teach in that grade
        (`match: grade`), then everybody else (`match: other`); by name within
        each. `excludeBlockId` leaves that class out of the busy check (the
        class being edited or covered); on a `date` its own teacher is also
        left out (they are no substitute for themselves). A `date` on a
        weekend or outside the cycle lists nobody. Requires `schedule:read`.
      operationId: listAvailableTeachers
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: groupId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subjectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: weekday, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5 }, description: Required unless `date` is given. }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: startsAt, in: query, required: true, schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { name: endsAt, in: query, required: true, schema: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$' } }
        - { name: excludeBlockId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The free teachers, best fits first.
          content:
            application/json:
              schema:
                type: object
                required: [teachers]
                properties:
                  teachers:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleAvailableTeacher' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/settings/{levelId}:
    parameters:
      - { name: levelId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [schedule]
      summary: Set a level's time grid (T16)
      description: >
        The hours the calendar shows for the level (default 07:00–15:00),
        `HH:MM` in 5-minute steps, at least one hour. Existing classes are not
        touched; the calendar widens itself to show any class outside the
        grid. Requires `schedule:write`.
      operationId: putScheduleSettings
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gridStart, gridEnd]
              properties:
                gridStart: { type: string, example: '07:00' }
                gridEnd: { type: string, example: '15:00' }
      responses:
        '200':
          description: The level's grid.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings: { $ref: '#/components/schemas/ScheduleSettings' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/events:
    get:
      tags: [schedule]
      summary: The timetable's change history (T16)
      description: >
        Who changed what, when and why: every date-specific change (and its
        undo) and every base edit made after the cycle started; newest first,
        at most `limit` (default 100, max 500). Requires `schedule:read`.
      operationId: listScheduleEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleEvent' }
        '400':
          description: A malformed `cycleId` or `limit`.
          content:
            text/plain:
              schema: { type: string }
              example: cycleId is required
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/schedule/absences:
    get:
      tags: [schedule]
      summary: Teacher absences touching a date range (T19)
      description: >
        The cycle's teacher absences whose dates touch `from`..`to` (at most a
        year apart), of `teacherId` when given; cancelled ones only with
        `includeCancelled=true`. PRIVACY: `kind`, `note` and who registered
        or cancelled it are returned ONLY to callers holding `schedule:write`;
        everyone else gets the dates and hours (the screen says "Ausente").
        Requires `schedule:read`.
      operationId: listTeacherAbsences
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: teacherId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: includeCancelled, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The absences, by start date.
          content:
            application/json:
              schema:
                type: object
                required: [absences]
                properties:
                  absences:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherAbsence' }
        '400':
          description: A malformed `cycleId`, `teacherId` or date range.
          content:
            text/plain:
              schema: { type: string }
              example: cycleId, from and to (YYYY-MM-DD) are required
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [schedule]
      summary: Register a teacher's absence (T19)
      description: >
        A teacher away on `startsOn`..`endsOn` (both inclusive, inside one
        cycle — 400 `SCHEDULE_DATE_OUTSIDE_CYCLE`), the whole day
        (`allDay: true`) or between `startsAt` and `endsAt` of each of those
        dates (5-minute steps). `kind`: sick (Incapacidad), vacation
        (Vacaciones), personal (Asunto personal), other (Otro). Two active
        absences of one teacher never overlap (409
        `SCHEDULE_ABSENCE_OVERLAP`). A teacher cannot register their own
        absence (403 `SCHEDULE_ABSENCE_OWN`). On every date it covers, the
        teacher's classes show `status: uncovered` until a substitute is
        assigned or the class is cancelled for that date.
        `uncoveredCount` is how many classes are left uncovered on its
        school days right now ("Quedan N clases sin cubrir"). The history
        records it without the kind or the note. Requires `schedule:write`.
      operationId: createTeacherAbsence
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherAbsenceInput' }
            example: { cycleId: 6f1c2b8e-0000-4000-8000-000000000001, teacherId: 6f1c2b8e-0000-4000-8000-000000000021, kind: personal, startsOn: '2026-10-05', endsOn: '2026-10-05', allDay: false, startsAt: '08:00', endsAt: '10:00', note: Cita médica }
      responses:
        '201':
          description: The absence and the classes it leaves uncovered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherAbsenceSaved' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403':
          description: Without `schedule:write`, or SCHEDULE_ABSENCE_OWN (the caller is that teacher).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: No puedes registrar tu propia ausencia
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }

  /api/v1/schedule/absences/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [schedule]
      summary: Change an absence (T19)
      description: >
        Changes the kind, dates, hours or note of an ACTIVE absence (409
        `SCHEDULE_ABSENCE_CANCELLED` otherwise); the teacher never changes
        (`teacherId` is required and must be the absence's). Same rules as
        registering it; the change goes to the history. Requires
        `schedule:write`.
      operationId: updateTeacherAbsence
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherAbsenceInput' }
            example: { teacherId: 6f1c2b8e-0000-4000-8000-000000000021, kind: sick, startsOn: '2026-10-05', endsOn: '2026-10-07', allDay: true }
      responses:
        '200':
          description: The absence and the classes it leaves uncovered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherAbsenceSaved' }
        '400': { $ref: '#/components/responses/ScheduleBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }

  /api/v1/schedule/absences/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [schedule]
      summary: Cancel an absence — never deleted (T19)
      description: >
        The teacher's classes are no longer uncovered on its dates. The record
        stays, with who cancelled it and when; the cancellation goes to the
        history. Cancelling twice is 409 `SCHEDULE_ABSENCE_CANCELLED`; a
        teacher cannot cancel their own absence (403 `SCHEDULE_ABSENCE_OWN`).
        Requires `schedule:write`.
      operationId: cancelTeacherAbsence
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: The cancelled absence.
          content:
            application/json:
              schema:
                type: object
                required: [absence]
                properties:
                  absence: { $ref: '#/components/schemas/TeacherAbsence' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403':
          description: Without `schedule:write`, or SCHEDULE_ABSENCE_OWN (the caller is that teacher).
          headers:
            X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
          content:
            text/plain:
              schema: { type: string }
              example: No puedes cancelar tu propia ausencia; pídeselo a la dirección
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }

  /api/v1/schedule/uncovered:
    get:
      tags: [schedule]
      summary: Classes nobody gives because their teacher is absent ("Clases por cubrir", T19)
      description: >
        Date by date between `from` and `to` (at most 31 days), the classes
        whose teacher — or substitute — is absent and that have no substitute
        nor cancellation for that date. Weekends, dates outside the cycle and
        the school calendar's non-working days have none. Each class carries
        its absence, shaped like everywhere else (`kind`/`note` only for
        `schedule:write`). Requires `schedule:read`.
      operationId: listUncoveredClasses
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cycleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The uncovered classes, by date then start time.
          content:
            application/json:
              schema:
                type: object
                required: [classes]
                properties:
                  classes:
                    type: array
                    items: { $ref: '#/components/schemas/UncoveredClass' }
        '400':
          description: A malformed `cycleId` or date range (more than 31 days).
          content:
            text/plain:
              schema: { type: string }
              example: El rango de fechas es de a lo más un mes
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/schedule:
    get:
      tags: [schedule]
      summary: The calling teacher's own timetable (T16)
      description: >
        The same board as `GET /api/v1/schedule`, narrowed to the classes of
        the teacher linked to the caller's account (active cycle). A caller
        with no teacher record linked gets an empty timetable. Requires
        `teaching:read`; behind `module_schedule`.
      operationId: getOwnSchedule
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The caller's timetable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleBoard' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/schedule/day:
    get:
      tags: [schedule]
      summary: The calling teacher's classes on one date, changes included (T16)
      description: >
        `GET /api/v1/schedule/day` for the active cycle, narrowed to the
        classes the caller gives that day — including the ones they cover as a
        substitute. Requires `teaching:read`; behind `module_schedule`.
      operationId: getOwnScheduleDay
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The caller's classes that day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleDay' }
        '400':
          description: A malformed `date`.
          content:
            text/plain:
              schema: { type: string }
              example: date must be YYYY-MM-DD
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/activities:
    get:
      tags: [activities]
      summary: The school's activities
      description: >
        Every activity with its schedule, price options and how many pupils are
        enrolled today, by name. Inactive ones only when asked. Requires
        `activities:read`.
      operationId: listActivities
      security: [{ sessionCookie: [] }]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The activities.
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [activities]
      summary: Create an activity
      description: >
        A name the school already uses (ignoring case and accents) is 409. The
        schedule needs at least one slot (weekday 1 = Monday … 7 = Sunday,
        `HH:MM`, end after start, no two slots of one day overlapping). At least
        one price option; `daysPerWeek` null is the flat fee (at most one), and
        no two options for the same number of days. The first due date is on or
        after the first billing date and before the next period starts.
        Requires `activities:write`.
      operationId: createActivity
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/activities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [activities]
      summary: One activity
      description: Requires `activities:read`.
      operationId: getActivity
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    put:
      tags: [activities]
      summary: Edit an activity
      description: >
        Replaces the activity's fields and its price options. An option sent
        with its `id` is edited in place (a new price applies to periods billed
        from now on — charges already issued never change); one sent without
        an id is new; one left out is removed, which is 409 while an enrolled
        pupil still uses it. Once anyone has been enrolled, the periodicity and
        the period of the first billing date are fixed (409): changing them
        would re-issue periods already billed. Switching an inactive activity
        back on never bills the periods it was off (the period in course is
        billed when it is switched on by its due date). Same validation as
        create. Requires `activities:write`.
      operationId: updateActivity
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '200':
          description: The activity as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken, or a removed option is still in use.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/activities/{id}/enrollments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [activities]
      summary: Who is enrolled
      description: >
        The pupils enrolled today (no end date, or one in the future), each
        with the price option chosen for them. Requires `activities:read`.
      operationId: listActivityEnrollments
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The enrolments.
          content:
            application/json:
              schema:
                type: object
                required: [enrollments]
                properties:
                  enrollments:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEnrollment' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [activities]
      summary: Enroll pupils
      description: >
        Enrolls up to 200 pupils at once, each with its own price option (the
        screen pre-fills the batch's choice). A pupil already enrolled is left
        as is. The periods already billable are charged at once: the period in
        course is charged when the enrolment starts on or before its due date,
        otherwise billing starts with the next period (no proration). The
        activity must be active. Requires `activities:write`.
      operationId: enrollInActivity
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollments]
              properties:
                startsOn:
                  type: string
                  format: date
                  description: The day the enrolment starts. Empty means today.
                  example: '2026-10-02'
                enrollments:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, optionId]
                    properties:
                      studentId: { type: string, format: uuid }
                      optionId: { type: string, format: uuid }
      responses:
        '200':
          description: The pupils now enrolled by this request, and the charges issued.
          content:
            application/json:
              schema:
                type: object
                required: [enrollments, chargesCreated]
                properties:
                  enrollments:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEnrollment' }
                  chargesCreated: { type: integer, example: 3 }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The activity is inactive.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/activities/{id}/enrollments/end:
    post:
      tags: [activities]
      summary: Unenroll pupils
      description: >
        Ends the enrolment of up to 200 pupils on `endsOn` (default today; the
        first day they are no longer enrolled). No period whose billing date is
        on or after it is charged; charges already
        issued, paid or not, are never touched. A pupil not enrolled is
        ignored. Requires `activities:write`.
      operationId: unenrollFromActivity
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              properties:
                endsOn: { type: string, format: date, example: '2026-10-31' }
                studentIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: How many enrolments ended.
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer, example: 2 }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/activities/{id}/enrollments/{studentId}:
    put:
      tags: [activities]
      summary: Change a pupil's price option
      description: >
        Applies to periods billed from now on; charges already issued keep their
        amount. Requires `activities:write`.
      operationId: changeActivityOption
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string, format: uuid }
      responses:
        '200':
          description: The enrolment as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEnrollment' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/scholarships:
    get:
      tags: [scholarships]
      summary: The school's scholarships
      description: >
        Every scholarship with what it applies to and how many pupils hold it
        today, by name. Inactive ones only when asked. Requires
        `scholarships:read`.
      operationId: listScholarships
      security: [{ sessionCookie: [] }]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The scholarships.
          content:
            application/json:
              schema:
                type: object
                required: [scholarships]
                properties:
                  scholarships:
                    type: array
                    items: { $ref: '#/components/schemas/Scholarship' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [scholarships]
      summary: Create a scholarship
      description: >
        A name the school already uses (ignoring case and accents) is 409.
        `value` is basis points for `percent` (1–10000; 5000 = 50 %), cents
        off for `fixed_off` (≥ 1) and the cents to pay for `fixed_price`
        (≥ 0). At least one target. Requires `scholarships:write`.
      operationId: createScholarship
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScholarshipInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scholarship' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/scholarships/targets:
    get:
      tags: [scholarships]
      summary: What a scholarship can apply to
      description: >
        The inscription, the monthly tuition, the active concepts of the
        catalog the school charges (its own concepts and the plan's fees) and
        the active activities, read from what exists today. Requires
        `scholarships:read`.
      operationId: listScholarshipTargets
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: '#/components/schemas/ScholarshipTarget' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/scholarships/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [scholarships]
      summary: One scholarship
      description: Requires `scholarships:read`.
      operationId: getScholarship
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The scholarship.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scholarship' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    put:
      tags: [scholarships]
      summary: Edit a scholarship
      description: >
        Replaces its fields. Charges still pending take the new terms; charges
        already paid — with money, or settled by the scholarship itself by
        their due date — keep the scholarship they were settled with.
        Deactivating it works like removing every pupil. Same validation as
        create. Requires `scholarships:write`.
      operationId: updateScholarship
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScholarshipInput' }
      responses:
        '200':
          description: The scholarship as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scholarship' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/scholarships/{id}/students:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [scholarships]
      summary: Who holds it
      description: >
        The pupils holding the scholarship today, each with the other
        scholarships they hold that share a target with this one (they do
        not stack: the most favourable applies). Requires `scholarships:read`.
      operationId: listScholarshipStudents
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The holders.
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items: { $ref: '#/components/schemas/ScholarshipHolder' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [scholarships]
      summary: Give it to pupils
      description: >
        Up to 200 pupils at once; one who already holds it is left as is. It
        applies at once to every charge of theirs it targets that is still
        pending (paid ones never change). The scholarship must be active.
        Returns the new holders with their overlaps. Requires
        `scholarships:write`.
      operationId: assignScholarship
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              properties:
                studentIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The pupils who now hold it because of this request.
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items: { $ref: '#/components/schemas/ScholarshipHolder' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The scholarship is inactive.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/scholarships/{id}/students/remove:
    post:
      tags: [scholarships]
      summary: Take it away from pupils
      description: >
        Up to 200 pupils. Their pending charges go back to full price; charges
        already paid, or settled by the scholarship by their due date, keep
        it. A pupil who does not hold it is ignored. Requires
        `scholarships:write`.
      operationId: unassignScholarship
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              properties:
                studentIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: How many pupils no longer hold it.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, example: 2 }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expense-categories:
    get:
      tags: [expenses]
      summary: Expense categories
      description: The school's own list, by name. Requires `expenses:read`.
      operationId: listExpenseCategories
      security: [{ sessionCookie: [] }]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseCategory' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [expenses]
      summary: Add an expense category
      description: Active from the start. A name already used (any case) is a conflict. Requires `expenses:write`.
      operationId: createExpenseCategory
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: Papelería }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategory' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/expense-categories/{id}:
    put:
      tags: [expenses]
      summary: Rename or (de)activate a category
      description: >
        Recorded expenses keep pointing at a category whatever happens to it: it
        is deactivated, never deleted. Requires `expenses:write`.
      operationId: updateExpenseCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, active]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: Mantenimiento }
                active: { type: boolean, example: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategory' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The name is taken.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/expenses:
    get:
      tags: [expenses]
      summary: Expenses of a period
      description: >
        Expenses dated between two days (both inclusive, at most a year),
        newest first, at most 500. Cancelled ones only when asked. Requires
        `expenses:read` and module_expenses (and module_finance).
      operationId: listExpenses
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: Inclusive. }
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: includeCancelled, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: The expenses.
          content:
            application/json:
              schema:
                type: object
                required: [expenses]
                properties:
                  expenses:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      tags: [expenses]
      summary: Record an expense
      description: >
        Money the school paid out, filed under an active category. Who recorded
        it is the signed-in caller. Its history starts with a "created" entry.
        Requires `expenses:write`.
      operationId: createExpense
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expenses/{id}:
    get:
      tags: [expenses]
      summary: An expense and its history
      description: Every change, oldest first, with the expense before and after, who and when. Requires `expenses:read`.
      operationId: getExpense
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The expense.
          content:
            application/json:
              schema:
                type: object
                required: [expense, events]
                properties:
                  expense: { $ref: '#/components/schemas/Expense' }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseEvent' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    put:
      tags: [expenses]
      summary: Edit an expense
      description: >
        Replaces the editable fields; the history keeps the expense as it was.
        A cancelled expense cannot be edited (409). Moving it to a deactivated
        category is refused. Requires `expenses:write`.
      operationId: updateExpense
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ExpenseInput' }
                - type: object
                  properties:
                    reason: { type: string, maxLength: 500, description: Optional — why it was edited., example: Se capturó con otro monto }
      responses:
        '200':
          description: Edited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The expense is cancelled.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/expenses/{id}/cancel:
    post:
      tags: [expenses]
      summary: Cancel an expense
      description: >
        Cancelled is a state, never a deletion: the expense stays, listed and
        counting for nothing. The reason is required. Requires `expenses:write`.
      operationId: cancelExpense
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, example: Capturado dos veces }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: Already cancelled.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/expenses/{id}/receipt:
    get:
      tags: [expenses]
      summary: The expense's receipt (comprobante)
      description: >
        The file's bytes, read from a private bucket and served only after the
        permission check (`expenses:read`). Served with the type its bytes
        proved to be, nosniff, no-store and a sandboxing Content-Security-Policy.
      operationId: getExpenseReceipt
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The receipt.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: No receipt, no such expense, or receipts are not enabled.
          content:
            text/plain:
              schema: { type: string }
    put:
      tags: [expenses]
      summary: Attach or replace the receipt
      description: >
        The raw file as the body: a JPEG, PNG or PDF judged by its bytes (never
        by the Content-Type or a name), at most 5 MB. Replaces any previous
        receipt. Requires `expenses:write`.
      operationId: putExpenseReceipt
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: The expense is cancelled.
          content:
            text/plain:
              schema: { type: string }
        '413':
          description: Larger than 5 MB.
    delete:
      tags: [expenses]
      summary: Remove the receipt
      description: Recorded in the history. Requires `expenses:write`.
      operationId: deleteExpenseReceipt
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expenses/summary:
    get:
      tags: [expenses]
      summary: Income, expenses and balance of a period
      description: >
        Money received (deposits and counter sales, on the day it changed hands)
        and money paid out, by method, and the balance (income − expenses) per
        method and in total. Credit notes are NOT income (ADR 0025): they come
        apart in `creditNoteCents`. Aggregates only — no family is named.
        Requires `expenses:read`.
      operationId: financeSummary
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: Inclusive; at most a year after from. }
      responses:
        '200':
          description: The period's money.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expenses/reports:
    get:
      tags: [expenses]
      summary: The finance report of a day, week, month or year
      description: >
        The period that holds `date` (today when empty, on finance's UTC day):
        a day, its week (Monday–Sunday), its month or its year. The summary by
        method, income by concept, expenses by category and the expenses.
        `/pdf` and `/xlsx` export the same report. Requires `expenses:read`.
      operationId: expensesReport
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportDate'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReport' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expenses/reports/pdf:
    get:
      tags: [expenses]
      summary: The finance report as a PDF
      description: Letter pages, the receipts' engine and faces (ADR 0017). Requires `expenses:read`.
      operationId: expensesReportPdf
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportDate'
      responses:
        '200':
          description: reporte-finanzas-<period>-<from>.pdf
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/expenses/reports/xlsx:
    get:
      tags: [expenses]
      summary: The finance report as an Excel workbook
      description: >
        One sheet per table; money cells are numbers with a currency format,
        text never becomes a formula. Requires `expenses:read`.
      operationId: expensesReportXlsx
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportDate'
      responses:
        '200':
          description: reporte-finanzas-<period>-<from>.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/finance/outbox/drain:
    post:
      tags: [finance-payments]
      summary: Publish the events still waiting
      description: >
        A payment queues its events in the same transaction as the money and
        drains them the moment it commits, so the ordinary case needs nobody and
        an empty queue is the normal answer.


        This exists for what that cannot cover: the broker was down, or the
        process died between the commit and the send. Without it, a family could
        pay and the pupil stay "en trámite" forever — the event that marks them
        inscribed would simply be gone, with nothing able to notice.


        Safe to call repeatedly. The service also sweeps on its own timer.
      operationId: drainFinanceOutbox
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 0
                  description: How many to publish in this pass. Zero uses the service's batch size.
      responses:
        '200':
          description: How many events actually went out. Zero is the ordinary answer.
          content:
            application/json:
              schema:
                type: object
                required: [published]
                properties:
                  published: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/finance/billing-runs:
    post:
      tags: [finance-tuition]
      summary: Generate the month's charges
      description: >
        Issues the tuition whose due date has arrived, the inscription of anybody
        enrolled without one, and one fixed surcharge per completed overdue month.
        IDEMPOTENT — every charge carries a reference unique per school — so this
        may be called by a button and by a scheduler, and calling it twice in a
        day charges nobody twice.
      operationId: runBilling
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId]
              properties:
                cycleId: { type: string, format: uuid }
                asOfDate:
                  type: string
                  format: date
                  description: >
                    The date the run pretends it is, so a school can catch up a
                    cycle it configured late. Empty means today.
      responses:
        '200':
          description: What the run did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }

  /api/v1/teaching/terms:
    get:
      tags: [grades]
      summary: The terms the caller may pick (teacher, legacy term capture)
      description: >
        A term belongs to a cycle AND a level: this lists the terms of each
        (cycle, group level) the caller teaches in the active cycle — never
        another level's. With `assignmentId`, only that assignment's cycle and
        level (404 when the caller does not teach it). A group whose level
        cannot be resolved lists nothing. Behind `module_grades` AND
        `module_config`. Requires `teaching:read`.
      operationId: listTeachingTerms
      security: [{ sessionCookie: [] }]
      parameters:
        - name: assignmentId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The terms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermList' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/terms:
    get:
      tags: [grades]
      summary: The terms of an assignment's cycle and level (director, legacy term capture)
      description: >
        Only the terms the legacy capture accepts for this assignment: its
        cycle's terms of its group's level. Behind `module_grades` AND
        `module_config`. Requires `grades:read`.
      operationId: listGradesTerms
      security: [{ sessionCookie: [] }]
      parameters:
        - name: assignmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The terms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermList' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/grades/period-sheet:
    get:
      tags: [grades]
      summary: The period capture sheet of one of the caller's assignments (teacher)
      description: >
        Same as `GET /api/v1/grades/period-sheet`, limited to an assignment
        the caller teaches in the active cycle (any other id is 404, like an
        unknown one). A pupil who joined the group by transfer shows the
        periods that ended before the move read-only (`rowEditable: false`,
        `rowReadOnlyReason` "Ese periodo corresponde al grupo anterior del
        alumno"): they belong to the previous group. Behind `module_grades`
        AND `module_config`. Requires `teaching:read`.
      operationId: getTeachingPeriodSheet
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/GradesAssignmentId'
        - $ref: '#/components/parameters/GradesPeriodId'
      responses:
        '200':
          description: The sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSheet' }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/teaching/grades/period-grades:
    put:
      tags: [grades]
      summary: Save one period grade (teacher autosave)
      description: >
        Same as `PUT /api/v1/grades/period-grades`, limited to an assignment
        the caller teaches in the active cycle (404 otherwise). A period that
        ended before the pupil joined the group by transfer is 400 "Ese
        periodo corresponde al grupo anterior del alumno" (`X-Error-Code:
        PERIOD_PREVIOUS_GROUP`). Behind `module_grades` AND `module_config`.
        Requires `teaching:write`.
      operationId: putTeachingPeriodGrade
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/PeriodGrade' }
      responses:
        '200': { $ref: '#/components/responses/PeriodGradeSaved' }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }
    delete:
      tags: [grades]
      summary: Empty one period grade (teacher)
      description: >
        Same as `DELETE /api/v1/grades/period-grades`, limited to an
        assignment the caller teaches in the active cycle (404 otherwise); the
        same rules as the PUT. Requires `teaching:write`.
      operationId: deleteTeachingPeriodGrade
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GradesAssignmentId'
        - $ref: '#/components/parameters/GradesPeriodIdRequired'
        - $ref: '#/components/parameters/GradesEnrollmentId'
      responses:
        '204': { description: The cell is empty (also when it already was). }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }

  /api/v1/grades/period-sheet:
    get:
      tags: [grades]
      summary: The period capture sheet of an assignment (director)
      description: >
        One row per active enrollment of the assignment's group, sorted by last
        name (Spanish order), with the grade of the period (`value`/`updatedAt`
        null when empty). `periods` are the evaluation periods of the group's
        GRADE in the assignment's cycle (config, T14), by ordinal; `periodId`
        omitted ⇒ the period containing the school's current local day
        (`today`), else the latest one that already started, else the first.
        A grade with no periods answers `periods: []`, `periodId: null`,
        `editable: false` ("Este grado no tiene periodos de evaluación"). A
        level without numeric grading answers `editable: false` with
        `readOnlyReason`. A period that has not started is read-only for every
        caller ("Aún no empieza ese periodo"; writes `PERIOD_NOT_STARTED`).
        `closedPeriodIds` are the periods whose level term is CLOSED —
        read-only for everyone ("El periodo está cerrado"; writes 409
        `PERIOD_LOCKED`). A period of another grade is 400
        `PERIOD_NOT_IN_GRADE`; an unknown assignment 404. Behind
        `module_grades`. Requires `grades:read`.
      operationId: getPeriodSheet
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/GradesAssignmentId'
        - $ref: '#/components/parameters/GradesPeriodId'
      responses:
        '200':
          description: The sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSheet' }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/period-grades:
    put:
      tags: [grades]
      summary: Save one period grade (director autosave)
      description: >
        Records or corrects one student's grade for a subject and evaluation
        period (one cell). `value` must be a JSON number holding a WHOLE number
        inside the level's range — 9.5 is 400 "Solo se permiten calificaciones
        enteras" (`GRADE_NOT_INTEGER`); a string, null or a missing value is
        400; to empty a cell send DELETE. The caller is recorded as who
        captured it. The director acts for the whole school: the periods a
        transferred pupil spent in a previous group stay writable, but a period
        that has not started is 400 "Aún no empieza ese periodo"
        (`PERIOD_NOT_STARTED`), as for a teacher. Every refusal carries its
        code in `X-Error-Code`. Behind `module_grades`. Requires
        `grades:write`.
      operationId: putPeriodGrade
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/PeriodGrade' }
      responses:
        '200': { $ref: '#/components/responses/PeriodGradeSaved' }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }
    delete:
      tags: [grades]
      summary: Empty one period grade (director)
      description: >
        Removes one cell; emptying an empty cell succeeds. Same rules as the
        PUT (period of the group's grade and already started, enrollment in
        the group, level with numeric grading, term not closed). Behind
        `module_grades`. Requires `grades:write`.
      operationId: deletePeriodGrade
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GradesAssignmentId'
        - $ref: '#/components/parameters/GradesPeriodIdRequired'
        - $ref: '#/components/parameters/GradesEnrollmentId'
      responses:
        '204': { description: The cell is empty (also when it already was). }
        '400': { $ref: '#/components/responses/PeriodGradeRefused' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }

  /api/v1/family/students/{studentId}/grades/periods:
    get:
      tags: [family]
      summary: A child's grades by evaluation period
      description: >
        The child's ACTIVE enrollment, visible as soon as a grade is captured:
        the evaluation periods of the child's grade in the cycle, and one entry
        per subject of the group (sorted by name, Spanish order), each a
        period id → grade object (`{}` when nothing is captured yet). Grades
        are whole numbers, shown as captured; the app computes averages with
        the shared rule (exact mean truncated to 2 decimals). A level without
        numeric grading answers `gradingEnabled: false`, still listing any
        grade captured before it stopped and omitting `scale`. Of two active
        enrollments (re-enrolled for next year) the one whose cycle is active
        is shown — else the one whose cycle contains today. A child that is not
        the caller's, or has no active enrollment, is 404. Behind
        `module_grades` AND `module_students`. Requires `family:read`.
      operationId: getFamilyPeriodGrades
      security: [{ familyBearer: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The child's period grades.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyPeriodGrades' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/periods:
    get:
      tags: [grades]
      summary: The periods (terms) of a cycle with their closure and progress
      description: >
        Every term of the cycle, of every level that grades numerically (a
        term is exactly one level of one cycle — the unit that closes and
        issues report cards; a level with «Lleva calificación numérica» off has
        nothing to capture or close, so its terms are not listed, T10 — unless
        one of them was ever closed: then they stay listed, with `expected` 0,
        so its published report cards stay reachable), whether it
        is `open` or `closed`, how many times it was closed (`version`, 0 =
        never; it is the version of its latest report cards) and its capture
        progress (T15): the term stands for the evaluation period with the
        SAME ordinal in each grade of the level (ADR 0030); `startsOn`/`endsOn`
        span those periods. `expected` = active enrollments of the level's
        groups × the subjects taught in each group, one grade each for its
        grade's period (a pupil who joined the group after that period ended
        is not expected); `captured` = how many of those cells have a grade.
        Withdrawn pupils are not
        expected and get no report card.
        Behind `module_grades`. Requires `grades:read`.
      operationId: listGradePeriods
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cycleId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The cycle's periods.
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/GradePeriod' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/periods/{termId}/progress:
    get:
      tags: [grades]
      summary: What a period still owes before it closes
      description: >
        The period's expected and captured grades (see the periods list) and
        what is missing, grouped by group and subject with the teacher who
        owes it, sorted by group then subject (Spanish order). `unfinished` is
        true while a grade's period of this term has not ended (the school's
        local day): its grades are still expected — closing now reports them
        missing and needs `force` — so the screen warns "Aún no termina el
        periodo". `groupsWithoutPeriod` names the groups (with active pupils)
        whose grade has no evaluation period of the term's ordinal: the term
        cannot close until config gives them one (409
        `PERIOD_NOT_CONFIGURED`). Behind
        `module_grades`. Requires `grades:read`.
      operationId: getGradePeriodProgress
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TermIdPath' }]
      responses:
        '200':
          description: The progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradePeriodProgress' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/periods/{termId}/close:
    post:
      tags: [grades]
      summary: Close a period and issue its report cards (director)
      description: >
        Closes the period and, in the SAME transaction, freezes a report card
        for every ACTIVE enrollment of the level's groups that has at least
        one grade in the term's period of its grade (version = the period's
        close count; withdrawn pupils get none). A pupil with no grade in
        that period (a group without subjects, say) gets no card and no
        notification; `skippedWithoutGrades` counts them (T10). A re-close
        supersedes every card of the previous version; one whose enrollment
        has no grade in the period any more is withdrawn with no replacement
        and no notification, counted by `withdrawnReportCards`. Each card's columns
        are the evaluation periods of the pupil's grade from the first up to
        the one with the term's ordinal, with the grades exactly as captured;
        each subject's `average` is the exact mean of its columns and the
        general average the exact mean of those averages, both truncated to 2
        decimals (ADR 0030). From then on nobody — teacher or director — may
        write a grade of those periods (409 `PERIOD_LOCKED` "El periodo está
        cerrado") until it is reopened. A period whose grades are not all
        captured (an unfinished one included) is 409 `MISSING_GRADES` "Faltan
        N calificaciones por capturar" unless `force: true`; a level whose
        grades (with active pupils) lack an evaluation period of the term's
        ordinal is 409 `PERIOD_NOT_CONFIGURED`; a closed one 409
        `ALREADY_CLOSED`; a level without numeric grades 409
        `LEVEL_NOT_GRADED`. Closing again after a reopen issues version 2, which
        supersedes EVERY version-1 card of the term — a pupil withdrawn in
        between included (families see the latest) — and notifies them
        "Boleta actualizada". Notifications go through a transactional outbox:
        a broker outage delays them, never loses them. An empty body means `force: false`. Behind
        `module_grades`. Requires `grades:close` (owner only).
      operationId: closeGradePeriod
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/TermIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Close even with missing captures.
                  default: false
            example: { force: true }
      responses:
        '200':
          description: The period is closed and its report cards are issued.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, reportCards, skippedWithoutGrades, withdrawnReportCards]
                properties:
                  status: { type: string, enum: [closed] }
                  version: { type: integer, minimum: 1, example: 1 }
                  reportCards:
                    type: integer
                    minimum: 0
                    description: Report cards published by this close.
                    example: 31
                  skippedWithoutGrades:
                    type: integer
                    minimum: 0
                    description: >
                      Active pupils with no grade in the term's period: no
                      report card and no notification (T10).
                    example: 1
                  withdrawnReportCards:
                    type: integer
                    minimum: 0
                    description: >
                      Report cards of the previous version this close withdrew
                      without a replacement: their pupil has no grade in the
                      term's period any more. Zero on a first close.
                    example: 0
              example: { status: closed, version: 1, reportCards: 31, skippedWithoutGrades: 1, withdrawnReportCards: 0 }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }

  /api/v1/grades/periods/{termId}/reopen:
    post:
      tags: [grades]
      summary: Reopen a closed period (director)
      description: >
        Unlocks the period's months so its grades can be corrected. Its report
        cards stay published until the next close supersedes them. An open
        period (or one never closed) is 409 `ALREADY_OPEN`. Behind
        `module_grades`. Requires `grades:close` (owner only).
      operationId: reopenGradePeriod
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/TermIdPath'
      responses:
        '200':
          description: The period is open.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [open] }
              example: { status: open }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PeriodRefused' }

  /api/v1/grades/report-cards:
    get:
      tags: [grades]
      summary: The latest report card of each pupil of a period or group
      description: >
        Only the latest PUBLISHED version of each pupil's report card, sorted by
        pupil name. `termId` or `groupId` is required (both may be given).
        Behind `module_grades`. Requires `grades:read`.
      operationId: listReportCards
      security: [{ sessionCookie: [] }]
      parameters:
        - name: termId
          in: query
          schema: { type: string, format: uuid }
        - name: groupId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The report cards.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [reportCards]
                properties:
                  reportCards:
                    type: array
                    items: { $ref: '#/components/schemas/ReportCardSummary' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/report-cards/{id}:
    get:
      tags: [grades]
      summary: One report card (director)
      description: >
        The frozen snapshot (any version, `status` published or superseded)
        plus the school's details from config. Behind `module_grades`.
        Requires `grades:read`.
      operationId: getReportCard
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ReportCardIdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ReportCardJSON' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/grades/report-cards/{id}/pdf:
    get:
      tags: [grades]
      summary: One report card as a PDF (director)
      description: >
        The school's internal format (not SEP): the school's header, the title
        "Boleta de calificaciones — <periodo>", the pupil, matrícula, cycle,
        level and group, a subject × period table (a card issued before T15:
        subject × month) with each subject's "Promedio", the general average, the passing mark, "Versión N —
        reemplaza a la anterior" when N > 1, and the issue date. Downloaded as
        `boleta-<matrícula>-<periodo>-v<N>.pdf`, `no-store`. Behind
        `module_grades`. Requires `grades:read`.
      operationId: getReportCardPdf
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ReportCardIdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ReportCardPDF' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/report-cards:
    get:
      tags: [family]
      summary: A child's report cards
      description: >
        The latest published report card of each period of the child (a
        superseded version never shows), newest period first: by cycle (newest
        first), then by `termOrdinal` (highest first) — never by issue date,
        which a reopen moves. A child that is not the caller's is 404. Behind
        `module_grades` AND `module_students`. Requires `family:read`.
      operationId: listFamilyReportCards
      security: [{ familyBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/FamilyStudentIdPath' }]
      responses:
        '200':
          description: The child's report cards.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [reportCards]
                properties:
                  reportCards:
                    type: array
                    items: { $ref: '#/components/schemas/FamilyReportCardSummary' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/report-cards/{id}:
    get:
      tags: [family]
      summary: One of a child's report cards
      description: >
        Same body as the director's. 404 when the child is not the caller's,
        the report card belongs to another pupil, or a later version
        superseded it. Behind `module_grades` AND `module_students`. Requires
        `family:read`.
      operationId: getFamilyReportCard
      security: [{ familyBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FamilyStudentIdPath'
        - $ref: '#/components/parameters/ReportCardIdPath'
      responses:
        '200': { $ref: '#/components/responses/ReportCardJSON' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

  /api/v1/family/students/{studentId}/report-cards/{id}/pdf:
    get:
      tags: [family]
      summary: One of a child's report cards as a PDF
      description: >
        Same PDF as the director's, same 404 rules as the JSON. Behind
        `module_grades` AND `module_students`. Requires `family:read`.
      operationId: getFamilyReportCardPdf
      security: [{ familyBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FamilyStudentIdPath'
        - $ref: '#/components/parameters/ReportCardIdPath'
      responses:
        '200': { $ref: '#/components/responses/ReportCardPDF' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gl_session
      description: |
        The web panel's session. Secure, HttpOnly, SameSite=Strict. Because it is
        a cookie, every state-changing call also requires the CSRF header.
    familyBearer:
      type: http
      scheme: bearer
      description: |
        The family app's access token (/api/v1/auth/mobile/*), sent as
        `Authorization: Bearer <token>`. No cookie, so no CSRF header.
  headers:
    XErrorCode:
      description: >
        The refusal's machine code, so a screen can react (mark the cell, lock
        the row) without parsing the sentence. Exposed to the web via CORS.
        Attendance saves (T14): NO_CLASSES (400, a day without classes).
        Period grades (T15): GRADE_NOT_INTEGER, GRADE_OUT_OF_RANGE,
        GRADE_NOT_NUMBER, PERIOD_NOT_IN_GRADE, PERIOD_NOT_STARTED,
        PERIOD_PREVIOUS_GROUP, LEVEL_NOT_GRADED, ENROLLMENT_NOT_IN_GROUP,
        LEVEL_SCALE_NOT_CONFIGURED, and PERIOD_LOCKED (409, a period whose
        level term is closed). MONTH_LOCKED (409) stays on the legacy per-term
        capture POST /api/v1/grades. Level scale change: SCALE_TIGHTENING.
        Period closing (409): MISSING_GRADES, PERIOD_NOT_CONFIGURED,
        ALREADY_CLOSED, ALREADY_OPEN, LEVEL_NOT_GRADED. Evaluation periods
        (config): PERIOD_HAS_GRADES (409, a save or copy would remove a period
        that already holds grades).
        Term months (T7): MONTH_INVALID (400), MONTH_OUTSIDE_CYCLE (400),
        TERM_TOO_LONG (400, more than six months), MONTH_IN_OTHER_TERM (409),
        TERM_CLOSED (409, the term is a closed period). Level deletion (ADR
        0021): LEVEL_BEING_DELETED (409) on ANY write that resolves a level
        whose deletion is running (grades capture, closing or reopening a
        period, attendance lists, enrolling or transferring a pupil, a tuition
        plan, a garment scoped to it, the level's structure in config).
        User deletion (T2): DELETION_PENDING (500, the account is deleted but
        its links or identity-provider account are not yet closed; repeat the
        DELETE). Withdrawn pupil (T14): STUDENT_WITHDRAWN (409, the pupil's
        identity, medical record and photo no longer change; contacts do).
        Absent on a refusal without a code.
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        example: GRADE_DECIMALS
    XScanResult:
      description: An attendance scan's verdict, for the screen's sound and colour.
      schema: { type: string, enum: [ok, invalid, foreign, suspended] }
    NoStore:
      description: A scan names a pupil from a credential; nothing caches it.
      schema: { type: string, const: no-store }
  requestBodies:
    PeriodGrade:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assignmentId, periodId, enrollmentId, value]
            properties:
              assignmentId: { type: string, format: uuid }
              periodId: { type: string, format: uuid, description: An evaluation period of the group's grade in the assignment's cycle. }
              enrollmentId: { type: string, format: uuid }
              value:
                type: integer
                description: >
                  A JSON number (never a string) holding a WHOLE number inside
                  the level's range. Its exact text is judged: 9.5 is refused
                  (GRADE_NOT_INTEGER), never rounded.
          example:
            assignmentId: 9c3d1e2f-0000-4000-8000-000000000003
            periodId: 0e000000-0000-4000-8000-000000000001
            enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
            value: 9
    AttendanceScan:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [date, groupId, code]
            properties:
              date: { type: string, format: date, description: 'The day of the list on screen, ISO `YYYY-MM-DD`. Ownership, mode and enrollments are resolved for this day.' }
              groupId: { type: string, format: uuid }
              subjectId: { type: string, format: uuid, description: The subject of a `per_class` list; omitted for a daily one. }
              code: { type: string, description: 'The scanned QR, `GLCARD:` + 22 base64url characters. Never logged.' }
          example:
            date: '2026-09-15'
            groupId: 7a1c2e3d-0000-4000-8000-000000000001
            code: GLCARD:AQAAAAAAAAAAAAAAAAAAAA
  parameters:
    GradesAssignmentId:
      name: assignmentId
      in: query
      required: true
      description: A teaching assignment (group + subject). Malformed or unknown ⇒ 404.
      schema: { type: string, format: uuid }
    GradesPeriodId:
      name: periodId
      in: query
      required: false
      description: An evaluation period of the group's grade; omitted ⇒ the period of the school's current local day.
      schema: { type: string, format: uuid }
    GradesPeriodIdRequired:
      name: periodId
      in: query
      required: true
      schema: { type: string, format: uuid }
    GradesEnrollmentId:
      name: enrollmentId
      in: query
      required: true
      schema: { type: string, format: uuid }
    AttendanceGroupId:
      name: groupId
      in: query
      required: true
      schema: { type: string, format: uuid }
    AttendanceDate:
      name: date
      in: query
      required: true
      description: The school day, ISO `YYYY-MM-DD`.
      schema: { type: string, format: date }
    AttendanceSubjectId:
      name: subjectId
      in: query
      description: Required for a `per_class` group, refused for a `daily` one.
      schema: { type: string, format: uuid }
    StudentIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FamilyStudentIdPath:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FamilyDepositIdPath:
      name: depositId
      in: path
      required: true
      description: The `depositId` of a payment line of the child's statement.
      schema: { type: string, format: uuid }
    TermIdPath:
      name: termId
      in: path
      required: true
      description: The period (a config term) — a malformed id is 404.
      schema: { type: string, format: uuid }
    ReportCardIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportPeriod:
      name: period
      in: query
      required: true
      schema: { type: string, enum: [daily, weekly, monthly, yearly] }
      description: The span the report covers (a week runs Monday to Sunday).
    ReportDate:
      name: date
      in: query
      required: false
      schema: { type: string, format: date, example: '2026-10-15' }
      description: Any day inside the period; empty is today.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: |
        Required on every state-changing call made with the session cookie. The
        family app's bearer-authenticated calls do not need it.
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    StudentWithdrawn:
      description: >
        The pupil is withdrawn (T14): their identity, medical record and photo
        no longer change. `X-Error-Code: STUDENT_WITHDRAWN`. Contacts stay
        editable, because the remaining debt is still collected.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          example: "ese alumno está dado de baja: su ficha ya no se corrige"
    ScheduleBadRequest:
      description: >
        The timetable refuses the request's shape (T16); the sentence is shown
        as is and the code rides in `X-Error-Code`: SCHEDULE_TIME_INVALID
        (`HH:MM`, 5-minute steps, end after start), SCHEDULE_OUTSIDE_GRID,
        SCHEDULE_WEEKDAY_INVALID (1–5), SCHEDULE_REASON_REQUIRED,
        SCHEDULE_DATE_OUTSIDE_CYCLE, SCHEDULE_DATE_WRONG_WEEKDAY,
        SCHEDULE_SWAP_INVALID, SCHEDULE_SUBSTITUTE_INVALID,
        SCHEDULE_ASSIGNMENT_INVALID (not one of the cycle's teaching
        assignments), SCHEDULE_GRID_INVALID, SCHEDULE_DATE_NON_WORKING (a
        change on a day the school calendar closes), and for absences (T19)
        SCHEDULE_ABSENCE_KIND_INVALID, SCHEDULE_ABSENCE_DATES_INVALID,
        SCHEDULE_ABSENCE_NOTE_TOO_LONG. A malformed body is a plain 400.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          example: La hora va en pasos de 5 minutos
    ScheduleConflict:
      description: >
        The timetable would double-book someone (T16): SCHEDULE_TEACHER_BUSY
        or SCHEDULE_GROUP_BUSY name the conflicting class;
        SCHEDULE_OVERRIDE_CONFLICT names the date whose change it would break;
        SCHEDULE_BLOCK_TAKEN (the class already has a change that date);
        SCHEDULE_BLOCK_HAS_OVERRIDES (move it after removing its future
        changes); SCHEDULE_CHANGED (another editor won a race — reload);
        LEVEL_BEING_DELETED; and (T19) SCHEDULE_TEACHER_ABSENT (the change
        would put an absent teacher in class), SCHEDULE_ABSENCE_OVERLAP,
        SCHEDULE_ABSENCE_CANCELLED.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          example: Ana Ruiz ya da Matemáticas a 3.º A el lunes de 08:00 a 08:50
    PeriodRefused:
      description: >
        The period's state refuses the request; the sentence is shown as is and
        the machine code rides in `X-Error-Code` (MISSING_GRADES,
        PERIOD_NOT_CONFIGURED, ALREADY_CLOSED, ALREADY_OPEN, LEVEL_NOT_GRADED;
        PERIOD_LOCKED on a grade write; TERM_CLOSED on a term-months change).
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          examples:
            missing: { value: Faltan 3 calificaciones por capturar }
            notConfigured: { value: 'El grupo 2° PRIMARIA · A no tiene el periodo 2 configurado' }
            closed: { value: El periodo ya está cerrado }
            open: { value: El periodo ya está abierto }
            locked: { value: El periodo está cerrado }
    ReportCardJSON:
      description: The report card and the school's details.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReportCard' }
    ReceiptPDF:
      description: The payment receipt as a PDF, downloaded as an attachment.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Content-Disposition:
          description: attachment; filename="comprobante-<folio>.pdf"
          schema: { type: string, example: 'attachment; filename="comprobante-P-2026-000042.pdf"' }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    StatementPDF:
      description: The account statement as a letter-size PDF, downloaded as an attachment.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Content-Disposition:
          description: attachment; filename="estado-de-cuenta-<asOf>.pdf"
          schema: { type: string, example: 'attachment; filename="estado-de-cuenta-2026-10-01.pdf"' }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    ReportCardPDF:
      description: The report card as a letter-size PDF, downloaded as an attachment.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Content-Disposition:
          description: attachment; filename="boleta-<matrícula>-<periodo>-v<N>.pdf"
          schema: { type: string, example: 'attachment; filename="boleta-2026-00042-1-er-trimestre-v1.pdf"' }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    PeriodGradeSaved:
      description: The stored cell.
      content:
        application/json:
          schema:
            type: object
            required: [enrollmentId, periodId, value, updatedAt]
            properties:
              enrollmentId: { type: string, format: uuid }
              periodId: { type: string, format: uuid }
              value: { type: integer, example: 9 }
              updatedAt: { type: [string, 'null'], format: date-time }
          example: { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, periodId: 0e000000-0000-4000-8000-000000000001, value: 9, updatedAt: '2026-10-03T15:04:05Z' }
    PeriodGradeRefused:
      description: >
        A sentence for the teacher, shown as is, with its machine code in
        `X-Error-Code`.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          examples:
            integer: { value: Solo se permiten calificaciones enteras }
            range: { value: La calificación debe estar entre 5 y 10 }
            notInGrade: { value: Ese periodo no pertenece al grado del grupo }
            notStarted: { value: Aún no empieza ese periodo }
            level: { value: Este nivel no lleva calificación numérica }
            notNumber: { value: La calificación debe ser un número }
            enrollment: { value: El alumno no está inscrito en este grupo }
            previousGroup: { value: Ese periodo corresponde al grupo anterior del alumno }
            scaleNotConfigured: { value: La escala de calificación del nivel no está configurada }
    AttendanceScanResolved:
      description: >
        The card is not revoked and its pupil is actively enrolled in the group
        on the list's date (whatever the pupil's admission status).
      headers:
        X-Scan-Result: { $ref: '#/components/headers/XScanResult' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttendanceScanResult' }
          example: { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, studentId: 6e1d2c3b-0000-4000-8000-000000000042, name: Ana García }
    AttendanceScanSuspended:
      description: >
        `X-Scan-Result: suspended` — the pupil belongs to the group but the
        office revoked the card. Body "Credencial suspendida".
      headers:
        X-Scan-Result: { $ref: '#/components/headers/XScanResult' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        text/plain:
          schema: { type: string }
          example: Credencial suspendida
    AttendanceScanRefused:
      description: >
        `X-Scan-Result: invalid` — not a card code, or a code no card carried
        (these two read the same); body "Código no válido".
        `X-Scan-Result: foreign` — a real card whose pupil has no active
        enrollment in the group (judged before suspension); body "Este alumno
        no pertenece a este grupo". Distinct on purpose, so the door gets a
        clear warning: it reveals that a code is SOME real card, never whose
        (no name, no id). Card tokens carry 128 random bits, so finding real
        codes by guessing is impractical.
      headers:
        X-Scan-Result: { $ref: '#/components/headers/XScanResult' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        text/plain:
          schema: { type: string }
          examples:
            invalid: { value: Código no válido }
            foreign: { value: Este alumno no pertenece a este grupo }
    AttendanceSaved:
      description: >-
        The list's stored state after the save. Counts describe what THIS list
        stored, never what was submitted: a mark for a pupil whose day·subject
        another group's list already holds (a transferred pupil, on a day before
        the move) is not stored, not counted, and listed in heldElsewhere.
      content:
        application/json:
          schema:
            type: object
            required: [absentCount, markedCount, heldElsewhere]
            properties:
              absentCount: { type: integer, minimum: 0, description: Stored marks that are absences. }
              markedCount: { type: integer, minimum: 0, description: Exceptions the list holds in total. }
              heldElsewhere:
                type: array
                description: >-
                  Enrollment ids (ascending) whose submitted mark was skipped
                  because another group's list holds it. Always present; empty
                  when every mark landed.
                items: { type: string, format: uuid }
          example: { absentCount: 1, markedCount: 2, heldElsewhere: ['3f2504e0-4f89-41d3-9a0c-0305e82c3301'] }
    BadRequest:
      description: The request did not satisfy the contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No session, or it expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but lacking the permission this route needs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        No such row — OR the caller may not see it. The two are deliberately
        indistinguishable: a 403 on someone else's id confirms that it exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PlainTextError:
      description: Human-readable error text returned as text/plain by students enrollment handlers.
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/PlainTextError' }
    LevelBeingDeleted:
      description: |
        The garment's level is being deleted (ADR 0021): X-Error-Code and the
        envelope's code are LEVEL_BEING_DELETED. Retry once the deletion ends.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ModuleDisabled:
      description: |
        `module_uniforms` is off. A disabled module answers 404 because it must be
        invisible, not merely refused — the flag is a security boundary enforced
        by the gateway, not a hint to the UI.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    # The text/plain answers of the gateway's older handlers (see ERRORS at the
    # top): the body is one sentence — the service's own when it gave one, safe
    # to show — or the bare status text.
    PlainLevelBeingDeleted:
      description: |
        The level is being deleted (ADR 0021): X-Error-Code LEVEL_BEING_DELETED.
        Retry once the deletion ends.
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          example: Este nivel se está eliminando
    PagedFinanceBadRequest:
      description: |
        The paged finance reads refuse a malformed page size, or a page token
        longer than 128 characters, at the gateway with the envelope (code
        `invalid`, details.field = pageSize or pageToken). A refusal from
        the finance service (no scoping filter, a page token it did not mint)
        is still the older text/plain sentence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid
              message: pageSize debe ser un entero entre 1 y 500
              details: { field: pageSize }
        text/plain:
          schema: { type: string }
          example: invalid page token
    AttendanceSaveRefused:
      description: >
        The list cannot be saved; the body says why, written for the person.
        With `X-Error-Code: NO_CLASSES` the date has no classes for the group
        (weekend, outside its cycle, or a closed day of the school calendar).
        Without a code: a contract violation (bad date, mark of another group,
        window or mode rule).
      headers:
        X-Error-Code: { $ref: '#/components/headers/XErrorCode' }
      content:
        text/plain:
          schema: { type: string }
          example: Ese día no hay clases.
    PlainBadRequest:
      description: The request did not satisfy the contract; the body says which field.
      content:
        text/plain:
          schema: { type: string }
          example: items[0].groupId must be a group id
    StudentImportFileError:
      description: >
        The file cannot be read: `FILE_NOT_XLSX`, `FILE_EMPTY` or
        `FILE_MISSING_COLUMN` (the body names the column). The code travels in
        the error-code header.
      content:
        text/plain:
          schema: { type: string }
          example: CURP
    StudentImportTooLarge:
      description: "`FILE_TOO_LARGE`: over 2 MB or 1,000 rows."
      content:
        text/plain:
          schema: { type: string }
          example: the file is too large
    PlainUnauthorized:
      description: No session, or it expired.
      content:
        text/plain:
          schema: { type: string }
          example: unauthorized
    PlainForbidden:
      description: Authenticated, but lacking the permission this route needs.
      content:
        text/plain:
          schema: { type: string }
          example: forbidden
    PlainNotFound:
      description: |
        No such row, or the route's module flag is off — a disabled module is
        invisible, so both answer 404.
      content:
        text/plain:
          schema: { type: string }
          example: teaching assignment not found

  schemas:
    StudentImportRequest:
      type: object
      required: [fileBase64]
      properties:
        fileName: { type: string, example: Primaria.xlsx }
        fileBase64: { type: string, format: byte, description: "The .xlsx, base64 (≤ 2 MB decoded)." }
        levels:
          type: object
          description: Where each level of the file goes, keyed by the file's name for it.
          additionalProperties:
            type: object
            properties:
              levelId: { type: string, format: uuid }
              create: { type: boolean }
        capacities:
          type: object
          description: Capacity of each group the import creates, keyed `level|ordinal(2 digits)|group`.
          additionalProperties: { type: integer, minimum: 1 }
          example: { "Primaria|01|A": 30 }
        planHash: { type: string, description: The preview's planHash; required by the commit. }
    StudentImportResult:
      type: object
      required: [cycle, levels, placements, rows, summary, unresolved, planHash]
      properties:
        cycle:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: 2026-2027 }
        levels:
          type: array
          items:
            type: object
            required: [fileName, status, students, noTuition]
            properties:
              fileName: { type: string, example: Preparatoria }
              status: { type: string, enum: [matched, chosen, create, unresolved] }
              levelId: { type: string, format: uuid }
              levelName: { type: string, example: Bachillerato }
              students: { type: integer, example: 30 }
              noTuition: { type: boolean, description: The level has no active tuition table in the cycle — no colegiatura will be billed. }
        placements:
          type: array
          items:
            type: object
            required: [key, level, grade, group, students, capacity, levelCreated, gradeCreated, groupCreated]
            properties:
              key: { type: string, example: "Primaria|01|A" }
              level: { type: string }
              grade: { type: string, example: 1° }
              group: { type: string, example: A }
              students: { type: integer }
              capacity: { type: integer }
              levelCreated: { type: boolean }
              gradeCreated: { type: boolean }
              groupCreated: { type: boolean }
              error: { type: string, enum: [level_not_found, level_being_deleted, invalid_placement] }
        rows:
          type: array
          items:
            type: object
            required: [row, name, curp, destination, status]
            properties:
              row: { type: integer, description: The spreadsheet row (the header is 1). }
              name: { type: string }
              curp: { type: string }
              destination: { type: string, example: Primaria · 3° · A }
              status: { type: string, enum: [new, warning, already, skipped, pending] }
              reason: { type: string, example: status_withdrawn }
              warnings: { type: array, items: { type: string }, example: [bank_reference_invalid] }
              enrollmentNumber: { type: string, example: 2026-00042 }
        summary:
          type: object
          required: [total, new, warnings, already, skipped, pending]
          properties:
            total: { type: integer }
            new: { type: integer }
            warnings: { type: integer, description: A subset of new. }
            already: { type: integer }
            skipped: { type: integer }
            pending: { type: integer }
        unresolved: { type: array, items: { type: string }, example: [Preparatoria] }
        planHash: { type: string }
        batchId: { type: string, format: uuid, description: Set by the commit. }
    ScheduleBoard:
      type: object
      description: The base timetable of a cycle and the catalog to draw it (T16).
      required: [cycle, cycles, started, settings, levels, grades, groups, subjects, teachers, assignments, blocks]
      properties:
        cycle: { $ref: '#/components/schemas/ScheduleCycle' }
        cycles:
          type: array
          description: Every cycle, for the cycle picker.
          items: { $ref: '#/components/schemas/ScheduleCycle' }
        started:
          type: boolean
          description: The cycle's first day has arrived (school time zone); base edits now need a reason and are recorded.
        settings:
          type: array
          description: One grid per level (the default 07:00–15:00 when the level has none saved).
          items: { $ref: '#/components/schemas/ScheduleSettings' }
        levels:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, example: Primaria }
        grades:
          type: array
          items:
            type: object
            required: [id, levelId, name, ordinal]
            properties:
              id: { type: string, format: uuid }
              levelId: { type: string, format: uuid }
              name: { type: string, example: 3.º }
              ordinal: { type: integer, example: 3 }
        groups:
          type: array
          items:
            type: object
            required: [id, gradeLevelId, name]
            properties:
              id: { type: string, format: uuid }
              gradeLevelId: { type: string, format: uuid }
              name: { type: string, example: A }
        subjects:
          type: array
          items:
            type: object
            required: [id, gradeLevelId, name]
            properties:
              id: { type: string, format: uuid }
              gradeLevelId: { type: string, format: uuid }
              name: { type: string, example: Matemáticas }
        teachers:
          type: array
          items:
            type: object
            required: [id, firstName, lastName]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string, example: Ana }
              lastName: { type: string, example: Ruiz }
        assignments:
          type: array
          description: The cycle's teaching assignments — the only things a class can be built from.
          items:
            type: object
            required: [id, groupId, subjectId, teacherId]
            properties:
              id: { type: string, format: uuid }
              groupId: { type: string, format: uuid }
              subjectId: { type: string, format: uuid }
              teacherId: { type: string, format: uuid }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ScheduleBlock' }
    ScheduleCycle:
      type: object
      required: [id, name, startsOn, endsOn, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 2026-2027 }
        startsOn: { type: string, format: date, example: '2026-08-24' }
        endsOn: { type: string, format: date, example: '2027-07-09' }
        active: { type: boolean }
    ScheduleSettings:
      type: object
      required: [levelId, gridStart, gridEnd]
      properties:
        levelId: { type: string, format: uuid }
        gridStart: { type: string, example: '07:00' }
        gridEnd: { type: string, example: '15:00' }
    ScheduleBlock:
      type: object
      description: One class of the base timetable — a teaching assignment on a weekday and time.
      required: [id, cycleId, assignmentId, groupId, subjectId, teacherId, weekday, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        weekday: { type: integer, minimum: 1, maximum: 5, description: '1 = Monday … 5 = Friday.' }
        startsAt: { type: string, example: '08:00' }
        endsAt: { type: string, example: '08:50', description: Exclusive — a class ending at 08:50 and one starting at 08:50 do not collide. }
    ScheduleBlockInput:
      type: object
      required: [assignmentId, weekday, startsAt, endsAt]
      properties:
        assignmentId: { type: string, format: uuid }
        weekday: { type: integer, minimum: 1, maximum: 5 }
        startsAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:00' }
        endsAt: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$', example: '08:50' }
        reason:
          type: string
          maxLength: 200
          description: >
            Required to change a class (PUT) once the cycle has started;
            optional when adding one.
    ScheduleDay:
      type: object
      required: [date, weekday, nonWorking, classes]
      properties:
        date: { type: string, format: date }
        weekday: { type: integer, minimum: 1, maximum: 7, description: '1 = Monday … 7 = Sunday (6 and 7 have no classes).' }
        nonWorking: { type: [string, 'null'], description: 'The school-calendar period closing the date (a closed date has no classes); null on a school day.', example: Independencia }
        classes:
          type: array
          description: By start time, then group.
          items: { $ref: '#/components/schemas/ScheduleClass' }
    ScheduleClass:
      type: object
      description: A class as it happens on a date.
      required: [blockId, groupId, subjectId, teacherId, startsAt, endsAt, status, baseTeacherId, baseStartsAt, baseEndsAt, overrideId, reason, absence]
      properties:
        blockId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid, description: Who gives it that day. }
        startsAt: { type: string, example: '09:00' }
        endsAt: { type: string, example: '09:50' }
        status: { type: string, enum: [regular, substitute, swapped, cancelled, uncovered], description: 'uncovered: its teacher is absent and nobody covers it yet ("Sin cubrir", T19).' }
        baseTeacherId: { type: string, format: uuid }
        baseStartsAt: { type: string, example: '08:00' }
        baseEndsAt: { type: string, example: '08:50' }
        overrideId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        absence:
          description: Set when `status` is `uncovered`.
          oneOf:
            - { $ref: '#/components/schemas/TeacherAbsence' }
            - { type: 'null' }
    ScheduleOverrideInput:
      type: object
      required: [blockId, date, kind, reason]
      properties:
        blockId: { type: string, format: uuid }
        date: { type: string, format: date }
        kind: { type: string, enum: [substitute, swap, cancel] }
        teacherId: { type: string, format: uuid, description: The substitute (kind substitute). }
        swapBlockId: { type: string, format: uuid, description: The other class of the same group (kind swap). }
        reason: { type: string, minLength: 1, maxLength: 200 }
        replaceOverrideId:
          type: string
          format: uuid
          description: >
            T19 — a substitute or cancellation of the SAME class that date to
            replace in the same step (the substitute is now absent). A swap is
            never replaced (409 SCHEDULE_BLOCK_TAKEN: undo it first).
    ScheduleOverride:
      type: object
      required: [id, cycleId, blockId, date, kind, teacherId, swapBlockId, reason, createdBy, createdByName, createdAt]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        date: { type: string, format: date }
        kind: { type: string, enum: [substitute, swap, cancel] }
        teacherId: { type: [string, 'null'], format: uuid }
        swapBlockId: { type: [string, 'null'], format: uuid }
        reason: { type: string }
        createdBy: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
    ScheduleAvailableTeacher:
      type: object
      required: [teacherId, firstName, lastName, match]
      properties:
        teacherId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        match: { type: string, enum: [subject, grade, other], description: Teaches that subject / teaches in that grade / anybody free. }
    ScheduleEvent:
      type: object
      required: [id, at, actorId, actorName, action, blockId, overrideId, absenceId, date, reason, summary]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string, enum: [block_created, block_updated, block_deleted, override_created, override_deleted, absence_created, absence_updated, absence_cancelled] }
        blockId: { type: [string, 'null'], format: uuid }
        overrideId: { type: [string, 'null'], format: uuid }
        absenceId: { type: [string, 'null'], format: uuid }
        date: { type: [string, 'null'], format: date, description: "The date a change applies to (overrides), or an absence's first date." }
        reason: { type: string }
        summary: { type: string, example: 'Suplencia el 2026-10-05: Música, 3.º A, lunes 08:00–08:50 — Luis Pérez en lugar de Ana Ruiz' }
    TeacherAbsenceInput:
      type: object
      required: [teacherId, kind, startsOn, endsOn, allDay]
      properties:
        cycleId: { type: string, format: uuid, description: Omitted — the cycle whose dates contain `startsOn`. }
        teacherId: { type: string, format: uuid }
        kind: { type: string, enum: [sick, vacation, personal, other] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, description: Inclusive. }
        allDay: { type: boolean }
        startsAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:00', description: Required unless `allDay`. }
        endsAt: { type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$', example: '10:00', description: Required unless `allDay`; exclusive. }
        note: { type: string, maxLength: 500 }
    TeacherAbsence:
      type: object
      description: >
        A teacher away on `startsOn`..`endsOn`, all day or between `startsAt`
        and `endsAt` of each date. `kind`, `note`, `createdByName`,
        `createdAt` and `cancelledByName` are present ONLY for callers holding
        `schedule:write`.
      required: [id, cycleId, teacherId, startsOn, endsOn, allDay, startsAt, endsAt, cancelled]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        allDay: { type: boolean }
        startsAt: { type: [string, 'null'], example: '08:00' }
        endsAt: { type: [string, 'null'], example: '10:00' }
        cancelled: { type: boolean }
        kind: { type: string, enum: [sick, vacation, personal, other] }
        note: { type: string }
        createdByName: { type: string, example: Directora Ruiz }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        cancelledByName: { type: string }
    TeacherAbsenceSaved:
      type: object
      required: [absence, uncoveredCount]
      properties:
        absence: { $ref: '#/components/schemas/TeacherAbsence' }
        uncoveredCount: { type: integer, minimum: 0, description: Classes left uncovered on its school days ("Quedan N clases sin cubrir"). }
    UncoveredClass:
      type: object
      required: [date, class]
      properties:
        date: { type: string, format: date }
        class: { $ref: '#/components/schemas/ScheduleClass' }
    GradePeriod:
      type: object
      required: [termId, termName, ordinal, levelId, levelName, startsOn, endsOn, status, version, progress]
      properties:
        termId: { type: string, format: uuid }
        termName: { type: string, example: 1.er trimestre }
        ordinal: { type: integer, example: 1 }
        levelId: { type: string, format: uuid }
        levelName: { type: string, example: Primaria }
        startsOn:
          type: [string, 'null']
          format: date
          description: The earliest start of the term's evaluation periods across the level's grades; null when no grade has one.
        endsOn:
          type: [string, 'null']
          format: date
          description: The latest end of those periods; null when no grade has one.
        status: { type: string, enum: [open, closed] }
        closedAt:
          type: string
          format: date-time
          description: When it was last closed; absent when never closed.
        closedByName:
          type: string
          description: Who last closed it; absent when never closed.
          example: Directora Ruiz
        version:
          type: integer
          minimum: 0
          description: How many times it was closed (the version of its latest report cards).
        progress:
          type: object
          required: [captured, expected]
          properties:
            captured: { type: integer, example: 270 }
            expected: { type: integer, example: 288 }
      example:
        termId: 7a000000-0000-4000-8000-000000000001
        termName: 1.er trimestre
        ordinal: 1
        levelId: 1a000000-0000-4000-8000-000000000001
        levelName: Primaria
        startsOn: '2026-08-24'
        endsOn: '2026-11-30'
        status: closed
        closedAt: '2026-12-01T16:00:00Z'
        closedByName: Directora Ruiz
        version: 1
        progress: { captured: 288, expected: 288 }
    GradePeriodProgress:
      type: object
      required: [termId, unfinished, endsOn, groupsWithoutPeriod, expected, captured, missing, reportCards, skippedWithoutGrades, withdrawnReportCards]
      properties:
        termId: { type: string, format: uuid }
        reportCards:
          type: integer
          minimum: 0
          description: Report cards closing now would publish (T10), so the close dialog can say it beforehand.
          example: 30
        skippedWithoutGrades:
          type: integer
          minimum: 0
          description: Active pupils who would get no report card (and no notification) because they have no grade in the term's period.
          example: 1
        withdrawnReportCards:
          type: integer
          minimum: 0
          description: Report cards already published for the term that closing now would withdraw without a replacement, because their pupil has no grade in the term's period any more.
          example: 0
        unfinished:
          type: boolean
          description: >
            True while a grade's period of this term has not ended (the
            school's local day): its grades are still expected ("Aún no termina
            el periodo").
        endsOn:
          type: [string, 'null']
          format: date
          description: The latest end of the term's periods across the level's grades; null when none.
        groupsWithoutPeriod:
          type: array
          description: >
            Groups with active pupils whose grade has no evaluation period of
            the term's ordinal; closing is refused (PERIOD_NOT_CONFIGURED)
            while any is listed. [] when none.
          items: { type: string, example: 2° PRIMARIA · A }
        expected: { type: integer, example: 288 }
        captured: { type: integer, example: 270 }
        missing:
          type: array
          items:
            type: object
            required: [groupId, groupLabel, subjectId, subjectName, teacherName, missingCount]
            properties:
              groupId: { type: string, format: uuid }
              groupLabel: { type: string, example: 1° PRIMARIA · A }
              subjectId: { type: string, format: uuid }
              subjectName: { type: string, example: Matemáticas }
              teacherName: { type: string, example: Gabriela Rojas }
              missingCount: { type: integer, minimum: 1, example: 18 }
      example:
        termId: 7a000000-0000-4000-8000-000000000001
        unfinished: true
        endsOn: '2026-11-30'
        groupsWithoutPeriod: []
        expected: 288
        captured: 270
        reportCards: 30
        skippedWithoutGrades: 1
        withdrawnReportCards: 0
        missing:
          - { groupId: 4a000000-0000-4000-8000-000000000001, groupLabel: 1° PRIMARIA · A, subjectId: 5a000000-0000-4000-8000-000000000001, subjectName: Matemáticas, teacherName: Gabriela Rojas, missingCount: 18 }
    ReportCardSummary:
      type: object
      required: [id, termId, termName, studentId, studentName, groupId, groupLabel, version, issuedAt, generalAverage, hasGrades]
      properties:
        id: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        termName: { type: string, example: 1.er trimestre }
        studentId: { type: string, format: uuid }
        studentName: { type: string, example: Ana López }
        groupId: { type: string, format: uuid }
        groupLabel: { type: string, example: 1° PRIMARIA · A }
        version: { type: integer, minimum: 1, example: 1 }
        issuedAt: { type: [string, 'null'], format: date-time }
        generalAverage:
          type: [number, 'null']
          description: The exact mean truncated to 2 decimals (T15; a card issued before keeps its one decimal); null when no subject has a grade.
          example: 8.66
        hasGrades:
          type: boolean
          description: False when no subject has a grade in the term (only cards issued before T10, since a close now skips a pupil without a grade in the term's period); consumers show "Sin calificaciones capturadas en este periodo" instead of a table.
          example: true
    FamilyReportCardSummary:
      type: object
      required: [id, termId, termName, termOrdinal, cycleName, version, issuedAt, generalAverage, hasGrades]
      properties:
        id: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        termName: { type: string, example: 1.er trimestre }
        termOrdinal:
          type: integer
          minimum: 0
          description: The term's order in its cycle, frozen when the card was issued (1 = first). 0 = issued before the order was recorded; it sorts below the numbered terms of its cycle.
          example: 1
        cycleName: { type: string, description: The cycle's name as it read at issue., example: 2026-2027 }
        version: { type: integer, minimum: 1, example: 2 }
        issuedAt: { type: [string, 'null'], format: date-time }
        generalAverage: { type: [number, 'null'], example: 8.5 }
        hasGrades:
          type: boolean
          description: False when no subject has a grade in the term (only cards issued before T10, since a close now skips a pupil without a grade in the term's period); consumers show "Sin calificaciones capturadas en este periodo" instead of a table.
          example: true
    ReportCard:
      type: object
      description: >
        The frozen snapshot issued when the period closed: names as they read
        then, the card's columns, each subject's grade per column (exact, as
        captured) and its `average` — the exact mean of its grades, truncated
        to 2 decimals — and the general average (the exact mean of the
        subjects' exact averages, truncated to 2 decimals). Since T15 the
        columns are `periods`: the evaluation periods of the pupil's grade from
        the first up to the one closed, and each line's grades are `periods`
        (period id → grade). A card issued before T15 keeps its month columns
        (`months`, line `months`; `periods` is []) and its one-decimal,
        half-up averages, exactly as issued. A column without a grade is
        absent from the line; `average` is null for a subject without grades.
      required: [id, termId, termName, termOrdinal, cycleName, levelName, groupId, groupLabel, studentId, studentName, enrollmentNumber, version, status, issuedAt, periods, months, scale, generalAverage, hasGrades, lines, school]
      properties:
        id: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        termName: { type: string, example: 1.er trimestre }
        termOrdinal: { type: integer, minimum: 0, description: See FamilyReportCardSummary.termOrdinal., example: 1 }
        cycleName: { type: string, example: 2026-2027 }
        levelName: { type: string, example: Primaria }
        groupId: { type: string, format: uuid }
        groupLabel: { type: string, example: 1° PRIMARIA · A }
        studentId: { type: string, format: uuid }
        studentName: { type: string, example: Ana López }
        enrollmentNumber: { type: string, example: 2026-00042 }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [published, superseded] }
        issuedAt: { type: [string, 'null'], format: date-time }
        periods:
          type: array
          description: The card's columns (T15), by ordinal; [] on a card issued before T15.
          items:
            type: object
            required: [id, ordinal, name]
            properties:
              id: { type: string, format: uuid }
              ordinal: { type: integer, minimum: 1, example: 1 }
              name: { type: string, example: 1.er trimestre }
        months:
          type: array
          description: The columns of a card issued before T15 (monthly capture); [] since T15.
          items: { type: string, example: '2026-09' }
        scale: { $ref: '#/components/schemas/GradingScale' }
        generalAverage: { type: [number, 'null'], example: 8.66 }
        hasGrades:
          type: boolean
          description: False when no subject has a grade in the term (only cards issued before T10, since a close now skips a pupil without a grade in the term's period); consumers show "Sin calificaciones capturadas en este periodo" instead of a table.
          example: true
        lines:
          type: array
          items:
            type: object
            required: [subjectId, subjectName, position, periods, months, average]
            properties:
              subjectId: { type: string, format: uuid }
              subjectName: { type: string, example: Matemáticas }
              position: { type: integer, minimum: 1 }
              periods:
                type: object
                description: Period id → the captured grade (T15); {} on a card issued before T15.
                additionalProperties: { type: number }
                example: { 0e000000-0000-4000-8000-000000000001: 9, 0e000000-0000-4000-8000-000000000002: 8 }
              months:
                type: object
                description: '"YYYY-MM" → the captured grade, on a card issued before T15; {} since T15.'
                additionalProperties: { type: number }
                example: {}
              average: { type: [number, 'null'], example: 8.5 }
        school:
          type: object
          required: [name, legalName, rfc, cct, address, phone, legend]
          properties:
            name: { type: string }
            legalName: { type: string }
            rfc: { type: string }
            cct: { type: string }
            address: { type: string }
            phone: { type: string }
            legend: { type: string }
      example:
        id: 7c000000-0000-4000-8000-000000000001
        termId: 7a000000-0000-4000-8000-000000000001
        termName: 1.er trimestre
        termOrdinal: 1
        cycleName: 2026-2027
        levelName: Primaria
        groupId: 4a000000-0000-4000-8000-000000000001
        groupLabel: 1° PRIMARIA · A
        studentId: 57000000-0000-4000-8000-000000000001
        studentName: Ana López
        enrollmentNumber: 2026-00042
        version: 1
        status: published
        issuedAt: '2026-12-01T16:00:00Z'
        periods:
          - { id: 0e000000-0000-4000-8000-000000000001, ordinal: 1, name: 1.er trimestre }
          - { id: 0e000000-0000-4000-8000-000000000002, ordinal: 2, name: 2.º trimestre }
        months: []
        scale: { min: 5, max: 10, decimals: 1, passing: 6 }
        generalAverage: 8.75
        hasGrades: true
        lines:
          - { subjectId: 5a000000-0000-4000-8000-000000000002, subjectName: Español, position: 1, periods: { 0e000000-0000-4000-8000-000000000001: 9, 0e000000-0000-4000-8000-000000000002: 8 }, months: {}, average: 8.5 }
          - { subjectId: 5a000000-0000-4000-8000-000000000001, subjectName: Matemáticas, position: 2, periods: { 0e000000-0000-4000-8000-000000000001: 9, 0e000000-0000-4000-8000-000000000002: 9 }, months: {}, average: 9 }
        school: { name: COLEGIO GARCÍA LORCA, legalName: '', rfc: '', cct: 09PPR0001A, address: '', phone: '', legend: '' }
    ExpoPushToken:
      type: string
      pattern: '^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]{1,200}\]$'
      example: 'ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]'
    FamilyDeviceRequest:
      type: object
      additionalProperties: false
      required: [token, platform]
      properties:
        token: { $ref: '#/components/schemas/ExpoPushToken' }
        platform: { type: string, enum: [ios, android] }
      example: { token: 'ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]', platform: ios }
    FamilyDayStatus:
      type: string
      description: >
        The day's status over every list taken that day. With no absent list:
        `late` if any list is late, else `excused` if any is excused, else
        `present` (present+late → late, late+excused → late, present+excused →
        excused). Absent in some lists but not all → `partial`. Absent in every
        list taken → `absent`. `not_taken` is today before any list was taken.
      enum: [present, absent, late, excused, partial, not_taken]
    FamilyAttendanceClass:
      type: object
      required: [subjectName, status]
      properties:
        subjectName: { type: string, example: Matemáticas }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: string }
    FamilyAttendanceDay:
      type: object
      required: [date, status, mode, classes]
      properties:
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/FamilyDayStatus' }
        mode: { $ref: '#/components/schemas/AttendanceMode' }
        note: { type: string, description: The daily list's justification. }
        classes:
          type: array
          description: Per-class days only (empty for a daily day).
          items: { $ref: '#/components/schemas/FamilyAttendanceClass' }
    FamilyAttendanceMonth:
      type: object
      required: [month, today, days, summary]
      properties:
        month: { type: string, example: '2026-09' }
        today: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/FamilyAttendanceDay' }
        summary:
          type: object
          description: Days per status (not_taken is not counted).
          required: [present, absent, late, excused, partial]
          properties:
            present: { type: integer, minimum: 0 }
            absent: { type: integer, minimum: 0 }
            late: { type: integer, minimum: 0 }
            excused: { type: integer, minimum: 0 }
            partial: { type: integer, minimum: 0 }
      example:
        month: '2026-09'
        today: '2026-09-17'
        days:
          - { date: '2026-09-17', status: not_taken, mode: per_class, classes: [] }
          - date: '2026-09-16'
            status: partial
            mode: per_class
            classes:
              - { subjectName: Español, status: present }
              - { subjectName: Matemáticas, status: absent, note: cita médica }
        summary: { present: 0, absent: 0, late: 0, excused: 0, partial: 1 }
    AttendanceScanResult:
      type: object
      description: The list row a scanned card resolved to.
      required: [enrollmentId, studentId, name]
      properties:
        enrollmentId: { type: string, format: uuid, description: The row to mark (the pupil's active enrollment in the group). }
        studentId: { type: string, format: uuid }
        name: { type: string, description: '"First Last".' }
    FinanceCharge:
      type: object
      description: >
        One debt of one pupil. Every amount is integer cents; paidCents,
        remainingCents, scholarshipCents and status are derived server-side.
      required: [id, studentId, cycleId, conceptId, description, amountCents, discountCents, dueDate, status, paidCents, remainingCents, scholarshipCents]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        cycleId: { type: string, description: Empty for a sale to a pupil not yet placed in a group. }
        conceptId: { type: string, format: uuid }
        description: { type: string }
        amountCents: { type: integer, format: int64 }
        discountCents: { type: integer, format: int64 }
        dueDate: { type: string, format: date }
        startsOn: { type: string, format: date, description: First day the charge opens to the family; absent when open from issue. }
        status: { type: string, enum: [pending, partially_paid, paid, cancelled] }
        paidCents: { type: integer, format: int64 }
        remainingCents: { type: integer, format: int64 }
        scholarshipCents: { type: integer, format: int64 }
    TuitionPlan:
      type: object
      description: What one level costs in one school year. Every amount is integer cents.
      required: [id, cycleId, levelId, enrollmentCents, monthlyCents, months, firstBilledMonth, dueDay, lateFeeCents, active]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        levelId: { type: string, format: uuid }
        enrollmentCents: { type: integer, format: int64, minimum: 0, example: 500000 }
        monthlyCents: { type: integer, format: int64, minimum: 0, example: 320000 }
        months:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
          description: How many monthly payments the year has.
        firstBilledMonth:
          type: integer
          minimum: 1
          maximum: 12
          example: 9
          description: Calendar month of the first payment. Ten from September is the common shape.
        dueDay:
          type: integer
          minimum: 1
          maximum: 28
          example: 10
          description: >
            Day of the month a payment falls due. Capped at 28 so it exists in
            February too — a limit on the 31st would be moved by the calendar,
            silently, one month a year.
        lateFeeCents:
          type: integer
          format: int64
          minimum: 0
          example: 15000
          description: Fixed surcharge added once per completed overdue month. Zero disables it.
        active: { type: boolean }
        policy: { $ref: '#/components/schemas/CollectionPolicy' }
        schedule:
          type: array
          description: >
            An explicit payment plan, replacing the uniform monthly amount.
            Empty means the year is divided into equal parts, which is what most
            schools do.
          items: { $ref: '#/components/schemas/Installment' }
        monthlyDiscountCents:
          type: integer
          format: int64
          minimum: 0
          example: 50000
          description: A fixed amount off every month of this level.
        fees:
          type: array
          description: >
            The extras collected on top of the tuition, each split across the
            months the school chose. Empty is the ordinary state.
          items: { $ref: '#/components/schemas/Fee' }
        enrollmentDueOn:
          type: string
          format: date
          example: "2026-06-30"
          description: >
            The deadline the school set for the inscription. Empty keeps the
            default rule — the due day in the cycle's first month — so a plan
            written before this field existed goes on meaning what it meant.
        enrollmentStartsOn:
          type: string
          format: date
          example: "2026-06-01"
          description: >
            The first day the inscription opens to families (T5). Before it the
            charge is not shown in the parents' app nor asked for at the
            counter. Empty keeps it open from the day it is issued. Requires
            enrollmentDueOn and may not come after it (400 otherwise). Changing
            either date moves the inscriptions still owing — untouched or part
            paid — at once; settled ones are never touched.

    Contact:
      type: object
      description: >
        Somebody the school can reach about a pupil. A contact WITH an account
        is a family that can open the app; one without is a phone number the
        office calls. Both are contacts, and there is one list.
      required: [id, studentId, relationship, hasAccount]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        guardianUserId:
          type: string
          description: Empty when the contact has no account.
        relationship: { type: string, enum: [mother, father, guardian, other] }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string }
        hasAccount:
          type: boolean
          description: Whether this contact can open the family app.
        isEmergency:
          type: boolean
          description: Whom the school calls first when something happens.

    StudentProfile:
      type: object
      description: >
        The part of a pupil's file the office keeps by hand. Every field is
        optional; what is filled must be well formed.
      required: [birthDate, sex, email, phones, address]
      properties:
        birthDate: { type: string, pattern: '^$|^\d{4}-\d{2}-\d{2}$', example: "2019-03-12", description: Not in the future. Empty when not captured. }
        sex: { type: string, enum: ['', F, M, X], example: F }
        email: { type: string, example: "ada@correo.mx", description: Stored trimmed and lowercase. }
        phones:
          type: array
          maxItems: 3
          items:
            type: object
            required: [kind, number]
            properties:
              kind: { type: string, enum: [celular, casa, trabajo, otro] }
              number: { type: string, pattern: '^[0-9]{10}$', example: "5512345678" }
        address:
          type: object
          required: [street, extNumber, intNumber, neighborhood, postalCode, municipality, state]
          properties:
            street: { type: string, maxLength: 120, example: "Av. Juárez" }
            extNumber: { type: string, maxLength: 120, example: "123" }
            intNumber: { type: string, maxLength: 120, example: "4B" }
            neighborhood: { type: string, maxLength: 120, example: "Centro" }
            postalCode: { type: string, pattern: '^$|^[0-9]{5}$', example: "44100" }
            municipality: { type: string, maxLength: 120, example: "Guadalajara" }
            state: { type: string, example: "Jalisco", description: "One of the 32 federal entities, or empty." }

    BirthdayTemplate:
      type: object
      required: [title, body, isDefault, updatedAt]
      properties:
        title: { type: string, example: "¡Feliz cumpleaños, {nombre}!" }
        body: { type: string, example: "Toda la comunidad del Colegio García Lorca le desea a {nombre} un muy feliz cumpleaños." }
        isDefault:
          type: boolean
          description: True while the school has not saved its own text.
        updatedAt:
          type: string
          description: RFC3339 instant of the last save; empty while isDefault.
          example: "2026-10-01T13:00:00Z"
    StudentWithProfile:
      type: object
      required: [id, curp, firstName, lastName, level, levelId, gradeGroup, guardianName, admissionStatus, profile]
      properties:
        id: { type: string, format: uuid }
        curp: { type: string }
        firstName: { type: string }
        lastName: { type: string, description: "Paternal surname. A pupil captured before maternalLastName existed may hold both surnames here." }
        maternalLastName: { type: string, description: "Maternal surname; empty when not captured. Display order is lastName maternalLastName firstName." }
        level: { type: string, example: "Primaria" }
        levelId: { $ref: '#/components/schemas/LevelId' }
        gradeGroup: { type: string, example: "4° A" }
        guardianName: { type: string }
        admissionStatus: { type: string, enum: [pending, accepted, enrolled, rejected, withdrawn] }
        bankReference: { type: string, example: "231076", description: "BBVA payment reference (ADR 0033); empty when the pupil has none." }
        hasPhoto: { type: boolean, example: false, description: "Only on GET /api/v1/students/{id}: whether the pupil has a photo (T13). Absent means unknown; a client then asks for the photo." }
        profile: { $ref: '#/components/schemas/StudentProfile' }

    Enrollment:
      type: object
      required: [id, studentId, cycleId, status]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        status: { type: string, enum: [active, transferred, withdrawn] }
        withdrawnOn:
          description: Omitted or null until the enrollment is withdrawn.
          oneOf:
            - { type: string, format: date, example: "2026-10-15" }
            - { type: 'null' }
        withdrawalReason:
          description: Omitted or null when no reason was recorded.
          oneOf:
            - { type: string, maxLength: 500, example: "La familia se muda de ciudad." }
            - { type: 'null' }

    MedicalRecord:
      type: object
      required: [bloodType, allergies, conditions]
      properties:
        bloodType: { type: string, enum: ['', A+, A-, B+, B-, AB+, AB-, O+, O-], example: "O+" }
        allergies: { type: string, maxLength: 2000, example: "Penicilina" }
        conditions: { type: string, maxLength: 2000, example: "Asma leve" }

    StudentNote:
      type: object
      required: [id, studentId, body, authorUserId, authorName, createdAt, voided]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        body: { type: string, example: "Llegó con fiebre; se avisó a la mamá." }
        authorUserId: { type: string, format: uuid }
        authorName: { type: string, example: "Gabriela Rojas", description: "The author's name as it read when the note was written." }
        createdAt: { type: string, format: date-time }
        voided: { type: boolean }
        voidedAt: { type: string, format: date-time, description: "Present only on a voided note." }
        updatedAt: { type: string, format: date-time, description: "Present only on an edited note: when it was last edited." }
        updatedByName: { type: string, example: "Gabriela Rojas", description: "Present only on an edited note: who last edited it, as their name read then." }

    Invitation:
      type: object
      description: >
        An access link that has been minted for somebody who has not walked
        through the door yet.


        `sent` and `sendError` exist so a director is never told "invitación
        enviada" about a message that was dropped. `url` is the fallback for
        handing access over by hand; it grants nothing the administrator does not
        already hold over that account.
      required: [url, expiresAt, sent]
      properties:
        url:
          type: string
          format: uri
          description: >
            EMPTY when `sent` is true. The link is withheld once the message has
            gone out: it buys nothing then, and every extra copy of a token is
            another place it can leak from. It is returned only as the fallback
            for a message that was dropped.
        expiresAt: { type: string, format: date-time }
        sent:
          type: boolean
          description: Whether the message actually left.
        sendError:
          type: string
          description: Why it did not, when sent is false.
        via:
          type: string
          description: "Which road the message took when sent: smtp (our link, 24 h) or provider (the identity provider's own link, 1 h). Omitted when nothing went out."

    SchoolEvent:
      type: object
      description: >
        Something the school DOES, as opposed to a day it is shut. Both ends
        inclusive; a one-day event has startsOn == endsOn. levelId and groupId
        are the audience — at most one is set, and neither means the whole
        school.
      required: [id, cycleId, title, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        title: { type: string, example: Festival de primavera }
        description: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        levelId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }

    NonWorkingPeriod:
      type: object
      description: >
        A day, or a run of days, the school does not operate. Both ends
        inclusive; a single-day holiday has startsOn == endsOn. Plain calendar
        dates, never timestamps — a timezone would move a holiday.
      required: [id, cycleId, label, kind, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        label: { type: string, example: Independencia }
        kind: { type: string, enum: [holiday, vacation] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    Installment:
      type: object
      description: >
        One payment of the year. A school does not always divide the year into
        equal parts — "once meses, pero diciembre a la mitad y la otra mitad en
        marzo" is a real arrangement, and N-equal-payments cannot express it.
        The year comes from the cycle, so a schedule may run past December.
      required: [month, amountCents]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        amountCents: { type: integer, format: int64, minimum: 1 }

    Fee:
      type: object
      description: >
        Money the school collects on top of the monthly tuition, spread across
        the months it chooses. "La cuota de julio" is charged for a month the
        school year does not bill, so it is collected inside months that it
        does. amountCents is the WHOLE fee, not the monthly share: the school
        states what it collects and the server divides it, putting the remainder
        of an uneven division on the first payment so no cent is lost.
      required: [name, amountCents, months]
      properties:
        name:
          type: string
          minLength: 1
          example: Cuota de Julio
          description: >
            What the family reads on the statement, and the whole explanation of
            why a month costs more than the tabulador says.
        amountCents: { type: integer, format: int64, minimum: 1, example: 160000 }
        months:
          type: array
          minItems: 1
          description: >
            The calendar months it is divided between, in the order chosen. One
            month is a fee that is not split. A month listed twice is refused.
          items: { type: integer, minimum: 1, maximum: 12 }
          example: [9, 10]

    CollectionPolicy:
      type: object
      description: >
        What a late payment costs and what an early one saves. It rides with the
        tuition table because that is where a price lives.
      properties:
        dailyMode:
          type: boolean
          description: >
            Picks the rule. false keeps the fixed monthly surcharge above. true
            charges lateFeeDailyCents for every day the money is late, and the
            monthly run stops issuing surcharge charges — the amount changes
            every night, so it is worked out at the moment of payment instead.
        lateFeeDailyCents:
          type: integer
          format: int64
          minimum: 0
          example: 1000
          description: The daily surcharge. Required when dailyMode is true.
        surchargeCountsAllDays:
          type: boolean
          description: >
            Counts Saturdays, Sundays and holidays. The school said yes — the
            money is late on a Sunday too.
        earlyPaymentCents:
          type: integer
          format: int64
          minimum: 0
          example: 10000
          description: >
            A fixed amount off, per month settled, when the family pays inside
            the early window. Zero disables it.
        earlyPaymentDays:
          type: integer
          minimum: 0
          maximum: 28
          example: 10
          description: How many WORKING days the early window lasts, from the first of the month.

    TuitionPlanInput:
      type: object
      required: [cycleId, levelId, monthlyCents, months, firstBilledMonth, dueDay]
      properties:
        cycleId: { type: string, format: uuid }
        levelId: { type: string, format: uuid }
        enrollmentCents: { type: integer, format: int64, minimum: 0 }
        monthlyCents: { type: integer, format: int64, minimum: 0 }
        months: { type: integer, minimum: 1, maximum: 12 }
        firstBilledMonth: { type: integer, minimum: 1, maximum: 12 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        lateFeeCents: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        policy: { $ref: '#/components/schemas/CollectionPolicy' }
        schedule:
          type: array
          items: { $ref: '#/components/schemas/Installment' }
        monthlyDiscountCents: { type: integer, format: int64, minimum: 0 }
        fees:
          type: array
          items: { $ref: '#/components/schemas/Fee' }
        enrollmentDueOn: { type: string, format: date, example: "2026-06-30" }
        enrollmentStartsOn: { type: string, format: date, example: "2026-06-01" }

    Tender:
      type: object
      description: >
        One method a payment came in by, and how much of it (T8). A credit note
        is a credit the school issued by hand and the cashier types: it settles
        debt but is not money, so cash-ups and income reports keep it apart.
      required: [method, amountCents]
      properties:
        method: { type: string, enum: [cash, card, transfer, credit_note] }
        amountCents: { type: integer, format: int64, minimum: 1, example: 200000 }
        reference:
          type: string
          maxLength: 120
          description: Free text — a credit note's folio, a voucher, a transfer id.
          example: NC-0007
        cardType:
          type: string
          enum: [debit, credit]
          description: Only on a card.

    Deposit:
      type: object
      description: Money as it arrived, before it was decided what it pays.
      required: [id, studentId, amountCents, method, tenders, paidAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1, example: 670000 }
        method:
          type: string
          enum: [cash, card, transfer, credit_note, mixed]
          description: >
            A summary of the tenders: the one tender's method, or `mixed` when
            the deposit combined several (T8). Read `tenders` for the breakdown.
        tenders:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Tender' }
          description: >
            The methods the money came in by, in order. Always at least one: a
            deposit from before T8 is one tender with its own method.
        cardType:
          type: string
          enum: ['', debit, credit]
          description: >
            Which kind of card. Not a payment method — the money still arrives
            by card — but the terminal the office reconciles against at month
            end knows the difference. Empty for cash and transfers, and on a
            mixed deposit (each card tender carries its own).
        reference:
          type: string
          description: What identifies the money itself — a folio, a transfer id, a card slip.
        paidAt: { type: string, format: date-time }
        paidOn:
          type: string
          format: date
          example: '2026-10-15'
          description: >
            The school-local day the money changed hands (Morelia, ADR 0035):
            what the cash cut, the statement and the receipt's "Fecha de pago"
            read. paidAt is the instant it was recorded; its UTC date is the
            next day for a live payment after 18:00 local.
        calendarVersion:
          type: string
          description: >
            The school calendar the split was worked out against. "unavailable"
            means the calendar could not be read and the deadline was computed
            without the school's holidays.
        voidedAt: { type: [string, 'null'], format: date-time }
        voidReason: { type: string }
        receivedByName:
          type: string
          example: "Laura Caja"
          description: >
            Who took the money: the signed-in cashier (never a field of the
            request), with their name as it read then. Absent on deposits from
            before it was recorded (task 7).
        capturedAt:
          type: string
          format: date-time
          description: >
            When the deposit was keyed. It differs from paidAt when a payment is
            captured late with the day the family paid.
        folio: { type: string, example: 'P-2026-000123' }
        supersededAt:
          type: string
          format: date-time
          description: T9 — when a correction replaced this deposit. It then counts for nothing.
        supersededBy: { type: string, format: uuid, description: The deposit that replaced it. }
        supersededByFolio: { type: string, example: 'P-2026-000124' }
        correctsDepositId: { type: string, format: uuid, description: 'On a correction: the deposit it replaces.' }
        correctsFolio: { type: string, example: 'P-2026-000123' }

    DepositSnapshot:
      type: object
      description: A deposit as it stood on one side of a correction (T9).
      required: [depositId, folio, amountCents, tenders, lines]
      properties:
        depositId: { type: string, format: uuid }
        folio: { type: string, example: 'P-2026-000123' }
        amountCents: { type: integer, format: int64, example: 50000 }
        paidAt: { type: string, format: date-time }
        paidOn:
          type: string
          format: date
          description: The school-local day (ADR 0035). Absent on snapshots written before it was kept.
        tenders:
          type: array
          items: { $ref: '#/components/schemas/Tender' }
        lines:
          type: array
          description: What the deposit put on each charge.
          items:
            type: object
            required: [chargeId, amountCents]
            properties:
              chargeId: { type: string, format: uuid }
              description: { type: string, example: 'Colegiatura septiembre 2026' }
              amountCents: { type: integer, format: int64, example: 50000 }

    DepositCorrection:
      type: object
      description: One correction of a payment (T9) — before, after, who, when and why.
      required: [id, originalDepositId, correctedDepositId, reason, before, after, correctedAt]
      properties:
        id: { type: string, format: uuid }
        originalDepositId: { type: string, format: uuid }
        correctedDepositId: { type: string, format: uuid }
        reason: { type: string, example: 'Se capturó $500 y la familia entregó $1,000' }
        before: { $ref: '#/components/schemas/DepositSnapshot' }
        after: { $ref: '#/components/schemas/DepositSnapshot' }
        correctedByName: { type: string, example: Directora Ruiz }
        correctedAt: { type: string, format: date-time }

    DepositCorrectionResult:
      type: object
      description: What a correction did (T9).
      required: [original, deposit, allocations, surcharges, unallocatedCents, replayed, correction]
      properties:
        original: { $ref: '#/components/schemas/Deposit' }
        deposit: { $ref: '#/components/schemas/Deposit' }
        allocations:
          type: array
          items: { type: object }
        surcharges:
          type: array
          items: { type: object }
        unallocatedCents: { type: integer, format: int64, minimum: 0 }
        replayed: { type: boolean }
        correction: { $ref: '#/components/schemas/DepositCorrection' }

    DepositResult:
      type: object
      description: What a deposit did, in the shape a receipt needs.
      required: [deposit, allocations, surcharges, unallocatedCents, replayed]
      properties:
        deposit: { $ref: '#/components/schemas/Deposit' }
        allocations:
          type: array
          description: The payments the deposit split into, oldest debt first.
          items: { type: object }
        surcharges:
          type: array
          description: >
            The surcharge charges this deposit made real. Under the daily rule a
            row exists only where money landed on it.
          items: { type: object }
        unallocatedCents:
          type: integer
          format: int64
          minimum: 0
          description: What no charge claimed — the family's credit with the school.
        replayed:
          type: boolean
          description: >
            The deposit already existed under this idempotency key and nothing
            was collected a second time.

    DepositPreview:
      type: object
      description: >
        What an amount would cover. No deposit: nothing was taken, and an empty
        deposit on the wire reads like a real one.
      required: [allocations, surcharges, unallocatedCents]
      properties:
        allocations:
          type: array
          description: Where the money would land, oldest debt first.
          items: { type: object }
        surcharges:
          type: array
          description: The surcharge rows the payment would make real.
          items: { type: object }
        unallocatedCents:
          type: integer
          format: int64
          minimum: 0
          description: What would be left over as the family's credit.

    Income:
      type: object
      description: A period's takings, by what the school charged for.
      required: [lines, totalCents, creditNoteCents]
      properties:
        lines:
          type: array
          description: Biggest first — a report is read from the top.
          items:
            type: object
            required: [conceptId, concept, amountCents]
            properties:
              conceptId: { type: string, format: uuid }
              concept: { type: string, example: Colegiatura }
              amountCents: { type: integer, format: int64, minimum: 0 }
        totalCents: { type: integer, format: int64, minimum: 0 }
        creditNoteCents:
          type: integer
          format: int64
          minimum: 0
          description: >
            What credit notes settled in the period (T8). Not income: in neither
            the lines nor totalCents.

    Statement:
      type: object
      description: >
        A student's ledger (T7): movements in date order — on a day, each
        charge with its own adjustments right after it, then the money — with
        the running balance after each line.
      required: [movements, totals, dueTodayCents, surchargeCents, earlyDiscountCents, unallocatedCents, asOf]
      properties:
        movements:
          type: array
          items: { $ref: '#/components/schemas/StatementMovement' }
        totals: { $ref: '#/components/schemas/StatementTotals' }
        dueTodayCents:
          type: integer
          format: int64
          description: >
            What the counter asks for today (Registrar pago's figure): what has
            fallen due PLUS the charges falling due later THIS calendar month,
            so a family can pay the month on time and earn the early-payment
            reward (ISSUE-T14-106). It is "what to pay to be current this
            month", not "what is overdue": label it that way.
          example: 350000
        surchargeCents:
          type: integer
          format: int64
          description: The surcharge inside dueTodayCents.
          example: 30000
        earlyDiscountCents:
          type: integer
          format: int64
          description: The early-payment reward already taken off dueTodayCents.
          example: 0
        unallocatedCents:
          type: integer
          format: int64
          description: Money handed over that no charge has claimed (the family's credit).
          example: 0
        asOf: { type: string, format: date, example: '2026-10-01' }
    FamilyStudent:
      type: object
      required: [id, firstName, lastName, maternalLastName, level, levelId, gradeGroup, groupLabel]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, example: 'Alumna' }
        lastName: { type: string, example: 'Dos' }
        maternalLastName: { type: string, description: Empty when not captured. }
        level: { type: string, example: 'Primaria' }
        levelId: { type: string, format: uuid }
        gradeGroup:
          type: string
          description: The group's bare letter as stored on the pupil. Kept for older apps; show groupLabel.
          example: 'B'
        groupLabel:
          type: string
          description: >
            ISSUE-T14-108. The group as every screen and receipt names it, the
            one of the school's today: grade, level and letter. Falls back to
            gradeGroup when the pupil has no enrollment the catalog resolves.
          example: '3° PRIMARIA · B'
    FamilyStudentProfile:
      allOf:
        - { $ref: '#/components/schemas/FamilyStudent' }
        - type: object
          required: [currentEnrollment]
          properties:
            currentEnrollment:
              description: The active enrollment; null when none is active.
              oneOf:
                - type: 'null'
                - type: object
                  required: [id, studentId, cycleId, groupId, termId, status, enrolledAt]
                  properties:
                    id: { type: string, format: uuid }
                    studentId: { type: string, format: uuid }
                    cycleId: { type: string, format: uuid }
                    groupId: { type: string, format: uuid }
                    termId: { type: string }
                    status: { type: string, example: 'active' }
                    enrolledAt: { type: string, format: date-time }
                    withdrawnOn: { type: string, format: date }
                    withdrawalReason: { type: string }
    PaymentReceipt:
      type: object
      description: >
        The proof of a counter deposit, in the office's words (task 12): what
        the 80 mm ticket and the PDF print.
      required: [kind, folio, school, paidOn, buyer, lines, surchargeCents, discountCents,
        scholarshipCents, creditCents, totalCents, method, tenders]
      properties:
        kind: { type: string, enum: [payment], example: payment }
        folio: { type: string, example: 'P-2026-000042' }
        school:
          type: object
          properties:
            name: { type: string }
            legalName: { type: string }
            rfc: { type: string }
            cct: { type: string }
            address: { type: string }
            phone: { type: string }
            legend: { type: string }
        paidOn: { type: string, format: date, example: '2026-10-17' }
        buyer: { type: string, example: 'Alumna Dos' }
        buyerDetail: { type: string, example: '3° PRIMARIA · B' }
        lines:
          type: array
          items:
            type: object
            required: [description, amountCents]
            properties:
              description: { type: string, example: 'Inscripción 2026-2027' }
              amountCents: { type: integer, format: int64, example: 300000 }
              surcharge: { type: boolean }
              discountCents: { type: integer, format: int64 }
              scholarshipCents: { type: integer, format: int64 }
              scholarshipName: { type: string }
        surchargeCents: { type: integer, format: int64 }
        discountCents: { type: integer, format: int64 }
        scholarshipCents: { type: integer, format: int64 }
        creditCents: { type: integer, format: int64, description: Money no concept claimed. }
        totalCents: { type: integer, format: int64, example: 300000 }
        method: { type: string, example: 'Efectivo' }
        reference: { type: string }
        tenders:
          type: array
          items:
            type: object
            required: [code, method, amountCents]
            properties:
              code: { type: string, enum: [cash, card, transfer, credit_note] }
              method: { type: string, example: 'Efectivo' }
              amountCents: { type: integer, format: int64 }
              reference: { type: string }
        receivedBy: { type: string }
        voided: { type: boolean }
        voidReason: { type: string, description: Office only; never sent to a family. }
        superseded: { type: boolean }
        supersededByFolio: { type: string }
        correctsFolio: { type: string }
    StatementMovement:
      type: object
      required: [kind, date, description, amountCents, balanceCents, accrued, notYetDue, voided]
      properties:
        kind:
          type: string
          enum: [charge, surcharge, discount, scholarship, payment, credit_note]
          description: >
            charge and surcharge raise the balance; discount, scholarship,
            payment and credit_note lower it. scholarship (T18) is the part a
            scholarship takes off a charge, described "Beca <name> · <charge>".
        date:
          type: string
          format: date
          description: >
            A charge's due date; the day money arrived; today for an accrued
            surcharge. The school's day is the UTC day.
          example: '2026-09-10'
        description: { type: string, example: 'Colegiatura septiembre 2026' }
        amountCents:
          type: integer
          format: int64
          minimum: 0
          description: Always positive; `kind` says the direction.
          example: 320000
        balanceCents:
          type: integer
          format: int64
          description: The running balance after this line. Negative is credit.
          example: 320000
        chargeId: { type: string, format: uuid }
        depositId: { type: string, format: uuid }
        method: { type: string, enum: [cash, card, transfer], description: On money lines. }
        cardType: { type: string, enum: [debit, credit] }
        reference: { type: string, example: 'SPEI 123456' }
        folio: { type: string, example: 'P-2026-000042' }
        accrued:
          type: boolean
          description: A surcharge earned by the daily rule up to today, not yet written down. Counted.
        notYetDue:
          type: boolean
          description: A charge that has not opened (T5). Listed for the office, not counted.
        voided:
          type: boolean
          description: A cancelled deposit. Listed for the office struck through, not counted.
        voidReason: { type: string, example: 'importe capturado mal' }
        superseded:
          type: boolean
          description: T9 — a deposit replaced by its correction. Listed for the office, not counted; the family is not shown it.
        supersededByFolio: { type: string, example: 'P-2026-000124' }
        correctsFolio:
          type: string
          description: On a correction's lines, the receipt it replaces.
          example: 'P-2026-000123'
        appliedTo:
          type: array
          description: >
            On a deposit's lines (ISSUE-T14-106): what that deposit's money
            paid, each charge with its part, in due-date order. Every tender
            line of one deposit carries the same list; money no charge claimed
            (credit) is not in it. Absent on every other line. The line's
            `description` names them too ("Pago · Inscripción", or
            "Pago · <first> y N más").
          items: { $ref: '#/components/schemas/StatementAppliedPart' }
    StatementAppliedPart:
      type: object
      required: [chargeId, description, amountCents]
      properties:
        chargeId: { type: string, format: uuid }
        description: { type: string, example: 'Inscripción 2026-2027' }
        amountCents: { type: integer, format: int64, minimum: 0, example: 300000 }
    StatementTotals:
      type: object
      required: [chargedCents, discountCents, paidCents, balanceCents, notYetDueCents]
      properties:
        chargedCents: { type: integer, format: int64, example: 3650000 }
        discountCents:
          type: integer
          format: int64
          description: Discounts and scholarships.
          example: 20000
        paidCents: { type: integer, format: int64, example: 2000000 }
        balanceCents:
          type: integer
          format: int64
          description: charged − discount − paid. Negative is credit in the family's favour.
          example: 1630000
        notYetDueCents:
          type: integer
          format: int64
          description: What the charges not yet opened will ask for, net. Not in the balance.
          example: 50000
    CashUp:
      type: object
      description: One day's takings, split by how the money arrived.
      required: [deposits, cancelled, cashCents, cardCents, transferCents, totalCents, creditNoteCents, payments]
      properties:
        deposits:
          type: array
          items: { $ref: '#/components/schemas/Deposit' }
        cancelled:
          type: array
          description: Voided that day. They count for nothing and are shown anyway.
          items: { $ref: '#/components/schemas/Deposit' }
        superseded:
          type: array
          description: >
            T9 — deposits of that day replaced by a correction. They count for
            nothing (the correction counts on the day it is dated) and are shown.
          items: { $ref: '#/components/schemas/Deposit' }
        payments:
          type: array
          description: >
            Payments taken outside a deposit that day (a counter sale's, paid
            straight against its charge). The totals include them.
          items: { $ref: '#/components/schemas/CashUpPayment' }
        cashCents: { type: integer, format: int64, minimum: 0 }
        cardCents: { type: integer, format: int64, minimum: 0 }
        transferCents: { type: integer, format: int64, minimum: 0 }
        totalCents:
          type: integer
          format: int64
          minimum: 0
          description: Money only — cash, card and transfer. Credit notes are not in it.
        creditNoteCents:
          type: integer
          format: int64
          minimum: 0
          description: >
            What credit notes settled that day (T8), on its own line: not money,
            so in none of the per-method figures nor in totalCents.
        day:
          type: string
          format: date
          description: >
            The day this cut is — the server's day when none was asked for.
            Closing sends it back, so the day on screen is the one closed.
        expenses:
          type: array
          description: >
            T10 — the day's expenses; cancelled ones listed, not counted. This
            and every T10 field below (expensesByMethod, expectedCashCents,
            closure, modifiedAfterClose, reopened) are filled only for a caller
            holding `expenses:read` while module_expenses is on; anyone else
            (the cashier's collections:read) gets them empty.
          items: { $ref: '#/components/schemas/Expense' }
        expensesByMethod: { $ref: '#/components/schemas/MethodTotals' }
        expectedCashCents:
          type: integer
          format: int64
          description: T10 — the cash the drawer should hold, cash in − cash out.
        closure: { $ref: '#/components/schemas/CashCutClosure' }
        modifiedAfterClose:
          type: boolean
          description: >
            T10 — a movement of the day changed after it was closed (a
            correction, a void, a late capture, an expense edited or cancelled).
        reopened:
          type: array
          description: T10 — earlier closures of the day that were reopened, newest first.
          items: { $ref: '#/components/schemas/CashCutClosure' }

    CashUpPayment:
      type: object
      description: A payment taken outside a deposit, with what it paid for.
      required: [id, chargeId, amountCents, method, reference, paidAt, description]
      properties:
        id: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1, example: 135000 }
        method: { type: string, enum: [cash, card, transfer, credit_note] }
        reference: { type: string }
        paidAt: { type: string, format: date-time }
        paidOn: { type: string, format: date, description: 'The school-local day (ADR 0035).' }
        description: { type: string, example: "Uniformes · U-2026-000001" }
        cardType:
          type: string
          enum: [debit, credit]
          description: Only on a card payment (T8).

    MethodTotals:
      type: object
      description: An amount per method and their sum. A balance may be negative.
      required: [cashCents, cardCents, transferCents, totalCents]
      properties:
        cashCents: { type: integer, format: int64, example: 500000 }
        cardCents: { type: integer, format: int64, example: 120000 }
        transferCents: { type: integer, format: int64, example: 80000 }
        totalCents: { type: integer, format: int64, example: 700000 }

    ActivitySlot:
      type: object
      required: [weekday, start, end]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday … 7 = Sunday., example: 2 }
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '15:00' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '16:30' }

    ActivityPriceOption:
      type: object
      required: [amountCents]
      properties:
        id:
          type: string
          format: uuid
          description: Present on what the server returns; on input, send it to edit an existing option and omit it for a new one.
        daysPerWeek:
          type: [integer, 'null']
          minimum: 1
          maximum: 7
          description: Days a week the pupil attends for this price; null is the flat fee, whatever the days.
          example: 2
        amountCents: { type: integer, format: int64, minimum: 1, description: Charged per period., example: 60000 }

    ActivityInput:
      type: object
      required: [name, schedule, periodicity, billingStartsOn, firstDueOn, options]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, example: Natación }
        schedule:
          type: array
          minItems: 1
          maxItems: 21
          items: { $ref: '#/components/schemas/ActivitySlot' }
        periodicity:
          type: string
          enum: [monthly, weekly, per_cycle]
          description: How often it is charged. per_cycle is a single charge, on the first billing date; a pupil who joins after its due date is still charged, with the same window to pay from the day they joined.
          example: monthly
        billingStartsOn:
          type: string
          format: date
          description: The first billing date; later periods repeat it (same day each month, or each week).
          example: '2026-10-01'
        firstDueOn:
          type: string
          format: date
          description: The first period's due date; later periods keep the same distance.
          example: '2026-10-10'
        lateFeeCents:
          type: integer
          format: int64
          minimum: 0
          description: Fixed late fee once a period is past due and unpaid. 0 is none.
          example: 5000
        active: { type: boolean, example: true }
        options:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/ActivityPriceOption' }

    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityInput'
        - type: object
          required: [id, active, lateFeeCents, enrolledCount]
          properties:
            id: { type: string, format: uuid }
            enrolledCount: { type: integer, example: 12 }

    ActivityEnrollment:
      type: object
      required: [id, activityId, studentId, optionId, startsOn]
      properties:
        id: { type: string, format: uuid }
        activityId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        startsOn: { type: string, format: date, example: '2026-10-02' }
        endsOn: { type: [string, 'null'], format: date, example: null }

    ScholarshipInput:
      type: object
      required: [name, kind, value, targets]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Beca hermanos }
        kind:
          type: string
          enum: [percent, fixed_off, fixed_price]
          description: >
            percent: a share of the price off; fixed_off: a fixed amount off
            (never below zero); fixed_price: the family pays this amount (never
            more than the price).
        value:
          type: integer
          format: int64
          minimum: 0
          description: >
            percent: basis points, 1–10000 (5000 = 50 %). fixed_off: cents
            off, ≥ 1. fixed_price: cents to pay, ≥ 0.
          example: 5000
        targets:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: >
            What it applies to: `enrollment`, `tuition`, `concept:<conceptId>`,
            `activity:<activityId>` (see /scholarships/targets).
          items:
            type: string
            pattern: '^(enrollment|tuition|(concept|activity):[0-9a-fA-F-]{36})$'
          example: [tuition, enrollment]
        active: { type: boolean, example: true }

    Scholarship:
      allOf:
        - $ref: '#/components/schemas/ScholarshipInput'
        - type: object
          required: [id, active, assignedCount]
          properties:
            id: { type: string, format: uuid }
            assignedCount: { type: integer, example: 14 }

    ScholarshipTarget:
      type: object
      required: [key, label, group]
      properties:
        key: { type: string, example: 'concept:7d1c2a4e-5b6f-4c3d-8e9f-0a1b2c3d4e5f' }
        label: { type: string, example: Cuota de materiales }
        group: { type: string, enum: [enrollment, tuition, concept, activity] }

    ScholarshipHolder:
      type: object
      required: [studentId, startsOn, overlaps]
      properties:
        studentId: { type: string, format: uuid }
        startsOn: { type: string, format: date, example: '2026-10-02' }
        overlaps:
          type: array
          description: Other scholarships of this pupil sharing a target with this one.
          items:
            type: object
            required: [scholarshipId, name]
            properties:
              scholarshipId: { type: string, format: uuid }
              name: { type: string, example: Beca excelencia }

    ExpenseCategory:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Papelería }
        active: { type: boolean, example: true }

    ExpenseInput:
      type: object
      required: [spentOn, categoryId, amountCents, method]
      properties:
        spentOn: { type: string, format: date, description: The day the money left; never in the future., example: '2026-10-01' }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, minimum: 1, example: 125050 }
        method: { type: string, enum: [cash, card, transfer], example: cash }
        description: { type: string, maxLength: 500, example: Hojas y tóner para dirección }

    Expense:
      type: object
      description: Money the school paid out (T10).
      required: [id, spentOn, categoryId, categoryName, amountCents, method, description, status]
      properties:
        id: { type: string, format: uuid }
        spentOn: { type: string, format: date, example: '2026-10-01' }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, example: Papelería }
        amountCents: { type: integer, format: int64, minimum: 1, example: 125050 }
        method: { type: string, enum: [cash, card, transfer] }
        description: { type: string, example: Hojas y tóner }
        status: { type: string, enum: [active, cancelled] }
        cancelReason: { type: string }
        cancelledAt: { type: string, format: date-time }
        receipt:
          type: object
          description: Absent when no receipt is attached.
          required: [contentType, sizeBytes]
          properties:
            contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
            sizeBytes: { type: integer, format: int64, example: 248331 }
        createdByName: { type: string, example: Laura Caja }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseEvent:
      type: object
      description: One change of an expense — before and after, who, when, why.
      required: [id, kind, before, after, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [created, edited, cancelled, receipt_attached, receipt_removed] }
        before: { type: object, description: 'The expense before (empty object on create).', additionalProperties: true }
        after: { type: object, additionalProperties: true }
        reason: { type: string }
        actorName: { type: string, example: Laura Caja }
        at: { type: string, format: date-time }

    FinanceSummary:
      type: object
      required: [income, creditNoteCents, expenses, balance, expensesByCategory]
      properties:
        income: { $ref: '#/components/schemas/MethodTotals' }
        creditNoteCents:
          type: integer
          format: int64
          minimum: 0
          description: What credit notes settled. Not income — outside every figure.
        expenses: { $ref: '#/components/schemas/MethodTotals' }
        balance: { $ref: '#/components/schemas/MethodTotals' }
        expensesByCategory:
          type: array
          items:
            type: object
            required: [categoryId, categoryName, amountCents, count]
            properties:
              categoryId: { type: string, format: uuid }
              categoryName: { type: string, example: Papelería }
              amountCents: { type: integer, format: int64 }
              count: { type: integer, format: int32 }

    AttendanceCounts:
      type: object
      required: [present, absent, late, excused]
      properties:
        present: { type: integer, minimum: 0 }
        absent: { type: integer, minimum: 0 }
        late: { type: integer, minimum: 0, description: Retardos. }
        excused: { type: integer, minimum: 0 }
    AttendanceReportRow:
      allOf:
        - $ref: '#/components/schemas/AttendanceCounts'
        - type: object
          required: [enrollmentId, studentId, name, active]
          properties:
            enrollmentId: { type: string, format: uuid }
            studentId: { type: string, format: uuid }
            name: { type: string, description: Surnames first; "(sin nombre)" when the directory cannot name the pupil. }
            active: { type: boolean, description: False for a pupil who left the group during the range. }
    AttendanceReport:
      type: object
      required: [groupId, groupLabel, from, to, listsTaken, rows, totals]
      properties:
        groupId: { type: string, format: uuid }
        groupLabel: { type: string, example: "1° SECUNDARIA · A" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        listsTaken: { type: integer, minimum: 0, description: Lists of the group taken in the range (daily and per-class). }
        rows:
          type: array
          description: One per pupil who was in the group during the range, by surname.
          items: { $ref: '#/components/schemas/AttendanceReportRow' }
        totals: { $ref: '#/components/schemas/AttendanceCounts' }
      example:
        groupId: 7a1c2e3d-0000-4000-8000-000000000001
        groupLabel: "1° SECUNDARIA · A"
        from: "2026-09-01"
        to: "2026-09-30"
        listsTaken: 20
        rows:
          - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, studentId: 6c1d2e3f-0000-4000-8000-000000000002, name: "GARCÍA LÓPEZ ANA", active: true, present: 17, absent: 1, late: 2, excused: 0 }
        totals: { present: 17, absent: 1, late: 2, excused: 0 }
    FinanceReport:
      type: object
      required: [period, from, to, label, summary, incomeByConcept, expenses]
      properties:
        period: { type: string, enum: [daily, weekly, monthly, yearly] }
        from: { type: string, format: date, example: '2026-10-01' }
        to: { type: string, format: date, example: '2026-10-31' }
        label: { type: string, example: Octubre de 2026 }
        summary: { $ref: '#/components/schemas/FinanceSummary' }
        incomeByConcept: { $ref: '#/components/schemas/Income' }
        expenses:
          type: array
          description: The period's live expenses, newest first, at most 500.
          items: { $ref: '#/components/schemas/Expense' }
        expensesTruncated:
          type: boolean
          description: The period has more expenses than the list carries; the totals are the whole period's.

    CashCutClosure:
      type: object
      description: One closure of a day's cut — the snapshot taken when it was closed.
      required: [id, day, expectedCashCents, countedCashCents, differenceCents, income, expenses, creditNoteCents, closedAt]
      properties:
        id: { type: string, format: uuid }
        day: { type: string, format: date }
        expectedCashCents: { type: integer, format: int64, example: 170000 }
        countedCashCents: { type: integer, format: int64, minimum: 0, example: 165000 }
        differenceCents: { type: integer, format: int64, description: counted − expected; negative is money missing., example: -5000 }
        income: { $ref: '#/components/schemas/MethodTotals' }
        expenses: { $ref: '#/components/schemas/MethodTotals' }
        creditNoteCents: { type: integer, format: int64 }
        note: { type: string }
        closedByName: { type: string, example: Laura Caja }
        closedAt: { type: string, format: date-time }
        reopenedAt: { type: string, format: date-time }
        reopenedByName: { type: string }
        reopenReason: { type: string }

    BillingRun:
      type: object
      description: What a billing run did.
      required: [tuitionCreated, enrollmentCreated, lateFeesCreated, skipped, levelsWithoutPlan]
      properties:
        tuitionCreated: { type: integer, example: 30 }
        enrollmentCreated: { type: integer, example: 10 }
        lateFeesCreated: { type: integer, example: 4 }
        activitiesCreated:
          type: integer
          example: 5
          description: >
            Activity charges issued (T17): one per enrolled pupil per period
            whose billing date has arrived. Their fixed late fees count in
            lateFeesCreated.
        feesCreated:
          type: integer
          example: 8
          description: Charges issued for the extras collected on top of the tuition.
        enrollmentMoved:
          type: integer
          example: 0
          description: >
            Inscriptions whose deadline the run corrected to match the tuition
            table. The run never re-issues a charge it has written, so this is
            how a deadline changed after billing reaches pupils already charged.
        enrollmentRepriced:
          type: integer
          example: 0
          description: >
            Unpaid inscriptions the run re-priced to the tier now in force.
            Reported for the same reason as enrollmentMoved, and it matters
            more: this one moves money, not dates.
        skipped:
          type: integer
          example: 6
          description: >
            Already existed. On a second run in the same day this is everything,
            which is what idempotent looks like from the outside.
        levelsWithoutPlan:
          type: array
          items: { type: string }
          example: ["Kínder"]
          description: >
            Levels nobody has priced, by NAME. Reported rather than billed at
            zero: a family charged nothing is a problem a school finds in June.
    Teacher:
      type: object
      description: A member of the staff roster (config). `userId` is empty until the teacher can sign in.
      required: [id, firstName, lastName, email, userId]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, example: Gabriela }
        lastName: { type: string, example: Rojas }
        email: { type: string, example: gabriela.rojas@garcialorca.edu.mx }
        userId: { type: string, description: 'The iam account, or empty when none is linked.' }

    Subject:
      type: object
      description: A subject of ONE grade (T13). Assignments pair it only with groups of that grade.
      required: [id, gradeLevelId, name]
      properties:
        id: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string, example: Matemáticas }
    GradeLevel:
      type: object
      description: A grade (grado) of a level, ordered by ordinal.
      required: [id, levelId, name, ordinal]
      properties:
        id: { type: string, format: uuid }
        levelId: { type: string, format: uuid }
        name: { type: string, example: 3° }
        ordinal: { type: integer, minimum: 1, example: 3 }
    Group:
      type: object
      description: A group (grupo) of a grade in one cycle. capacity 0 = not sized.
      required: [id, cycleId, gradeLevelId, name, capacity]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string, example: A }
        capacity: { type: integer, minimum: 0, example: 25 }
    TeachingAssignment:
      type: object
      description: One teacher holding one (group, subject) slot in a cycle. cycleId is derived from the group.
      required: [id, cycleId, groupId, subjectId, teacherId]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }

    TeachingLoadItem:
      type: object
      required: [groupId, subjectId]
      properties:
        groupId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }

    TeachingLoadConflict:
      type: object
      description: A requested slot another teacher already holds.
      required: [groupId, subjectId, assignmentId, teacherId, teacherName]
      properties:
        groupId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string, description: '"first last" of the teacher holding it.' }

    TeachingLoadResult:
      type: object
      description: Every list is present; an empty one is [].
      required: [created, reassigned, skipped, conflicts]
      properties:
        created:
          type: array
          items: { $ref: '#/components/schemas/TeachingAssignment' }
        reassigned:
          type: array
          items: { $ref: '#/components/schemas/TeachingAssignment' }
        skipped:
          type: array
          description: Slots that were already this teacher's.
          items: { $ref: '#/components/schemas/TeachingLoadItem' }
        conflicts:
          type: array
          description: Slots another teacher holds, left untouched (replaceConflicts=false).
          items: { $ref: '#/components/schemas/TeachingLoadConflict' }

    AttendanceMode:
      type: string
      enum: [daily, per_class]
      description: >
        How a level takes attendance. New levels default by name
        (secundaria/preparatoria/bachillerato → per_class, others → daily).
    Level:
      type: object
      required: [id, name, sepCode, enrollmentGranularity, attendanceMode, grading, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Secundaria }
        sortOrder:
          type: integer
          minimum: 0
          example: 4
          description: >
            The level's place in the school order (1 = first). Lists of levels
            come sorted by it, then by name.
        sepCode: { type: string }
        enrollmentGranularity: { type: string, enum: [cycle, term] }
        attendanceMode: { $ref: '#/components/schemas/AttendanceMode' }
        grading: { $ref: '#/components/schemas/LevelGrading' }
    GradingScale:
      type: object
      description: >
        A level's numeric scale, in the units a person reads (at most two
        decimals). 0 <= min < passing <= max <= 100; decimals 0..2.
      required: [min, max, decimals, passing]
      properties:
        min: { type: number, example: 5 }
        max: { type: number, example: 10 }
        decimals: { type: integer, minimum: 0, maximum: 2, example: 1 }
        passing: { type: number, example: 6 }
    LevelGrading:
      description: >
        Whether the level takes numeric grades (`enabled`; Preescolar, Kínder
        and Maternal start disabled) and on which scale. New levels default to
        5–10, one decimal, 6 to pass.
      allOf:
        - $ref: '#/components/schemas/GradingScale'
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
      example: { enabled: true, min: 5, max: 10, decimals: 1, passing: 6 }
    TermList:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          items:
            type: object
            required: [id, name, cycleId, levelId, months]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, example: Bloque 1 }
              cycleId: { type: string, format: uuid }
              levelId: { type: string, format: uuid }
              months:
                type: array
                description: The calendar months the term covers, ascending; [] when none are set.
                items: { type: string, example: '2026-09' }
    ConfigTerm:
      type: object
      required: [id, cycleId, levelId, name, ordinal, startsOn, endsOn, months]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        levelId: { type: string, format: uuid }
        name: { type: string, example: Trimestre 1 }
        ordinal: { type: integer, minimum: 1, example: 1 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        months:
          type: array
          description: The calendar months the term covers ("YYYY-MM", ascending); [] when none are set.
          items: { type: string, example: '2026-09' }
    ConfigEvaluationPeriod:
      type: object
      required: [id, cycleId, gradeLevelId, ordinal, name, startsOn, endsOn, termId]
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1, maximum: 12, example: 1 }
        name: { type: string, maxLength: 60, example: 1.er trimestre }
        startsOn: { type: string, format: date, example: '2026-08-24', description: 'First day (inclusive).' }
        endsOn: { type: string, format: date, example: '2026-11-30', description: 'Last day (inclusive).' }
        termId:
          type: [string, 'null']
          format: uuid
          description: The level term this period was migrated from (provenance), or null.
    ConfigEvaluationPeriodInput:
      type: object
      required: [ordinal, name, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
          description: >
            The grade's existing period this row edits; omit it for a new
            period. The id follows the row, so removing the 1st period removes
            that one even though the rest are renumbered.
        ordinal: { type: integer, minimum: 1, maximum: 12, example: 1 }
        name: { type: string, minLength: 1, maxLength: 60, example: 1.er trimestre }
        startsOn: { type: string, format: date, example: '2026-08-24' }
        endsOn: { type: string, format: date, example: '2026-11-30' }
    EvaluationPeriodRef:
      type: object
      description: An evaluation period of a grade (config, T14). Both dates inclusive.
      required: [id, ordinal, name, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1, maximum: 12, example: 1 }
        name: { type: string, example: 1.er trimestre }
        startsOn: { type: string, format: date, example: '2026-08-24' }
        endsOn: { type: string, format: date, example: '2026-11-30' }
    PeriodSheet:
      type: object
      required: [assignmentId, periodId, periods, currentPeriodId, today, scale, gradingEnabled, editable, closedPeriodIds, rows]
      properties:
        assignmentId: { type: string, format: uuid }
        periodId:
          type: [string, 'null']
          format: uuid
          description: The period shown; null when the grade has no periods.
        periods:
          type: array
          description: The evaluation periods of the group's grade in the assignment's cycle, by ordinal.
          items: { $ref: '#/components/schemas/EvaluationPeriodRef' }
        currentPeriodId:
          type: [string, 'null']
          format: uuid
          description: The period containing `today`; null when today falls in none.
        today:
          type: string
          format: date
          description: >
            The school's current local day (America/Mexico_City). A period that
            starts after it is not gradable yet (read-only sheet, writes
            refused with `PERIOD_NOT_STARTED`), so the screen marks it up front.
          example: '2026-10-01'
        closedPeriodIds:
          type: array
          description: >
            The periods of `periods` whose level term is CLOSED: read-only for
            everyone (writes answer 409 `PERIOD_LOCKED`) until the director
            reopens it. [] when none.
          items: { type: string, format: uuid }
        scale: { $ref: '#/components/schemas/GradingScale' }
        gradingEnabled: { type: boolean }
        editable: { type: boolean }
        readOnlyReason:
          type: string
          description: Why the sheet cannot be edited; absent when it can.
          example: Aún no empieza ese periodo
        rows:
          type: array
          items:
            type: object
            required: [enrollmentId, studentId, name, value, updatedAt, rowEditable]
            properties:
              enrollmentId: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              name: { type: string, example: Ana Ávila }
              value: { type: [integer, 'null'], example: 9 }
              updatedAt: { type: [string, 'null'], format: date-time }
              rowEditable:
                type: boolean
                description: >
                  Whether the caller may write THIS row's cell. False when the
                  whole sheet is read-only, or — on the teacher's routes — when
                  the period ended before the pupil joined this group by
                  transfer (it belongs to the previous group; the director may
                  edit it).
              rowReadOnlyReason:
                type: string
                description: Why the row cannot be edited; absent when it can.
                example: Ese periodo corresponde al grupo anterior del alumno
      example:
        assignmentId: 9c3d1e2f-0000-4000-8000-000000000003
        periodId: 0e000000-0000-4000-8000-000000000001
        periods:
          - { id: 0e000000-0000-4000-8000-000000000001, ordinal: 1, name: 1.er trimestre, startsOn: '2026-08-24', endsOn: '2026-11-30' }
          - { id: 0e000000-0000-4000-8000-000000000002, ordinal: 2, name: 2.º trimestre, startsOn: '2026-12-07', endsOn: '2027-03-26' }
        currentPeriodId: 0e000000-0000-4000-8000-000000000001
        today: '2026-10-01'
        closedPeriodIds: []
        scale: { min: 5, max: 10, decimals: 1, passing: 6 }
        gradingEnabled: true
        editable: true
        rows:
          - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, studentId: 6e1d2c3b-0000-4000-8000-000000000042, name: Ana Ávila, value: 9, updatedAt: '2026-10-01T15:04:05Z', rowEditable: true }
          - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3302, studentId: 6e1d2c3b-0000-4000-8000-000000000043, name: Nico Núñez, value: null, updatedAt: null, rowEditable: true }
    FamilyPeriodGrades:
      type: object
      required: [gradingEnabled, cycleName, periods, subjects]
      properties:
        gradingEnabled: { type: boolean }
        cycleName: { type: string, example: 2026-2027 }
        periods:
          type: array
          description: The evaluation periods of the child's grade in the cycle, by ordinal.
          items: { $ref: '#/components/schemas/EvaluationPeriodRef' }
        scale:
          allOf: [{ $ref: '#/components/schemas/GradingScale' }]
          description: >
            The level's scale, present only when `gradingEnabled` is true.
            A level that stopped grading numerically omits it: the app shows
            the grades as stored and marks none as failing.
        subjects:
          type: array
          items:
            type: object
            required: [subjectId, subjectName, grades]
            properties:
              subjectId: { type: string, format: uuid }
              subjectName: { type: string, example: Matemáticas }
              grades:
                type: object
                description: Period id → grade (a whole number); `{}` when nothing is captured.
                additionalProperties: { type: number }
                example: { 0e000000-0000-4000-8000-000000000001: 9 }
    AttendanceStatus:
      type: string
      enum: [present, absent, late, excused]
    AttendanceClass:
      type: object
      required: [groupId, groupLabel, levelName, mode]
      properties:
        groupId: { type: string, format: uuid }
        groupLabel: { type: string, example: "1° SECUNDARIA · A" }
        levelName: { type: string, example: Secundaria }
        mode: { $ref: '#/components/schemas/AttendanceMode' }
        subjectId: { type: string, format: uuid, description: Only on a per_class entry. }
        subjectName: { type: string, description: Only on a per_class entry. }
        assignmentId: { type: string, format: uuid, description: Only on a per_class entry. }
    AttendanceSession:
      type: object
      description: The list was taken. takenAt/takenByName are its first save, updatedAt the latest correction.
      required: [takenAt, takenByName, updatedAt]
      properties:
        takenAt: { type: string, format: date-time }
        takenByName: { type: string, example: Gabriela Rojas }
        updatedAt: { type: string, format: date-time }
    AttendanceList:
      type: object
      required: [mode, date, editable, today, windowDays, session, rows]
      properties:
        mode:
          allOf: [{ $ref: '#/components/schemas/AttendanceMode' }]
          description: >
            The list's shape. Usually the level's mode; a list taken before
            its level changed mode keeps the shape it was taken in (a key
            with a subject is per_class, without one daily).
        date: { type: string, format: date }
        editable: { type: boolean, description: Whether the caller may still save this list. }
        readOnlyReason:
          type: string
          enum: [future, window, no_classes]
          description: >
            Present only when `editable` is false, and says why: `future` — the
            date is after `today` (web text "No puedes registrar una fecha
            futura"); `window` — more than `windowDays` before `today` (web
            text "Solo puedes corregir hasta 7 días atrás"); `no_classes` —
            the school calendar has no classes that day: a weekend, a date
            outside the group's cycle, or a closed day (web text "Ese día no
            hay clases."), sent to the director too. `future` and `window`
            win over `no_classes`. A code, not a sentence: the web maps it to
            its own text. A list already taken on such a day stays readable.
        today:
          type: string
          format: date
          description: >
            The school's day (America/Mexico_City, ADR 0035), whatever the
            server's or the browser's zone. The teacher's window is measured
            from it, so the web bases its date picker on `today`.
        windowDays: { type: integer, const: 7, description: How many days back a teacher may correct. }
        session:
          oneOf:
            - { $ref: '#/components/schemas/AttendanceSession' }
            - { type: 'null' }
          description: Null for a list nobody has taken.
        rows:
          type: array
          items:
            type: object
            required: [enrollmentId, studentId, name, status, note]
            properties:
              enrollmentId: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              name: { type: string, description: '"" when the name cannot be resolved.' }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              note: { type: string, maxLength: 500 }
      example:
        mode: daily
        date: "2026-09-15"
        editable: true
        today: "2026-09-15"
        windowDays: 7
        session: { takenAt: "2026-09-15T14:05:00Z", takenByName: Gabriela Rojas, updatedAt: "2026-09-15T14:05:00Z" }
        rows:
          - { enrollmentId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, studentId: 1b2c3d4e-0000-4000-8000-000000000001, name: Ana García, status: excused, note: cita médica }
    SaveAttendanceRequest:
      type: object
      required: [groupId, date, marks]
      properties:
        groupId: { type: string, format: uuid }
        date: { type: string, format: date }
        subjectId: { type: string, format: uuid, description: "Required for a per_class group, refused for a daily one." }
        marks:
          type: array
          description: The COMPLETE set of exceptions; an empty array means everybody present.
          items:
            type: object
            required: [enrollmentId, status]
            properties:
              enrollmentId: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
              note: { type: string, maxLength: 500 }
    AttendanceRecord:
      type: object
      required: [id, enrollmentId, date, status, note, subjectId]
      properties:
        id: { type: string, format: uuid }
        enrollmentId: { type: string, format: uuid }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: string }
        subjectId: { type: string, description: 'The per-class subject; "" for a daily mark.' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable. The UI branches on this, never on the message.
              enum:
                [invalid, unauthorized, forbidden, not_found, conflict,
                 insufficient_stock, module_disabled, upstream_unavailable, internal]
            message:
              type: string
              description: |
                Human-readable, in Spanish, and safe to show. It says what happened
                and what to do — never a stack trace, never an internal id.
            details:
              type: object
              additionalProperties: true
              description: Structured context the UI can use, e.g. which permission is missing.
      examples:
        - error:
            code: insufficient_stock
            message: Esa talla ya no está disponible, actualizamos la lista
            details: { itemId: 6f1c9a2e-1111-4e2b-9a11-000000000001, sizeLabel: "8", available: 0 }
    PlainTextError:
      type: string
      description: Human-readable message sent by the gateway's students enrollment handlers.
      example: Only an active enrollment can be previewed for withdrawal.

    LevelId:
      type: string
      pattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: >
        A level the school defined in Configuración (config `levels`), not a
        fixed SEP list (ADR 0014). Omitted or empty on a garment means it applies
        to EVERY level. A uuid, or the empty string.

    Item:
      type: object
      required: [id, name, priceCents, active, sizes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        levelId: { $ref: '#/components/schemas/LevelId' }
        priceCents:
          type: integer
          minimum: 0
          description: Integer cents, as everywhere money appears.
        active: { type: boolean }
        category: { $ref: '#/components/schemas/ItemCategory' }
        sizes:
          type: array
          items: { $ref: '#/components/schemas/StockLevel' }

    ItemCategory:
      type: string
      enum: [uniform, book, supply, other]
      default: uniform
      description: >
        What kind of thing this is. The module sells whatever the school sells —
        the stock rules, the append-only ledger and the counter sale were never
        about clothing, only the vocabulary was. Everything stored before
        categories existed is a uniform, which is the truth about it.

    CreateItemRequest:
      type: object
      description: >
        An article has no clave (task 3): it is told apart by its id and found
        by name. A `code` sent by an older client is ignored.
      required: [name, priceCents]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        category: { $ref: '#/components/schemas/ItemCategory' }
        levelId: { $ref: '#/components/schemas/LevelId' }
        priceCents: { type: integer, minimum: 0 }

    StockLevel:
      type: object
      required: [id, itemId, sizeLabel, onHand, reserved, available, minStock, belowMinimum]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        sizeLabel: { type: string, maxLength: 12 }
        sizeOrder: { type: integer }
        onHand: { type: integer, description: Physically in the storeroom. }
        reserved: { type: integer, description: Committed to a live order line. }
        available:
          type: integer
          description: |
            onHand minus reserved. DERIVED, never stored, and the only number a
            parent should ever be shown: it is what can actually be taken.
        minStock: { type: integer }
        belowMinimum: { type: boolean }

    SaleLine:
      type: object
      required: [itemId, sizeLabel, qty]
      properties:
        itemId: { type: string, format: uuid }
        sizeLabel: { type: string, maxLength: 12 }
        qty: { type: integer, minimum: 1 }
      description: |
        Note what is NOT here: a price. The amount always comes from the server's
        catalogue, so a crafted request cannot buy a jumper for one peso.

    LineStatus:
      type: string
      enum: [awaiting_stock, reserved, sold, released, cancelled]
      description: |
        `reserved` is the only status that holds stock. `released` and `cancelled`
        are terminal: a line let go is not re-picked, because the school has
        reclaimed the goods and may already have sold them to someone else. The
        family orders again.

    FulfillmentStatus:
      type: string
      enum: [picking, ready_for_pickup, paid, dispatched, expired, cancelled, sold_at_counter]
      description: |
        `sold_at_counter` is terminal from birth: the goods were handed over as
        they were sold, so no sweep may ever return them to stock.

    OrderLabel:
      type: string
      enum: [awaiting_stock, partial, in_progress, closed, closed_partial]
      description: |
        The order's DERIVED state, for display only, recomputed on every read so
        it cannot drift. `closed_partial` is the honest ending for an order that
        finished having delivered only some of what was asked for.

    OrderLine:
      type: object
      required: [id, itemId, itemName, sizeLabel, qty, unitPriceCents, status]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName:
          type: string
          description: Snapshot; renaming the catalogue must not rewrite an issued order.
        sizeLabel: { type: string }
        qty: { type: integer }
        unitPriceCents:
          type: integer
          description: Snapshot, for the same reason.
        status: { $ref: '#/components/schemas/LineStatus' }
        fulfillmentId: { type: [string, 'null'], format: uuid }

    Fulfillment:
      type: object
      required: [id, orderId, seq, folio, status, amountCents]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        seq:
          type: integer
          description: Renders as the -A, -B suffix. A number, so an order is not capped at 26 deliveries.
        folio: { type: string, example: U-2026-000123-A }
        status: { $ref: '#/components/schemas/FulfillmentStatus' }
        amountCents: { type: integer }
        financeChargeId: { type: [string, 'null'], format: uuid }
        readyAt: { type: [string, 'null'], format: date-time }
        pickupDeadline: { type: [string, 'null'], format: date }
        remainingBusinessDays:
          type: [integer, 'null']
          description: |
            Computed by the SERVER against the school calendar, in the school's
            timezone. A client deriving it from the date would count Saturdays,
            and two clients in different timezones would disagree with the panel.
        deadlineLabel:
          type: [string, 'null']
          description: |
            The sentence to show, already written. Escalates with urgency and never
            says "0 days" or "1 days".
          examples:
            - Pasa a caja antes del viernes 12 de septiembre · te quedan 3 días hábiles
            - 'Último día: mañana, viernes 12 de septiembre'
            - Hoy es el último día para recoger tu pedido
        deadlineEstimated:
          type: boolean
          description: |
            The calendar was unreachable and the deadline was computed without it.
            Such deadlines may later be EXTENDED, never shortened.
        extendedDays: { type: integer }
        requiresAttention:
          type: boolean
          description: |
            No rule could settle this one — a payment that arrived after expiry,
            say. It surfaces in its own filter; silence is not an option.
        attentionReason: { type: string }

    Order:
      type: object
      required: [id, folio, source, label, totalCents, lines, fulfillments, createdAt]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: U-2026-000123 }
        studentId: { type: [string, 'null'], format: uuid }
        studentName:
          type: string
          description: Snapshot, so the panel filters and searches without calling the students service per row.
        studentLevel:
          type: string
          description: Snapshot of the student's level name at order time ("Preescolar").
        studentLevelId: { $ref: '#/components/schemas/LevelId' }
        studentGradeGroup: { type: string, example: 3° B }
        cycleId: { type: [string, 'null'], format: uuid }
        source: { type: string, enum: [family, counter, staff] }
        label: { $ref: '#/components/schemas/OrderLabel' }
        totalCents: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        fulfillments:
          type: array
          items: { $ref: '#/components/schemas/Fulfillment' }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }

    Settings:
      type: object
      required: [pickupWindowBusinessDays, autoCancelEnabled]
      properties:
        pickupWindowBusinessDays: { type: integer, minimum: 1, maximum: 90, default: 10 }
        autoCancelEnabled:
          type: boolean
          default: true
          description: |
            Lets a school stop automatic release entirely — during the
            back-to-school weeks, when nobody wants holds evaporating.
        maxExtensions: { type: integer, minimum: 0, maximum: 5, default: 2 }
        maxOpenOrdersPerStudent: { type: integer, minimum: 1, maximum: 50, default: 5 }
        maxLinesPerOrder: { type: integer, minimum: 1, maximum: 100, default: 20 }
        maxUnitsPerLine: { type: integer, minimum: 1, maximum: 20, default: 5 }
        maxLineExpiries:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
          description: |
            How many times one line may be reserved and let lapse before it stops
            being reservable. Without a ceiling, a family can hold the last unit
            of a size indefinitely, for free, by never coming to pay.
    LevelDeletionCounts:
      type: object
      description: Rows a level deletion reaches, by kind (ADR 0021).
      required: [gradeLevels, groups, subjects, terms, teachingAssignments, students, enrollments, attendanceMarks, monthlyGrades, reportCards, tuitionPlans, uniformItems, schoolEvents]
      properties:
        gradeLevels: { type: integer, format: int64, minimum: 0 }
        groups: { type: integer, format: int64, minimum: 0 }
        subjects: { type: integer, format: int64, minimum: 0 }
        terms: { type: integer, format: int64, minimum: 0 }
        teachingAssignments: { type: integer, format: int64, minimum: 0 }
        students: { type: integer, format: int64, minimum: 0, description: Pupils KEPT with their level cleared. }
        enrollments: { type: integer, format: int64, minimum: 0 }
        attendanceMarks: { type: integer, format: int64, minimum: 0 }
        monthlyGrades: { type: integer, format: int64, minimum: 0, description: 'Monthly grades captured before T15 (kept; no longer written).' }
        reportCards: { type: integer, format: int64, minimum: 0 }
        tuitionPlans: { type: integer, format: int64, minimum: 0 }
        uniformItems: { type: integer, format: int64, minimum: 0, description: 'Garments KEPT, left with no level (unresolved).' }
        schoolEvents: { type: integer, format: int64, minimum: 0 }
        enrollmentTransfers: { type: integer, format: int64, minimum: 0, description: Group changes of the level's enrollments. }
        attendanceSessions: { type: integer, format: int64, minimum: 0, description: Attendance lists taken. }
        gradeEntries: { type: integer, format: int64, minimum: 0, description: Per-term grades (the legacy capture). }
        periodGrades: { type: integer, format: int64, minimum: 0, description: Grades by evaluation period (T15). }
        periodClosures: { type: integer, format: int64, minimum: 0, description: Closed periods. }
      example: { gradeLevels: 3, groups: 6, subjects: 24, terms: 3, teachingAssignments: 24, students: 58, enrollments: 58, attendanceMarks: 4120, monthlyGrades: 1392, reportCards: 58, tuitionPlans: 1, uniformItems: 2, schoolEvents: 1 }
    LevelDeletionPreview:
      type: object
      required: [levelId, levelName, empty, counts, keeps, confirmToken, expiresAt]
      properties:
        levelId: { type: string, format: uuid }
        levelName: { type: string }
        empty: { type: boolean, description: 'No grade levels, no pupils and no enrollments.' }
        counts: { $ref: '#/components/schemas/LevelDeletionCounts' }
        keeps:
          type: object
          description: The money that stays untouched.
          required: [charges, payments]
          properties:
            charges: { type: integer, format: int64, minimum: 0 }
            payments: { type: integer, format: int64, minimum: 0 }
        confirmToken: { type: string, description: 'Signs these counts for this school and level; valid ten minutes.' }
        expiresAt: { type: string, format: date-time }
      example:
        levelId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        levelName: Maternal
        empty: false
        counts: { gradeLevels: 1, groups: 1, subjects: 0, terms: 3, teachingAssignments: 0, students: 12, enrollments: 12, attendanceMarks: 800, monthlyGrades: 0, reportCards: 0, tuitionPlans: 1, uniformItems: 0, schoolEvents: 0 }
        keeps: { charges: 120, payments: 96 }
        confirmToken: '<token-del-resumen>'
        expiresAt: '2026-09-28T10:10:00Z'
    DeleteLevelRequest:
      type: object
      required: [confirmName, confirmToken, password]
      properties:
        confirmName: { type: string, description: The level's name as typed by the director. }
        confirmToken: { type: string }
        password: { type: string, format: password, writeOnly: true }
    LevelDeletionResult:
      type: object
      required: [batchId, deletedAt, restorableUntil, counts]
      properties:
        batchId: { type: string, format: uuid }
        deletedAt: { type: string, format: date-time }
        restorableUntil: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/LevelDeletionCounts' }
      example:
        batchId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        deletedAt: '2026-09-28T10:05:00Z'
        restorableUntil: '2026-10-05T10:05:00Z'
        counts: { gradeLevels: 1, groups: 1, subjects: 0, terms: 3, teachingAssignments: 0, students: 12, enrollments: 12, attendanceMarks: 800, monthlyGrades: 0, reportCards: 0, tuitionPlans: 1, uniformItems: 0, schoolEvents: 0 }
    LevelTrashItem:
      type: object
      required: [batchId, levelId, levelName, deletedAt, restorableUntil, deletedByName, counts, status]
      properties:
        batchId: { type: string, format: uuid }
        levelId: { type: string, format: uuid }
        levelName: { type: string }
        deletedAt: { type: string, format: date-time }
        restorableUntil: { type: string, format: date-time }
        deletedByName: { type: string }
        counts: { $ref: '#/components/schemas/LevelDeletionCounts' }
        status: { type: string, enum: [deleted, failed_partial, restored_partial, restoring] }
    LevelRestoreResult:
      type: object
      required: [restored, skipped]
      properties:
        restored: { $ref: '#/components/schemas/LevelDeletionCounts' }
        skipped:
          type: array
          items:
            type: object
            required: [kind, count, reason]
            properties:
              kind: { type: string, example: enrollments }
              count: { type: integer, format: int64, minimum: 1 }
              reason: { type: string, example: el alumno ya está inscrito en otro grupo de ese ciclo }
