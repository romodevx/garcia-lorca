# García Lorca — local dev stack (hot reload).
#
# Brings up the whole backend + web on one network:
#   postgres (hardened app role) · pubsub emulator · 11 Go services · web (Next.js)
#
# Mobile (Expo) is NOT here by design — it runs natively against this stack.
# Use the Makefile: `make run`, `make run-new`, `make stop`, `make restart_<svc>`,
# `make start_<svc>`, `make logs_<svc>`, etc.

name: garcia-lorca

# ----------------------------------------------------------------------------
# Shared definitions for the 11 Go services. Each container runs the same dev
# image and is specialised by the SERVICE env var (the air entrypoint builds
# ./services/$SERVICE/cmd). Source is mounted, so edits hot-reload.
# ----------------------------------------------------------------------------
x-go-env: &go-env
  PORT: "8080"
  ADDR: ":8080"
  DATABASE_URL: "postgres://app:${APP_DB_PASSWORD}@postgres:5432/garcia_lorca?sslmode=disable"
  PUBSUB_EMULATOR_HOST: "pubsub:8085"
  # Must match the project the emulator starts with, or publishes land in a
  # different (invisible) project.
  PUBSUB_PROJECT_ID: "garcia-lorca-local"
  GOFLAGS: "-buildvcs=false"

x-go-service: &go-service
  build:
    context: .
    dockerfile: docker/go-dev.Dockerfile
  image: garcia-lorca-go-dev:local
  volumes:
    - .:/workspace
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks: [gl]
  restart: unless-stopped

services:
  # ---- Infra ---------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: garcia_lorca
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    # Host port is configurable to avoid clashing with another local Postgres
    # (another project's stack, a native install). Internal traffic always uses
    # the service name `postgres:5432`, so this only affects host-side tools.
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garcia_lorca"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [gl]
    restart: unless-stopped

  # Pupils' photos (task 5): the GCS emulator, so the students service talks to
  # the same client API it uses against the real private bucket. In-memory: a
  # restart empties it, which is fine for local work.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443"]
    networks: [gl]
    restart: unless-stopped

  pubsub:
    image: google/cloud-sdk:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=garcia-lorca-local --host-port=0.0.0.0:8085
    ports: ["8085:8085"]
    networks: [gl]
    restart: unless-stopped

  # ---- Migrations (one-shot) ----------------------------------------------
  # Applies migrations/**/*.sql as the superuser once Postgres is healthy, then
  # exits 0. Go services wait for it to complete so tables exist before boot.
  migrate:
    image: postgres:16-bookworm
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: garcia_lorca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_TEMP_PASSWORD: ${OWNER_TEMP_PASSWORD:-}
    volumes:
      - ./migrations:/migrations:ro
      - ./docker/apply-migrations.sh:/apply-migrations.sh:ro
      - ./docker/seed-owner.sql:/seed/owner.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gl]
    restart: "no"

  # ---- Go services (alpha order; gateway is the public edge) ---------------
  gateway:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: gateway
      IAM_BASE_URL: "http://iam:8080"
      STUDENTS_BASE_URL: "http://students:8080"
      CONFIG_BASE_URL: "http://config:8080"
      GRADES_BASE_URL: "http://grades:8080"
      FINANCE_BASE_URL: "http://finance:8080"
      ATTENDANCE_BASE_URL: "http://attendance:8080"
      COMMS_BASE_URL: "http://comms:8080"
      UNIFORMS_BASE_URL: "http://uniforms:8080"
      # student_import (legacy Excel migration, PLAN-student-import) is OFF by
      # default. To try it locally, append ",student_import" — it also needs
      # students + config ON, and the caller needs students:import (owner-only).
      ENABLED_MODULES: "iam,gateway,students,config,teachers,grades,finance,attendance,comms,uniforms,expenses,schedule,activities,scholarships"
      # Browser origin(s) allowed to call the gateway cross-origin with cookies.
      # Tracks WEB_HOST_PORT so a remapped web port stays permitted.
      WEB_ORIGIN: "http://localhost:${WEB_HOST_PORT:-3000}"
      # Level-deletion preview HMAC key (ADR 0021). Fixed, NON-secret dev value
      # so previews survive a gateway restart; shared envs use Secret Manager.
      LEVEL_DELETION_TOKEN_KEY: "${LEVEL_DELETION_TOKEN_KEY:-local-dev-level-deletion-key-not-a-secret-0021}"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      iam:
        condition: service_started
      config:
        condition: service_started
      grades:
        condition: service_started
      finance:
        condition: service_started
      attendance:
        condition: service_started
      comms:
        condition: service_started

  iam:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: iam
      # Identity Platform, for developing the provider sign-in path locally.
      # EMPTY BY DEFAULT: with no project named, iam's verifier stays nil and
      # LoginWithIDToken refuses, so the ordinary password login is untouched.
      # Export IDENTITY_PLATFORM_PROJECT before `make run` to switch it on.
      IDENTITY_PLATFORM_PROJECT: "${IDENTITY_PLATFORM_PROJECT:-}"
      # The Admin SDK authenticates with Application Default Credentials. Mounted
      # read-only from the host below; nothing is baked into the image.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # The WEB api key, used only to ask the provider to MAIL an invitation.
      # It is the same public key a browser would carry, and the only thing it
      # can do here is send a link to an address that already owns the account.
      # Empty is valid: sign-in still works and inviting says why it cannot.
      # Where an invitation link points. It has to be the address the browser
      # can actually reach, which locally is the host port, not the container's.
      # Getting this wrong produces a link that looks right and 404s.
      # The WEB api key. Public by design — it ships in the browser bundle — and
      # needed for exactly one thing: the temporary path where the provider
      # mails its own set-a-password link.
      IDENTITY_PLATFORM_API_KEY: "${IDENTITY_PLATFORM_API_KEY:-}"
      PUBLIC_WEB_URL: "http://localhost:${WEB_HOST_PORT:-3000}"
      # The relay that carries invitations. EMPTY IS A VALID STATE: with no
      # relay, inviting still works and reports the link so it can be handed
      # over by hand. Fill these in and the same button starts mailing, with no
      # code change — the school's own server when its credential arrives, any
      # authenticated relay before that.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Colegio García Lorca}"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # Read-only, and only for iam: no other service talks to the provider.
      - ${HOME}/.config/gcloud:/gcloud:ro
    ports: ["8091:8080"]

  students:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: students
      # The enroll knot validates group/term references against config by RPC.
      CONFIG_BASE_URL: "http://config:8080"
      # Guardian links validate the guardian user (existence + role) against iam
      # by RPC — server-to-server, network-private.
      IAM_BASE_URL: "http://iam:8080"
      # Pupils' photos: a private bucket, the emulator locally.
      PHOTOS_BUCKET: "garcia-lorca-student-photos-local"
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
    ports: ["8092:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config:
        condition: service_started
      iam:
        condition: service_started
      # student-events publishing needs the emulator reachable.
      pubsub:
        condition: service_started
      fake-gcs:
        condition: service_started

  config:
    <<: *go-service
    environment: { <<: *go-env, SERVICE: config }
    ports: ["8101:8080"]

  finance:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: finance
      # The ledger validates its references by RPC: config (school cycle) and
      # students (the debtor + the enrollments a bulk generation expands over).
      CONFIG_BASE_URL: "http://config:8080"
      STUDENTS_BASE_URL: "http://students:8080"
      # T10: expense receipts — a private bucket, the emulator locally.
      EXPENSE_RECEIPTS_BUCKET: "garcia-lorca-expense-receipts-local"
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
    ports: ["8093:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config:
        condition: service_started
      students:
        condition: service_started
      # payment-events publishing needs the emulator reachable.
      pubsub:
        condition: service_started
      fake-gcs:
        condition: service_started

  grades:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: grades
      # The capture knot + roster read config (teaching assignment + term) and
      # students (enrollments) by RPC — server-to-server, network-private.
      CONFIG_BASE_URL: "http://config:8080"
      STUDENTS_BASE_URL: "http://students:8080"
    ports: ["8094:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config:
        condition: service_started
      students:
        condition: service_started
      # grades-events publishing (GradesPublished after a period close, ADR 0020)
      # needs the emulator reachable; the broker env comes from x-go-env.
      pubsub:
        condition: service_started

  attendance:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: attendance
      # The roster comes from students (a group's enrollments) and the group
      # reference is validated against config — both by RPC, server-to-server
      # and network-private.
      CONFIG_BASE_URL: "http://config:8080"
      STUDENTS_BASE_URL: "http://students:8080"
    ports: ["8095:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config:
        condition: service_started
      students:
        condition: service_started
      # attendance-events publishing needs the emulator reachable.
      pubsub:
        condition: service_started

  comms:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: comms
      # Comms consumes payment-events, attendance-events and grades-events (its
      # consumedTopics; it get-or-creates comms-<topic> on the emulator). The
      # tenant is explicit here because an event belonging to another tenant is
      # dropped — a mismatch with the publishers would look like a silent stack
      # rather than a misconfiguration.
      COMMS_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      # A notification is pushed to the student's GUARDIANS' devices, and who
      # those guardians are is read from students by RPC — server-to-server,
      # network-private.
      STUDENTS_BASE_URL: "http://students:8080"
    ports: ["8096:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      students:
        condition: service_started
      # The subscriber loop needs the emulator reachable at startup: it
      # get-or-creates its own subscription per topic.
      pubsub:
        condition: service_started

  docs:
    <<: *go-service
    environment: { <<: *go-env, SERVICE: docs }
    ports: ["8097:8080"]

  uniforms:
    <<: *go-service
    # The shop needs students (who a pupil is) and finance (the money). Both are
    # reached in-network here; in Cloud Run these are the internal service URLs.
    environment:
      <<: *go-env
      SERVICE: uniforms
      STUDENTS_BASE_URL: "http://students:8080"
      FINANCE_BASE_URL: "http://finance:8080"
    ports: ["8099:8080"]
    depends_on: [postgres, students, finance]

  billing:
    <<: *go-service
    environment: { <<: *go-env, SERVICE: billing }
    ports: ["8100:8080"]

  # ---- Web (Next.js, hot reload) -------------------------------------------
  # Node image + install-at-start so no host node_modules leak into the linux
  # container (named volumes mask every node_modules path the monorepo uses).
  web:
    image: node:22-bookworm
    working_dir: /workspace
    command:
      - bash
      - -lc
      - "corepack enable pnpm && pnpm install --filter @garcia-lorca/web... --no-frozen-lockfile && pnpm --filter @garcia-lorca/web exec next dev -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      WATCHPACK_POLLING: "true"
      # These MUST track iam's IDENTITY_PLATFORM_* settings, and the half-set
      # state is worse than either end. With the provider on for iam but off
      # here, an invited person receives the provider's mail, sets a password at
      # Google, and then cannot sign in: the web asks for OUR password and the
      # user row has no hash. Nothing reports it — they simply bounce off the
      # login screen. Setting both, or neither, is the only coherent pair.
      NEXT_PUBLIC_AUTH_PROVIDER: "${NEXT_PUBLIC_AUTH_PROVIDER:-}"
      NEXT_PUBLIC_FIREBASE_API_KEY: "${IDENTITY_PLATFORM_API_KEY:-}"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "${IDENTITY_PLATFORM_PROJECT:-}.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "${IDENTITY_PLATFORM_PROJECT:-}"
    # Host port configurable to dodge another local dev server on 3000.
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    volumes:
      - .:/workspace
      - web-nm-root:/workspace/node_modules
      - web-nm-web:/workspace/apps/web/node_modules
      - web-nm-ui:/workspace/packages/ui/node_modules
      - web-nm-domain:/workspace/packages/domain/node_modules
      - web-nm-apiclient:/workspace/packages/api-client/node_modules
      - web-nm-config:/workspace/packages/config/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
      # pnpm puts its content-addressable store project-local (same FS as
      # node_modules, for hardlinks). Mask it with a volume so it never lands in
      # the bind-mounted host worktree.
      - web-pnpm-store-local:/workspace/.pnpm-store
    depends_on:
      gateway:
        condition: service_started
    networks: [gl]
    restart: unless-stopped

networks:
  gl:
    driver: bridge

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
  pnpm-store:
  web-nm-root:
  web-nm-web:
  web-nm-ui:
  web-nm-domain:
  web-nm-apiclient:
  web-nm-config:
  web-pnpm-store-local:
