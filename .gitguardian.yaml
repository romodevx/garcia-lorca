# GitGuardian — qué NO tiene sentido escanear en este repo.
#
# Por qué existe este archivo: los archivos de test están llenos de cosas con
# forma de credencial que no lo son, y cada una cuesta una alerta en el PR y un
# rato de alguien confirmando que un fixture es un fixture. Eso entrena a leer
# las alertas de GitGuardian como ruido, que es justo lo que no queremos el día
# que marque una de verdad.
#
# La otra mitad del trato, y la que importa más: los fixtures se CONSTRUYEN en
# tiempo de ejecución en vez de escribirse (ver testPassword en
# services/iam/internal/usecase/invitation_test.go y el equivalente en
# apps/web/app/_screens/admin/AdminScreen.test.tsx). Con eso no hay nada con
# forma de credencial en el código, así que esta lista es defensa en profundidad
# y no una alfombra bajo la que barrer.
#
# Lo que NO se excluye, a propósito: migraciones, terraform, docker-compose,
# workflows y cualquier archivo de configuración. Ahí un secreto sí sería un
# secreto.
#
# OJO: para la App de GitHub, la lista autoritativa vive en los ajustes del
# workspace de GitGuardian (Secrets detection → excluded filepaths). Este
# archivo lo respeta ggshield en local y en pre-commit; si las alertas siguen
# saliendo en el PR, hay que replicar estas rutas allí una vez.

version: 2

secret:
  ignored-paths:
    - "**/*_test.go"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/testdata/**"
    - "apps/web/e2e/**"
    - "**/*.example"
    - ".env.example"
