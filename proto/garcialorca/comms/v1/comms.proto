// Comms / Push (M10) — event consumer that fans domain events out to families.
//
// Comms PUBLISHES NOTHING. It subscribes over Pub/Sub to the domain events
// owned by other services — finance (PaymentRegistered, DebtOverdue),
// attendance (AbsenceRecorded, AttendanceMarked) and students
// (StudentEnrolled, AdmissionStatusChanged) — and those services' proto
// messages ARE the wire contract; comms never redefines them here.
//
// Its own API surface is therefore deliberately small: device registration
// (an FCM token per user) plus reading the notifications it has already
// materialised for a student. Sending is a side effect of consuming an event,
// never an RPC.
//
// Phase 9a scope: RegisterDevice + ListNotifications + MarkNotificationRead.
// The family agenda (AgendaEntry, ListAgenda) lands in a later phase — the
// FASE 0 `AgendaEntry` stub is dropped here rather than half-modelled.
syntax = "proto3";

package garcialorca.comms.v1;

import "google/protobuf/timestamp.proto";

// CommsService is the communications API surface.
service CommsService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // RegisterDevice registers (or refreshes) the FCM token a user's device is
  // reachable at. Re-registering the same token updates the existing device
  // rather than duplicating it (upsert), so a client may call this on every
  // launch. An unknown platform is InvalidArgument.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);

  // ListNotifications returns the notifications materialised for one student,
  // newest first. With unread_only=true only notifications whose read_at is
  // unset are returned.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  // MarkNotificationRead stamps a notification's read_at and returns the
  // updated notification. Marking an already-read notification is idempotent
  // (read_at keeps its original value).
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);

  // Announce sends one message to many families at once: a notification per
  // pupil, plus a push to the families that can be reached.
  //
  // The audience arrives as a list of pupils, already resolved. Comms does not
  // know what a group or a level is — the gateway owns that question, because it
  // already speaks to config and students.
  rpc Announce(AnnounceRequest) returns (AnnounceResponse);

  // UnregisterDevice removes a push token, but ONLY when it is registered to
  // user_id (T5: a family logging out of the app). A token registered to anyone
  // else, or not registered at all, is left untouched and answers the same
  // empty success, so the call is idempotent and reveals nothing.
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse);

  // RunBirthdays greets, in the family app, every enrolled pupil whose birthday
  // is `date` (T11). It is what Cloud Scheduler calls every morning (07:00
  // America/Mexico_City); the gateway does NOT expose it. Idempotent per pupil
  // and year: a second run the same day — a scheduler retry, a manual curl —
  // greets nobody twice. A pupil whose family has no account yet is skipped and
  // counted, not greeted into a feed nobody reads.
  rpc RunBirthdays(RunBirthdaysRequest) returns (RunBirthdaysResponse);

  // GetBirthdayTemplate returns the greeting the school sends, or the default
  // text while the school has not written its own.
  rpc GetBirthdayTemplate(GetBirthdayTemplateRequest) returns (GetBirthdayTemplateResponse);

  // UpdateBirthdayTemplate replaces the greeting. `{nombre}` is replaced by the
  // pupil's first name when it is sent. An empty or oversized text is
  // InvalidArgument.
  rpc UpdateBirthdayTemplate(UpdateBirthdayTemplateRequest) returns (UpdateBirthdayTemplateResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// Notification is one message materialised for a student from a consumed
// domain event. `type` is the stable client-facing KIND — one of
// "absence"|"attendance"|"payment"|"report_card" (T7)|"announcement"|"birthday" (T11) — which a client
// switches on for its icon;
// it is deliberately NOT the producing event's name, so an upstream contract
// change never reaches the client. `title` / `body` are the rendered push
// payload. `read_at` unset means the notification is still unread.
message Notification {
  string id = 1;
  string tenant_id = 2;
  string student_id = 3;
  string type = 4;
  string title = 5;
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp read_at = 8;
}

// Device is one push target for a user: the FCM token plus the platform it
// came from. `platform` is one of ""|ios|android|web (empty = unknown client).
message Device {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string fcm_token = 4;
  string platform = 5;
}

// --- RPC messages ---------------------------------------------------------

// RegisterDeviceRequest carries the token to register. `platform` is one of
// ""|ios|android|web; anything else is InvalidArgument.
message RegisterDeviceRequest {
  string user_id = 1;
  string fcm_token = 2;
  string platform = 3;
}

message RegisterDeviceResponse {
  Device device = 1;
}

// UnregisterDeviceRequest names the caller (user_id) and the token to remove.
message UnregisterDeviceRequest {
  string user_id = 1;
  string fcm_token = 2;
}

message UnregisterDeviceResponse {}

message ListNotificationsRequest {
  string student_id = 1;
  bool unread_only = 2;  // true = only notifications with read_at unset
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationReadRequest {
  string id = 1;
}

message MarkNotificationReadResponse {
  Notification notification = 1;
}

// AnnounceRequest is one message for many families.
message AnnounceRequest {
  repeated string student_ids = 1;
  string title = 2;
  string body = 3;
  // idempotency_key makes the send safe to retry. One announcement can reach
  // four hundred families; a phone buzzing twice for the same junta is what
  // makes a school turn notifications off for good.
  string idempotency_key = 4;
}

// AnnounceResponse reports how many families it actually reached — a retry
// reports zero, because it delivered nothing new.
message AnnounceResponse {
  int32 created = 1;
}

// RunBirthdaysRequest names the day to greet. Empty date = TODAY in the school's
// time zone (America/Mexico_City), which is what a schedule means; a date
// ("2026-10-01") lets QA and a manual recovery replay a given day.
message RunBirthdaysRequest {
  string date = 1;
}

// RunBirthdaysResponse reports what the run did. A re-run of the same day
// reports everybody as already_greeted.
message RunBirthdaysResponse {
  string date = 1;              // the day that was greeted, YYYY-MM-DD
  int32 greeted = 2;            // pupils greeted by THIS run
  int32 already_greeted = 3;    // greeted earlier this year (idempotent skip)
  int32 without_guardians = 4;  // no family account linked: nobody to greet
}

// BirthdayTemplate is the greeting the school sends. is_default is true while
// the school has not saved its own text.
message BirthdayTemplate {
  string title = 1;
  string body = 2;
  bool is_default = 3;
  google.protobuf.Timestamp updated_at = 4;  // unset while is_default
  string updated_by = 5;                     // iam user id; empty while is_default
}

message GetBirthdayTemplateRequest {}

message GetBirthdayTemplateResponse {
  BirthdayTemplate template = 1;
}

message UpdateBirthdayTemplateRequest {
  string title = 1;
  string body = 2;
  string updated_by = 3;  // the caller (gateway principal)
}

message UpdateBirthdayTemplateResponse {
  BirthdayTemplate template = 1;
}
