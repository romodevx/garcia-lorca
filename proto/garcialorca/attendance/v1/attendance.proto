// Attendance (M06) — daily pass list; absence events feed comms.
//
// Phase 8 (daily pass list): attendance is per (enrollment, date). The model is
// DEFAULT-PRESENT: the server stores only the exceptions (absent/late/excused),
// so a roster row with no stored mark reads back as "present". Saving a day is a
// reconcile — the client sends the full set of exceptions for the group·day and
// the server makes the stored state match it (marks removed from the set become
// present again).
//
// Dates are ISO "YYYY-MM-DD" strings (no time-of-day: attendance is per school
// day). Cross-service references (group_id, enrollment_id, student_id) are plain
// UUIDs validated by RPC, NOT foreign keys.
//
// QR check-in is DEFERRED to a later phase: this contract has no marked_by /
// method field, and every mark is a manual teacher/staff action.
//
// BREAKING CHANGE, deliberate (no ADR needed). Phase 8 reassigns field numbers on
// AttendanceRecord, AttendanceMarked and AbsenceRecorded. Those messages were
// FASE-0 stubs: they were never consumed by any client or subscriber, no wire
// data was ever produced from them, and `module_attendance` has never been
// enabled in any environment. Renumbering them pre-release keeps the released
// contract clean instead of carrying reserved gaps from a placeholder. Once this
// module ships behind an enabled flag, field numbers here are frozen and any
// further break requires a version bump plus an ADR (api-standards).
//
// T3 (per-class lists + sessions), ADDITIVE only: every list is now keyed by
// (group, date, subject_id). An empty subject_id is the DAILY list (one per group
// per day, the Phase 8 shape — existing rows keep a NULL subject); a subject_id is
// a PER_CLASS list. Which of the two a group uses is its level's attendance mode,
// enforced at the gateway; this service stores whichever key it is given. A saved
// list also records a SESSION (who took it, when), so a day where everybody was
// present is distinguishable from a day nobody took.
syntax = "proto3";

package garcialorca.attendance.v1;

import "google/protobuf/timestamp.proto";

// AttendanceService is the attendance API surface.
service AttendanceService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // GetDailyRoster returns one row per active enrollment in the group for the
  // given list (date + optional subject), each carrying the effective status and
  // note, plus the list's session when it has been taken. Rows with no
  // stored mark come back as "present" (default-present model). Student names
  // are NOT returned — attendance stays free of student PII; the web resolves
  // names from the students list.
  rpc GetDailyRoster(GetDailyRosterRequest) returns (GetDailyRosterResponse);

  // SaveDailyAttendance reconciles a whole list in one call. `marks` carry
  // ONLY the non-present exceptions; every enrollment in the group that is
  // absent from `marks` is reset to present (its stored mark, if any, is
  // dropped). Saving the same list again is idempotent and publishes nothing.
  rpc SaveDailyAttendance(SaveDailyAttendanceRequest) returns (SaveDailyAttendanceResponse);

  // ListAttendance lists a single enrollment's stored attendance records within
  // an inclusive date range. Only exceptions are stored, so present days are
  // absent from the result by construction. Returns at most 500 rows (most
  // recent first); explicit pagination is a follow-up.
  rpc ListAttendance(ListAttendanceRequest) returns (ListAttendanceResponse);

  // ListSessions lists which pass lists were TAKEN for a set of groups over an
  // inclusive date range, in one batched read (T5: the family per-day view tells
  // "present" from "nobody took the list"). Both bounds are required and span at
  // most 62 days; at most 20 group ids per call. Newest first, at most 2000 rows.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // SummarizeAttendance counts one group's attendance over an inclusive date
  // range (T12 report): how many lists were taken for the group (daily and
  // per-class alike) and, for every pupil who was in the group during the
  // range, the lists taken while they were in it and their absent, late and
  // excused marks on them. Present is what is left (default-present model).
  // Both bounds are required and span at most 366 days.
  rpc SummarizeAttendance(SummarizeAttendanceRequest) returns (SummarizeAttendanceResponse);

  // --- level deletion (ADR 0021) ---
  // PreviewLevelDeletion counts what deleting a level would archive in this
  // service, without changing anything. The scope comes from config (structure
  // ids) and students (enrollment/student ids); each service uses the ids it
  // owns data for.
  rpc PreviewLevelDeletion(PreviewLevelDeletionRequest) returns (PreviewLevelDeletionResponse);
  // ArchiveLevel moves this service's rows of the level into its deletion
  // archive (a JSONB copy, then DELETE) inside ONE tenant-bound transaction.
  // Idempotent per batch_id: a repeated call answers the first call's counts.
  rpc ArchiveLevel(ArchiveLevelRequest) returns (ArchiveLevelResponse);
  // RestoreLevelBatch puts a batch back in dependency order inside ONE
  // transaction, skipping rows that now conflict and reporting them.
  // Converges on retry: rows put back leave the archive, rows that do not fit
  // stay archived (until the purge) and a retry tries them again; a batch with
  // nothing left answers its last report. NotFound when this service holds no
  // archive for the batch (never archived, or purged) — never a silent success.
  rpc RestoreLevelBatch(RestoreLevelBatchRequest) returns (RestoreLevelBatchResponse);
  // PurgeLevelArchives hard-deletes archives past the 7-day retention. The
  // retention is fixed server-side: no caller can purge fresh trash.
  rpc PurgeLevelArchives(PurgeLevelArchivesRequest) returns (PurgeLevelArchivesResponse);
  // PurgeLevelBatch hard-deletes this service's archive rows of one batch, when
  // the gateway's sweep finds the batch past its restorable_until (config's
  // clock, ADR 0021). Idempotent: an unknown batch purges nothing.
  rpc PurgeLevelBatch(PurgeLevelBatchRequest) returns (PurgeLevelBatchResponse);

  // --- group corrections (T8, ADR 0036) ---
  // GroupUsage counts the pass lists taken in one config group and the marks
  // stamped with it. The gateway refuses to delete a group while any is
  // non-zero.
  rpc GroupUsage(GroupUsageRequest) returns (GroupUsageResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// AttendanceRecord is one stored attendance exception for an enrollment on a
// date. `date` is ISO "YYYY-MM-DD"; `status` is one of absent|late|excused
// (present is never stored — see the default-present model). `note` is an
// optional free-text justification and may be empty.
message AttendanceRecord {
  string id = 1;
  string enrollment_id = 2;
  string date = 3;
  string status = 4;
  string note = 5;
  // subject_id is the per-class subject the mark belongs to; empty for a daily
  // list's mark.
  string subject_id = 6;
}

// AttendanceSession records that a list was taken: taken_at/taken_by_name are the
// FIRST save of the list, updated_at the latest correction.
message AttendanceSession {
  google.protobuf.Timestamp taken_at = 1;
  string taken_by_name = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// RosterRow is one student's slot in a day's pass list: the enrollment, the
// student it belongs to, and the effective status for that day. `status` is one
// of present|absent|late|excused and defaults to "present" when no mark exists.
message RosterRow {
  string enrollment_id = 1;
  string student_id = 2;
  string status = 3;
  // note is the stored mark's justification; empty for a present row.
  string note = 4;
}

// Mark is one exception submitted for a group·day. `status` is normally one of
// absent|late|excused; "present" is also accepted and CLEARS the stored row for
// that enrollment (an explicit revert to default-present), which is equivalent to
// omitting the enrollment from `marks`. `note` is an optional free-text
// justification, capped at 500 characters.
message Mark {
  string enrollment_id = 1;
  string status = 2;
  string note = 3;
}

// --- RPC messages ---------------------------------------------------------

// GetDailyRosterRequest asks for a group's pass list on one date
// (ISO "YYYY-MM-DD"). subject_id selects a per-class list; empty is the daily
// list.
message GetDailyRosterRequest {
  string group_id = 1;
  string date = 2;
  string subject_id = 3;
}

// GetDailyRosterResponse carries the rows and, when the list has been taken, its
// session (unset for a list nobody has saved yet).
message GetDailyRosterResponse {
  repeated RosterRow rows = 1;
  AttendanceSession session = 2;
  // no_classes is true when the date is not a school day of the group's cycle
  // (weekend, outside the cycle, or a closed day): the list may be read but a
  // save is refused (InvalidArgument, X-Error-Code NO_CLASSES).
  bool no_classes = 3;
}

// SaveDailyAttendanceRequest reconciles one group·day. `marks` is the COMPLETE
// set of exceptions for that day; anything not listed is present.
//
// subject_id selects a per-class list (empty = daily). taken_by (user UUID) and
// taken_by_name (display name) are REQUIRED: they are stamped on the session.
// A correction updates the stored rows in place and publishes events only for
// what changed (a new exception, a changed status, or an exception cleared back
// to present — announced as AttendanceMarked with status "present").
message SaveDailyAttendanceRequest {
  string group_id = 1;
  string date = 2;
  repeated Mark marks = 3;
  string subject_id = 4;
  string taken_by = 5;
  string taken_by_name = 6;
  // subject_name is the per-class list's display label (T5), carried on the
  // events this save publishes so comms can say WHICH class a student missed.
  // It is NOT stored. Optional; ignored for a daily list; at most 200 chars.
  string subject_name = 7;
}

// SaveDailyAttendanceResponse reports the state after reconciling:
// `absent_count` is how many of the stored marks are status "absent";
// `marked_count` is how many exceptions are stored for the day in total.
// Both count what THIS list stored, never what was submitted: a submitted
// mark for a pupil whose day·subject another group's list already holds (a
// transferred pupil on a day before the move) is not stored and not counted.
// `held_elsewhere` lists those skipped enrollment ids, ascending, so the
// client can tell the taker which marks did not land.
message SaveDailyAttendanceResponse {
  int32 absent_count = 1;
  int32 marked_count = 2;
  repeated string held_elsewhere = 3;
}

// ListAttendanceRequest bounds the query by enrollment and an inclusive date
// range (both ISO "YYYY-MM-DD").
message ListAttendanceRequest {
  string enrollment_id = 1;
  string from_date = 2;
  string to_date = 3;
}

message ListAttendanceResponse {
  repeated AttendanceRecord records = 1;
}

// ListSessionsRequest bounds the query by groups and an inclusive date range
// (both ISO "YYYY-MM-DD", both required).
message ListSessionsRequest {
  repeated string group_ids = 1;
  string from_date = 2;
  string to_date = 3;
}

// TakenList is one list that was taken: its group, day and subject (empty for
// the daily list).
message TakenList {
  string group_id = 1;
  string date = 2;
  string subject_id = 3;
}

message ListSessionsResponse {
  repeated TakenList lists = 1;
}

// SummarizeAttendanceRequest names the group and the inclusive range (both
// ISO "YYYY-MM-DD", both required).
message SummarizeAttendanceRequest {
  string group_id = 1;
  string from_date = 2;
  string to_date = 3;
}

// StudentAttendanceCount is one pupil's line: the group's lists taken while
// they were in it (from enrolling, or their latest move into the group, to
// leaving it) and their exceptions on those lists. Present is lists minus the
// exceptions.
message StudentAttendanceCount {
  string enrollment_id = 1;
  string student_id = 2;
  int32 absent = 3;
  int32 late = 4;
  int32 excused = 5;
  int32 lists = 6;
  // active is false for a pupil who left the group (withdrew) in the range.
  bool active = 7;
}

// SummarizeAttendanceResponse: lists_taken is how many lists of the group were
// taken in the range; counts has one entry per pupil who was in the group at
// some point of the range (withdrawn ones included), ordered by enrollment id,
// zeros included.
message SummarizeAttendanceResponse {
  int32 lists_taken = 1;
  repeated StudentAttendanceCount counts = 2;
}

// --- Domain events (published) --------------------------------------------

// AttendanceMarked fires when a student's mark CHANGES on a list: a new
// exception, a changed status, or (status "present") a stored exception cleared
// by a correction. Re-saving an unchanged list publishes nothing. `subject_id`
// is empty for a daily list.
message AttendanceMarked {
  string record_id = 1;
  string enrollment_id = 2;
  string student_id = 3;
  string tenant_id = 4;
  string date = 5;
  string status = 6;
  string subject_id = 7;
  // mark_version is the stored mark's revision this event announces: every
  // stored change of a mark (per record_id) yields a strictly greater version,
  // and a mark cleared to present carries its last revision + 1. Consumers
  // dedupe on (record_id, mark_version), so a correction is a NEW event while a
  // redelivery of the same one is not. 0 means unset (a pre-versioning event).
  int64 mark_version = 8;
  // subject_name is the per-class list's display label as the saver's edge
  // resolved it (T5); empty for a daily list or when it was not resolvable.
  string subject_name = 9;
  // previous_status is the stored status this change replaced (absent, late or
  // excused) when the mark was CORRECTED in place or cleared; empty for a new
  // exception or when unknown. Consumers render a change between two
  // exceptions (absent → late) as a correction, not as a fresh event.
  string previous_status = 10;
}

// AbsenceRecorded fires when a student is recorded absent on a date (feeds
// comms M10). It is the absent-only companion of AttendanceMarked.
message AbsenceRecorded {
  string record_id = 1;
  string enrollment_id = 2;
  string student_id = 3;
  string tenant_id = 4;
  string date = 5;
  string subject_id = 6;
  // mark_version is the stored mark's revision this event announces: every
  // stored change of a mark (per record_id) yields a strictly greater version,
  // and a mark cleared to present carries its last revision + 1. Consumers
  // dedupe on (record_id, mark_version), so a correction is a NEW event while a
  // redelivery of the same one is not. 0 means unset (a pre-versioning event).
  int64 mark_version = 7;
  // subject_name: see AttendanceMarked.subject_name.
  string subject_name = 8;
  // previous_status: see AttendanceMarked.previous_status (late → absent).
  string previous_status = 9;
}

// --- level deletion (ADR 0021) ---------------------------------------------

// LevelScope is everything a level deletion reaches, resolved by the gateway
// from config (structure) and students (people). Every id is a uuid; a service
// reads only the fields it owns data for.
message LevelScope {
  string level_id = 1;
  repeated string grade_level_ids = 2;
  repeated string group_ids = 3;
  repeated string subject_ids = 4;
  repeated string term_ids = 5;
  repeated string enrollment_ids = 6;
  repeated string student_ids = 7;
}

// LevelArchiveCount is how many rows of one kind a level deletion touches.
message LevelArchiveCount {
  string kind = 1;
  int64 count = 2;
}

// LevelRestoreSkip is rows of one kind a restore could not put back, and why.
message LevelRestoreSkip {
  string kind = 1;
  int64 count = 2;
  string reason = 3;
}

message PreviewLevelDeletionRequest {
  LevelScope scope = 1;
}

message PreviewLevelDeletionResponse {
  repeated LevelArchiveCount counts = 1;
}

message ArchiveLevelRequest {
  // batch_id is the saga's idempotency key (a uuid minted by the gateway).
  string batch_id = 1;
  LevelScope scope = 2;
}

message ArchiveLevelResponse {
  repeated LevelArchiveCount counts = 1;
}

message RestoreLevelBatchRequest {
  string batch_id = 1;
  // skip_enrollment_ids are enrollments students could NOT restore: their rows
  // stay archived (reported as skipped) instead of coming back orphaned.
  repeated string skip_enrollment_ids = 2;
}

message RestoreLevelBatchResponse {
  repeated LevelArchiveCount restored = 1;
  repeated LevelRestoreSkip skipped = 2;
}

message PurgeLevelArchivesRequest {}

message PurgeLevelArchivesResponse {
  int64 purged_rows = 1;
}

message PurgeLevelBatchRequest {
  string batch_id = 1;
}

message PurgeLevelBatchResponse {
  int64 purged_rows = 1;
}

// --- group corrections (T8) -------------------------------------------------

message GroupUsageRequest {
  string group_id = 1;
}

message GroupUsageResponse {
  int64 sessions = 1;
  int64 marks = 2;
}
