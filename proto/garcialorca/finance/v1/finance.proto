// Finance / Adeudos (M05) — charge concepts, charges, and the payment ledger.
//
// Phase 7 (finance core): the school defines its own charge concepts
// (colegiatura, inscripción, uniformes, …), charges are issued against a
// student's enrollment in a cycle — one at a time or generated in bulk for a
// whole cycle/group — and payments are applied against those charges.
// Cross-service references (student_id, cycle_id, group_id) are plain UUIDs
// validated by RPC, NOT foreign keys.
//
// MONEY IS ALWAYS INTEGER CENTS (int64). Never a float/double.
//
// CONTPAQi XML export (spike S02) remains a stub — Phase 7b.
syntax = "proto3";

package garcialorca.finance.v1;

import "google/protobuf/timestamp.proto";

// FinanceService is the finance/debt API surface.
service FinanceService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // --- Concepts ---

  // CreateConcept registers a charge concept in the tenant's catalog.
  rpc CreateConcept(CreateConceptRequest) returns (CreateConceptResponse);

  // ListConcepts lists the tenant's charge concepts. Only active concepts are
  // returned unless include_inactive is set.
  rpc ListConcepts(ListConceptsRequest) returns (ListConceptsResponse);

  // UpdateConcept edits a charge concept (full replace of the mutable fields,
  // including active — deactivating hides it from new charges). Charges already
  // issued from the concept are untouched.
  rpc UpdateConcept(UpdateConceptRequest) returns (UpdateConceptResponse);

  // --- Charges ---

  // CreateCharge issues a single charge against a student's enrollment in a
  // cycle. Amount and description default to the concept's when not overridden.
  rpc CreateCharge(CreateChargeRequest) returns (CreateChargeResponse);

  // GenerateCharges issues one charge per ACTIVE enrollment in the cycle,
  // optionally narrowed to a single group. Idempotent: a student who already
  // has a charge for the same (concept, cycle) is skipped, so the call can be
  // safely retried. (Re-issuing a recurring concept within a cycle is a later
  // phase — see the monthly-recurrence follow-up.)
  rpc GenerateCharges(GenerateChargesRequest) returns (GenerateChargesResponse);

  // ListCharges lists charges filtered by student and/or cycle (each filter is
  // independent; empty = any). AT LEAST ONE is required: an unscoped read would
  // return the tenant's whole ledger, so it is rejected as INVALID_ARGUMENT.
  // Returns at most 500 rows (earliest due first); explicit pagination is a
  // follow-up.
  rpc ListCharges(ListChargesRequest) returns (ListChargesResponse);

  // PreviewWithdrawal projects charges due strictly after the withdrawal date
  // with no payments, and the unpaid balance due on or before that date.
  rpc PreviewWithdrawal(PreviewWithdrawalRequest) returns (PreviewWithdrawalResponse);

  // ApplyDiscount sets the discount on a charge (beca, convenio, ajuste). The
  // discount cannot exceed the charge amount; the remaining balance and status
  // are recomputed server-side.
  rpc ApplyDiscount(ApplyDiscountRequest) returns (ApplyDiscountResponse);

  // CancelCharge voids a charge. A cancelled charge stops counting toward the
  // account balance and can no longer receive payments.
  rpc CancelCharge(CancelChargeRequest) returns (CancelChargeResponse);

  // CancelChargeIfUnpaid voids a charge ONLY if nothing was collected against
  // it, decided under the charge's row lock. It is the variant an automated
  // caller needs: the uniforms expiry sweep voids the charge behind a lapsed
  // hold while a cashier may be collecting that exact payment, and it must lose
  // that race loudly (FailedPrecondition) rather than void collected money.
  rpc CancelChargeIfUnpaid(CancelChargeIfUnpaidRequest) returns (CancelChargeIfUnpaidResponse);

  // --- Payments + account ---

  // RegisterPayment applies a payment to a charge and returns the payment plus
  // the charge with its recomputed paid/remaining/status. Overpaying a charge
  // or paying a cancelled charge is InvalidArgument.
  rpc RegisterPayment(RegisterPaymentRequest) returns (RegisterPaymentResponse);

  // GetAccount returns a student's account statement: every charge, every
  // payment, and the total outstanding balance.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // GetStatement returns a student's ledger (T7): every movement in date
  // order with the running balance, and its totals. The one computation the
  // office, the parents' app and the PDF all read.
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);

  // ListOverdue lists charges past their due date with a remaining balance,
  // optionally filtered by cycle. Cancelled and fully paid charges are excluded.
  // Returns at most 500 rows (earliest due first); explicit pagination is a
  // follow-up.
  rpc ListOverdue(ListOverdueRequest) returns (ListOverdueResponse);

  // --- deposits (M16: money that arrives before it is decided what it pays) ---
  // RegisterDeposit takes an amount without being told what it covers, and
  // splits it across what the family owes: oldest first, surcharges included,
  // and whatever is left stays as their credit.
  rpc RegisterDeposit(RegisterDepositRequest) returns (RegisterDepositResponse);
  // PreviewDeposit says what an amount WOULD cover, without taking it. Same
  // rule, same order, same arithmetic as RegisterDeposit, and it writes nothing
  // — so a cashier can tell a parent what their money pays for before it
  // changes hands. A projection, not a promise: the charges are read without a
  // lock, so a payment landing in between changes the answer.
  rpc PreviewDeposit(PreviewDepositRequest) returns (PreviewDepositResponse);
  // ExpectedToday is what a family must hand over today to be current: the
  // months already due (and the one due later this month, which is how the
  // early-payment reward is earned), what being late has cost, and what paying
  // early saves. The counter shows it and never lets anybody edit it.
  rpc ExpectedToday(ExpectedTodayRequest) returns (ExpectedTodayResponse);
  // ListDeposits returns a student's deposits, newest first.
  rpc ListDeposits(ListDepositsRequest) returns (ListDepositsResponse);
  // DailyCashUp is the day's takings: one number per method, the total, and the
  // list behind them. The artefact that replaces the notebook — at close of day
  // the office can say what came in without adding anything up by hand.
  rpc DailyCashUp(DailyCashUpRequest) returns (DailyCashUpResponse);
  // IncomeByConcept is what the school earned in a period, by what it charged
  // for. Counted on the day the money changed hands, not the day the charge was
  // issued: the two are months apart for anyone paying late.
  rpc IncomeByConcept(IncomeByConceptRequest) returns (IncomeByConceptResponse);
  // VoidDeposit cancels a deposit and releases what it settled. The row stays,
  // with its reason: a school that deletes money rows cannot explain its ledger.
  rpc VoidDeposit(VoidDepositRequest) returns (VoidDepositResponse);
  // GetDepositReceipt returns a deposit and what it paid, concept by concept,
  // for its receipt (task 12). A voided deposit comes back with no lines.
  rpc GetDepositReceipt(GetDepositReceiptRequest) returns (GetDepositReceiptResponse);
  // CorrectDeposit corrects a registered payment (T9): the original is kept,
  // superseded and counting for nothing; a new deposit with its own folio
  // carries the corrected amount, date, tenders and charges, split by the same
  // rule on the corrected date; the history records before, after, who, when
  // and why (the reason is required). Idempotent by idempotency_key. A
  // cancelled or already corrected deposit is a conflict (AlreadyExists).
  rpc CorrectDeposit(CorrectDepositRequest) returns (CorrectDepositResponse);
  // ListDepositCorrections is the correction history of a deposit: every
  // correction in its chain, oldest first.
  rpc ListDepositCorrections(ListDepositCorrectionsRequest) returns (ListDepositCorrectionsResponse);

  // --- expenses and the cash cut (T10, ADR 0027) ---
  // The categories an expense is filed under. Configurable; deactivated, never
  // deleted, because recorded expenses keep pointing at them.
  rpc CreateExpenseCategory(CreateExpenseCategoryRequest) returns (CreateExpenseCategoryResponse);
  rpc ListExpenseCategories(ListExpenseCategoriesRequest) returns (ListExpenseCategoriesResponse);
  rpc UpdateExpenseCategory(UpdateExpenseCategoryRequest) returns (UpdateExpenseCategoryResponse);
  // CreateExpense records money the school paid out. Every change to it is an
  // event in its history; it is cancelled, never deleted.
  rpc CreateExpense(CreateExpenseRequest) returns (CreateExpenseResponse);
  rpc UpdateExpense(UpdateExpenseRequest) returns (UpdateExpenseResponse);
  rpc CancelExpense(CancelExpenseRequest) returns (CancelExpenseResponse);
  // ListExpenses lists the expenses dated between two days (both inclusive),
  // newest first, at most 500.
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  // GetExpense is one expense and its history, oldest event first.
  rpc GetExpense(GetExpenseRequest) returns (GetExpenseResponse);
  // The receipt (comprobante) attached to an expense: JPEG, PNG or PDF judged
  // by its bytes, at most 5 MB, kept in a private bucket.
  rpc AttachExpenseReceipt(AttachExpenseReceiptRequest) returns (AttachExpenseReceiptResponse);
  rpc GetExpenseReceipt(GetExpenseReceiptRequest) returns (GetExpenseReceiptResponse);
  rpc RemoveExpenseReceipt(RemoveExpenseReceiptRequest) returns (RemoveExpenseReceiptResponse);
  // FinanceSummary is a period's money: income and expenses by method and the
  // balance between them. Credit notes are not income and come apart.
  rpc FinanceSummary(FinanceSummaryRequest) returns (FinanceSummaryResponse);
  // CloseCashCut closes a day's cut with the cash counted in the drawer: a
  // snapshot of what was expected, what was counted and the difference.
  rpc CloseCashCut(CloseCashCutRequest) returns (CloseCashCutResponse);
  // ReopenCashCut reopens a closed day (with a reason) so it can be closed
  // again. The earlier closure stays in the history.
  rpc ReopenCashCut(ReopenCashCutRequest) returns (ReopenCashCutResponse);

  // --- activities (T17, ADR 0031) ---
  // Extracurricular activities with their schedule, price options (per days a
  // week, or flat) and periodicity. Their charges are issued by RunBilling.
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  // UpdateActivity replaces the fields and the price options; an option left
  // out is retired, refused while an enrolled pupil uses it.
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  // ListActivityEnrollments is who is enrolled today.
  rpc ListActivityEnrollments(ListActivityEnrollmentsRequest) returns (ListActivityEnrollmentsResponse);
  // EnrollInActivity enrols pupils (each with its option) and charges the
  // periods already billable.
  rpc EnrollInActivity(EnrollInActivityRequest) returns (EnrollInActivityResponse);
  // UnenrollFromActivity stops future periods; issued charges never change.
  rpc UnenrollFromActivity(UnenrollFromActivityRequest) returns (UnenrollFromActivityResponse);
  rpc ChangeActivityOption(ChangeActivityOptionRequest) returns (ChangeActivityOptionResponse);

  // --- scholarships (T18, ADR 0022) ---
  // Becas: a percent off, a fixed amount off or a fixed amount to pay, on the
  // inscription, the tuition, catalog concepts and activities. What one takes
  // off a charge is worked out on every read and payment, never stored until
  // the charge is settled under it.
  rpc ListScholarships(ListScholarshipsRequest) returns (ListScholarshipsResponse);
  rpc GetScholarship(GetScholarshipRequest) returns (GetScholarshipResponse);
  rpc CreateScholarship(CreateScholarshipRequest) returns (CreateScholarshipResponse);
  // UpdateScholarship replaces its terms; what it already settled keeps them.
  rpc UpdateScholarship(UpdateScholarshipRequest) returns (UpdateScholarshipResponse);
  // ListScholarshipTargets is what a scholarship can apply to today.
  rpc ListScholarshipTargets(ListScholarshipTargetsRequest) returns (ListScholarshipTargetsResponse);
  // ListScholarshipHolders is who holds one now, with their overlaps.
  rpc ListScholarshipHolders(ListScholarshipHoldersRequest) returns (ListScholarshipHoldersResponse);
  rpc AssignScholarship(AssignScholarshipRequest) returns (AssignScholarshipResponse);
  // UnassignScholarship gives the pupils' pending charges their price back.
  rpc UnassignScholarship(UnassignScholarshipRequest) returns (UnassignScholarshipResponse);

  // --- tuition (M15: what each level costs, and the monthly run) ---
  // UpsertTuitionPlan sets (or replaces) the tuition table for one level of one
  // cycle. Keyed by (cycle, level): a school raises tuition each year, and the
  // old year must keep reconciling against its own table.
  rpc UpsertTuitionPlan(UpsertTuitionPlanRequest) returns (UpsertTuitionPlanResponse);

  // ListTuitionPlans returns the whole tuition table of a cycle.
  rpc ListTuitionPlans(ListTuitionPlansRequest) returns (ListTuitionPlansResponse);

  // RunBilling generates everything the school is owed as of a date: the monthly
  // tuition whose due date has arrived, the inscription of anybody enrolled
  // without one, and one fixed surcharge per completed overdue month.
  //
  // It is IDEMPOTENT — every charge it writes carries an external_ref that is
  // unique per tenant — so a button and a scheduler may both call it, and calling
  // it twice on the same day charges nobody twice.
  rpc RunBilling(RunBillingRequest) returns (RunBillingResponse);

  // DrainOutbox publishes the events waiting in the outbox and reports how many
  // went out.
  //
  // A payment drains straight after committing, so the ordinary case needs
  // nobody. This exists for the case that ordinary path cannot cover: the broker
  // was down, or the container died between the commit and the send. A scheduler
  // calls it on a timer, and an empty queue is the normal answer.
  rpc DrainOutbox(DrainOutboxRequest) returns (DrainOutboxResponse);

  // ExportContpaqi produces a CONTPAQi-format XML export (spike S02).
  // TODO(M05/S02): real field mapping + period/account filters.
  rpc ExportContpaqi(ExportContpaqiRequest) returns (ExportContpaqiResponse);

  // --- level deletion (ADR 0021) ---
  // PreviewLevelDeletion counts what deleting a level would archive in this
  // service, without changing anything. The scope comes from config (structure
  // ids) and students (enrollment/student ids); each service uses the ids it
  // owns data for.
  rpc PreviewLevelDeletion(PreviewLevelDeletionRequest) returns (PreviewLevelDeletionResponse);
  // ArchiveLevel moves this service's rows of the level into its deletion
  // archive (a JSONB copy, then DELETE) inside ONE tenant-bound transaction.
  // Idempotent per batch_id: a repeated call answers the first call's counts.
  rpc ArchiveLevel(ArchiveLevelRequest) returns (ArchiveLevelResponse);
  // RestoreLevelBatch puts a batch back in dependency order inside ONE
  // transaction, skipping rows that now conflict and reporting them.
  // Converges on retry: rows put back leave the archive, rows that do not fit
  // stay archived (until the purge) and a retry tries them again; a batch with
  // nothing left answers its last report. NotFound when this service holds no
  // archive for the batch (never archived, or purged) — never a silent success.
  rpc RestoreLevelBatch(RestoreLevelBatchRequest) returns (RestoreLevelBatchResponse);
  // PurgeLevelArchives hard-deletes archives past the 7-day retention. The
  // retention is fixed server-side: no caller can purge fresh trash.
  rpc PurgeLevelArchives(PurgeLevelArchivesRequest) returns (PurgeLevelArchivesResponse);
  // PurgeLevelBatch hard-deletes this service's archive rows of one batch, when
  // the gateway's sweep finds the batch past its restorable_until (config's
  // clock, ADR 0021). Idempotent: an unknown batch purges nothing.
  rpc PurgeLevelBatch(PurgeLevelBatchRequest) returns (PurgeLevelBatchResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// ChargeConcept is a school-defined billable concept (colegiatura, inscripción,
// uniformes, …). `default_amount_cents` is the amount used when a charge does
// not override it. `recurrence` is "once" or "monthly" — it documents the
// concept's intent; issuing the charges is always an explicit call.
message ChargeConcept {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  int64 default_amount_cents = 4;
  string recurrence = 5;
  bool active = 6;
  // What the concept IS, independent of what the school called it:
  // "custom" | "tuition" | "enrollment" | "late_fee". At most one of each
  // system kind per school; the billing run finds its concepts by this, so
  // renaming "Colegiatura" cannot stop a school being billed.
  string kind = 7;
}

// Charge is one debt owed by a student for a concept in a cycle.
// `paid_cents` and `remaining_cents` are DERIVED server-side and never
// client-supplied: paid = sum of the charge's payments,
// remaining = amount_cents - discount_cents - paid_cents.
// `status` is one of: pending | partially_paid | paid | cancelled.
// `due_date` is an ISO date, "YYYY-MM-DD".
message Charge {
  string id = 1;
  string tenant_id = 2;
  string student_id = 3;
  string cycle_id = 4;
  string concept_id = 5;
  string description = 6;
  int64 amount_cents = 7;
  int64 discount_cents = 8;
  string due_date = 9;
  string status = 10;
  int64 paid_cents = 11;
  int64 remaining_cents = 12;
  // external_ref ties this charge to the row that caused it in another module
  // (e.g. a uniforms fulfillment). Empty for the school's own charges, which is
  // what keeps the "one concept per cycle" rule applying to them alone.
  string external_ref = 13;
  // starts_on is the first day the charge opens to the family (YYYY-MM-DD,
  // T5). Empty is open from the day it was issued.
  string starts_on = 14;
  // scholarship_cents is the scholarship's part (T18): written when the charge
  // was settled under it, or worked out today on a read. remaining_cents is
  // already net of it.
  int64 scholarship_cents = 15;
  string scholarship_id = 16;
}

// Payment is one amount applied to a charge. `method` is one of:
// cash | card | transfer | credit_note (T8: a credit note the school issued by
// hand — it settles debt but is not money). `reference` is the folio / "con qué se pagó"
// (transfer id, card voucher, receipt number) — free text.
message Payment {
  string id = 1;
  string tenant_id = 2;
  string charge_id = 3;
  int64 amount_cents = 4;
  string method = 5;
  string reference = 6;
  google.protobuf.Timestamp paid_at = 7;
  // debit | credit on a card payment (T8), empty otherwise.
  string card_type = 8;
  // The deposit this payment is a slice of (T9: what a correction preselects);
  // empty for a payment made straight against its charge.
  string deposit_id = 9;
}

// --- Concept RPC messages -------------------------------------------------

message CreateConceptRequest {
  string name = 1;
  int64 default_amount_cents = 2;
  // recurrence is "once" or "monthly".
  string recurrence = 3;
}

message CreateConceptResponse {
  ChargeConcept concept = 1;
}

message ListConceptsRequest {
  // include_inactive false (default) returns only active concepts.
  bool include_inactive = 1;
}

message ListConceptsResponse {
  repeated ChargeConcept concepts = 1;
}

message UpdateConceptRequest {
  string id = 1;
  string name = 2;
  int64 default_amount_cents = 3;
  string recurrence = 4;
  bool active = 5;
}

message UpdateConceptResponse {
  ChargeConcept concept = 1;
}

// --- Charge RPC messages --------------------------------------------------

// CreateChargeRequest issues one charge. The overrides let the school deviate
// from the concept's defaults for a single student without editing the concept.
message CreateChargeRequest {
  string student_id = 1;
  // cycle_id may be empty only together with external_ref: another module's
  // sale to a pupil not yet placed in a group (task 10). The school's own
  // charges always name their cycle.
  string cycle_id = 2;
  string concept_id = 3;
  // amount_cents_override 0 ⇒ use the concept's default_amount_cents.
  int64 amount_cents_override = 4;
  // description_override empty ⇒ use the concept's name.
  string description_override = 5;
  // due_date is an ISO date, "YYYY-MM-DD".
  string due_date = 6;
  // external_ref identifies the row in the calling module that this charge
  // stands for. Setting it does two things: it exempts the charge from the
  // "a student owes a concept once per cycle" rule, so a module that bills the
  // same concept repeatedly (uniforms) can; and it deduplicates a retried
  // creation, since the same ref may exist only once per tenant.
  string external_ref = 7;
}

message CreateChargeResponse {
  Charge charge = 1;
}

// GenerateChargesRequest issues the concept's charge to every active enrollment
// in the cycle, optionally narrowed to one group.
message GenerateChargesRequest {
  string concept_id = 1;
  string cycle_id = 2;
  // group_id empty ⇒ the whole cycle.
  string group_id = 3;
  // amount_cents_override 0 ⇒ use the concept's default_amount_cents.
  int64 amount_cents_override = 4;
  // due_date is an ISO date, "YYYY-MM-DD".
  string due_date = 5;
}

message GenerateChargesResponse {
  int32 created_count = 1;
  // skipped_count counts enrollments that already had the charge (idempotency).
  int32 skipped_count = 2;
}

message ListChargesRequest {
  string student_id = 1;  // filter (empty = any); at least one of the two required
  string cycle_id = 2;    // filter (empty = any); at least one of the two required
}

message ListChargesResponse {
  repeated Charge charges = 1;
}

// PreviewWithdrawalRequest asks which charges would be cancelled for a dated
// student withdrawal. withdrawn_on is YYYY-MM-DD.
message PreviewWithdrawalRequest {
  string student_id = 1;
  string cycle_id = 2;
  string withdrawn_on = 3;
}

// PreviewWithdrawalResponse is the projected cancellation and remaining debt.
message PreviewWithdrawalResponse {
  repeated Charge to_cancel = 1;
  int64 to_cancel_cents = 2;
  int64 remaining_debt_cents = 3;
}

message ApplyDiscountRequest {
  string charge_id = 1;
  int64 discount_cents = 2;
  string reason = 3;
}

message ApplyDiscountResponse {
  Charge charge = 1;
}

message CancelChargeRequest {
  string charge_id = 1;
}

message CancelChargeIfUnpaidRequest {
  string charge_id = 1;
}

message CancelChargeIfUnpaidResponse {
  Charge charge = 1;
}

message CancelChargeResponse {
  Charge charge = 1;
}

// --- Payment + account RPC messages ---------------------------------------

// Tender is one method a payment came in by, and how much of it (T8). A
// combined payment is a credit note completed with cash, say. A credit note is
// not money: cash-ups and income reports keep it apart.
message Tender {
  // cash | card | transfer | credit_note.
  string method = 1;
  int64 amount_cents = 2;
  // Free text: a credit note's folio, a voucher, a transfer id.
  string reference = 3;
  // debit | credit, only when method is card.
  string card_type = 4;
}

message RegisterPaymentRequest {
  string charge_id = 1;
  int64 amount_cents = 2;
  // method is one of: cash | card | transfer | credit_note. Ignored when
  // tenders are given.
  string method = 3;
  // reference is the folio / voucher / transfer id.
  string reference = 4;
  // idempotency_key is optional; a repeat with the same key returns the original
  // payment instead of charging again. Empty ⇒ no deduplication (every call
  // posts a new payment).
  string idempotency_key = 5;
  // paid_at is the date the money actually changed hands, which is not always
  // the date it was captured: a cashier catching up on Monday is recording
  // Friday's cash. Every collection rule — early-payment discount, daily
  // surcharge, which months a deposit covers — reads this, so stamping the
  // server clock instead quietly applied the wrong day's rules.
  // Optional: unset ⇒ now. A future date is refused.
  google.protobuf.Timestamp paid_at = 6;
  // The authenticated caller, set by the gateway — never by a client (task 7).
  string received_by = 7;
  // tenders, when given, combine methods (T8): one payment row per tender, all
  // in one transaction. They must add up exactly to amount_cents. Empty means
  // the single method above.
  repeated Tender tenders = 8;
}

message RegisterPaymentResponse {
  // payment is the first row (the only one for a single method).
  Payment payment = 1;
  // charge carries the recomputed paid/remaining/status after the payment.
  Charge charge = 2;
  // payments are every row, one per tender (T8).
  repeated Payment payments = 3;
}

message GetAccountRequest {
  string student_id = 1;
  // family_view returns the statement a family is shown (T5): without the
  // charges that have not opened yet (and have no money on them), with the
  // balance and today's figure worked out over what is left.
  bool family_view = 2;
}

// GetAccountResponse is the student's account statement.
// total_balance_cents is THE balance (T5): the statement's balance to the cent —
// opened, non-cancelled charges at the counter's price (ladder, scholarship),
// plus the surcharge accrued to today, less discounts and every payment.
// Negative is the family's credit. Charges not yet open are listed to the office
// but are in nobody's balance, so office and family views read one number.
message GetAccountResponse {
  repeated Charge charges = 1;
  repeated Payment payments = 2;
  int64 total_balance_cents = 3;
  // Money the family has handed over that no charge has claimed: an
  // overpayment, or a deposit made before the month was billed.
  int64 unallocated_cents = 4;
  // What is being asked for TODAY, at the moment of the read: the months that
  // have come due, already carrying the surcharge the daily rule has earned and
  // net of the early-payment reward.
  //
  // total_balance_cents above is what the year still owes (the statement's
  // balance). This is the part of it the family must hand over now, and it is
  // the number the school quotes at the counter.
  // Before this field the parents' app showed the first and the window showed
  // the second, and the two disagreed by design.
  int64 due_today_cents = 5;
  // The parts of due_today_cents, so a family asking "why that number?" is
  // answered by the statement rather than by a phone call.
  int64 surcharge_cents = 6;
  int64 early_discount_cents = 7;
  // The day the figures above were worked out for, as YYYY-MM-DD. Carried
  // because these amounts move on their own overnight, and a screen that cannot
  // say which day it is quoting cannot be trusted the morning after.
  string as_of = 8;
}

message GetStatementRequest {
  string student_id = 1;
  // family_view is the family's ledger: without the charges that have not
  // opened (T5) and without voided deposits. The balance is the same.
  bool family_view = 2;
}

// StatementMovement is one line of the ledger. amount_cents is always
// positive; `kind` says which way it moves the balance:
// charge | surcharge raise it; discount | scholarship | payment | credit_note
// lower it. scholarship (T18) is reserved; credit_note is a tender paid by a
// credit note (T8).
message StatementMovement {
  string kind = 1;
  // YYYY-MM-DD: a charge's due date, the day money arrived, or the
  // statement's day for a surcharge still accruing.
  string date = 2;
  string description = 3;
  int64 amount_cents = 4;
  // The running balance after this line. Negative is the family's credit.
  int64 balance_cents = 5;
  string charge_id = 6;
  string deposit_id = 7;
  // cash | card | transfer | credit_note, on money lines.
  string method = 8;
  string card_type = 9;
  string reference = 10;
  string folio = 11;
  // A surcharge the daily rule has earned up to today, not yet written down.
  bool accrued = 12;
  // A charge that has not opened (T5): shown to the office, not counted.
  bool not_yet_due = 13;
  // A cancelled deposit: shown to the office struck through, not counted.
  bool voided = 14;
  string void_reason = 15;
  // A deposit replaced by its correction (T9): shown to the office with the
  // folio that replaced it, not counted. The family is not shown it.
  bool superseded = 16;
  string superseded_by_folio = 17;
  // On a correction's lines: the folio it corrects.
  string corrects_folio = 18;
}

// StatementTotals: balance = charged - discount - paid.
message StatementTotals {
  int64 charged_cents = 1;
  int64 discount_cents = 2;
  int64 paid_cents = 3;
  int64 balance_cents = 4;
  // What the charges not yet opened will ask for, net. Not in the balance.
  int64 not_yet_due_cents = 5;
}

message GetStatementResponse {
  repeated StatementMovement movements = 1;
  StatementTotals totals = 2;
  // The counter's figures for today, as on GetAccountResponse.
  int64 due_today_cents = 3;
  int64 surcharge_cents = 4;
  int64 early_discount_cents = 5;
  int64 unallocated_cents = 6;
  string as_of = 7;
}

message ListOverdueRequest {
  string cycle_id = 1;  // optional filter (empty = any)
}

message ListOverdueResponse {
  repeated Charge charges = 1;
}

// --- CONTPAQi export (S02) ------------------------------------------------

message ExportContpaqiRequest {
  string tenant_id = 1;
  // TODO(S02): period (from/to), account filter.
}

message ExportContpaqiResponse {
  // xml is the CONTPAQi-format export payload. TODO(S02): validate against schema.
  bytes xml = 1;
}

// --- Domain events (published) --------------------------------------------

// PaymentRegistered fires when a payment is applied to a charge.
message PaymentRegistered {
  string payment_id = 1;
  string student_id = 2;
  string charge_id = 3;
  string tenant_id = 4;
  int64 amount_cents = 5;
  string method = 6;
  google.protobuf.Timestamp paid_at = 7;
}

// PaymentCorrected fires when a registered payment is corrected (T9): the
// family is told the right amount. payment_id is the corrected deposit;
// original_payment_id the deposit it replaced.
message PaymentCorrected {
  string payment_id = 1;
  string original_payment_id = 2;
  string student_id = 3;
  string tenant_id = 4;
  int64 amount_cents = 5;
  int64 previous_amount_cents = 6;
  string method = 7;
  google.protobuf.Timestamp paid_at = 8;
  string folio = 9;
}

// ChargeSettled fires the moment a charge becomes fully covered — the crossing
// into "paid", not every collection along the way. It exists because a consumer
// that only cares whether the money is IN (uniforms, before it releases goods)
// should not have to sum payments off PaymentRegistered, tolerate out-of-order
// delivery, or subscribe to every payment the school takes to discard most of
// them. A partial payment simply does not emit it.
message ChargeSettled {
  string charge_id = 1;
  string student_id = 2;
  string tenant_id = 3;
  // external_ref echoes the charge's reference, so a consumer can resolve its
  // own row without a lookup back into finance.
  string external_ref = 4;
  int64 amount_cents = 5;
  google.protobuf.Timestamp settled_at = 6;
}

// DebtOverdue fires when a charge crosses its due date with a remaining balance.
// due_date is an ISO date, "YYYY-MM-DD".
message DebtOverdue {
  string charge_id = 1;
  string student_id = 2;
  string tenant_id = 3;
  int64 amount_due_cents = 4;
  string due_date = 5;
}

// --- tuition (M15) ----------------------------------------------------------

// TuitionPlan is what one level costs in one cycle.
message TuitionPlan {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string level_id = 4;
  int64 enrollment_cents = 5;
  int64 monthly_cents = 6;
  // How many monthly payments the year has (1-12) and the calendar month the
  // first one falls in (1-12). Ten from September is the common shape.
  int32 months = 7;
  int32 first_billed_month = 8;
  // Day of the month a payment is due. 1-28: a limit on the 31st does not exist
  // in February and would silently move, so it is refused rather than adjusted.
  int32 due_day = 9;
  // Fixed surcharge added once per completed overdue month. Zero disables it.
  int64 late_fee_cents = 10;
  bool active = 11;
  CollectionPolicy policy = 12;
  // An explicit payment plan, replacing the uniform monthly amount. Empty means
  // the year is divided into equal parts, which is what most schools do.
  repeated Installment schedule = 13;
  // A fixed amount off every month of this level — the school's arrangement for
  // maternal, or for any level it prices differently. Set once here rather than
  // typed per pupil, which is the difference between a rule and four hundred
  // chances to mistype it.
  int64 monthly_discount_cents = 14;
  // The extras collected on top of the tuition, each split across the months
  // the school chose. Empty is the ordinary state.
  repeated Fee fees = 15;
  // The deadline the school set for the inscription (YYYY-MM-DD). Empty keeps
  // the rule the run has always used — the due day in the cycle's first month —
  // so a plan written before this field goes on meaning what it meant.
  string enrollment_due_on = 16;
  // What joining this level actually costs, broken into the lines the school
  // prints and priced by when the family settles them. Empty keeps
  // enrollment_cents above, so a plan written before this field goes on meaning
  // what it meant. See ADR 0011.
  repeated EnrollmentConcept enrollment_concepts = 17;
  // The first day the inscription opens to families (YYYY-MM-DD, T5). Empty is
  // open from the day it is issued. Needs enrollment_due_on and may not come
  // after it.
  string enrollment_starts_on = 18;
}

// EnrollmentConcept is one line of the inscription: a name the family reads and
// what it costs depending on WHEN it is settled.
//
// The school's price list does not charge one amount to join. It charges three
// — inscription, administration and insurance, parents' association — and the
// first of them doubles between January and April. The ladder is the whole
// incentive: joining late costs more, and it goes on costing more until the
// money arrives.
//
// This is deliberately NOT a Fee. A Fee is one amount divided between months;
// this is one amount that CHANGES with the month. Folding either into the other
// would leave neither able to explain itself, and both live on the same plan.
message EnrollmentConcept {
  // What the family reads on the statement. Unique within the plan, because two
  // lines with one name cannot be told apart on a receipt.
  string name = 1;
  // The price ladder, ordered by effective_from. At least one step.
  repeated PriceTier tiers = 2;
}

// PriceTier is what a concept costs from a date onward.
//
// "Vigente desde" and not a set of months: "de abril a septiembre" is one row
// rather than six checkboxes, and nothing has to verify that no month was left
// out or listed twice — a ladder covers the whole axis by construction.
message PriceTier {
  // YYYY-MM-DD. The tier that applies on a given day is the LAST one whose date
  // has arrived; before the first one, the first one — a concept does not cost
  // nothing for having been asked about early.
  string effective_from = 1;
  int64 amount_cents = 2;
  // The last day this price applies (YYYY-MM-DD), empty when the school has not
  // decided to end it.
  //
  // Carried because that is how a price list is written — "Abril a Sept", not
  // "de abril en adelante" — and because two ranges that overlap are a slip
  // worth refusing. It does NOT bound what is charged: a day no range covers is
  // still priced, at the last amount that took effect.
  string effective_to = 3;
}

// Fee is money the school collects on top of the monthly tuition, spread across
// the months it chooses.
//
// It exists because a school's year and its calendar do not agree. "La cuota de
// julio" is charged for a month the year does not bill, so it has to be
// collected inside months that it does. Saying that used to mean hand-writing a
// schedule of month:amount pairs, which priced the tuition and the fee as one
// number and left nobody able to explain either.
message Fee {
  // What the family reads on the statement, and the whole explanation of why a
  // month costs more than the tabulador says.
  string name = 1;
  // The WHOLE fee, not the monthly share. The school states what it collects;
  // dividing it is the server's job, not the director's.
  int64 amount_cents = 2;
  // The calendar months (1-12) it is divided between, in the order chosen. One
  // month is a fee that is not split. The remainder of an uneven division goes
  // to the first payment, so no cent is lost.
  repeated int32 months = 3;
}

// Installment is one payment of the year: the calendar month it falls in and
// how much of the tuition it collects.
//
// It exists because a school does not always divide the year into equal parts.
// "Once meses, pero diciembre a la mitad y la otra mitad en marzo" is a real
// arrangement, and a plan that can only say "N equal payments" cannot express
// it. The year is worked out from the cycle, so a schedule running past
// December continues into the next one.
message Installment {
  int32 month = 1;  // 1-12
  int64 amount_cents = 2;
}

// CollectionPolicy is what a late payment costs and what an early one saves,
// for one tuition table. It rides with the plan because that is where a price
// lives.
message CollectionPolicy {
  // daily_mode picks which surcharge rule applies. false keeps the original one
  // (late_fee_cents, once per completed overdue month); true charges
  // late_fee_daily_cents for every day the money is late, and the monthly run
  // stops issuing surcharge charges because the amount changes every night.
  bool daily_mode = 1;
  int64 late_fee_daily_cents = 2;
  // surcharge_counts_all_days counts Saturdays, Sundays and holidays. The school
  // said yes: the money is late on a Sunday too.
  bool surcharge_counts_all_days = 3;
  // A fixed amount off, per month settled, when the family pays within the first
  // early_payment_days working days of the month. Zero disables it.
  int64 early_payment_cents = 4;
  int32 early_payment_days = 5;
}


message UpsertTuitionPlanRequest {
  string cycle_id = 1;
  string level_id = 2;
  int64 enrollment_cents = 3;
  int64 monthly_cents = 4;
  int32 months = 5;
  int32 first_billed_month = 6;
  int32 due_day = 7;
  int64 late_fee_cents = 8;
  bool active = 9;
  CollectionPolicy policy = 10;
  repeated Installment schedule = 11;
  int64 monthly_discount_cents = 12;
  repeated Fee fees = 13;
  // YYYY-MM-DD, or empty for the default rule.
  string enrollment_due_on = 14;
  // The inscription broken into priced lines. Empty keeps enrollment_cents.
  repeated EnrollmentConcept enrollment_concepts = 15;
  // YYYY-MM-DD, or empty for open from issue (T5). Not after enrollment_due_on.
  string enrollment_starts_on = 16;
}

message UpsertTuitionPlanResponse {
  TuitionPlan plan = 1;
}

message ListTuitionPlansRequest {
  string cycle_id = 1;
}

message ListTuitionPlansResponse {
  repeated TuitionPlan plans = 1;
}

message RunBillingRequest {
  string cycle_id = 1;
  // The date the run pretends it is, as YYYY-MM-DD. Empty means today. It exists
  // so a school can catch up a cycle it configured late, and so the behaviour is
  // testable without waiting for a calendar.
  string as_of_date = 2;
}

// RunBillingResponse reports what the run did. `skipped` counts the charges that
// already existed — on a second run in the same day that is everything, which is
// what idempotent looks like from the outside.
message RunBillingResponse {
  int32 tuition_created = 1;
  int32 enrollment_created = 2;
  int32 late_fees_created = 3;
  int32 skipped = 4;
  // Charges issued for the extras collected on top of the tuition.
  int32 fees_created = 6;
  // Inscriptions whose deadline the run corrected to match the tuition table.
  // Reported because a run that silently moves four hundred due dates is one
  // nobody can audit.
  int32 enrollment_moved = 7;
  // Unpaid inscriptions the run re-priced to the tier now in force. Reported for
  // the same reason as enrollment_moved, and it matters more: this one moves
  // money, not dates.
  int32 enrollment_repriced = 8;
  // Activity periods issued (T17). Their fixed late fees count in
  // late_fees_created.
  int32 activities_created = 10;
  // Levels of the cycle with no tuition table. They are NOT billed at zero —
  // they are reported, so a school notices it forgot one instead of discovering
  // it in June.
  repeated string levels_without_plan = 5;
}

// --- Deposits (M16) --------------------------------------------------------

// Deposit is money as it arrived: one amount, one date, one receipt.
message Deposit {
  string id = 1;
  string student_id = 2;
  int64 amount_cents = 3;
  // method is one of: cash | card | transfer | credit_note, or mixed when the
  // deposit combined several tenders (T8). A summary: read the tenders.
  string method = 4;
  string reference = 5;
  google.protobuf.Timestamp paid_at = 6;
  // The school calendar the split was worked out against. 'unavailable' means
  // the calendar could not be read and the deadline was computed without the
  // school's holidays.
  string calendar_version = 7;
  google.protobuf.Timestamp voided_at = 8;
  string void_reason = 9;
  // debit | credit on a card payment, empty otherwise. Not a payment method —
  // the money still arrives by card — but the terminal the office reconciles
  // against at month end knows the difference.
  string card_type = 10;
  // Who took the money (task 7): the account and its name as it read then.
  // Empty on deposits from before it was recorded.
  string received_by = 11;
  string received_by_name = 12;
  // When the deposit was keyed, which is not paid_at when a payment is
  // captured late.
  google.protobuf.Timestamp captured_at = 13;
  // folio is the receipt number, P-<year>-<six digits> (task 12).
  string folio = 14;
  // The methods the money came in by, in order (T8). Always at least one: a
  // deposit made before T8 is one tender with its own method.
  repeated Tender tenders = 15;
  // T9: a deposit replaced by its correction is superseded — kept, counting
  // for nothing — and names the deposit (and folio) that replaced it.
  google.protobuf.Timestamp superseded_at = 16;
  string superseded_by = 17;
  string superseded_by_folio = 18;
  // On a correction: the deposit (and folio) it corrects.
  string corrects_deposit_id = 19;
  string corrects_folio = 20;
}

message RegisterDepositRequest {
  string student_id = 1;
  int64 amount_cents = 2;
  // method is one of: cash | card | transfer | credit_note. Ignored when
  // tenders are given.
  string method = 3;
  string reference = 4;
  // paid_at is when the money changed hands, which is not always when it was
  // keyed. Every collection rule is a function of it. Empty means now; a future
  // date is refused.
  google.protobuf.Timestamp paid_at = 5;
  // idempotency_key is optional; a repeat under the same key returns what was
  // stored the first time and collects nothing.
  string idempotency_key = 6;
  // grant_early_payment honours the early-payment reward even though the money
  // arrived after the window closed — the parent who is always punctual and
  // slipped once. A decision, never a default: it is recorded under its own
  // discount reason so a report can tell it from the rule firing.
  bool grant_early_payment = 7;
  // debit | credit, only when method is card.
  string card_type = 8;
  // The authenticated caller, set by the gateway — never by a client.
  string received_by = 9;
  string received_by_name = 10;
  // The charges the money may pay, chosen at the counter (task 8): paid oldest
  // first, each month with its surcharge; what is left is the family's credit.
  // Empty means every charge, oldest first. A charge that is not the
  // student's is refused.
  repeated string charge_ids = 11;
  // tenders, when given, combine methods (T8): they must add up exactly to
  // amount_cents and replace method, reference and card_type.
  repeated Tender tenders = 12;
}

message RegisterDepositResponse {
  Deposit deposit = 1;
  // The payments the deposit split into, oldest debt first.
  repeated Payment allocations = 2;
  // The surcharge charges this deposit made real. A row exists only where money
  // landed on it.
  repeated Charge surcharges = 3;
  // What no charge claimed: the family's credit.
  int64 unallocated_cents = 4;
  // replayed says the deposit already existed under this idempotency key.
  bool replayed = 5;
}

message ListDepositsRequest {
  string student_id = 1;
}

message ListDepositsResponse {
  repeated Deposit deposits = 1;
}

message VoidDepositRequest {
  string id = 1;
  // reason is required: a cancelled deposit without one is an unexplained hole
  // in the day's takings.
  string reason = 2;
}

message VoidDepositResponse {}

// PreviewDepositRequest asks what an amount would cover. It carries no
// idempotency key: nothing is written, so there is nothing to deduplicate.
message PreviewDepositRequest {
  string student_id = 1;
  int64 amount_cents = 2;
  google.protobuf.Timestamp paid_at = 3;
  // The charges the money may pay (task 8); empty means all, oldest first.
  repeated string charge_ids = 4;
}

// PreviewDepositResponse is the projected split.
message PreviewDepositResponse {
  repeated Payment allocations = 1;
  repeated Charge surcharges = 2;
  int64 unallocated_cents = 3;
}

// DailyCashUpRequest asks for one day's takings.
message DailyCashUpRequest {
  // The day the money changed hands, as YYYY-MM-DD. Empty means today.
  string day = 1;
}

// DailyCashUpResponse is what came in, and in what form.
message DailyCashUpResponse {
  repeated Deposit deposits = 1;
  // Cancelled deposits count for nothing and are listed anyway: a cash-up that
  // hid them could not explain why the drawer holds less than the receipts say.
  repeated Deposit cancelled = 2;
  int64 cash_cents = 3;
  int64 card_cents = 4;
  int64 transfer_cents = 5;
  int64 total_cents = 6;
  // Payments taken outside a deposit (a counter sale's, paid straight against
  // its charge). They are in the drawer, so they are in the totals too.
  repeated CashUpPayment payments = 7;
  // What credit notes settled that day (T8). Not money: in neither the
  // per-method figures nor total_cents.
  int64 credit_note_cents = 8;
  // Deposits of the day replaced by a correction (T9). They count for nothing;
  // their correction counts on the day it is dated.
  repeated Deposit superseded = 9;
  // T10: the day's expenses (cancelled ones included, flagged), what they took
  // out by method, and the cash the drawer should hold: cash in − cash out.
  repeated Expense expenses = 10;
  MethodTotals expenses_by_method = 11;
  int64 expected_cash_cents = 12;
  // The day's live closure, absent while the day is open.
  CashCutClosure closure = 13;
  // A movement of the day changed after it was closed (a correction, a void,
  // an expense edited or cancelled, a late capture).
  bool modified_after_close = 14;
  // Earlier closures of the day that were reopened, newest first.
  repeated CashCutClosure reopened = 15;
  // The day this cut is (YYYY-MM-DD) — the server's day when none was asked
  // for — so closing it closes THIS day, not whatever day it is at the POST.
  string day = 16;
}

// CashUpPayment is a payment taken outside a deposit, with what it paid for.
message CashUpPayment {
  Payment payment = 1;
  string description = 2;
}

// IncomeByConceptRequest asks what came in between two days, both inclusive.
message IncomeByConceptRequest {
  string from = 1;  // YYYY-MM-DD
  string to = 2;    // YYYY-MM-DD, inclusive
}

// IncomeLine is what one concept earned in the period.
message IncomeLine {
  string concept_id = 1;
  string concept = 2;
  int64 amount_cents = 3;
}

// IncomeByConceptResponse is the period's income, biggest line first.
message IncomeByConceptResponse {
  repeated IncomeLine lines = 1;
  int64 total_cents = 2;
  // What credit notes settled in the period (T8). Not income: in neither the
  // lines nor total_cents.
  int64 credit_note_cents = 3;
}

// ExpectedTodayRequest asks what is due as of a date.
message ExpectedTodayRequest {
  string student_id = 1;
  string on = 2;  // YYYY-MM-DD; empty means today
  // Leave the year's balance out: annual_balance_cents and
  // on_time_balance_cents come back 0, and the payments and deposits are not
  // read. For lists that only show amount_cents (the counter's search).
  bool skip_balance = 3;
}

// ExpectedTodayResponse is the figure the counter reads aloud, with the parts
// that make it up.
message ExpectedTodayResponse {
  int64 amount_cents = 1;
  int64 surcharge_cents = 2;
  int64 discount_cents = 3;
  // The whole year still owed, shown beside it so nobody confuses "what is due
  // today" with "what is left". THE balance (T5): equal to GetAccount's
  // total_balance_cents and the statement's balance, always as of today.
  int64 annual_balance_cents = 4;
  // The same, concept by concept, oldest due date first (task 8). The lines
  // marked due add up to amount_cents.
  repeated ExpectedLine lines = 5;
  // What scholarships take off the lines asked for (T18), already out of
  // amount_cents.
  int64 scholarship_cents = 6;
  // What annual_balance_cents comes to if every month in it is paid in time:
  // the balance less the early-payment rewards of the lines in_balance (a
  // projection, not a debt). Lines not yet open take nothing off it.
  int64 on_time_balance_cents = 7;
}

// ExpectedLine is one charge still owed, as of the day asked about.
message ExpectedLine {
  string charge_id = 1;
  string description = 2;
  string due_date = 3;  // YYYY-MM-DD
  int64 owed_cents = 4;
  int64 surcharge_cents = 5;
  int64 discount_cents = 6;
  int64 total_cents = 7;
  bool due = 8;
  // The scholarship's part that day (T18), already out of owed_cents.
  int64 scholarship_cents = 9;
  // Whether the line counts in annual_balance_cents today: false for a charge
  // not yet open (T5) with nothing paid on it — listed, payable ahead, but
  // not part of the debt.
  bool in_balance = 10;
}

// DrainOutboxRequest asks for the waiting events to be published.
message DrainOutboxRequest {
  // How many to publish in this pass. Zero means the service's own batch size.
  int32 limit = 1;
}

// DrainOutboxResponse reports how many actually went out. Zero is the ordinary
// answer: the payment path drains its own events.
message DrainOutboxResponse {
  int32 published = 1;
}

message GetDepositReceiptRequest {
  string deposit_id = 1;
}

// ReceiptLine is one concept a deposit paid.
message ReceiptLine {
  string charge_id = 1;
  string description = 2;
  // amount_cents is what THIS deposit put on the charge.
  int64 amount_cents = 3;
  // surcharge marks a late fee, printed as such.
  bool surcharge = 4;
  // discount_cents is the charge's discount (pronto pago, level), shown beside it.
  int64 discount_cents = 5;
  // The scholarship's part and its name (T18), shown beside it.
  int64 scholarship_cents = 6;
  string scholarship_name = 7;
}

message GetDepositReceiptResponse {
  Deposit deposit = 1;
  repeated ReceiptLine lines = 2;
  // unallocated_cents is what no charge claimed: the family's credit.
  int64 unallocated_cents = 3;
}

// --- corrections (T9) -------------------------------------------------------

message CorrectDepositRequest {
  // The deposit to correct.
  string deposit_id = 1;
  int64 amount_cents = 2;
  // The corrected day the money changed hands. Empty keeps the original's; a
  // future date is refused.
  google.protobuf.Timestamp paid_at = 3;
  // 1 to 4 tenders adding up exactly to amount_cents.
  repeated Tender tenders = 4;
  // The charges the money may pay; empty means every charge, oldest first.
  repeated string charge_ids = 5;
  // Required: why the payment is corrected.
  string reason = 6;
  // Optional: a retried correction under the same key changes nothing.
  string idempotency_key = 7;
  // The authenticated caller, set by the gateway — never by a client.
  string corrected_by = 8;
  string corrected_by_name = 9;
}

message CorrectDepositResponse {
  // The original, now superseded.
  Deposit original = 1;
  // The corrected deposit and its split.
  Deposit deposit = 2;
  repeated Payment allocations = 3;
  repeated Charge surcharges = 4;
  int64 unallocated_cents = 5;
  bool replayed = 6;
  DepositCorrection correction = 7;
}

message ListDepositCorrectionsRequest {
  string deposit_id = 1;
}

message ListDepositCorrectionsResponse {
  repeated DepositCorrection corrections = 1;
}

// DepositCorrection is one correction: before, after, who, when and why.
message DepositCorrection {
  string id = 1;
  string original_deposit_id = 2;
  string corrected_deposit_id = 3;
  string reason = 4;
  DepositSnapshot before = 5;
  DepositSnapshot after = 6;
  string corrected_by = 7;
  string corrected_by_name = 8;
  google.protobuf.Timestamp corrected_at = 9;
}

// DepositSnapshot is a deposit as it stood on one side of a correction.
message DepositSnapshot {
  string deposit_id = 1;
  string folio = 2;
  int64 amount_cents = 3;
  google.protobuf.Timestamp paid_at = 4;
  repeated Tender tenders = 5;
  repeated SnapshotLine lines = 6;
}

// SnapshotLine is what a deposit put on one charge.
message SnapshotLine {
  string charge_id = 1;
  string description = 2;
  int64 amount_cents = 3;
}

// --- level deletion (ADR 0021) ---------------------------------------------

// LevelScope is everything a level deletion reaches, resolved by the gateway
// from config (structure) and students (people). Every id is a uuid; a service
// reads only the fields it owns data for.
message LevelScope {
  string level_id = 1;
  repeated string grade_level_ids = 2;
  repeated string group_ids = 3;
  repeated string subject_ids = 4;
  repeated string term_ids = 5;
  repeated string enrollment_ids = 6;
  repeated string student_ids = 7;
}

// LevelArchiveCount is how many rows of one kind a level deletion touches.
message LevelArchiveCount {
  string kind = 1;
  int64 count = 2;
}

// LevelRestoreSkip is rows of one kind a restore could not put back, and why.
message LevelRestoreSkip {
  string kind = 1;
  int64 count = 2;
  string reason = 3;
}

message PreviewLevelDeletionRequest {
  LevelScope scope = 1;
}

message PreviewLevelDeletionResponse {
  repeated LevelArchiveCount counts = 1;
}

message ArchiveLevelRequest {
  // batch_id is the saga's idempotency key (a uuid minted by the gateway).
  string batch_id = 1;
  LevelScope scope = 2;
}

message ArchiveLevelResponse {
  repeated LevelArchiveCount counts = 1;
}

message RestoreLevelBatchRequest {
  string batch_id = 1;
}

message RestoreLevelBatchResponse {
  repeated LevelArchiveCount restored = 1;
  repeated LevelRestoreSkip skipped = 2;
}

message PurgeLevelArchivesRequest {}

message PurgeLevelArchivesResponse {
  int64 purged_rows = 1;
}

message PurgeLevelBatchRequest {
  string batch_id = 1;
}

message PurgeLevelBatchResponse {
  int64 purged_rows = 1;
}

// --- expenses and the cash cut (T10) ----------------------------------------

// MethodTotals is an amount per method of payment, and their sum.
message MethodTotals {
  int64 cash_cents = 1;
  int64 card_cents = 2;
  int64 transfer_cents = 3;
  int64 total_cents = 4;
}

message ExpenseCategory {
  string id = 1;
  string name = 2;
  bool active = 3;
}

message CreateExpenseCategoryRequest {
  string name = 1;
}

message CreateExpenseCategoryResponse {
  ExpenseCategory category = 1;
}

message ListExpenseCategoriesRequest {
  bool include_inactive = 1;
}

message ListExpenseCategoriesResponse {
  repeated ExpenseCategory categories = 1;
}

message UpdateExpenseCategoryRequest {
  string id = 1;
  string name = 2;
  bool active = 3;
}

message UpdateExpenseCategoryResponse {
  ExpenseCategory category = 1;
}

// ExpenseReceipt describes the file attached to an expense (not its bytes).
message ExpenseReceipt {
  string content_type = 1;
  int64 size_bytes = 2;
}

// Expense is money the school paid out.
message Expense {
  string id = 1;
  // The day it was paid, YYYY-MM-DD.
  string spent_on = 2;
  string category_id = 3;
  string category_name = 4;
  int64 amount_cents = 5;
  // cash | card | transfer
  string method = 6;
  string description = 7;
  // active | cancelled
  string status = 8;
  string cancel_reason = 9;
  google.protobuf.Timestamp cancelled_at = 10;
  // Absent when no receipt is attached.
  ExpenseReceipt receipt = 11;
  string created_by_name = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// ExpenseEvent is one entry of an expense's history.
message ExpenseEvent {
  string id = 1;
  // created | edited | cancelled | receipt_attached | receipt_removed
  string kind = 2;
  // The expense as it stood before and after, as JSON ({} on create).
  string before_json = 3;
  string after_json = 4;
  string reason = 5;
  string actor_name = 6;
  google.protobuf.Timestamp at = 7;
}

message CreateExpenseRequest {
  string spent_on = 1;
  string category_id = 2;
  int64 amount_cents = 3;
  string method = 4;
  string description = 5;
  // The authenticated caller, set by the gateway — never by a client.
  string actor_id = 6;
  string actor_name = 7;
}

message CreateExpenseResponse {
  Expense expense = 1;
}

message UpdateExpenseRequest {
  string id = 1;
  string spent_on = 2;
  string category_id = 3;
  int64 amount_cents = 4;
  string method = 5;
  string description = 6;
  // Optional: why it was edited.
  string reason = 7;
  string actor_id = 8;
  string actor_name = 9;
}

message UpdateExpenseResponse {
  Expense expense = 1;
}

message CancelExpenseRequest {
  string id = 1;
  // Required.
  string reason = 2;
  string actor_id = 3;
  string actor_name = 4;
}

message CancelExpenseResponse {
  Expense expense = 1;
}

message ListExpensesRequest {
  string from = 1;  // YYYY-MM-DD
  string to = 2;    // YYYY-MM-DD, inclusive
  // Optional: only this category.
  string category_id = 3;
  bool include_cancelled = 4;
}

message ListExpensesResponse {
  repeated Expense expenses = 1;
}

message GetExpenseRequest {
  string id = 1;
}

message GetExpenseResponse {
  Expense expense = 1;
  repeated ExpenseEvent events = 2;
}

message AttachExpenseReceiptRequest {
  string id = 1;
  bytes data = 2;
  string actor_id = 3;
  string actor_name = 4;
}

message AttachExpenseReceiptResponse {
  Expense expense = 1;
}

message GetExpenseReceiptRequest {
  string id = 1;
}

message GetExpenseReceiptResponse {
  bytes data = 1;
  string content_type = 2;
}

message RemoveExpenseReceiptRequest {
  string id = 1;
  string actor_id = 2;
  string actor_name = 3;
}

message RemoveExpenseReceiptResponse {
  Expense expense = 1;
}

message FinanceSummaryRequest {
  string from = 1;  // YYYY-MM-DD
  string to = 2;    // YYYY-MM-DD, inclusive
}

// CategoryTotal is what one expense category took in the period.
message CategoryTotal {
  string category_id = 1;
  string category_name = 2;
  int64 amount_cents = 3;
  int32 count = 4;
}

message FinanceSummaryResponse {
  // Money received (deposits and counter sales, by the day it changed hands).
  MethodTotals income = 1;
  // What credit notes settled. Not income: outside every figure above.
  int64 credit_note_cents = 2;
  // Live expenses (cancelled ones count for nothing).
  MethodTotals expenses = 3;
  // income − expenses, per method and in total. May be negative.
  MethodTotals balance = 4;
  repeated CategoryTotal expenses_by_category = 5;
}

// CashCutClosure is one closure of a day's cut: the snapshot taken then.
message CashCutClosure {
  string id = 1;
  string day = 2;
  int64 expected_cash_cents = 3;
  int64 counted_cash_cents = 4;
  // counted − expected: negative is money missing from the drawer.
  int64 difference_cents = 5;
  MethodTotals income = 6;
  MethodTotals expenses = 7;
  int64 credit_note_cents = 8;
  string note = 9;
  string closed_by_name = 10;
  google.protobuf.Timestamp closed_at = 11;
  google.protobuf.Timestamp reopened_at = 12;
  string reopened_by_name = 13;
  string reopen_reason = 14;
}

message CloseCashCutRequest {
  string day = 1;  // YYYY-MM-DD; a future day is refused
  int64 counted_cash_cents = 2;
  string note = 3;
  string actor_id = 4;
  string actor_name = 5;
}

message CloseCashCutResponse {
  CashCutClosure closure = 1;
}

message ReopenCashCutRequest {
  string day = 1;
  string reason = 2;
  string actor_id = 3;
  string actor_name = 4;
}

message ReopenCashCutResponse {
  CashCutClosure closure = 1;
}

// --- activities (T17) -------------------------------------------------------

// ActivitySlot is one entry of the weekly schedule: weekday 1 (Monday) … 7
// (Sunday), start and end as "HH:MM".
message ActivitySlot {
  int32 weekday = 1;
  string start = 2;
  string end = 3;
}

// ActivityPriceOption is a charging scheme: a price per period for attending
// days_per_week days, or (days_per_week 0) a flat fee. id empty on input = new.
message ActivityPriceOption {
  string id = 1;
  int32 days_per_week = 2;
  int64 amount_cents = 3;
}

message Activity {
  string id = 1;
  string name = 2;
  repeated ActivitySlot schedule = 3;
  // monthly | weekly | per_cycle
  string periodicity = 4;
  // YYYY-MM-DD: the first billing date and the first due date.
  string billing_starts_on = 5;
  string first_due_on = 6;
  int64 late_fee_cents = 7;
  bool active = 8;
  repeated ActivityPriceOption options = 9;
  int32 enrolled_count = 10;
}

// ActivityInput is what create and update take.
message ActivityInput {
  string name = 1;
  repeated ActivitySlot schedule = 2;
  string periodicity = 3;
  string billing_starts_on = 4;
  string first_due_on = 5;
  int64 late_fee_cents = 6;
  bool active = 7;
  repeated ActivityPriceOption options = 8;
}

message ActivityEnrollment {
  string id = 1;
  string activity_id = 2;
  string student_id = 3;
  string option_id = 4;
  string starts_on = 5;
  // Empty while still enrolled.
  string ends_on = 6;
}

message ListActivitiesRequest {
  bool include_inactive = 1;
}

message ListActivitiesResponse {
  repeated Activity activities = 1;
}

message GetActivityRequest {
  string id = 1;
}

message GetActivityResponse {
  Activity activity = 1;
}

message CreateActivityRequest {
  ActivityInput activity = 1;
}

message CreateActivityResponse {
  Activity activity = 1;
}

message UpdateActivityRequest {
  string id = 1;
  ActivityInput activity = 2;
}

message UpdateActivityResponse {
  Activity activity = 1;
}

message ListActivityEnrollmentsRequest {
  string activity_id = 1;
}

message ListActivityEnrollmentsResponse {
  repeated ActivityEnrollment enrollments = 1;
}

message EnrollItem {
  string student_id = 1;
  string option_id = 2;
}

message EnrollInActivityRequest {
  string activity_id = 1;
  // YYYY-MM-DD; empty is today.
  string starts_on = 2;
  repeated EnrollItem items = 3;
}

message EnrollInActivityResponse {
  repeated ActivityEnrollment enrollments = 1;
  int32 charges_created = 2;
}

message UnenrollFromActivityRequest {
  string activity_id = 1;
  repeated string student_ids = 2;
  // YYYY-MM-DD; empty is today.
  string ends_on = 3;
}

message UnenrollFromActivityResponse {
  int32 ended = 1;
}

message ChangeActivityOptionRequest {
  string activity_id = 1;
  string student_id = 2;
  string option_id = 3;
}

message ChangeActivityOptionResponse {
  ActivityEnrollment enrollment = 1;
}

// --- scholarships (T18) -----------------------------------------------------

// ScholarshipInput is what create and update take. kind: percent | fixed_off |
// fixed_price. value: basis points for a percent (1–10000), cents otherwise.
// targets: "enrollment" | "tuition" | "concept:<id>" | "activity:<id>".
message ScholarshipInput {
  string name = 1;
  string kind = 2;
  int64 value = 3;
  repeated string targets = 4;
  bool active = 5;
}

message Scholarship {
  string id = 1;
  string name = 2;
  string kind = 3;
  int64 value = 4;
  repeated string targets = 5;
  bool active = 6;
  int32 assigned_count = 7;
}

// ScholarshipTarget is one thing a scholarship can apply to. group:
// enrollment | tuition | concept | activity.
message ScholarshipTarget {
  string key = 1;
  string label = 2;
  string group = 3;
}

message ScholarshipRef {
  string id = 1;
  string name = 2;
}

// ScholarshipHolder is a pupil holding one, with the other scholarships they
// hold that share a target with it (they do not stack).
message ScholarshipHolder {
  string student_id = 1;
  string starts_on = 2;
  repeated ScholarshipRef overlaps = 3;
}

message ListScholarshipsRequest {
  bool include_inactive = 1;
}

message ListScholarshipsResponse {
  repeated Scholarship scholarships = 1;
}

message GetScholarshipRequest {
  string id = 1;
}

message GetScholarshipResponse {
  Scholarship scholarship = 1;
}

message CreateScholarshipRequest {
  ScholarshipInput scholarship = 1;
}

message CreateScholarshipResponse {
  Scholarship scholarship = 1;
}

message UpdateScholarshipRequest {
  string id = 1;
  ScholarshipInput scholarship = 2;
}

message UpdateScholarshipResponse {
  Scholarship scholarship = 1;
}

message ListScholarshipTargetsRequest {}

message ListScholarshipTargetsResponse {
  repeated ScholarshipTarget targets = 1;
}

message ListScholarshipHoldersRequest {
  string scholarship_id = 1;
}

message ListScholarshipHoldersResponse {
  repeated ScholarshipHolder holders = 1;
}

message AssignScholarshipRequest {
  string scholarship_id = 1;
  repeated string student_ids = 2;
}

message AssignScholarshipResponse {
  repeated ScholarshipHolder holders = 1;
}

message UnassignScholarshipRequest {
  string scholarship_id = 1;
  repeated string student_ids = 2;
}

message UnassignScholarshipResponse {
  int32 removed = 1;
}
