// Grades / Boletas (M07) — grade capture (roster + grade_entries).
//
// Phase 5 (capture): a teacher opens a teaching assignment (group+subject),
// sees the roster (students enrolled in the group), and captures/edits a
// numeric grade (0–10) per student for a term. subject_id / teacher_id / cycle
// are DERIVED server-side from the assignment — never client-supplied.
// Cross-service references (enrollment_id, subject_id, term_id, teacher_id) are
// plain UUIDs validated by RPC, NOT foreign keys.
//
// T7 adds period closing and report cards (boletas): ClosePeriod, the report
// card reads and the GradesPublished event. grade_entries.published_at stays unused.
syntax = "proto3";

package garcialorca.grades.v1;

import "google/protobuf/timestamp.proto";

// GradesService is the grades/boletas API surface.
service GradesService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // CaptureGrade records or edits a student's numeric grade (0–10) for a term.
  // The subject and teacher are DERIVED from the assignment (never client
  // args); the enrollment, term, and assignment are validated by RPC against
  // the students/config services. Re-capturing the same (enrollment, subject,
  // term) updates the value (upsert). Out-of-range value is InvalidArgument.
  rpc CaptureGrade(CaptureGradeRequest) returns (CaptureGradeResponse);

  // GetRoster returns one row per active enrollment in the assignment's group,
  // each with the current grade value for the term (has_value=false when the
  // student has no grade captured yet). Student names are NOT returned — grades
  // stays free of student PII; the web resolves names from the students list.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

  // ListGradeEntries lists grade entries, optionally filtered by enrollment
  // and/or term (each filter is independent; empty = any).
  rpc ListGradeEntries(ListGradeEntriesRequest) returns (ListGradeEntriesResponse);

  // --- monthly grades (T6) — DEPRECATED by T15 ---
  // Monthly capture was retired in T15 (grades are captured per evaluation
  // period). The monthly_grades table and its rows are kept, untouched; these
  // RPCs are no longer served (Unimplemented) and will be removed from the
  // contract in a later release.

  // UpsertMonthlyGrade records or corrects one student's grade for a month
  // (autosave per cell). Scale, decimals, month and level refusals are
  // InvalidArgument with a sentence for the user; an unknown assignment is
  // NotFound.
  rpc UpsertMonthlyGrade(UpsertMonthlyGradeRequest) returns (UpsertMonthlyGradeResponse) {
    option deprecated = true;
  }
  // ClearMonthlyGrade removes one student's grade for a month (an emptied
  // cell). Clearing a grade that does not exist succeeds.
  rpc ClearMonthlyGrade(ClearMonthlyGradeRequest) returns (ClearMonthlyGradeResponse) {
    option deprecated = true;
  }
  // GetMonthlySheet is the capture grid of one assignment for one month: the
  // cycle's months, the level's scale, whether it is editable, and one row per
  // active enrollment of the group (student names are resolved at the edge).
  rpc GetMonthlySheet(GetMonthlySheetRequest) returns (GetMonthlySheetResponse) {
    option deprecated = true;
  }
  // GetEnrollmentMonthlyGrades is one enrollment's monthly grades for its
  // cycle: the months, the scale, the group's subjects and every captured grade.
  rpc GetEnrollmentMonthlyGrades(GetEnrollmentMonthlyGradesRequest) returns (GetEnrollmentMonthlyGradesResponse) {
    option deprecated = true;
  }
  // CountScaleViolations counts the PERIOD grades (T15) already captured in
  // the level's ACTIVE cycle that a proposed scale would refuse (out of range;
  // period grades are whole numbers, so decimals never refuse one; with
  // grading disabled, every grade counts). Loosening a scale can never produce
  // a violation. No active cycle counts 0.
  rpc CountScaleViolations(CountScaleViolationsRequest) returns (CountScaleViolationsResponse);

  // --- period grades (T15) ---
  // The school captures one WHOLE-NUMBER grade per student, subject and
  // EVALUATION PERIOD of the group's grade (config, T14/ADR 0029). The subject
  // is DERIVED from the assignment; the level's scale bounds the value (its
  // decimals no longer matter: capture is integers only); the period must be
  // one of the group's grade in the assignment's cycle and must have started
  // (the school's local day); the enrollment must be active in the group. A
  // period whose level term (same cycle, level and ordinal) is closed is
  // read-only for everyone (PERIOD_LOCKED, 409).

  // UpsertPeriodGrade records or corrects one student's grade for a period
  // (autosave per cell). Refusals are InvalidArgument with a sentence and an
  // X-Error-Code (GRADE_NOT_INTEGER, GRADE_OUT_OF_RANGE, GRADE_NOT_NUMBER,
  // PERIOD_NOT_IN_GRADE, PERIOD_NOT_STARTED, PERIOD_PREVIOUS_GROUP,
  // ENROLLMENT_NOT_IN_GROUP, LEVEL_NOT_GRADED); a closed period is
  // FailedPrecondition PERIOD_LOCKED; an unknown assignment is NotFound.
  rpc UpsertPeriodGrade(UpsertPeriodGradeRequest) returns (UpsertPeriodGradeResponse);
  // ClearPeriodGrade removes one student's grade for a period (an emptied
  // cell). Clearing a grade that does not exist succeeds; the same rules as
  // the upsert apply.
  rpc ClearPeriodGrade(ClearPeriodGradeRequest) returns (ClearPeriodGradeResponse);
  // GetPeriodSheet is the capture grid of one assignment for one period: the
  // grade's periods, the level's scale, whether it is editable, and one row
  // per active enrollment of the group (names are resolved at the edge). An
  // empty period_id opens the period of the school's current local day (or
  // the latest that started; before the first, the first).
  rpc GetPeriodSheet(GetPeriodSheetRequest) returns (GetPeriodSheetResponse);
  // GetEnrollmentPeriodGrades is one enrollment's period grades for its
  // cycle: the grade's periods, the scale, the group's subjects and every
  // captured grade.
  rpc GetEnrollmentPeriodGrades(GetEnrollmentPeriodGradesRequest) returns (GetEnrollmentPeriodGradesResponse);
  // PeriodsWithGrades answers which of these evaluation periods already hold
  // at least one grade, in one read. The gateway asks before config removes
  // a period (PERIOD_HAS_GRADES): a period with grades cannot be removed.
  rpc PeriodsWithGrades(PeriodsWithGradesRequest) returns (PeriodsWithGradesResponse);

  // --- period closing and report cards (T7) ---
  // A period is one config term: exactly one level of one cycle, covering a
  // set of months. Closing it snapshots a report card per active enrollment of
  // the level (one transaction with the closure) and locks the term's months
  // for every writer; reopening unlocks them, and closing again issues the
  // next version, which supersedes the previous one.

  // ListPeriods lists every term of a cycle with its closure state and capture
  // progress.
  rpc ListPeriods(ListPeriodsRequest) returns (ListPeriodsResponse);
  // GetPeriodProgress is one term's capture progress and what is missing,
  // grouped by group and subject. NotFound for an unknown term.
  rpc GetPeriodProgress(GetPeriodProgressRequest) returns (GetPeriodProgressResponse);
  // ClosePeriod closes a term and issues its report cards. Refusals are
  // AlreadyExists (409 at the edge) with an X-Error-Code: MISSING_GRADES
  // (captures missing and force unset), TERM_WITHOUT_MONTHS, ALREADY_CLOSED,
  // LEVEL_NOT_GRADED.
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
  // ReopenPeriod reopens a closed term (ALREADY_OPEN otherwise). Its report
  // cards stay published.
  rpc ReopenPeriod(ReopenPeriodRequest) returns (ReopenPeriodResponse);
  // ListReportCards lists the LATEST published report card of each enrollment,
  // filtered by term, group and/or student (at least one filter is required).
  rpc ListReportCards(ListReportCardsRequest) returns (ListReportCardsResponse);
  // GetReportCard is one report card's full snapshot (any version).
  rpc GetReportCard(GetReportCardRequest) returns (GetReportCardResponse);
  // ClosedTerms answers which of these terms are closed, in one read. The
  // gateway asks before config changes a term's months: a closed term's
  // months are frozen until it is reopened (TERM_CLOSED).
  rpc ClosedTerms(ClosedTermsRequest) returns (ClosedTermsResponse);

  // --- level deletion (ADR 0021) ---
  // PreviewLevelDeletion counts what deleting a level would archive in this
  // service, without changing anything. The scope comes from config (structure
  // ids) and students (enrollment/student ids); each service uses the ids it
  // owns data for.
  rpc PreviewLevelDeletion(PreviewLevelDeletionRequest) returns (PreviewLevelDeletionResponse);
  // ArchiveLevel moves this service's rows of the level into its deletion
  // archive (a JSONB copy, then DELETE) inside ONE tenant-bound transaction.
  // Idempotent per batch_id: a repeated call answers the first call's counts.
  rpc ArchiveLevel(ArchiveLevelRequest) returns (ArchiveLevelResponse);
  // RestoreLevelBatch puts a batch back in dependency order inside ONE
  // transaction, skipping rows that now conflict and reporting them.
  // Converges on retry: rows put back leave the archive, rows that do not fit
  // stay archived (until the purge) and a retry tries them again; a batch with
  // nothing left answers its last report. NotFound when this service holds no
  // archive for the batch (never archived, or purged) — never a silent success.
  rpc RestoreLevelBatch(RestoreLevelBatchRequest) returns (RestoreLevelBatchResponse);
  // PurgeLevelArchives hard-deletes archives past the 7-day retention. The
  // retention is fixed server-side: no caller can purge fresh trash.
  rpc PurgeLevelArchives(PurgeLevelArchivesRequest) returns (PurgeLevelArchivesResponse);
  // PurgeLevelBatch hard-deletes this service's archive rows of one batch, when
  // the gateway's sweep finds the batch past its restorable_until (config's
  // clock, ADR 0021). Idempotent: an unknown batch purges nothing.
  rpc PurgeLevelBatch(PurgeLevelBatchRequest) returns (PurgeLevelBatchResponse);

  // --- group corrections (T8, ADR 0036) ---
  // GroupUsage counts the report cards issued for one config group. The
  // gateway refuses to delete a group while any exists.
  rpc GroupUsage(GroupUsageRequest) returns (GroupUsageResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// GradeEntry is one captured grade for a student's subject in a term. All ids
// except `id` are cross-service references (validated by RPC, not FKs).
// `value` is the numeric grade in [0, 10]. `published_at` is reserved for the
// future boleta/publish flow and is unset in this phase.
message GradeEntry {
  string id = 1;
  string enrollment_id = 2;
  string subject_id = 3;
  string term_id = 4;
  string teacher_id = 5;
  double value = 6;
  google.protobuf.Timestamp published_at = 7;
}

// RosterRow is one student's slot in a roster: the enrollment, the student it
// belongs to, and the current grade value (has_value=false ⇒ not captured yet,
// and `value` is meaningless).
message RosterRow {
  string enrollment_id = 1;
  string student_id = 2;
  double value = 3;
  bool has_value = 4;
}

// --- RPC messages ---------------------------------------------------------

// CaptureGradeRequest captures/edits a grade. subject_id / teacher_id / cycle
// are deliberately absent — they are DERIVED from the assignment server-side.
message CaptureGradeRequest {
  string assignment_id = 1;
  string enrollment_id = 2;
  string term_id = 3;
  double value = 4;
}

message CaptureGradeResponse {
  GradeEntry entry = 1;
}

message GetRosterRequest {
  string assignment_id = 1;
  string term_id = 2;
}

message GetRosterResponse {
  repeated RosterRow rows = 1;
}

message ListGradeEntriesRequest {
  string enrollment_id = 1;  // optional filter (empty = any)
  string term_id = 2;        // optional filter (empty = any)
}

message ListGradeEntriesResponse {
  repeated GradeEntry entries = 1;
}

// --- Monthly grades (T6) --------------------------------------------------

// GradingScale is the level's numeric scale in exact hundredths (5.00 = 500).
message GradingScale {
  int32 min_hundredths = 1;
  int32 max_hundredths = 2;
  int32 decimals = 3;
  int32 passing_hundredths = 4;
}

// MonthlyGrade is one captured monthly grade. `month` is "YYYY-MM"; `value` is
// the canonical decimal text ("9.5", "10") — never a float, so a boundary like
// 9.95 is judged exactly.
message MonthlyGrade {
  string enrollment_id = 1;
  string subject_id = 2;
  string month = 3;
  string value = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UpsertMonthlyGradeRequest {
  string assignment_id = 1;
  string month = 2;          // "YYYY-MM"
  string enrollment_id = 3;
  string value = 4;          // decimal text, e.g. "9.5"
  string captured_by = 5;    // the authenticated user id (audit)
  // school_wide is set by the director's routes: the caller acts for the whole
  // school, so months that belong to a transferred pupil's previous group stay
  // writable. Unset (a teacher) = those months are read-only.
  bool school_wide = 6;
}

message UpsertMonthlyGradeResponse {
  MonthlyGrade grade = 1;
}

message ClearMonthlyGradeRequest {
  string assignment_id = 1;
  string month = 2;
  string enrollment_id = 3;
  bool school_wide = 4;      // see UpsertMonthlyGradeRequest.school_wide
}

message ClearMonthlyGradeResponse {}

message GetMonthlySheetRequest {
  string assignment_id = 1;
  // month "YYYY-MM"; empty = the current UTC month clamped into the cycle.
  string month = 2;
  bool school_wide = 3;      // see UpsertMonthlyGradeRequest.school_wide
}

// MonthlySheetRow is one active enrollment of the group; value is "" when no
// grade is captured for the month.
message MonthlySheetRow {
  string enrollment_id = 1;
  string student_id = 2;
  string value = 3;
  google.protobuf.Timestamp updated_at = 4;
  // editable is false when THIS row's month cannot be written by the caller
  // (a month before the pupil joined the group by transfer); read_only_reason
  // then says why. The sheet-level editable still gates every row.
  bool editable = 5;
  string read_only_reason = 6;
}

message GetMonthlySheetResponse {
  string assignment_id = 1;
  string month = 2;
  repeated string months = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  bool editable = 6;
  string read_only_reason = 7;
  repeated MonthlySheetRow rows = 8;
  // closed_months are the months of the sheet that belong to a CLOSED period
  // of the level: nobody may write them until the director reopens it.
  repeated string closed_months = 9;
  // unmapped_months are the months of the sheet no period of the level
  // covers: still capturable, but no report card prints them ("Sin periodo").
  repeated string unmapped_months = 10;
}

message GetEnrollmentMonthlyGradesRequest {
  string enrollment_id = 1;
}

message GetEnrollmentMonthlyGradesResponse {
  string cycle_id = 1;
  string cycle_name = 2;
  repeated string months = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  // subject_ids are the group's subjects plus any subject already graded.
  repeated string subject_ids = 6;
  repeated MonthlyGrade grades = 7;
}

message CountScaleViolationsRequest {
  string level_id = 1;
  // grading_enabled=false means "disable numeric grading": every captured
  // grade of the cycle is a violation.
  bool grading_enabled = 2;
  GradingScale scale = 3;
}

message CountScaleViolationsResponse {
  int32 violations = 1;
}

// --- Period grades (T15) -------------------------------------------------

// EvaluationPeriodRef is an evaluation period of a grade as config holds it
// (T14). starts_on / ends_on are inclusive calendar days, "YYYY-MM-DD".
message EvaluationPeriodRef {
  string id = 1;
  int32 ordinal = 2;
  string name = 3;
  string starts_on = 4;
  string ends_on = 5;
}

// PeriodGrade is one captured period grade. value is the canonical decimal
// text of a whole number ("9", "10"); a grade is never a float.
message PeriodGrade {
  string enrollment_id = 1;
  string subject_id = 2;
  string period_id = 3;
  string value = 4;
  google.protobuf.Timestamp updated_at = 5;
  string captured_by_name = 6;
}

message UpsertPeriodGradeRequest {
  string assignment_id = 1;
  string period_id = 2;
  string enrollment_id = 3;
  string value = 4;            // decimal text of a whole number, e.g. "9"
  string captured_by = 5;      // the authenticated user id (audit)
  string captured_by_name = 6; // the authenticated user's name (audit)
  // school_wide is set by the director's routes: periods that belong to a
  // transferred pupil's previous group stay writable.
  bool school_wide = 7;
}

message UpsertPeriodGradeResponse {
  PeriodGrade grade = 1;
}

message ClearPeriodGradeRequest {
  string assignment_id = 1;
  string period_id = 2;
  string enrollment_id = 3;
  bool school_wide = 4;
}

message ClearPeriodGradeResponse {}

message GetPeriodSheetRequest {
  string assignment_id = 1;
  string period_id = 2; // empty = the period of the school's current day
  bool school_wide = 3;
}

// PeriodSheetRow is one active enrollment of the group; value is "" when no
// grade is captured for the period. editable / read_only_reason say whether
// the caller may write THIS row.
message PeriodSheetRow {
  string enrollment_id = 1;
  string student_id = 2;
  string value = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool editable = 5;
  string read_only_reason = 6;
}

message GetPeriodSheetResponse {
  string assignment_id = 1;
  // period_id is the period shown; "" when the grade has no periods.
  string period_id = 2;
  repeated EvaluationPeriodRef periods = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  bool editable = 6;
  string read_only_reason = 7;
  repeated PeriodSheetRow rows = 8;
  // closed_period_ids are the periods of the sheet whose level term is
  // CLOSED: nobody may write them until the director reopens it.
  repeated string closed_period_ids = 9;
  // current_period_id is the period containing the school's current day, ""
  // when the day falls in none.
  string current_period_id = 10;
  // today is the school's current local day, "YYYY-MM-DD".
  string today = 11;
}

message GetEnrollmentPeriodGradesRequest {
  string enrollment_id = 1;
}

message GetEnrollmentPeriodGradesResponse {
  string cycle_id = 1;
  string cycle_name = 2;
  repeated EvaluationPeriodRef periods = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  // subject_ids are the group's subjects plus any subject already graded.
  repeated string subject_ids = 6;
  repeated PeriodGrade grades = 7;
}

message PeriodsWithGradesRequest {
  repeated string period_ids = 1;
}

message PeriodsWithGradesResponse {
  // period_ids are the requested periods that hold at least one grade.
  repeated string period_ids = 1;
}

// --- Domain events (published) --------------------------------------------

// GradesPublished fires once per report card issued when a period closes (on
// the grades-events topic, type attribute "GradesPublished"). version > 1
// means the report card replaces an earlier one. Consumers key idempotency on
// report_card_id + version.
message GradesPublished {
  string student_id = 1;
  string cycle_id = 2;
  string tenant_id = 3;
  string report_card_id = 4;
  string term_id = 5;
  string term_name = 6;
  int32 version = 7;
  string enrollment_id = 8;
}

// --- Period closing and report cards (T7) --------------------------------

// PeriodProgress counts the expected monthly captures of a term (active
// enrollments x the subjects taught in their group x every month of the term
// from the one the pupil joined the group in) and how many are captured.
message PeriodProgress {
  int32 captured = 1;
  int32 expected = 2;
}

// Period is one term with its closure state. status is "open" or "closed";
// version is how many times it has been closed (the version of its latest
// report cards; 0 = never closed).
message Period {
  string term_id = 1;
  string term_name = 2;
  int32 ordinal = 3;
  string level_id = 4;
  string level_name = 5;
  repeated string months = 6;
  string status = 7;
  google.protobuf.Timestamp closed_at = 8;
  string closed_by_name = 9;
  int32 version = 10;
  PeriodProgress progress = 11;
  // T15: the dates the term's evaluation periods span across the level's
  // grades (the earliest start, the latest end; "YYYY-MM-DD", "" when no
  // grade has that period). months (above) is empty since T15.
  string starts_on = 12;
  string ends_on = 13;
}

message ListPeriodsRequest {
  string cycle_id = 1;
}

message ListPeriodsResponse {
  repeated Period periods = 1;
}

message GetPeriodProgressRequest {
  string term_id = 1;
}

// MissingGrades is how many captures one group+subject still owes.
message MissingGrades {
  string group_id = 1;
  string group_label = 2;
  string subject_id = 3;
  string subject_name = 4;
  string teacher_name = 5;
  int32 missing_count = 6;
}

message GetPeriodProgressResponse {
  string term_id = 1;
  repeated string months = 2;
  int32 expected = 3;
  int32 captured = 4;
  repeated MissingGrades missing = 5;
  // unfinished_months are the term's months after the current UTC month: they
  // are still expected (closing now needs force), but have not been taught yet.
  repeated string unfinished_months = 6;
  // T15: unfinished is true while a grade's period of this term has not ended
  // (the school's local day): still expected, closing now needs force.
  // months / unfinished_months are empty since T15.
  bool unfinished = 7;
  string ends_on = 8;
  // groups_without_period are the labels of the level's groups with active
  // pupils whose grade has no evaluation period of the term's ordinal: the
  // term cannot close until config gives them one (PERIOD_NOT_CONFIGURED).
  repeated string groups_without_period = 9;
}

message ClosedTermsRequest {
  repeated string term_ids = 1;
}

message ClosedTermsResponse {
  // closed_term_ids are the requested terms that are closed now.
  repeated string closed_term_ids = 1;
}

message ClosePeriodRequest {
  string term_id = 1;
  // force closes even with missing captures.
  bool force = 2;
  // actor_id / actor_name are the authenticated director (audit, snapshot).
  string actor_id = 3;
  string actor_name = 4;
}

message ClosePeriodResponse {
  string status = 1;
  int32 version = 2;
  int32 report_cards = 3;
}

message ReopenPeriodRequest {
  string term_id = 1;
  string actor_id = 2;
}

message ReopenPeriodResponse {
  string status = 1;
}

message ListReportCardsRequest {
  string term_id = 1;
  string group_id = 2;
  string student_id = 3;
}

// ReportCardSummary is one report card in a list. general_average is decimal
// text — since T15 the exact mean truncated to 2 decimals ("8.66"; cards
// issued before keep their one decimal); "" = none. term_ordinal is the term's order in
// its cycle as frozen at issue (1 = first; 0 = issued before it was recorded).
// A student's list comes newest period first (cycle, then term_ordinal).
message ReportCardSummary {
  string id = 1;
  string term_id = 2;
  string term_name = 3;
  string student_id = 4;
  string student_name = 5;
  string group_id = 6;
  string group_label = 7;
  int32 version = 8;
  google.protobuf.Timestamp issued_at = 9;
  string general_average = 10;
  string enrollment_id = 11;
  int32 term_ordinal = 12;
  string cycle_id = 13;
  string cycle_name = 14;
}

message ListReportCardsResponse {
  repeated ReportCardSummary report_cards = 1;
}

message GetReportCardRequest {
  string id = 1;
}

// ReportCardLine is one subject of a report card. period_values (T15) maps an
// evaluation period id to the captured grade's exact text; a period without a
// grade is absent. month_values is the same for a card issued before T15.
// term_average is the exact mean of the line's grades, truncated to 2
// decimals ("8.66", "8.5", "9"); "" = no grade.
message ReportCardLine {
  string subject_id = 1;
  string subject_name = 2;
  int32 position = 3;
  map<string, string> month_values = 4;
  string term_average = 5;
  map<string, string> period_values = 6;
}

// ReportCardPeriod is one column of a T15 report card: an evaluation period of
// the pupil's grade, as it read at issue time.
message ReportCardPeriod {
  string id = 1;
  int32 ordinal = 2;
  string name = 3;
}

// ReportCard is the frozen snapshot issued when a period closed. Names are
// copied at issue time, so a later rename never changes an issued report card.
message ReportCard {
  string id = 1;
  string term_id = 2;
  string cycle_id = 3;
  string level_id = 4;
  string group_id = 5;
  string enrollment_id = 6;
  string student_id = 7;
  int32 version = 8;
  string status = 9; // "published" | "superseded"
  google.protobuf.Timestamp issued_at = 10;
  string issued_by = 11;
  string student_name = 12;
  string enrollment_number = 13;
  string group_label = 14;
  string level_name = 15;
  string cycle_name = 16;
  string term_name = 17;
  repeated string months = 18;
  string general_average = 19;
  GradingScale scale = 20;
  repeated ReportCardLine lines = 21;
  int32 term_ordinal = 22; // see ReportCardSummary.term_ordinal
  // periods are the card's columns (T15): the pupil's grade's periods from the
  // first up to the one closed. Empty on a card issued before T15, whose
  // columns are `months`.
  repeated ReportCardPeriod periods = 23;
}

message GetReportCardResponse {
  ReportCard report_card = 1;
}

// --- level deletion (ADR 0021) ---------------------------------------------

// LevelScope is everything a level deletion reaches, resolved by the gateway
// from config (structure) and students (people). Every id is a uuid; a service
// reads only the fields it owns data for.
message LevelScope {
  string level_id = 1;
  repeated string grade_level_ids = 2;
  repeated string group_ids = 3;
  repeated string subject_ids = 4;
  repeated string term_ids = 5;
  repeated string enrollment_ids = 6;
  repeated string student_ids = 7;
}

// LevelArchiveCount is how many rows of one kind a level deletion touches.
message LevelArchiveCount {
  string kind = 1;
  int64 count = 2;
}

// LevelRestoreSkip is rows of one kind a restore could not put back, and why.
message LevelRestoreSkip {
  string kind = 1;
  int64 count = 2;
  string reason = 3;
}

message PreviewLevelDeletionRequest {
  LevelScope scope = 1;
}

message PreviewLevelDeletionResponse {
  repeated LevelArchiveCount counts = 1;
}

message ArchiveLevelRequest {
  // batch_id is the saga's idempotency key (a uuid minted by the gateway).
  string batch_id = 1;
  LevelScope scope = 2;
}

message ArchiveLevelResponse {
  repeated LevelArchiveCount counts = 1;
}

message RestoreLevelBatchRequest {
  string batch_id = 1;
  // skip_enrollment_ids are enrollments students could NOT restore: their rows
  // stay archived (reported as skipped) instead of coming back orphaned.
  repeated string skip_enrollment_ids = 2;
}

message RestoreLevelBatchResponse {
  repeated LevelArchiveCount restored = 1;
  repeated LevelRestoreSkip skipped = 2;
}

message PurgeLevelArchivesRequest {}

message PurgeLevelArchivesResponse {
  int64 purged_rows = 1;
}

message PurgeLevelBatchRequest {
  string batch_id = 1;
}

message PurgeLevelBatchResponse {
  int64 purged_rows = 1;
}

// --- group corrections (T8) -------------------------------------------------

message GroupUsageRequest {
  string group_id = 1;
}

message GroupUsageResponse {
  int64 report_cards = 1;
}
