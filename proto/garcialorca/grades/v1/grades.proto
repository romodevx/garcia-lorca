// Grades / Boletas (M07) — grade capture (roster + grade_entries).
//
// Phase 5 (capture): a teacher opens a teaching assignment (group+subject),
// sees the roster (students enrolled in the group), and captures/edits a
// numeric grade (0–10) per student for a term. subject_id / teacher_id / cycle
// are DERIVED server-side from the assignment — never client-supplied.
// Cross-service references (enrollment_id, subject_id, term_id, teacher_id) are
// plain UUIDs validated by RPC, NOT foreign keys.
//
// T7 adds period closing and report cards (boletas): ClosePeriod, the report
// card reads and the GradesPublished event. grade_entries.published_at stays unused.
syntax = "proto3";

package garcialorca.grades.v1;

import "google/protobuf/timestamp.proto";

// GradesService is the grades/boletas API surface.
service GradesService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // CaptureGrade records or edits a student's numeric grade (0–10) for a term.
  // The subject and teacher are DERIVED from the assignment (never client
  // args); the enrollment, term, and assignment are validated by RPC against
  // the students/config services. Re-capturing the same (enrollment, subject,
  // term) updates the value (upsert). Out-of-range value is InvalidArgument.
  rpc CaptureGrade(CaptureGradeRequest) returns (CaptureGradeResponse);

  // GetRoster returns one row per active enrollment in the assignment's group,
  // each with the current grade value for the term (has_value=false when the
  // student has no grade captured yet). Student names are NOT returned — grades
  // stays free of student PII; the web resolves names from the students list.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

  // ListGradeEntries lists grade entries, optionally filtered by enrollment
  // and/or term (each filter is independent; empty = any).
  rpc ListGradeEntries(ListGradeEntriesRequest) returns (ListGradeEntriesResponse);

  // --- monthly grades (T6) ---
  // The school captures one grade per student, subject and MONTH. The subject
  // and teacher are DERIVED from the assignment; the level's grading scale
  // (config) bounds the value; the month must fall inside the assignment's
  // cycle; the enrollment must be active in the assignment's group.

  // UpsertMonthlyGrade records or corrects one student's grade for a month
  // (autosave per cell). Scale, decimals, month and level refusals are
  // InvalidArgument with a sentence for the user; an unknown assignment is
  // NotFound.
  rpc UpsertMonthlyGrade(UpsertMonthlyGradeRequest) returns (UpsertMonthlyGradeResponse);
  // ClearMonthlyGrade removes one student's grade for a month (an emptied
  // cell). Clearing a grade that does not exist succeeds.
  rpc ClearMonthlyGrade(ClearMonthlyGradeRequest) returns (ClearMonthlyGradeResponse);
  // GetMonthlySheet is the capture grid of one assignment for one month: the
  // cycle's months, the level's scale, whether it is editable, and one row per
  // active enrollment of the group (student names are resolved at the edge).
  rpc GetMonthlySheet(GetMonthlySheetRequest) returns (GetMonthlySheetResponse);
  // GetEnrollmentMonthlyGrades is one enrollment's monthly grades for its
  // cycle: the months, the scale, the group's subjects and every captured grade.
  rpc GetEnrollmentMonthlyGrades(GetEnrollmentMonthlyGradesRequest) returns (GetEnrollmentMonthlyGradesResponse);
  // CountScaleViolations counts the monthly grades already captured in the
  // level's ACTIVE cycle that a proposed scale would refuse (out of range or
  // too many decimals; with grading disabled, every grade counts). Loosening a
  // scale can never produce a violation. No active cycle counts 0.
  rpc CountScaleViolations(CountScaleViolationsRequest) returns (CountScaleViolationsResponse);

  // --- period closing and report cards (T7) ---
  // A period is one config term: exactly one level of one cycle, covering a
  // set of months. Closing it snapshots a report card per active enrollment of
  // the level (one transaction with the closure) and locks the term's months
  // for every writer; reopening unlocks them, and closing again issues the
  // next version, which supersedes the previous one.

  // ListPeriods lists every term of a cycle with its closure state and capture
  // progress.
  rpc ListPeriods(ListPeriodsRequest) returns (ListPeriodsResponse);
  // GetPeriodProgress is one term's capture progress and what is missing,
  // grouped by group and subject. NotFound for an unknown term.
  rpc GetPeriodProgress(GetPeriodProgressRequest) returns (GetPeriodProgressResponse);
  // ClosePeriod closes a term and issues its report cards. Refusals are
  // AlreadyExists (409 at the edge) with an X-Error-Code: MISSING_GRADES
  // (captures missing and force unset), TERM_WITHOUT_MONTHS, ALREADY_CLOSED,
  // LEVEL_NOT_GRADED.
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
  // ReopenPeriod reopens a closed term (ALREADY_OPEN otherwise). Its report
  // cards stay published.
  rpc ReopenPeriod(ReopenPeriodRequest) returns (ReopenPeriodResponse);
  // ListReportCards lists the LATEST published report card of each enrollment,
  // filtered by term, group and/or student (at least one filter is required).
  rpc ListReportCards(ListReportCardsRequest) returns (ListReportCardsResponse);
  // GetReportCard is one report card's full snapshot (any version).
  rpc GetReportCard(GetReportCardRequest) returns (GetReportCardResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// GradeEntry is one captured grade for a student's subject in a term. All ids
// except `id` are cross-service references (validated by RPC, not FKs).
// `value` is the numeric grade in [0, 10]. `published_at` is reserved for the
// future boleta/publish flow and is unset in this phase.
message GradeEntry {
  string id = 1;
  string enrollment_id = 2;
  string subject_id = 3;
  string term_id = 4;
  string teacher_id = 5;
  double value = 6;
  google.protobuf.Timestamp published_at = 7;
}

// RosterRow is one student's slot in a roster: the enrollment, the student it
// belongs to, and the current grade value (has_value=false ⇒ not captured yet,
// and `value` is meaningless).
message RosterRow {
  string enrollment_id = 1;
  string student_id = 2;
  double value = 3;
  bool has_value = 4;
}

// --- RPC messages ---------------------------------------------------------

// CaptureGradeRequest captures/edits a grade. subject_id / teacher_id / cycle
// are deliberately absent — they are DERIVED from the assignment server-side.
message CaptureGradeRequest {
  string assignment_id = 1;
  string enrollment_id = 2;
  string term_id = 3;
  double value = 4;
}

message CaptureGradeResponse {
  GradeEntry entry = 1;
}

message GetRosterRequest {
  string assignment_id = 1;
  string term_id = 2;
}

message GetRosterResponse {
  repeated RosterRow rows = 1;
}

message ListGradeEntriesRequest {
  string enrollment_id = 1;  // optional filter (empty = any)
  string term_id = 2;        // optional filter (empty = any)
}

message ListGradeEntriesResponse {
  repeated GradeEntry entries = 1;
}

// --- Monthly grades (T6) --------------------------------------------------

// GradingScale is the level's numeric scale in exact hundredths (5.00 = 500).
message GradingScale {
  int32 min_hundredths = 1;
  int32 max_hundredths = 2;
  int32 decimals = 3;
  int32 passing_hundredths = 4;
}

// MonthlyGrade is one captured monthly grade. `month` is "YYYY-MM"; `value` is
// the canonical decimal text ("9.5", "10") — never a float, so a boundary like
// 9.95 is judged exactly.
message MonthlyGrade {
  string enrollment_id = 1;
  string subject_id = 2;
  string month = 3;
  string value = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UpsertMonthlyGradeRequest {
  string assignment_id = 1;
  string month = 2;          // "YYYY-MM"
  string enrollment_id = 3;
  string value = 4;          // decimal text, e.g. "9.5"
  string captured_by = 5;    // the authenticated user id (audit)
  // school_wide is set by the director's routes: the caller acts for the whole
  // school, so months that belong to a transferred pupil's previous group stay
  // writable. Unset (a teacher) = those months are read-only.
  bool school_wide = 6;
}

message UpsertMonthlyGradeResponse {
  MonthlyGrade grade = 1;
}

message ClearMonthlyGradeRequest {
  string assignment_id = 1;
  string month = 2;
  string enrollment_id = 3;
  bool school_wide = 4;      // see UpsertMonthlyGradeRequest.school_wide
}

message ClearMonthlyGradeResponse {}

message GetMonthlySheetRequest {
  string assignment_id = 1;
  // month "YYYY-MM"; empty = the current UTC month clamped into the cycle.
  string month = 2;
  bool school_wide = 3;      // see UpsertMonthlyGradeRequest.school_wide
}

// MonthlySheetRow is one active enrollment of the group; value is "" when no
// grade is captured for the month.
message MonthlySheetRow {
  string enrollment_id = 1;
  string student_id = 2;
  string value = 3;
  google.protobuf.Timestamp updated_at = 4;
  // editable is false when THIS row's month cannot be written by the caller
  // (a month before the pupil joined the group by transfer); read_only_reason
  // then says why. The sheet-level editable still gates every row.
  bool editable = 5;
  string read_only_reason = 6;
}

message GetMonthlySheetResponse {
  string assignment_id = 1;
  string month = 2;
  repeated string months = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  bool editable = 6;
  string read_only_reason = 7;
  repeated MonthlySheetRow rows = 8;
  // closed_months are the months of the sheet that belong to a CLOSED period
  // of the level: nobody may write them until the director reopens it.
  repeated string closed_months = 9;
}

message GetEnrollmentMonthlyGradesRequest {
  string enrollment_id = 1;
}

message GetEnrollmentMonthlyGradesResponse {
  string cycle_id = 1;
  string cycle_name = 2;
  repeated string months = 3;
  GradingScale scale = 4;
  bool grading_enabled = 5;
  // subject_ids are the group's subjects plus any subject already graded.
  repeated string subject_ids = 6;
  repeated MonthlyGrade grades = 7;
}

message CountScaleViolationsRequest {
  string level_id = 1;
  // grading_enabled=false means "disable numeric grading": every captured
  // grade of the cycle is a violation.
  bool grading_enabled = 2;
  GradingScale scale = 3;
}

message CountScaleViolationsResponse {
  int32 violations = 1;
}

// --- Domain events (published) --------------------------------------------

// GradesPublished fires once per report card issued when a period closes (on
// the grades-events topic, type attribute "GradesPublished"). version > 1
// means the report card replaces an earlier one. Consumers key idempotency on
// report_card_id + version.
message GradesPublished {
  string student_id = 1;
  string cycle_id = 2;
  string tenant_id = 3;
  string report_card_id = 4;
  string term_id = 5;
  string term_name = 6;
  int32 version = 7;
  string enrollment_id = 8;
}

// --- Period closing and report cards (T7) --------------------------------

// PeriodProgress counts the expected monthly captures of a term (active
// enrollments x the subjects taught in their group x the term's months up to
// the current month) and how many of them are captured.
message PeriodProgress {
  int32 captured = 1;
  int32 expected = 2;
}

// Period is one term with its closure state. status is "open" or "closed";
// version is how many times it has been closed (the version of its latest
// report cards; 0 = never closed).
message Period {
  string term_id = 1;
  string term_name = 2;
  int32 ordinal = 3;
  string level_id = 4;
  string level_name = 5;
  repeated string months = 6;
  string status = 7;
  google.protobuf.Timestamp closed_at = 8;
  string closed_by_name = 9;
  int32 version = 10;
  PeriodProgress progress = 11;
}

message ListPeriodsRequest {
  string cycle_id = 1;
}

message ListPeriodsResponse {
  repeated Period periods = 1;
}

message GetPeriodProgressRequest {
  string term_id = 1;
}

// MissingGrades is how many captures one group+subject still owes.
message MissingGrades {
  string group_id = 1;
  string group_label = 2;
  string subject_id = 3;
  string subject_name = 4;
  string teacher_name = 5;
  int32 missing_count = 6;
}

message GetPeriodProgressResponse {
  string term_id = 1;
  repeated string months = 2;
  int32 expected = 3;
  int32 captured = 4;
  repeated MissingGrades missing = 5;
}

message ClosePeriodRequest {
  string term_id = 1;
  // force closes even with missing captures.
  bool force = 2;
  // actor_id / actor_name are the authenticated director (audit, snapshot).
  string actor_id = 3;
  string actor_name = 4;
}

message ClosePeriodResponse {
  string status = 1;
  int32 version = 2;
  int32 report_cards = 3;
}

message ReopenPeriodRequest {
  string term_id = 1;
  string actor_id = 2;
}

message ReopenPeriodResponse {
  string status = 1;
}

message ListReportCardsRequest {
  string term_id = 1;
  string group_id = 2;
  string student_id = 3;
}

// ReportCardSummary is one report card in a list. general_average is decimal
// text with one decimal ("8.5"); "" = none.
message ReportCardSummary {
  string id = 1;
  string term_id = 2;
  string term_name = 3;
  string student_id = 4;
  string student_name = 5;
  string group_id = 6;
  string group_label = 7;
  int32 version = 8;
  google.protobuf.Timestamp issued_at = 9;
  string general_average = 10;
  string enrollment_id = 11;
}

message ListReportCardsResponse {
  repeated ReportCardSummary report_cards = 1;
}

message GetReportCardRequest {
  string id = 1;
}

// ReportCardLine is one subject of a report card. month_values maps "YYYY-MM"
// to the captured grade's exact decimal text; a month without a grade is
// absent. term_average is one decimal ("8.5"); "" = no grade in the term.
message ReportCardLine {
  string subject_id = 1;
  string subject_name = 2;
  int32 position = 3;
  map<string, string> month_values = 4;
  string term_average = 5;
}

// ReportCard is the frozen snapshot issued when a period closed. Names are
// copied at issue time, so a later rename never changes an issued report card.
message ReportCard {
  string id = 1;
  string term_id = 2;
  string cycle_id = 3;
  string level_id = 4;
  string group_id = 5;
  string enrollment_id = 6;
  string student_id = 7;
  int32 version = 8;
  string status = 9; // "published" | "superseded"
  google.protobuf.Timestamp issued_at = 10;
  string issued_by = 11;
  string student_name = 12;
  string enrollment_number = 13;
  string group_label = 14;
  string level_name = 15;
  string cycle_name = 16;
  string term_name = 17;
  repeated string months = 18;
  string general_average = 19;
  GradingScale scale = 20;
  repeated ReportCardLine lines = 21;
}

message GetReportCardResponse {
  ReportCard report_card = 1;
}
