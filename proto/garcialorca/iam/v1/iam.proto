// IAM (M01) — authentication (JWT: short-lived access + refresh) and the
// permission-based authorization model every other service checks against.
// iam is the spine and the ONLY token issuer.
//
// FROZEN CONTRACT (M01, 2026-07-01): the auth + authz surface below is stable;
// downstream services depend on it. Admin CRUD (CreateUser/CreateRole/…) is
// intentionally NOT frozen yet — it is added when the admin module needs it.
syntax = "proto3";

package garcialorca.iam.v1;

import "google/protobuf/timestamp.proto";

// IamService is the IAM API surface: liveness, authentication, and
// authorization. Authorization is permission-based — callers resolve a
// principal's effective permissions (via ValidateToken) or ask CheckPermission;
// they never compare role names.
service IamService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Login exchanges email + password for an access token (short-lived) and a
  // refresh token. iam is the only issuer of both.
  rpc Login(LoginRequest) returns (LoginResponse);

  // RefreshToken exchanges a valid refresh token for a fresh access token (and a
  // rotated refresh token). Lets sessions outlive the short access TTL without
  // re-entering credentials.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // ChangePassword sets a new password for the principal, verifying the current
  // one first. Clears must_change_password. Used for the forced first-login
  // rotation and ordinary password changes.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // ValidateToken verifies an access token and returns its claims (principal +
  // effective permissions). The gateway/services call this to authorize a
  // request; an invalid/expired token is an Unauthenticated error.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // CheckPermission answers whether the access token's principal holds a
  // specific permission (e.g. "students:create"). Convenience over
  // ValidateToken for a single-permission gate.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // AssignRole grants a role to a user (admin operation, permission-gated).
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);

  // RevokeRole removes a role from a user (admin operation, permission-gated).
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);

  // --- User admin (admin operations, permission-gated) ---

  // CreateUser provisions a new principal with a temporary password. The account
  // is created with must_change_password=true, so the first allowed action is the
  // forced ChangePassword rotation. Optionally assigns roles at creation.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser fetches a user by id, including its assigned role ids.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ListUsers lists every user in the tenant, each with its assigned role ids.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // SetUserStatus suspends or reactivates an account. A SUSPENDED user cannot log
  // in; reactivating restores ACTIVE.
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);

  // --- Role admin (admin operations, permission-gated) ---

  // CreateRole defines a named bundle of permissions. The name is unique per
  // tenant.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // GetRole fetches a role by id, including its permissions.
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);

  // ListRoles lists every role in the tenant, each with its permissions.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // SetRolePermissions replaces a role's full permission set (not an additive
  // merge). Callers send the desired final list.
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  // status is a coarse health string, e.g. "ok".
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// UserStatus is the account lifecycle state. A non-ACTIVE user cannot log in.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
}

// User is the IAM principal. `email` is unique per tenant. `tenant_id` is
// reserved for multi-tenant scoping; M01 operates single-tenant and RLS is
// tenant-scoped via app.current_tenant.
message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  UserStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // must_change_password is true while the account still holds a temporary
  // password; the only allowed action until it clears is ChangePassword.
  bool must_change_password = 8;
  // role_ids are the ids of the roles assigned to the user. Populated by the
  // admin read RPCs (GetUser/ListUsers); the effective permission set is the
  // union of these roles' permissions.
  repeated string role_ids = 9;
}

// Role is a named bundle of permissions. `permissions` are "resource:action"
// strings, e.g. "students:read", "finance:payment:create".
message Role {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
}

// Claims is the verified content of an access token: the principal plus the
// effective permission set the gateway/services authorize against.
message Claims {
  string subject = 1;              // user id
  string tenant_id = 2;
  string email = 3;
  repeated string permissions = 4; // effective (union across the user's roles)
  google.protobuf.Timestamp expires_at = 5;
  // must_change_password mirrors the account flag so the gateway can enforce the
  // forced first-login rotation without an extra round-trip to iam.
  bool must_change_password = 6;
}

// --- Login / tokens -------------------------------------------------------

// SessionKind is which surface the session belongs to, and therefore how long
// it may sit unused before it must be logged in again.
//
// Two surfaces, two lifetimes, and the difference is not a preference. The
// school's panel sits on a shared desk: somebody walks away and the session has
// to be over. The family app lives on a parent's own phone, where logging them
// out every quarter of an hour would teach them to stop opening it.
enum SessionKind {
  // Unspecified is the school's panel — the SHORTER life. A caller that says
  // nothing gets it, because guessing wrong that way costs a login and guessing
  // wrong the other way leaves an office session open all afternoon.
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_STAFF = 1;
  SESSION_KIND_FAMILY = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  // Which surface is logging in. It comes from the ROUTE the request arrived
  // on, never from anything a user can type.
  SessionKind session_kind = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3; // access token TTL in seconds
  User user = 4;
  // Mirrors User.must_change_password for convenience: the client routes to the
  // change-password flow when true.
  bool must_change_password = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2; // rotated
  int64 expires_in = 3;
}

message ChangePasswordRequest {
  // access_token identifies the principal (iam derives the subject from it);
  // the current password is re-verified before the change.
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  Claims claims = 1;
}

message CheckPermissionRequest {
  string access_token = 1;
  string permission = 2; // "resource:action"
}

message CheckPermissionResponse {
  bool allowed = 1;
}

// --- Role assignment ------------------------------------------------------

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message AssignRoleResponse {}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeRoleResponse {}

// --- User admin -----------------------------------------------------------

// CreateUserRequest provisions a new principal. temp_password is the initial
// temporary password (stored as must_change_password=true). role_ids optionally
// assigns roles at creation.
message CreateUserRequest {
  string email = 1;
  string display_name = 2;
  string temp_password = 3;
  repeated string role_ids = 4;
}

// CreateUserResponse returns the created user.
message CreateUserResponse {
  User user = 1;
}

// GetUserRequest fetches a user by id.
message GetUserRequest {
  string id = 1;
}

// GetUserResponse returns the requested user (with role ids).
message GetUserResponse {
  User user = 1;
}

// ListUsersRequest lists all users in the tenant.
message ListUsersRequest {}

// ListUsersResponse returns the tenant users (each with role ids).
message ListUsersResponse {
  repeated User users = 1;
}

// SetUserStatusRequest suspends or reactivates a user account.
message SetUserStatusRequest {
  string user_id = 1;
  UserStatus status = 2;
}

// SetUserStatusResponse returns the updated user.
message SetUserStatusResponse {
  User user = 1;
}

// --- Role admin -----------------------------------------------------------

// CreateRoleRequest defines a role with an initial permission set. name is
// unique per tenant.
message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
}

// CreateRoleResponse returns the created role.
message CreateRoleResponse {
  Role role = 1;
}

// GetRoleRequest fetches a role by id.
message GetRoleRequest {
  string id = 1;
}

// GetRoleResponse returns the requested role.
message GetRoleResponse {
  Role role = 1;
}

// ListRolesRequest lists all roles in the tenant.
message ListRolesRequest {}

// ListRolesResponse returns the tenant roles.
message ListRolesResponse {
  repeated Role roles = 1;
}

// SetRolePermissionsRequest replaces a role's full permission set. The list is
// the desired final state, not an additive delta.
message SetRolePermissionsRequest {
  string role_id = 1;
  repeated string permissions = 2;
}

// SetRolePermissionsResponse returns the updated role.
message SetRolePermissionsResponse {
  Role role = 1;
}

// --- Domain events (published; see MODULES.md M04) ------------------------

// CycleRolled signals a school-cycle roll-over that downstream modules react to.
// Owned by config (M04) which shares area 11 with IAM.
// TODO(M04): previous_cycle_id, effective_at.
message CycleRolled {
  string new_cycle_id = 1;
  string tenant_id = 2;
}
