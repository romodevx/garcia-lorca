// Students / Admisión (M03) — the first business vertical slice: enroll a student
// end-to-end through the gateway.
//
// FROZEN CONTRACT (M03, 2026-07-02). Admission is a state machine:
//   pending → accepted → enrolled   (+ rejected from pending, withdrawn from
//   accepted/enrolled). ChangeAdmissionStatus drives every transition;
//   StudentEnrolled fires on enroll, AdmissionStatusChanged on every transition.
syntax = "proto3";

package garcialorca.students.v1;

import "google/protobuf/timestamp.proto";

// StudentsService is the students/admission API surface.
service StudentsService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // CreateApplicant registers a new applicant (admission status = pending).
  rpc CreateApplicant(CreateApplicantRequest) returns (CreateApplicantResponse);

  // GetStudent fetches a student by id.
  rpc GetStudent(GetStudentRequest) returns (GetStudentResponse);

  // UpdateStudent corrects a pupil's file: names, CURP and the profile (birth
  // date, sex, the pupil's email and phones, address). Level and group are not
  // here — a group changes by TransferStudent, which keeps history and seats.
  rpc UpdateStudent(UpdateStudentRequest) returns (UpdateStudentResponse);

  // A pupil's medical record: blood type, allergies, relevant conditions.
  // Served at the edge under medical:read / medical:write, not students:*.
  rpc GetStudentMedical(GetStudentMedicalRequest) returns (GetStudentMedicalResponse);
  rpc UpdateStudentMedical(UpdateStudentMedicalRequest) returns (UpdateStudentMedicalResponse);

  // A pupil's photo: JPEG or PNG (judged by its bytes), at most 2 MB, kept in a
  // private bucket and served only through the gateway.
  rpc UploadStudentPhoto(UploadStudentPhotoRequest) returns (UploadStudentPhotoResponse);
  rpc GetStudentPhoto(GetStudentPhotoRequest) returns (GetStudentPhotoResponse);
  rpc DeleteStudentPhoto(DeleteStudentPhotoRequest) returns (DeleteStudentPhotoResponse);

  // Notes staff keep about a pupil. A wrong one is voided (kept and marked);
  // an edit keeps the replaced text as a revision. The author and editor come
  // from the authenticated caller at the edge.
  rpc AddStudentNote(AddStudentNoteRequest) returns (AddStudentNoteResponse);
  rpc ListStudentNotes(ListStudentNotesRequest) returns (ListStudentNotesResponse);
  rpc VoidStudentNote(VoidStudentNoteRequest) returns (VoidStudentNoteResponse);
  // Replaces a note's text, keeping the replaced text as a revision (T6).
  rpc EditStudentNote(EditStudentNoteRequest) returns (EditStudentNoteResponse);

  // --- virtual card (task 13) ---
  // GetCardCode returns the code a pupil's card shows as a QR (GLCARD:<token>),
  // issuing one the first time.
  rpc GetCardCode(GetCardCodeRequest) returns (GetCardCodeResponse);
  // RevokeCard retires a pupil's current code and SUSPENDS the card: no new
  // code is issued to the family's session until the office reissues it.
  rpc RevokeCard(RevokeCardRequest) returns (RevokeCardResponse);
  // ReissueCard gives a suspended pupil a new card, on purpose. ALREADY_EXISTS
  // when the pupil's card is valid.
  rpc ReissueCard(ReissueCardRequest) returns (ReissueCardResponse);
  // VerifyCard reads a scanned code: whose card it is, whether it still counts
  // as a school credential (valid: an active code of an enrolled pupil), and
  // whether the office revoked it (revoked: the card's own state, independent
  // of admission). An unknown code is NOT_FOUND; something that is not a card
  // code, INVALID_ARGUMENT.
  rpc VerifyCard(VerifyCardRequest) returns (VerifyCardResponse);

  // ListStudents lists students, optionally filtered by level/group/status,
  // ordered by surname (paternal, maternal) then first name in Spanish
  // collation, id as the tie-break.
  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse);

  // ChangeAdmissionStatus advances the admission state machine (accept, reject,
  // enroll, withdraw). An invalid transition is a FailedPrecondition error.
  rpc ChangeAdmissionStatus(ChangeAdmissionStatusRequest) returns (ChangeAdmissionStatusResponse);

  // Enroll places a student into a group of a cycle. The cycle is DERIVED
  // server-side from the group (never a client arg); the group and optional term
  // are validated by RPC against the config service. A duplicate enrollment for
  // the same (student, cycle) is an AlreadyExists error.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // EnrollIntoGrade places a pupil in a GRADE and lets the school's own capacity
  // choose the group: A until it is full, then B. What a school knows when a
  // child arrives is the level and the grade; which group they land in is a
  // consequence of how full each one is. Refuses when the grade has no groups,
  // and when every seat is taken — opening another group is a decision.
  rpc EnrollIntoGrade(EnrollIntoGradeRequest) returns (EnrollIntoGradeResponse);

  // ImportStudents brings pupils over from the previous system (ADR 0033). Each
  // row is its own transaction: the pupil is created already ENROLLED in the
  // row's group, with an enrolment of origin "import" and NO StudentEnrolled
  // event — the previous system collected their inscription, and finance skips
  // imported enrolments. The cycle and level are derived from the group, never
  // taken from the caller. The enrolment starts on the cycle's first day (00:00
  // school time; now, if the cycle has not opened yet). A CURP the school
  // already has is reported, not touched (O4) — except that an earlier import
  // enrolment of theirs dated after the cycle's first day is moved back to it
  // (moved_to_cycle_start). validate_only runs every check and writes nothing,
  // so the preview and the commit walk the same path.
  rpc ImportStudents(ImportStudentsRequest) returns (ImportStudentsResponse);

  // ListImportIssues lists what the import could not keep as the file wrote it
  // for one pupil (open first; resolved ones only with include_resolved). An
  // unknown pupil is NotFound.
  rpc ListImportIssues(ListImportIssuesRequest) returns (ListImportIssuesResponse);

  // AcceptImportIssue closes an open issue without changing the file ("está
  // bien así"): resolution = accepted, resolved_by = the caller. An issue that
  // is already resolved is answered as it stands. A draft's curp issue is not
  // accepted (AlreadyExists, X-Error-Code STUDENT_DRAFT): only a valid CURP
  // closes it. An issue of another pupil is NotFound.
  rpc AcceptImportIssue(AcceptImportIssueRequest) returns (AcceptImportIssueResponse);

  // GetEnrollment fetches a single enrollment by id.
  rpc GetEnrollment(GetEnrollmentRequest) returns (GetEnrollmentResponse);

  // ListEnrollments lists enrollments, optionally filtered by student, cycle, or
  // group (each filter is independent; empty = any).
  rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse);

  // TransferStudent moves an active enrollment to another group in the SAME
  // cycle, recording a dated, reasoned transfer. Returns the updated enrollment.
  rpc TransferStudent(TransferStudentRequest) returns (TransferStudentResponse);

  // ListTransfers returns the group moves of a student's enrollments, oldest
  // first. A transfer rewrites the enrollment's group_id in place, so this
  // history is the only record of which group a pupil was in on a past day.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);

  // WithdrawEnrollment marks an enrollment as withdrawn. Returns the updated
  // enrollment.
  rpc WithdrawEnrollment(WithdrawEnrollmentRequest) returns (WithdrawEnrollmentResponse);

  // LinkGuardian links a guardian to a student. guardian_user_id references an
  // iam user (validated by RPC at the use-case layer, not by an FK). A duplicate
  // link for the same (guardian, student) is an AlreadyExists error.
  rpc LinkGuardian(LinkGuardianRequest) returns (LinkGuardianResponse);

  // AddContact records somebody the school can reach about a pupil, with no
  // account and no login: a grandmother who may collect the child, or the phone
  // that actually answers. Most of a pupil's contacts are these.
  rpc AddContact(AddContactRequest) returns (AddContactResponse);

  // GrantContactAccess attaches an iam account to a contact the school already
  // recorded, so that family can open the app. It does NOT create a second row:
  // a pupil has one list of contacts, and a person who appears twice — once as a
  // name, once as an account — is a list the office stops reading.
  //
  // student_id is required and checked here, not only at the edge: without it a
  // caller could name any contact id and hand that family's child to an account
  // of its choosing. A contact of another pupil is NotFound, never
  // PermissionDenied, so the answer does not confirm it exists.
  rpc GrantContactAccess(GrantContactAccessRequest) returns (GrantContactAccessResponse);

  // UpdateContact corrects a contact of a pupil; RemoveContact deletes one that
  // has no app access. Both are scoped by student_id: a contact of another
  // pupil is NotFound, so the answer never confirms it exists.
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc RemoveContact(RemoveContactRequest) returns (RemoveContactResponse);

  // UnlinkGuardian removes a guardian↔student link. An unknown link is a
  // NotFound error.
  rpc UnlinkGuardian(UnlinkGuardianRequest) returns (UnlinkGuardianResponse);

  // ListGuardiansForStudent lists the guardians linked to one student.
  rpc ListGuardiansForStudent(ListGuardiansForStudentRequest) returns (ListGuardiansForStudentResponse);

  // ListStudentsForGuardian lists the students linked to one guardian. This is
  // the seam that powers the self-scoped family read path: the gateway resolves
  // the caller's children through it before serving any family endpoint.
  rpc ListStudentsForGuardian(ListStudentsForGuardianRequest) returns (ListStudentsForGuardianResponse);

  // --- level deletion (ADR 0021) ---
  // PreviewLevelDeletion counts what deleting a level would archive in this
  // service, without changing anything. The scope comes from config (structure
  // ids) and students (enrollment/student ids); each service uses the ids it
  // owns data for.
  rpc PreviewLevelDeletion(PreviewLevelDeletionRequest) returns (PreviewLevelDeletionResponse);
  // ArchiveLevel moves this service's rows of the level into its deletion
  // archive (a JSONB copy, then DELETE) inside ONE tenant-bound transaction.
  // Idempotent per batch_id: a repeated call answers the first call's counts.
  rpc ArchiveLevel(ArchiveLevelRequest) returns (ArchiveLevelResponse);
  // RestoreLevelBatch puts a batch back in dependency order inside ONE
  // transaction, skipping rows that now conflict and reporting them.
  // Converges on retry: rows put back leave the archive, rows that do not fit
  // stay archived (until the purge) and a retry tries them again; a batch with
  // nothing left answers its last report. NotFound when this service holds no
  // archive for the batch (never archived, or purged) — never a silent success.
  rpc RestoreLevelBatch(RestoreLevelBatchRequest) returns (RestoreLevelBatchResponse);
  // PurgeLevelArchives hard-deletes archives past the 7-day retention. The
  // retention is fixed server-side: no caller can purge fresh trash.
  rpc PurgeLevelArchives(PurgeLevelArchivesRequest) returns (PurgeLevelArchivesResponse);
  // PurgeLevelBatch hard-deletes this service's archive rows of one batch, when
  // the gateway's sweep finds the batch past its restorable_until (config's
  // clock, ADR 0021). Idempotent: an unknown batch purges nothing.
  rpc PurgeLevelBatch(PurgeLevelBatchRequest) returns (PurgeLevelBatchResponse);

  // --- group corrections (T8, ADR 0036) ---
  // GroupUsage counts what this service keeps of one config group: every
  // enrollment ever placed in it (any status) and every transfer from or to
  // it. The gateway refuses to delete a group while any is non-zero.
  rpc GroupUsage(GroupUsageRequest) returns (GroupUsageResponse);
  // RefreshGroupName rewrites the group label on the files of the pupils
  // actively enrolled in the group, after config renamed it. Idempotent.
  rpc RefreshGroupName(RefreshGroupNameRequest) returns (RefreshGroupNameResponse);

  // --- families (ADR 0041) ---
  // A family groups siblings; a pupil belongs to at most one. The family is the
  // layer that WRITES guardian links consistently (T2); guardian_students stays
  // the only answer to "which child does this account see".
  rpc ListFamilies(ListFamiliesRequest) returns (ListFamiliesResponse);
  // GetFamily answers NotFound for an unknown id.
  rpc GetFamily(GetFamilyRequest) returns (GetFamilyResponse);
  // CreateFamily groups pupils that have no family yet (a pupil already in one
  // is FailedPrecondition). It is how a suggestion is accepted, adjusted or not.
  rpc CreateFamily(CreateFamilyRequest) returns (CreateFamilyResponse);
  rpc RenameFamily(RenameFamilyRequest) returns (RenameFamilyResponse);
  // AddStudentsToFamily adds pupils without a family to an existing one.
  rpc AddStudentsToFamily(AddStudentsToFamilyRequest) returns (AddStudentsToFamilyResponse);
  // RemoveStudentFromFamily takes one pupil out. Its guardian links stay: its
  // parents are still its parents. Removing the last pupil dissolves the family.
  rpc RemoveStudentFromFamily(RemoveStudentFromFamilyRequest) returns (RemoveStudentFromFamilyResponse);
  // DissolveFamily leaves every member without a family and touches no link.
  rpc DissolveFamily(DissolveFamilyRequest) returns (DissolveFamilyResponse);
  // SuggestFamilies proposes groups of pupils without a family that look like
  // siblings: same paternal + maternal surname, or a contact in common. A
  // dismissed group is not proposed again until its members change.
  rpc SuggestFamilies(SuggestFamiliesRequest) returns (SuggestFamiliesResponse);
  // DismissFamilySuggestion records "not a family" for exactly these pupils.
  // Idempotent.
  rpc DismissFamilySuggestion(DismissFamilySuggestionRequest) returns (DismissFamilySuggestionResponse);
}

// --- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Core types -----------------------------------------------------------

// Level is the former fixed SEP education level. DEPRECATED: a pupil's level is
// now a free reference to the config service's catalog (`level_id` +
// `level_name` on Student), so a school can have Preescolar, Maternal or any
// level it names (ADR 0014). Kept, never renumbered, for wire compatibility.
enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_KINDER = 1;
  LEVEL_PRIMARIA = 2;
  LEVEL_SECUNDARIA = 3;
  LEVEL_PREPARATORIA = 4;
  // Maternal (nursery) is the level below kinder. Appended as 5 rather than
  // inserted at 1 where it belongs pedagogically: enum numbers are the wire
  // format and renumbering them silently reinterprets every stored value.
  // Display order is a presentation concern and lives in the UI.
  LEVEL_MATERNAL = 5;
}

// AdmissionStatus is the applicant/student lifecycle state.
enum AdmissionStatus {
  ADMISSION_STATUS_UNSPECIFIED = 0;
  ADMISSION_STATUS_PENDING = 1;    // applied, awaiting decision
  ADMISSION_STATUS_ACCEPTED = 2;   // admitted, not yet enrolled
  ADMISSION_STATUS_ENROLLED = 3;   // enrolled into a cycle
  ADMISSION_STATUS_REJECTED = 4;   // terminal (from pending)
  ADMISSION_STATUS_WITHDRAWN = 5;  // terminal (from accepted/enrolled)
  // An imported pupil without a valid CURP: no enrollment, no family link,
  // no group change. A valid CURP saved on the file makes them pending.
  ADMISSION_STATUS_DRAFT = 6;
}

// Student is the core entity. `curp` (Clave Única de Registro de Población) is
// the Mexican national id, unique per tenant. `tenant_id` scopes RLS.
message Student {
  string id = 1;
  string tenant_id = 2;
  string curp = 3;
  string first_name = 4;
  string last_name = 5;
  Level level = 6 [deprecated = true];  // superseded by level_id/level_name
  string grade_group = 7;   // e.g. "4° A"
  string guardian_name = 8;
  AdmissionStatus admission_status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // The pupil's level: a config.v1.Level id, and its name as the school wrote
  // it, captured when the pupil was placed ("Preescolar", "Primaria").
  // level_id is empty only for a legacy row whose old level matched no config
  // level when the catalog went free.
  string level_id = 12;
  string level_name = 13;
  // The editable half of the file. Every field is optional.
  StudentProfile profile = 14;
  // enrollment_number is the matrícula, <year>-<five digits> (task 13).
  string enrollment_number = 15;
  // last_name is the PATERNAL surname; maternal_last_name the maternal one,
  // empty when not captured (T3). A pupil captured before this field existed may
  // still carry both surnames in last_name. Display order is always
  // "last_name maternal_last_name first_name".
  string maternal_last_name = 16;
  // bank_reference is the pupil's BBVA payment reference — the "matrícula" of
  // the previous system. Unique per school; empty when the pupil has none.
  string bank_reference = 17;
  // open_issues counts the import issues of the pupil nobody resolved yet.
  int32 open_issues = 18;
  // draft is admission_status == DRAFT: imported without a valid CURP (curp is
  // then empty).
  bool draft = 19;
  // family_id is the pupil's family (ADR 0041); empty when it has none.
  string family_id = 20;
}

// StudentProfile is what the office keeps up to date by hand.
message StudentProfile {
  string birth_date = 1;  // ISO date "2019-03-12", or empty
  string sex = 2;         // "" | "F" | "M" | "X"
  string email = 3;       // the pupil's own address, trimmed and lowercase
  repeated StudentPhone phones = 4;  // at most three
  StudentAddress address = 5;
}

message StudentPhone {
  string kind = 1;    // celular | casa | trabajo | otro
  string number = 2;  // ten digits
}

message StudentAddress {
  string street = 1;
  string ext_number = 2;
  string int_number = 3;
  string neighborhood = 4;
  string postal_code = 5;  // five digits, or empty
  string municipality = 6;
  string state = 7;        // one of the 32 federal entities, or empty
}

message UpdateStudentRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string curp = 4;
  StudentProfile profile = 5;
  string maternal_last_name = 6;  // optional; see Student.maternal_last_name
  // bank_reference: unset keeps the stored one (a client that does not know the
  // field must not wipe it); "" clears it; any other value replaces it.
  optional string bank_reference = 7;
  // The authenticated caller, set by the gateway — never by a client. It is
  // recorded as resolved_by on the import issues this correction closes.
  string actor_user_id = 8;
}

message UpdateStudentResponse {
  Student student = 1;
  // promoted_from_draft: the save gave a draft its CURP, so the pupil is now
  // pending. intended_group_id is the group the import meant them for (empty
  // when unknown), so the caller can offer to enroll them there.
  bool promoted_from_draft = 2;
  string intended_group_id = 3;
}

message StudentMedical {
  string blood_type = 1;  // A+ A- B+ B- AB+ AB- O+ O-, or empty
  string allergies = 2;
  string conditions = 3;
}

message GetStudentMedicalRequest {
  string student_id = 1;
}

message GetStudentMedicalResponse {
  StudentMedical medical = 1;
}

message UpdateStudentMedicalRequest {
  string student_id = 1;
  StudentMedical medical = 2;
}

message UpdateStudentMedicalResponse {
  StudentMedical medical = 1;
}

message UploadStudentPhotoRequest {
  string student_id = 1;
  bytes data = 2;
}

message UploadStudentPhotoResponse {
  string content_type = 1;
  int32 size_bytes = 2;
}

message GetStudentPhotoRequest {
  string student_id = 1;
}

message GetStudentPhotoResponse {
  bytes data = 1;
  string content_type = 2;
}

message DeleteStudentPhotoRequest {
  string student_id = 1;
}

message DeleteStudentPhotoResponse {}

// StudentNote is one entry in a pupil's history.
message StudentNote {
  string id = 1;
  string student_id = 2;
  string body = 3;
  string author_user_id = 4;
  // The author's name as it read when the note was written.
  string author_name = 5;
  google.protobuf.Timestamp created_at = 6;
  // Unset while the note stands.
  google.protobuf.Timestamp voided_at = 7;
  string voided_by = 8;
  // Unset until the note is edited; then the last edit.
  google.protobuf.Timestamp updated_at = 9;
  string updated_by = 10;
  // The last editor's name as it read when they edited.
  string updated_by_name = 11;
}

message AddStudentNoteRequest {
  string student_id = 1;
  string body = 2;
  // The authenticated caller, set by the gateway — never by a client.
  string author_user_id = 3;
  string author_name = 4;
}

message AddStudentNoteResponse {
  StudentNote note = 1;
}

message ListStudentNotesRequest {
  string student_id = 1;
  // Include voided notes (only for callers who may void any note).
  bool include_voided = 2;
}

message ListStudentNotesResponse {
  repeated StudentNote notes = 1;
}

message VoidStudentNoteRequest {
  string student_id = 1;
  string note_id = 2;
  // The authenticated caller, set by the gateway.
  string voided_by = 3;
  // Whether the caller may void any note (students:notes_void), set by the gateway.
  bool voids_any = 4;
}

message VoidStudentNoteResponse {
  StudentNote note = 1;
}

message EditStudentNoteRequest {
  string student_id = 1;
  string note_id = 2;
  string body = 3;
  // The authenticated caller, set by the gateway — never by a client.
  string editor_user_id = 4;
  string editor_name = 5;
  // Whether the caller may edit any note (students:notes_void), set by the gateway.
  bool edits_any = 6;
  // The text the editor started from. When set, a note that no longer says it
  // (someone else edited it meanwhile) is refused with FailedPrecondition/Conflict
  // instead of being overwritten.
  string expected_body = 7;
}

message EditStudentNoteResponse {
  StudentNote note = 1;
}

// --- RPC messages ---------------------------------------------------------

message CreateApplicantRequest {
  string curp = 1;
  string first_name = 2;
  string last_name = 3;
  Level level = 4 [deprecated = true];  // superseded by level_id
  string grade_group = 5;
  string guardian_name = 6;
  string level_id = 7;  // a config.v1.Level id; required
  string maternal_last_name = 8;  // optional; see Student.maternal_last_name
  // birth_date is optional at intake (T11): ISO "2019-03-12", or empty. It is
  // the same field the profile carries, judged by the same rule (not after
  // today), so a pupil registered with it is greeted on their birthday without
  // a second visit to the file.
  string birth_date = 9;
  string bank_reference = 10;  // optional; see Student.bank_reference
}

message CreateApplicantResponse {
  Student student = 1;
}

message GetStudentRequest {
  string id = 1;
}

message GetStudentResponse {
  Student student = 1;
  // Whether GetStudentPhoto would find a photo, so a client asks for it only
  // when there is one (T13: no 404 per file opened without a photo). Unset
  // means unknown — a client then asks, as before.
  optional bool has_photo = 2;
}

message ListStudentsRequest {
  Level level = 1 [deprecated = true];  // superseded by level_id
  AdmissionStatus status = 2;  // optional filter (UNSPECIFIED = any)
  string grade_group = 3;      // optional filter (empty = any)
  int32 page_size = 4;
  string page_token = 5;
  string level_id = 6;         // optional filter (empty = any)
  // ids narrows the list to these students (empty = any). At most 200 ids —
  // one page — so a caller naming a class list never drains the whole school.
  repeated string ids = 7;
  // birthday narrows the list to pupils born on a calendar day (T11): the daily
  // birthday greeting asks "who turns a year older today". Unset = any day.
  BirthdayFilter birthday = 8;
  // active_enrollment narrows the list to pupils with an active enrollment,
  // whatever their admission status but withdrawn or rejected (owner decision
  // D4: the birthday greeting reaches every pupil attending, "en trámite"
  // included). false = any.
  bool active_enrollment = 9;
  // family_id narrows the list to the pupils of one family (empty = any).
  string family_id = 10;
}

// BirthdayFilter is a calendar day, without a year. include_feb_29 also matches
// pupils born on February 29: the caller asks for it on February 28 of a year
// that has no 29th, so a leap-day pupil is still greeted in their own month.
// WHEN to ask is the caller's rule; students only answers the question.
message BirthdayFilter {
  int32 month = 1;  // 1..12
  int32 day = 2;    // 1..31, a day that month can have
  bool include_feb_29 = 3;
}

message ListStudentsResponse {
  repeated Student students = 1;
  string next_page_token = 2;
}

message ChangeAdmissionStatusRequest {
  string id = 1;
  AdmissionStatus target = 2;
  string reason = 3;     // for reject/withdraw
  string cycle_id = 4;   // for enroll (which school cycle); optional until M04
}

message ChangeAdmissionStatusResponse {
  Student student = 1;
}

// --- Domain events (published) --------------------------------------------

message EnrollIntoGradeRequest {
  string student_id = 1;
  string grade_level_id = 2;
  // Optional entry day, YYYY-MM-DD in the school's calendar; empty means
  // today. It must lie between the group's cycle start and the school's today
  // (InvalidArgument otherwise). Stored as 00:00 America/Mexico_City; billing
  // starts that month. A past day bills past months: the gateway requires
  // finance:write for it.
  string enrolled_on = 3;
}

// EnrollIntoGradeResponse carries the enrolment plus the group capacity chose,
// by NAME: the only reader is a person being told "quedó en 1° B".
message EnrollIntoGradeResponse {
  Enrollment enrollment = 1;
  string group_name = 2;
}

// StudentEnrolled fires when a student is enrolled into a cycle.
message StudentEnrolled {
  string student_id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  Level level = 4 [deprecated = true];  // superseded by level_id
  google.protobuf.Timestamp enrolled_at = 5;
  string level_id = 6;
}

// StudentWithdrawn fires when a student's enrollment is withdrawn from a cycle.
message StudentWithdrawn {
  string tenant_id = 1;
  string student_id = 2;
  string cycle_id = 3;
  string enrollment_id = 4;
  string withdrawn_on = 5;  // YYYY-MM-DD; the effective withdrawal date.
}

// AdmissionStatusChanged fires on every admission state transition.
message AdmissionStatusChanged {
  string student_id = 1;
  string tenant_id = 2;
  AdmissionStatus previous_status = 3;
  AdmissionStatus new_status = 4;
  string reason = 5;
  google.protobuf.Timestamp changed_at = 6;
}

// --- Enrollment (Phase 4) -------------------------------------------------

// EnrollmentStatus is the lifecycle of a student's placement in a cycle.
enum EnrollmentStatus {
  ENROLLMENT_STATUS_UNSPECIFIED = 0;
  ENROLLMENT_STATUS_ACTIVE = 1;       // currently enrolled
  ENROLLMENT_STATUS_TRANSFERRED = 2;  // superseded by a move to another group
  ENROLLMENT_STATUS_WITHDRAWN = 3;    // terminal, withdrawn from the cycle
}

// Enrollment places a student into a group of a cycle. cycle_id / group_id /
// term_id reference the config service (validated by RPC, not FKs). tenant_id
// scopes RLS. term_id is optional (empty when the cycle is not term-scoped).
message Enrollment {
  string id = 1;
  string tenant_id = 2;
  string student_id = 3;
  string cycle_id = 4;
  string group_id = 5;
  string term_id = 6;   // optional
  EnrollmentStatus status = 7;
  google.protobuf.Timestamp enrolled_at = 8;
  // ended_at is when the enrollment stopped being active (withdrawn or
  // transferred): its status-change instant. Unset while ACTIVE.
  google.protobuf.Timestamp ended_at = 9;
  // origin is how the place was taken: "manual" (or empty, before it was
  // recorded) or "import" (the legacy import). Finance bills no inscription to
  // an imported enrolment, nor the fees due before it (ADR 0033).
  string origin = 10;
  string withdrawn_on = 11;  // YYYY-MM-DD; empty unless withdrawn.
  string withdrawal_reason = 12;  // Optional free-text reason.
  // imported_at is when the legacy import brought the pupil in, set only for
  // origin "import". enrolled_at is the cycle's first day for them (T14), so
  // this is the instant finance reads as "the day they arrived": a month that
  // fell due before it accrues no surcharge (owner decision 2026-10-17).
  google.protobuf.Timestamp imported_at = 13;
}

// EnrollmentTransfer is a dated, reasoned record of a move between groups.
message EnrollmentTransfer {
  string id = 1;
  string enrollment_id = 2;
  string from_group_id = 3;
  string to_group_id = 4;
  string reason = 5;
  google.protobuf.Timestamp moved_at = 6;
}

// EnrollRequest enrolls a student into a group. The cycle is DERIVED from the
// group server-side, so it is deliberately NOT a field here.
message EnrollRequest {
  string student_id = 1;
  string group_id = 2;
  string term_id = 3;   // optional
  // Optional entry day, YYYY-MM-DD in the school's calendar; empty means
  // today. It must lie between the group's cycle start and the school's today
  // (InvalidArgument otherwise). Stored as 00:00 America/Mexico_City; billing
  // starts that month. A past day bills past months: the gateway requires
  // finance:write for it.
  string enrolled_on = 4;
}

message EnrollResponse {
  Enrollment enrollment = 1;
}

message GetEnrollmentRequest {
  string id = 1;
}

message GetEnrollmentResponse {
  Enrollment enrollment = 1;
}

message ListEnrollmentsRequest {
  string student_id = 1;  // optional filter (empty = any)
  string cycle_id = 2;    // optional filter (empty = any)
  string group_id = 3;    // optional filter (empty = any)
  // optional filter: every enrollment EVER in that group — the ones in it now
  // and the ones moved out of it since (a transfer rewrites group_id in place).
  // With the group's moves (ListTransfers group_id), who sat in it on a past day.
  string ever_in_group_id = 4;
}

message ListEnrollmentsResponse {
  repeated Enrollment enrollments = 1;
}

message ListTransfersRequest {
  // Exactly one filter: student_id (that pupil's moves), to_group_id (every
  // move INTO that group, whoever made it — one read for a whole class list) or
  // group_id (every move into OR out of that group: its membership history).
  string student_id = 1;
  string to_group_id = 2;
  string group_id = 3;
}

message ListTransfersResponse {
  repeated EnrollmentTransfer transfers = 1;  // oldest moved_at first
}

message TransferStudentRequest {
  string enrollment_id = 1;
  string to_group_id = 2;
  string reason = 3;
}

message TransferStudentResponse {
  Enrollment enrollment = 1;  // the updated enrollment
}

message WithdrawEnrollmentRequest {
  string id = 1;
  string withdrawn_on = 2;  // YYYY-MM-DD; empty means today.
  string reason = 3;  // Optional free text, at most 500 characters.
}

message WithdrawEnrollmentResponse {
  Enrollment enrollment = 1;  // the updated enrollment
}

// --- Guardian links (Phase 9b) --------------------------------------------

// GuardianLink ties a guardian to a student. guardian_user_id references an iam
// user (validated by RPC, not an FK — services own their own tables).
// tenant_id scopes RLS. relationship is one of mother|father|guardian|other.
message GuardianLink {
  string id = 1;
  string tenant_id = 2;
  // Empty for a contact with no account: a grandmother the school can call.
  // A contact WITH a user id is a family that can open the app.
  string guardian_user_id = 3;
  string student_id = 4;
  string relationship = 5;
  // Who to call. Present for contacts recorded by the office; empty on links
  // created before M16, which carried only an account.
  string full_name = 6;
  string phone = 7;
  string email = 8;
  // Whom the office calls first when something happens.
  bool is_emergency = 9;
}

message LinkGuardianRequest {
  string guardian_user_id = 1;
  string student_id = 2;
  string relationship = 3;  // mother | father | guardian | other
}

message LinkGuardianResponse {
  GuardianLink link = 1;
}

// GrantContactAccessRequest gives an existing contact the account it needs to
// open the family app. The guardian user must hold the `guardian` role and be
// ACTIVE — the link IS the family read path's authorization.
message GrantContactAccessRequest {
  string contact_id = 1;
  // The pupil the contact must belong to. Required: it is what stops a caller
  // from reaching a contact of a family that is not the one it named.
  string student_id = 2;
  string guardian_user_id = 3;
}

message GrantContactAccessResponse {
  GuardianLink contact = 1;
}

message UnlinkGuardianRequest {
  string guardian_user_id = 1;
  string student_id = 2;
}

message UnlinkGuardianResponse {}

message ListGuardiansForStudentRequest {
  string student_id = 1;
}

message ListGuardiansForStudentResponse {
  repeated GuardianLink links = 1;
}

message ListStudentsForGuardianRequest {
  string guardian_user_id = 1;
}

message ListStudentsForGuardianResponse {
  repeated GuardianLink links = 1;
}

// AddContactRequest records a person, not an account.
message AddContactRequest {
  string student_id = 1;
  string relationship = 2;  // mother | father | guardian | other
  string full_name = 3;
  string phone = 4;
  string email = 5;
  bool is_emergency = 6;
}

message AddContactResponse {
  GuardianLink contact = 1;
}

message UpdateContactRequest {
  string contact_id = 1;
  string student_id = 2;
  string relationship = 3;  // mother | father | guardian | other
  string full_name = 4;
  string phone = 5;
  string email = 6;
  bool is_emergency = 7;
}

message UpdateContactResponse {
  GuardianLink contact = 1;
}

message RemoveContactRequest {
  string contact_id = 1;
  string student_id = 2;
}

message RemoveContactResponse {}

message GetCardCodeRequest {
  string student_id = 1;
}

message GetCardCodeResponse {
  // code is empty when the card is suspended.
  string code = 1;
  // suspended: the office revoked the card and has not reissued it.
  bool suspended = 2;
}

message RevokeCardRequest {
  string student_id = 1;
}

message RevokeCardResponse {}

message ReissueCardRequest {
  string student_id = 1;
}

message ReissueCardResponse {}

message VerifyCardRequest {
  string code = 1;
}

message VerifyCardResponse {
  Student student = 1;
  // valid: an active (not revoked) code of an enrolled pupil.
  bool valid = 2;
  // revoked: the office retired this code. Independent of the pupil's
  // admission status — attendance scanning counts any code that is not revoked,
  // since the group's roster already decides who belongs to the list.
  bool revoked = 3;
}

// --- level deletion (ADR 0021) ---------------------------------------------

// LevelScope is everything a level deletion reaches, resolved by the gateway
// from config (structure) and students (people). Every id is a uuid; a service
// reads only the fields it owns data for.
message LevelScope {
  string level_id = 1;
  repeated string grade_level_ids = 2;
  repeated string group_ids = 3;
  repeated string subject_ids = 4;
  repeated string term_ids = 5;
  repeated string enrollment_ids = 6;
  repeated string student_ids = 7;
}

// LevelArchiveCount is how many rows of one kind a level deletion touches.
message LevelArchiveCount {
  string kind = 1;
  int64 count = 2;
}

// LevelRestoreSkip is rows of one kind a restore could not put back, and why.
message LevelRestoreSkip {
  string kind = 1;
  int64 count = 2;
  string reason = 3;
}

message PreviewLevelDeletionRequest {
  LevelScope scope = 1;
}

message PreviewLevelDeletionResponse {
  repeated LevelArchiveCount counts = 1;
  // student_ids are the pupils placed in the level (they are kept, with the
  // level cleared); enrollment_ids are the enrollments in the level's groups.
  repeated string student_ids = 2;
  repeated string enrollment_ids = 3;
}

message ArchiveLevelRequest {
  // batch_id is the saga's idempotency key (a uuid minted by the gateway).
  string batch_id = 1;
  LevelScope scope = 2;
}

message ArchiveLevelResponse {
  repeated LevelArchiveCount counts = 1;
}

message RestoreLevelBatchRequest {
  string batch_id = 1;
}

message RestoreLevelBatchResponse {
  repeated LevelArchiveCount restored = 1;
  repeated LevelRestoreSkip skipped = 2;
  // unrestored_enrollment_ids are the batch's enrollments still in the trash
  // (they conflicted): grades and attendance keep those enrollments' rows
  // archived too.
  repeated string unrestored_enrollment_ids = 3;
}

message PurgeLevelArchivesRequest {}

message PurgeLevelArchivesResponse {
  int64 purged_rows = 1;
}

message PurgeLevelBatchRequest {
  string batch_id = 1;
}

message PurgeLevelBatchResponse {
  int64 purged_rows = 1;
}

// ImportStudentRow is one pupil of the previous system's spreadsheet, already
// parsed and structured by the gateway. Domain rules are applied here, in
// students: an invalid profile sub-field is dropped with a warning instead of
// losing the row.
message ImportStudentRow {
  int32 row_number = 1;  // the spreadsheet row, echoed in the result
  string curp = 2;
  string first_name = 3;
  string last_name = 4;           // paternal
  string maternal_last_name = 5;  // optional
  // group_id is the config group the pupil goes into. Empty is legal only with
  // validate_only, for a group the import has not created yet.
  string group_id = 6;
  string bank_reference = 7;      // optional; digits only once trimmed
  StudentProfile profile = 8;     // lenient: bad sub-fields become warnings
  // action is what the school chose in the preview. UNSPECIFIED is IMPORT.
  ImportRowAction action = 9;
  // issues are what the gateway itself changed or dropped while reading the
  // file (e.g. birth_date_from_curp). Each one is stored with the pupil.
  repeated ImportIssue issues = 10;
  // original is what the spreadsheet said, before the gateway normalized it.
  // An issue students raises on a field reports this value when it is set,
  // else the value received in the row.
  ImportOriginalValues original = 11;
}

// ImportRowAction is the school's choice for one row of the preview. Omitted
// rows are simply not sent.
enum ImportRowAction {
  IMPORT_ROW_ACTION_UNSPECIFIED = 0;  // treated as IMPORT
  IMPORT_ROW_ACTION_IMPORT = 1;
  // DRAFT stores a row whose CURP is missing or invalid as a draft pupil: no
  // enrollment; the group is kept on its curp issue (intended_group_id). A row
  // with a valid CURP imports normally whatever the action.
  IMPORT_ROW_ACTION_DRAFT = 2;
}

// ImportIssue is one value an import could not keep as the file wrote it.
message ImportIssue {
  // field is one of: birth_date, phone_home, phone_mobile, email, postal_code,
  // state, bank_reference, surnames, first_name, address, curp.
  string field = 1;
  string code = 2;            // a stable warning code, e.g. "phone_invalid"
  string original_value = 3;  // what the file said
  string stored_value = 4;    // what was stored ("" when dropped)
}

// ImportOriginalValues is the spreadsheet's raw text per field. Every field is
// optional.
message ImportOriginalValues {
  string curp = 1;
  string birth_date = 2;
  string phone_home = 3;
  string phone_mobile = 4;
  string email = 5;
  string postal_code = 6;
  string state = 7;
  string bank_reference = 8;
  string address = 9;
}

message ImportStudentsRequest {
  repeated ImportStudentRow rows = 1;  // at most 1,000
  bool validate_only = 2;
  // batch_id groups the pupils of one import for audit (a uuid the gateway
  // mints per commit). Ignored with validate_only.
  string batch_id = 3;
}

enum ImportRowOutcome {
  IMPORT_ROW_OUTCOME_UNSPECIFIED = 0;
  IMPORT_ROW_OUTCOME_IMPORTED = 1;          // created (or, validating, would be)
  IMPORT_ROW_OUTCOME_ALREADY_EXISTS = 2;    // the school has this CURP (O4)
  IMPORT_ROW_OUTCOME_ALREADY_IMPORTED = 3;  // ...already placed in this very group
  IMPORT_ROW_OUTCOME_REJECTED = 4;          // see reason
}

message ImportRowResult {
  int32 row_number = 1;
  ImportRowOutcome outcome = 2;
  string student_id = 3;         // set when IMPORTED (commit) or ALREADY_*
  string enrollment_number = 4;  // the matrícula given, when IMPORTED (commit)
  // warnings are stable codes the client words: "bank_reference_taken",
  // "bank_reference_invalid", "phone_invalid", "email_invalid",
  // "birth_date_invalid", "state_unknown", "postal_code_invalid",
  // "address_truncated".
  repeated string warnings = 5;
  // reason is a stable code when REJECTED: "curp_invalid", "curp_duplicated",
  // "name_required", "group_not_found", "group_full".
  string reason = 6;
  // moved_to_cycle_start is set on an ALREADY_* row whose pupil an earlier
  // import enrolled after the cycle's first day: their import enrollment in
  // the row's cycle was moved back to it (or, with validate_only, would be).
  // Imported pupils are enrolled from the start of the cycle (owner decision
  // 2026-10-17); only enrolled_at changes, never a withdrawal's date.
  bool moved_to_cycle_start = 7;
  // draft: the row was (or, validating, would be) stored as a draft pupil.
  bool draft = 8;
}

message ImportStudentsResponse {
  repeated ImportRowResult results = 1;  // one per row, in request order
}

// --- import issues (PLAN-import-avisos) --------------------------------------

// StudentImportIssue is an import issue as stored with the pupil.
message StudentImportIssue {
  string id = 1;
  string student_id = 2;
  string field = 3;           // see ImportIssue.field
  string code = 4;
  string original_value = 5;
  string stored_value = 6;
  string import_batch_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // Unset while the issue is open.
  google.protobuf.Timestamp resolved_at = 9;
  string resolved_by = 10;    // the user who resolved it; empty if unknown
  string resolution = 11;     // "" (open) | "corrected" | "accepted"
  // intended_group_id is set on a draft's curp issue: the group the import
  // meant the pupil for.
  string intended_group_id = 12;
}

message ListImportIssuesRequest {
  string student_id = 1;
  bool include_resolved = 2;
}

message ListImportIssuesResponse {
  repeated StudentImportIssue issues = 1;
}

message AcceptImportIssueRequest {
  string student_id = 1;
  string issue_id = 2;
  // The authenticated caller, set by the gateway — never by a client.
  string user_id = 3;
}

message AcceptImportIssueResponse {
  StudentImportIssue issue = 1;
}

// --- group corrections (T8) -------------------------------------------------

message GroupUsageRequest {
  string group_id = 1;
}

message GroupUsageResponse {
  // enrollments counts every enrollment in the group, whatever its status.
  int64 enrollments = 1;
  // transfers counts every move out of or into the group.
  int64 transfers = 2;
}

message RefreshGroupNameRequest {
  string group_id = 1;
  string name = 2;
}

message RefreshGroupNameResponse {
  // students is how many pupils' files changed (0 on a repeat).
  int64 students = 1;
}

// --- families (ADR 0041) ----------------------------------------------------

// Family groups siblings. student_ids is ordered by surname then first name;
// account_count is how many distinct app accounts are linked to its pupils
// (at most 2, enforced by the service from T2).
message Family {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  repeated string student_ids = 4;
  int32 account_count = 5;
  string created_at = 6;  // RFC 3339
}

message ListFamiliesRequest {}

message ListFamiliesResponse {
  // Every family of the school, ordered by name. A school has a few hundred.
  repeated Family families = 1;
}

message GetFamilyRequest {
  string family_id = 1;
}

message GetFamilyResponse {
  Family family = 1;
}

message CreateFamilyRequest {
  // name is how the office calls the family ("García López"). Empty = the
  // first pupil's surnames.
  string name = 1;
  // At least one pupil, none already in a family, at most 20.
  repeated string student_ids = 2;
}

message CreateFamilyResponse {
  Family family = 1;
}

message RenameFamilyRequest {
  string family_id = 1;
  string name = 2;
}

message RenameFamilyResponse {
  Family family = 1;
}

message AddStudentsToFamilyRequest {
  string family_id = 1;
  repeated string student_ids = 2;
}

message AddStudentsToFamilyResponse {
  Family family = 1;
}

message RemoveStudentFromFamilyRequest {
  string family_id = 1;
  string student_id = 2;
}

message RemoveStudentFromFamilyResponse {
  // family is empty when the last pupil left and the family was dissolved.
  Family family = 1;
}

message DissolveFamilyRequest {
  string family_id = 1;
}

message DissolveFamilyResponse {}

// FamilySuggestionReason is why a group of pupils looks like one family.
enum FamilySuggestionReason {
  FAMILY_SUGGESTION_REASON_UNSPECIFIED = 0;
  // Same paternal and maternal surname, ignoring accents, case and spaces.
  FAMILY_SUGGESTION_REASON_SAME_SURNAMES = 1;
  // A contact of each pupil carries the same email.
  FAMILY_SUGGESTION_REASON_SHARED_CONTACT_EMAIL = 2;
  // A contact of each pupil carries the same phone.
  FAMILY_SUGGESTION_REASON_SHARED_CONTACT_PHONE = 3;
  // The same app account is already linked to each pupil.
  FAMILY_SUGGESTION_REASON_SHARED_ACCOUNT = 4;
}

// FamilySuggestionConfidence: a contact in common is HIGH; surnames alone are
// MEDIUM (cousins and unrelated families share common surnames).
enum FamilySuggestionConfidence {
  FAMILY_SUGGESTION_CONFIDENCE_UNSPECIFIED = 0;
  FAMILY_SUGGESTION_CONFIDENCE_MEDIUM = 1;
  FAMILY_SUGGESTION_CONFIDENCE_HIGH = 2;
}

message FamilySuggestion {
  // signature identifies exactly these pupils (SHA-256 of the sorted ids, hex).
  string signature = 1;
  string proposed_name = 2;
  repeated string student_ids = 3;
  repeated FamilySuggestionReason reasons = 4;
  FamilySuggestionConfidence confidence = 5;
}

message SuggestFamiliesRequest {}

message SuggestFamiliesResponse {
  // HIGH first, then by proposed name.
  repeated FamilySuggestion suggestions = 1;
}

message DismissFamilySuggestionRequest {
  // The pupils of the dismissed group; the service computes the signature.
  repeated string student_ids = 1;
  // The authenticated caller, set by the gateway — never by a client.
  string user_id = 2;
}

message DismissFamilySuggestionResponse {}
