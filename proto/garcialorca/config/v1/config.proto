// --- Evaluation period messages (T14) ---------------------------------------

// EvaluationPeriod is one evaluation period (trimester, bimester…) of one grade
// in one cycle. starts_on/ends_on are calendar dates, both inclusive, carried
// as midnight UTC.
message EvaluationPeriod {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string grade_level_id = 4;
  int32 ordinal = 5;
  string name = 6;
  google.protobuf.Timestamp starts_on = 7;
  google.protobuf.Timestamp ends_on = 8;
  // term_id is the term a migrated period came from (provenance), or "".
  string term_id = 9;
}

// EvaluationPeriodInput is one period as the school enters it. id names the
// existing period of the grade this row edits ("" for a new period): the id
// follows the row, never its position, so removing the 1st period removes it
// and not the last one.
message EvaluationPeriodInput {
  int32 ordinal = 1;
  string name = 2;
  google.protobuf.Timestamp starts_on = 3;
  google.protobuf.Timestamp ends_on = 4;
  string id = 5;
}

// ListEvaluationPeriodsRequest scopes the list to a cycle (required), and
// optionally a level's grades and/or one grade.
message ListEvaluationPeriodsRequest {
  string cycle_id = 1;
  string level_id = 2;
  string grade_level_id = 3;
}

// ListEvaluationPeriodsResponse returns the periods by grade, then ordinal.
message ListEvaluationPeriodsResponse {
  repeated EvaluationPeriod periods = 1;
}

// UpsertEvaluationPeriodsRequest replaces one grade's periods in a cycle.
message UpsertEvaluationPeriodsRequest {
  string cycle_id = 1;
  string grade_level_id = 2;
  repeated EvaluationPeriodInput periods = 3;
}

// UpsertEvaluationPeriodsResponse returns the grade's periods by ordinal.
message UpsertEvaluationPeriodsResponse {
  repeated EvaluationPeriod periods = 1;
}

// CopyEvaluationPeriodsRequest copies one grade's periods onto other grades.
message CopyEvaluationPeriodsRequest {
  string cycle_id = 1;
  string from_grade_level_id = 2;
  repeated string to_grade_level_ids = 3;
}

// CopyEvaluationPeriodsResponse returns the targets' periods, grade by grade
// in request order, then by ordinal.
message CopyEvaluationPeriodsResponse {
  repeated EvaluationPeriod periods = 1;
}

