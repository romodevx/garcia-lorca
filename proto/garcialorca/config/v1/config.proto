// Config / Academic Catalog (M04) — the academic structure the whole spine hangs
// off: cycles → levels → grade_levels → groups → subjects → terms, with the
// hybrid cycle model (per-level enrollment_granularity).
//
// FROZEN CONTRACT once merged (M04). All six entities live in ONE service/DB, so
// intra-catalog references are real FKs (no cross-service RPC within config).
// Every entity is tenant-scoped (RLS on app.current_tenant).
syntax = "proto3";

package garcialorca.config.v1;

import "google/protobuf/timestamp.proto";

// ConfigService is the academic-catalog API surface: catalog entities
// (levels, grade_levels, subjects) plus per-cycle entities (cycles, terms,
// groups). Per entity: Create / Get / List (lists are parent-scoped where
// natural).
service ConfigService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // --- levels (catalog) ---
  // CreateLevel adds a SEP education level with its enrollment granularity.
  rpc CreateLevel(CreateLevelRequest) returns (CreateLevelResponse);
  // GetLevel fetches a level by id.
  rpc GetLevel(GetLevelRequest) returns (GetLevelResponse);
  // ListLevels lists every level in the tenant catalog.
  rpc ListLevels(ListLevelsRequest) returns (ListLevelsResponse);
  // SetLevelAttendanceMode chooses how a level takes attendance: one list per
  // group per day (daily) or one per group, subject and day (per_class).
  rpc SetLevelAttendanceMode(SetLevelAttendanceModeRequest) returns (SetLevelAttendanceModeResponse);
  // SetLevelGradingScale configures a level's numeric grading (T6): whether it
  // is captured at all, its range, decimals and passing mark.
  rpc SetLevelGradingScale(SetLevelGradingScaleRequest) returns (SetLevelGradingScaleResponse);
  // UpdateLevel changes a level's attendance mode and/or grading scale in ONE
  // transaction: every present field is validated before anything is written,
  // so a half-valid request changes nothing. An absent field keeps its value;
  // a request with neither is InvalidArgument; an unknown level is NotFound.
  rpc UpdateLevel(UpdateLevelRequest) returns (UpdateLevelResponse);

  // --- cycles (per-cycle umbrella) ---
  // CreateCycle adds a school-year umbrella (status defaults to draft).
  rpc CreateCycle(CreateCycleRequest) returns (CreateCycleResponse);
  // GetCycle fetches a cycle by id.
  rpc GetCycle(GetCycleRequest) returns (GetCycleResponse);
  // ListCycles lists every cycle in the tenant.
  rpc ListCycles(ListCyclesRequest) returns (ListCyclesResponse);
  // ActivateCycle makes a cycle the school's live year, standing down whichever
  // other was active. Everything downstream asks "which cycle is active" — the
  // roster header, the group dropdowns, the tuition table, the billing run — so
  // that question must have exactly one answer.
  rpc ActivateCycle(ActivateCycleRequest) returns (ActivateCycleResponse);

  // --- grade_levels (catalog) ---
  // CreateGradeLevel adds a grade within a level.
  rpc CreateGradeLevel(CreateGradeLevelRequest) returns (CreateGradeLevelResponse);
  // GetGradeLevel fetches a grade_level by id.
  rpc GetGradeLevel(GetGradeLevelRequest) returns (GetGradeLevelResponse);
  // ListGradeLevels lists the grades of a level (scoped by level_id).
  rpc ListGradeLevels(ListGradeLevelsRequest) returns (ListGradeLevelsResponse);

  // --- subjects (catalog) ---
  // CreateSubject adds a subject taught at a grade.
  rpc CreateSubject(CreateSubjectRequest) returns (CreateSubjectResponse);
  // GetSubject fetches a subject by id.
  rpc GetSubject(GetSubjectRequest) returns (GetSubjectResponse);
  // ListSubjects lists the subjects of a grade (scoped by grade_level_id).
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);

  // --- terms (per cycle, level) ---
  // CreateTerm adds a period within a cycle for a level.
  rpc CreateTerm(CreateTermRequest) returns (CreateTermResponse);
  // GetTerm fetches a term by id.
  rpc GetTerm(GetTermRequest) returns (GetTermResponse);
  // ListTerms lists the terms of a cycle (scoped by cycle_id, optional level_id).
  rpc ListTerms(ListTermsRequest) returns (ListTermsResponse);
  // SetTermMonths replaces the calendar months a term covers. A month outside
  // the cycle is InvalidArgument (X-Error-Code MONTH_OUTSIDE_CYCLE); a month
  // another term of the same cycle+level holds is AlreadyExists
  // (MONTH_IN_OTHER_TERM), naming the month.
  rpc SetTermMonths(SetTermMonthsRequest) returns (SetTermMonthsResponse);
  // CopyTermMonths makes each target level's terms mirror the source level's
  // months in one cycle (matched by ordinal; missing terms created from the
  // source; unmatched target terms emptied), in one transaction.
  rpc CopyTermMonths(CopyTermMonthsRequest) returns (CopyTermMonthsResponse);

  // --- groups (per cycle, grade_level) ---
  // CreateGroup adds a class group within a cycle for a grade.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // GetGroup fetches a group by id.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  // ListGroups lists the groups of a cycle (scoped by cycle_id, optional grade_level_id).
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // --- school calendar (M16) ---
  // CreateNonWorkingPeriod adds a holiday, vacation or suspension to a cycle.
  rpc CreateNonWorkingPeriod(CreateNonWorkingPeriodRequest) returns (CreateNonWorkingPeriodResponse);
  // ListNonWorkingPeriods lists every closed day range of a cycle. This is the
  // read the collection rules make: finance asks config what days the school is
  // shut, rather than every module carrying its own idea of the calendar.
  rpc ListNonWorkingPeriods(ListNonWorkingPeriodsRequest) returns (ListNonWorkingPeriodsResponse);
  // DeleteNonWorkingPeriod removes one period. A day entered by mistake has to
  // be removable, or the calendar becomes untrustworthy and stops being used.
  rpc DeleteNonWorkingPeriod(DeleteNonWorkingPeriodRequest) returns (DeleteNonWorkingPeriodResponse);

  // --- school agenda (M16) ---
  // CreateSchoolEvent records something the school DOES: a festival, a parents'
  // meeting, an exam week. Deliberately separate from the closed days — finance
  // reads those to move a due date, and an activity must never do that.
  rpc CreateSchoolEvent(CreateSchoolEventRequest) returns (CreateSchoolEventResponse);
  // ListSchoolEvents returns a cycle's agenda, earliest first.
  rpc ListSchoolEvents(ListSchoolEventsRequest) returns (ListSchoolEventsResponse);
  // DeleteSchoolEvent removes one event.
  rpc DeleteSchoolEvent(DeleteSchoolEventRequest) returns (DeleteSchoolEventResponse);

  // --- the school's details (task 12) ---
  // GetSchoolProfile returns what a receipt prints about the school; found is
  // false until somebody fills it in.
  rpc GetSchoolProfile(GetSchoolProfileRequest) returns (GetSchoolProfileResponse);
  // SetSchoolProfile replaces the school's details (every field).
  rpc SetSchoolProfile(SetSchoolProfileRequest) returns (SetSchoolProfileResponse);

  // --- teachers (catalog person records; NOT login accounts) ---
  // CreateTeacher adds a teacher catalog record (user_id reserved, may be empty).
  rpc CreateTeacher(CreateTeacherRequest) returns (CreateTeacherResponse);
  // GetTeacher fetches a teacher by id.
  rpc GetTeacher(GetTeacherRequest) returns (GetTeacherResponse);
  // ListTeachers lists every teacher in the tenant catalog.
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
  // SetTeacherUser links a teacher catalog record to an IAM user (or unlinks it
  // when user_id is empty). config only stores the link; the caller (gateway)
  // is responsible for validating that the user exists.
  rpc SetTeacherUser(SetTeacherUserRequest) returns (SetTeacherUserResponse);

  // --- teaching_assignments (the knot: teacher ↔ group ↔ subject ↔ cycle) ---
  // CreateTeachingAssignment binds a teacher to a (group, subject); the server
  // derives cycle_id from the group and enforces the relational invariants.
  rpc CreateTeachingAssignment(CreateTeachingAssignmentRequest) returns (CreateTeachingAssignmentResponse);
  // GetTeachingAssignment fetches a teaching assignment by id.
  rpc GetTeachingAssignment(GetTeachingAssignmentRequest) returns (GetTeachingAssignmentResponse);
  // ListTeachingAssignments lists assignments, optionally filtered by
  // cycle_id / group_id / teacher_id (empty = any).
  rpc ListTeachingAssignments(ListTeachingAssignmentsRequest) returns (ListTeachingAssignmentsResponse);
  // AssignTeachingLoad gives one teacher a batch of (group, subject) slots in
  // ONE transaction ("carga académica"). Every item is validated first; one
  // invalid item (malformed id, unknown group/subject/teacher, a subject of
  // another grade level, the same slot twice) fails the whole request and names
  // it. A slot already held by this teacher is skipped; a slot held by someone
  // else is reported in `conflicts` and left untouched, unless
  // replace_conflicts is set, in which case it is reassigned to this teacher.
  // Each slot still has exactly one teacher per cycle (no co-teaching).
  rpc AssignTeachingLoad(AssignTeachingLoadRequest) returns (AssignTeachingLoadResponse);
  // DeleteTeachingAssignment frees a (group, subject) slot. NotFound if the id
  // does not exist.
  rpc DeleteTeachingAssignment(DeleteTeachingAssignmentRequest) returns (DeleteTeachingAssignmentResponse);
  // ReassignTeachingAssignment hands an existing slot to another teacher,
  // keeping the assignment id. NotFound if the assignment does not exist;
  // InvalidArgument if the teacher does not.
  rpc ReassignTeachingAssignment(ReassignTeachingAssignmentRequest) returns (ReassignTeachingAssignmentResponse);
}

// --- Health ---------------------------------------------------------------

// HealthRequest is the empty liveness probe request.
message HealthRequest {}

// HealthResponse reports service liveness.
message HealthResponse {
  string status = 1;
}

// --- Enums ----------------------------------------------------------------

// EnrollmentGranularity drives the hybrid cycle model: a level enrolls per
// whole CYCLE or per TERM.
enum EnrollmentGranularity {
  ENROLLMENT_GRANULARITY_UNSPECIFIED = 0;
  ENROLLMENT_GRANULARITY_CYCLE = 1;
  ENROLLMENT_GRANULARITY_TERM = 2;
}

// AttendanceMode is how a level takes attendance (T3). DAILY: one pass list per
// group per day, which any teacher of the group may take. PER_CLASS: one pass
// list per group, subject and day, taken only by that subject's teacher.
enum AttendanceMode {
  ATTENDANCE_MODE_UNSPECIFIED = 0;
  ATTENDANCE_MODE_DAILY = 1;
  ATTENDANCE_MODE_PER_CLASS = 2;
}

// CycleStatus is a cycle's lifecycle state.
enum CycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0;
  CYCLE_STATUS_DRAFT = 1;
  CYCLE_STATUS_ACTIVE = 2;
  CYCLE_STATUS_CLOSED = 3;
}

// --- Entities -------------------------------------------------------------

// Level is a SEP education level (catalog). enrollment_granularity is the
// hybrid-model driver. tenant_id scopes RLS.
message Level {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string sep_code = 4;
  EnrollmentGranularity enrollment_granularity = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // attendance_mode is how the level's groups take attendance.
  AttendanceMode attendance_mode = 8;
  // grading is the level's numeric grading scale (T6).
  GradingScale grading = 9;
}

// GradingScale is how a level grades numerically. Marks are exact hundredths
// (5.00 = 500) so no float ever carries a grade boundary. enabled=false means
// the level takes no numeric capture at all (Preescolar); the numbers are then
// kept but unused. Invariant: 0 <= min < passing <= max <= 10000, decimals 0..2.
message GradingScale {
  bool enabled = 1;
  int32 min_hundredths = 2;
  int32 max_hundredths = 3;
  // decimals is how many decimal places a captured grade may carry.
  int32 decimals = 4;
  int32 passing_hundredths = 5;
}

// Cycle is a school-year umbrella (e.g. "2026-2027").
message Cycle {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  CycleStatus status = 4;
  google.protobuf.Timestamp starts_on = 5;
  google.protobuf.Timestamp ends_on = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// GradeLevel is a grade within a level (catalog). ordinal orders grades.
message GradeLevel {
  string id = 1;
  string tenant_id = 2;
  string level_id = 3;
  string name = 4;
  int32 ordinal = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Subject is a subject taught at a grade (catalog).
message Subject {
  string id = 1;
  string tenant_id = 2;
  string grade_level_id = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Term is a period within a cycle for a level (per cycle).
message Term {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string level_id = 4;
  string name = 5;
  int32 ordinal = 6;
  google.protobuf.Timestamp starts_on = 7;
  google.protobuf.Timestamp ends_on = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // months are the calendar months the term covers, "YYYY-MM", ascending.
  repeated string months = 11;
}

// Group is a class group within a cycle for a grade (per cycle).
message Group {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string grade_level_id = 4;
  string name = 5;
  int32 capacity = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Level RPC messages ---------------------------------------------------

// CreateLevelRequest creates a catalog level.
message CreateLevelRequest {
  string name = 1;
  string sep_code = 2;
  EnrollmentGranularity enrollment_granularity = 3;
}

// CreateLevelResponse returns the created level.
message CreateLevelResponse {
  Level level = 1;
}

// GetLevelRequest fetches a level by id.
message GetLevelRequest {
  string id = 1;
}

// GetLevelResponse returns the requested level.
message GetLevelResponse {
  Level level = 1;
}

// ListLevelsRequest lists all levels in the tenant.
message ListLevelsRequest {}

// ListLevelsResponse returns the tenant levels.
message ListLevelsResponse {
  repeated Level levels = 1;
}

// SetLevelAttendanceModeRequest changes one level's attendance mode.
message SetLevelAttendanceModeRequest {
  string id = 1;
  AttendanceMode attendance_mode = 2;
}

// SetLevelAttendanceModeResponse returns the updated level.
message SetLevelAttendanceModeResponse {
  Level level = 1;
}

// SetLevelGradingScaleRequest replaces one level's grading scale.
message SetLevelGradingScaleRequest {
  string id = 1;
  GradingScale grading = 2;
}

// SetLevelGradingScaleResponse returns the updated level.
message SetLevelGradingScaleResponse {
  Level level = 1;
}

// UpdateLevelRequest patches one level. attendance_mode and grading are each
// optional (absent = unchanged); at least one must be present.
message UpdateLevelRequest {
  string id = 1;
  optional AttendanceMode attendance_mode = 2;
  GradingScale grading = 3;
}

// UpdateLevelResponse returns the level after the change.
message UpdateLevelResponse {
  Level level = 1;
}

// --- Cycle RPC messages ---------------------------------------------------

// CreateCycleRequest creates a school-year cycle.
message CreateCycleRequest {
  string name = 1;
  CycleStatus status = 2;
  google.protobuf.Timestamp starts_on = 3;
  google.protobuf.Timestamp ends_on = 4;
}

// CreateCycleResponse returns the created cycle.
message CreateCycleResponse {
  Cycle cycle = 1;
}

// GetCycleRequest fetches a cycle by id.
message GetCycleRequest {
  string id = 1;
}

// GetCycleResponse returns the requested cycle.
message GetCycleResponse {
  Cycle cycle = 1;
}

// ListCyclesRequest lists all cycles in the tenant.
message ListCyclesRequest {}

// ListCyclesResponse returns the tenant cycles.
message ListCyclesResponse {
  repeated Cycle cycles = 1;
}

message ActivateCycleRequest {
  string id = 1;
}

message ActivateCycleResponse {
  Cycle cycle = 1;
}

// --- GradeLevel RPC messages ----------------------------------------------

// CreateGradeLevelRequest creates a grade within a level.
message CreateGradeLevelRequest {
  string level_id = 1;
  string name = 2;
  int32 ordinal = 3;
}

// CreateGradeLevelResponse returns the created grade_level.
message CreateGradeLevelResponse {
  GradeLevel grade_level = 1;
}

// GetGradeLevelRequest fetches a grade_level by id.
message GetGradeLevelRequest {
  string id = 1;
}

// GetGradeLevelResponse returns the requested grade_level.
message GetGradeLevelResponse {
  GradeLevel grade_level = 1;
}

// ListGradeLevelsRequest lists the grades of a level.
message ListGradeLevelsRequest {
  string level_id = 1;
}

// ListGradeLevelsResponse returns the grades of the level.
message ListGradeLevelsResponse {
  repeated GradeLevel grade_levels = 1;
}

// --- Subject RPC messages -------------------------------------------------

// CreateSubjectRequest creates a subject at a grade.
message CreateSubjectRequest {
  string grade_level_id = 1;
  string name = 2;
}

// CreateSubjectResponse returns the created subject.
message CreateSubjectResponse {
  Subject subject = 1;
}

// GetSubjectRequest fetches a subject by id.
message GetSubjectRequest {
  string id = 1;
}

// GetSubjectResponse returns the requested subject.
message GetSubjectResponse {
  Subject subject = 1;
}

// ListSubjectsRequest lists the subjects of a grade.
message ListSubjectsRequest {
  string grade_level_id = 1;
}

// ListSubjectsResponse returns the subjects of the grade.
message ListSubjectsResponse {
  repeated Subject subjects = 1;
}

// --- Term RPC messages ----------------------------------------------------

// CreateTermRequest creates a period within a cycle for a level.
message CreateTermRequest {
  string cycle_id = 1;
  string level_id = 2;
  string name = 3;
  int32 ordinal = 4;
  google.protobuf.Timestamp starts_on = 5;
  google.protobuf.Timestamp ends_on = 6;
}

// CreateTermResponse returns the created term.
message CreateTermResponse {
  Term term = 1;
}

// GetTermRequest fetches a term by id.
message GetTermRequest {
  string id = 1;
}

// GetTermResponse returns the requested term.
message GetTermResponse {
  Term term = 1;
}

// ListTermsRequest lists the terms of a cycle, optionally filtered by level.
message ListTermsRequest {
  string cycle_id = 1;
  string level_id = 2;  // optional filter (empty = any level)
}

// ListTermsResponse returns the terms of the cycle.
message ListTermsResponse {
  repeated Term terms = 1;
}

// SetTermMonthsRequest replaces a term's months ("YYYY-MM" each; empty clears).
message SetTermMonthsRequest {
  string term_id = 1;
  repeated string months = 2;
}

// SetTermMonthsResponse returns the term with its new months.
message SetTermMonthsResponse {
  Term term = 1;
}

// CopyTermMonthsRequest copies one level's term months onto other levels of
// the same cycle.
message CopyTermMonthsRequest {
  string cycle_id = 1;
  string from_level_id = 2;
  repeated string to_level_ids = 3;
}

// CopyTermMonthsResponse returns the target levels' terms, level by level in
// request order, then by ordinal.
message CopyTermMonthsResponse {
  repeated Term terms = 1;
}

// --- Group RPC messages ---------------------------------------------------

// CreateGroupRequest creates a class group within a cycle for a grade.
message CreateGroupRequest {
  string cycle_id = 1;
  string grade_level_id = 2;
  string name = 3;
  int32 capacity = 4;
}

// CreateGroupResponse returns the created group.
message CreateGroupResponse {
  Group group = 1;
}

// GetGroupRequest fetches a group by id.
message GetGroupRequest {
  string id = 1;
}

// GetGroupResponse returns the requested group.
message GetGroupResponse {
  Group group = 1;
}

// ListGroupsRequest lists the groups of a cycle, optionally filtered by grade.
message ListGroupsRequest {
  string cycle_id = 1;
  string grade_level_id = 2;  // optional filter (empty = any grade)
}

// ListGroupsResponse returns the groups of the cycle.
message ListGroupsResponse {
  repeated Group groups = 1;
}

// --- teachers / teaching_assignments (Phase 3) entities -------------------

// Teacher is a catalog person record, NOT a login account. user_id is a
// reserved link to a future IAM user and may be empty.
message Teacher {
  string id = 1;
  string tenant_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string user_id = 6;  // reserved IAM link; may be empty
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// TeachingAssignment is the knot binding a teacher to a (group, subject)
// within a cycle. cycle_id is derived server-side from the group.
message TeachingAssignment {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string group_id = 4;
  string subject_id = 5;
  string teacher_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Teacher RPC messages -------------------------------------------------

// CreateTeacherRequest creates a teacher catalog record.
message CreateTeacherRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string user_id = 4;  // reserved IAM link; may be empty
}

// CreateTeacherResponse returns the created teacher.
message CreateTeacherResponse {
  Teacher teacher = 1;
}

// GetTeacherRequest fetches a teacher by id.
message GetTeacherRequest {
  string id = 1;
}

// GetTeacherResponse returns the requested teacher.
message GetTeacherResponse {
  Teacher teacher = 1;
}

// ListTeachersRequest lists all teachers in the tenant.
message ListTeachersRequest {}

// ListTeachersResponse returns the tenant teachers.
message ListTeachersResponse {
  repeated Teacher teachers = 1;
}

// SetTeacherUserRequest links a teacher to an IAM user. An empty user_id
// unlinks (stored as NULL).
message SetTeacherUserRequest {
  string teacher_id = 1;
  string user_id = 2;  // empty unlinks
}

// SetTeacherUserResponse returns the updated teacher.
message SetTeacherUserResponse {
  Teacher teacher = 1;
}

// --- TeachingAssignment RPC messages --------------------------------------

// CreateTeachingAssignmentRequest binds a teacher to a (group, subject). The
// server derives cycle_id from the group (never supplied by the client).
message CreateTeachingAssignmentRequest {
  string group_id = 1;
  string subject_id = 2;
  string teacher_id = 3;
}

// CreateTeachingAssignmentResponse returns the created assignment, including
// the server-derived cycle_id.
message CreateTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// GetTeachingAssignmentRequest fetches a teaching assignment by id.
message GetTeachingAssignmentRequest {
  string id = 1;
}

// GetTeachingAssignmentResponse returns the requested assignment.
message GetTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// ListTeachingAssignmentsRequest lists assignments filtered by any of
// cycle_id / group_id / teacher_id (empty = any).
message ListTeachingAssignmentsRequest {
  string cycle_id = 1;    // optional filter (empty = any cycle)
  string group_id = 2;    // optional filter (empty = any group)
  string teacher_id = 3;  // optional filter (empty = any teacher)
}

// ListTeachingAssignmentsResponse returns the matching assignments.
message ListTeachingAssignmentsResponse {
  repeated TeachingAssignment teaching_assignments = 1;
}

// TeachingLoadItem is one (group, subject) slot of a teaching load. The cycle
// is derived from the group.
message TeachingLoadItem {
  string group_id = 1;
  string subject_id = 2;
}

// TeachingLoadConflict is a requested slot another teacher already holds.
message TeachingLoadConflict {
  string group_id = 1;
  string subject_id = 2;
  string assignment_id = 3;  // the existing assignment occupying the slot
  string teacher_id = 4;     // the teacher currently holding it
  string teacher_name = 5;   // "first last" of that teacher
}

// AssignTeachingLoadRequest assigns every item to teacher_id. At most 500
// items per request (a technical bound on one transaction, not a limit on how
// many classes a teacher may hold).
message AssignTeachingLoadRequest {
  string teacher_id = 1;
  repeated TeachingLoadItem items = 2;
  bool replace_conflicts = 3;
}

// AssignTeachingLoadResponse reports what happened to each item, in request
// order within each list.
message AssignTeachingLoadResponse {
  repeated TeachingAssignment created = 1;
  repeated TeachingAssignment reassigned = 2;
  repeated TeachingLoadItem skipped = 3;  // already held by this teacher
  repeated TeachingLoadConflict conflicts = 4;  // left untouched (replace_conflicts=false)
}

// DeleteTeachingAssignmentRequest removes one assignment by id.
message DeleteTeachingAssignmentRequest {
  string id = 1;
}

// DeleteTeachingAssignmentResponse is empty: success means the slot is free.
message DeleteTeachingAssignmentResponse {}

// ReassignTeachingAssignmentRequest moves an assignment to another teacher.
message ReassignTeachingAssignmentRequest {
  string id = 1;
  string teacher_id = 2;
}

// ReassignTeachingAssignmentResponse returns the updated assignment.
message ReassignTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// --- School calendar (M16) ------------------------------------------------

// NonWorkingPeriod is a day, or a run of days, on which the school does not
// operate. Both ends are inclusive; a single-day holiday has starts_on ==
// ends_on. Dates are plain YYYY-MM-DD strings, not timestamps: a holiday is a
// calendar day everywhere in Mexico, and a timestamp would invite a timezone
// to move it.
message NonWorkingPeriod {
  string id = 1;
  string cycle_id = 2;
  string label = 3;
  string kind = 4;  // holiday | vacation
  string starts_on = 5;
  string ends_on = 6;
}

// CreateNonWorkingPeriodRequest adds one closed period to a cycle.
message CreateNonWorkingPeriodRequest {
  string cycle_id = 1;
  string label = 2;
  string kind = 3;
  string starts_on = 4;
  string ends_on = 5;
}

// CreateNonWorkingPeriodResponse returns the created period.
message CreateNonWorkingPeriodResponse {
  NonWorkingPeriod period = 1;
}

// ListNonWorkingPeriodsRequest lists the closed periods of one cycle.
message ListNonWorkingPeriodsRequest {
  string cycle_id = 1;
}

// ListNonWorkingPeriodsResponse returns them ordered by start date.
message ListNonWorkingPeriodsResponse {
  repeated NonWorkingPeriod periods = 1;
}

// DeleteNonWorkingPeriodRequest removes one period by id.
message DeleteNonWorkingPeriodRequest {
  string id = 1;
}

// DeleteNonWorkingPeriodResponse is empty: the removal either happened or the
// call failed.
message DeleteNonWorkingPeriodResponse {}

// --- School agenda (M16) ---------------------------------------------------

// SchoolEvent is something the school does. Dates are plain YYYY-MM-DD, both
// ends inclusive, for the same reason a holiday is: a school day is a calendar
// day, and a timestamp would invite a timezone to move it.
//
// level_id and group_id are the audience: at most one is set, and neither means
// the whole school.
message SchoolEvent {
  string id = 1;
  string cycle_id = 2;
  string title = 3;
  string description = 4;
  string starts_on = 5;
  string ends_on = 6;
  string level_id = 7;
  string group_id = 8;
}

message CreateSchoolEventRequest {
  string cycle_id = 1;
  string title = 2;
  string description = 3;
  string starts_on = 4;
  string ends_on = 5;
  string level_id = 6;  // optional; empty and group_id empty = whole school
  string group_id = 7;  // optional
}

message CreateSchoolEventResponse {
  SchoolEvent event = 1;
}

message ListSchoolEventsRequest {
  string cycle_id = 1;
}

message ListSchoolEventsResponse {
  repeated SchoolEvent events = 1;
}

message DeleteSchoolEventRequest {
  string id = 1;
}

message DeleteSchoolEventResponse {}

// SchoolProfile is the school's details as a receipt prints them (task 12). The
// name is required; RFC and CCT come upper-cased, the phone as ten digits.
message SchoolProfile {
  string name = 1;
  string legal_name = 2;
  string rfc = 3;
  string cct = 4;
  string address = 5;
  string phone = 6;
  string legend = 7;
}

message GetSchoolProfileRequest {}

message GetSchoolProfileResponse {
  SchoolProfile profile = 1;
  // found is false when the school has not filled its details yet.
  bool found = 2;
}

message SetSchoolProfileRequest {
  SchoolProfile profile = 1;
}

message SetSchoolProfileResponse {
  SchoolProfile profile = 1;
}
