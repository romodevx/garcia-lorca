// Config / Academic Catalog (M04) — the academic structure the whole spine hangs
// off: cycles → levels → grade_levels → groups → subjects → terms, with the
// hybrid cycle model (per-level enrollment_granularity).
//
// FROZEN CONTRACT once merged (M04). All six entities live in ONE service/DB, so
// intra-catalog references are real FKs (no cross-service RPC within config).
// Every entity is tenant-scoped (RLS on app.current_tenant).
syntax = "proto3";

package garcialorca.config.v1;

import "google/protobuf/timestamp.proto";

// ConfigService is the academic-catalog API surface: catalog entities
// (levels, grade_levels, subjects) plus per-cycle entities (cycles, terms,
// groups). Per entity: Create / Get / List (lists are parent-scoped where
// natural).
service ConfigService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // --- levels (catalog) ---
  // CreateLevel adds a SEP education level with its enrollment granularity.
  rpc CreateLevel(CreateLevelRequest) returns (CreateLevelResponse);
  // GetLevel fetches a level by id.
  rpc GetLevel(GetLevelRequest) returns (GetLevelResponse);
  // ListLevels lists every level in the tenant catalog.
  rpc ListLevels(ListLevelsRequest) returns (ListLevelsResponse);
  // SetLevelAttendanceMode chooses how a level takes attendance: one list per
  // group per day (daily) or one per group, subject and day (per_class).
  rpc SetLevelAttendanceMode(SetLevelAttendanceModeRequest) returns (SetLevelAttendanceModeResponse);
  // SetLevelGradingScale configures a level's numeric grading (T6): whether it
  // is captured at all, its range, decimals and passing mark.
  rpc SetLevelGradingScale(SetLevelGradingScaleRequest) returns (SetLevelGradingScaleResponse);
  // UpdateLevel changes a level's attendance mode and/or grading scale in ONE
  // transaction: every present field is validated before anything is written,
  // so a half-valid request changes nothing. An absent field keeps its value;
  // a request with neither is InvalidArgument; an unknown level is NotFound.
  rpc UpdateLevel(UpdateLevelRequest) returns (UpdateLevelResponse);
  // ReorderLevels sets the school order ListLevels answers in: level_ids must
  // be exactly the tenant's levels, each once, first = sort_order 1. Any other
  // list (one missing, one extra, a repeat) is InvalidArgument and changes
  // nothing; the whole order is written in ONE transaction.
  rpc ReorderLevels(ReorderLevelsRequest) returns (ReorderLevelsResponse);

  // --- cycles (per-cycle umbrella) ---
  // CreateCycle adds a school-year umbrella (status defaults to draft).
  rpc CreateCycle(CreateCycleRequest) returns (CreateCycleResponse);
  // GetCycle fetches a cycle by id.
  rpc GetCycle(GetCycleRequest) returns (GetCycleResponse);
  // ListCycles lists every cycle in the tenant.
  rpc ListCycles(ListCyclesRequest) returns (ListCyclesResponse);
  // ActivateCycle makes a cycle the school's live year, standing down whichever
  // other was active. Everything downstream asks "which cycle is active" — the
  // roster header, the group dropdowns, the tuition table, the billing run — so
  // that question must have exactly one answer.
  rpc ActivateCycle(ActivateCycleRequest) returns (ActivateCycleResponse);
  // RenameCycle gives a cycle a new name, keeping its dates and status.
  rpc RenameCycle(RenameCycleRequest) returns (RenameCycleResponse);

  // --- grade_levels (catalog) ---
  // CreateGradeLevel adds a grade within a level.
  rpc CreateGradeLevel(CreateGradeLevelRequest) returns (CreateGradeLevelResponse);
  // GetGradeLevel fetches a grade_level by id.
  rpc GetGradeLevel(GetGradeLevelRequest) returns (GetGradeLevelResponse);
  // ListGradeLevels lists the grades of a level (scoped by level_id).
  rpc ListGradeLevels(ListGradeLevelsRequest) returns (ListGradeLevelsResponse);
  // RenameGradeLevel fixes a grade's name in place (same id, level and
  // ordinal). A name the level already has (case-insensitively) is
  // AlreadyExists; an unknown grade is NotFound.
  rpc RenameGradeLevel(RenameGradeLevelRequest) returns (RenameGradeLevelResponse);
  // DeleteGradeLevel removes a grade that holds nothing: one with groups (any
  // cycle), subjects or evaluation periods is AlreadyExists, and the message
  // names what blocks it and how many. Nothing outside config keeps a grade id.
  rpc DeleteGradeLevel(DeleteGradeLevelRequest) returns (DeleteGradeLevelResponse);

  // --- subjects (catalog) ---
  // CreateSubject adds a subject taught at a grade.
  rpc CreateSubject(CreateSubjectRequest) returns (CreateSubjectResponse);
  // GetSubject fetches a subject by id.
  rpc GetSubject(GetSubjectRequest) returns (GetSubjectResponse);
  // ListSubjects lists the subjects of a grade (scoped by grade_level_id).
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
  // RenameSubject changes a subject's name; its id and grade stay, so grades,
  // attendance and assignments follow it.
  rpc RenameSubject(RenameSubjectRequest) returns (RenameSubjectResponse);
  // DeleteSubject removes a subject that was never in a teacher's load
  // (AlreadyExists-coded conflict otherwise; it can only be renamed).
  rpc DeleteSubject(DeleteSubjectRequest) returns (DeleteSubjectResponse);

  // --- terms (per cycle, level) ---
  // CreateTerm adds a period within a cycle for a level.
  rpc CreateTerm(CreateTermRequest) returns (CreateTermResponse);
  // GetTerm fetches a term by id.
  rpc GetTerm(GetTermRequest) returns (GetTermResponse);
  // ListTerms lists the terms of a cycle (scoped by cycle_id, optional level_id).
  rpc ListTerms(ListTermsRequest) returns (ListTermsResponse);
  // SetTermMonths replaces the calendar months a term covers. A month outside
  // the cycle is InvalidArgument (X-Error-Code MONTH_OUTSIDE_CYCLE); a month
  // another term of the same cycle+level holds is AlreadyExists
  // (MONTH_IN_OTHER_TERM), naming the month.
  rpc SetTermMonths(SetTermMonthsRequest) returns (SetTermMonthsResponse);
  // CopyTermMonths makes each target level's terms mirror the source level's
  // months in one cycle (matched by ordinal; missing terms created from the
  // source; unmatched target terms emptied), in one transaction.
  rpc CopyTermMonths(CopyTermMonthsRequest) returns (CopyTermMonthsResponse);

  // --- evaluation periods (per cycle, grade_level; T14) ---
  // ListEvaluationPeriods lists the periods of a cycle, optionally narrowed to
  // a level's grades and/or one grade, by grade ordinal then period ordinal.
  rpc ListEvaluationPeriods(ListEvaluationPeriodsRequest) returns (ListEvaluationPeriodsResponse);
  // UpsertEvaluationPeriods makes the given periods the complete set of one
  // grade in a cycle (a row with the id of one of the grade's periods keeps
  // that id; a period not named is removed; an empty list clears the grade). Overlapping
  // periods are AlreadyExists (X-Error-Code PERIOD_OVERLAP); a period outside
  // the cycle is InvalidArgument (PERIOD_OUTSIDE_CYCLE); one ending before it
  // starts is InvalidArgument (PERIOD_ENDS_BEFORE_START).
  rpc UpsertEvaluationPeriods(UpsertEvaluationPeriodsRequest) returns (UpsertEvaluationPeriodsResponse);
  // CopyEvaluationPeriods gives each target grade the source grade's periods
  // (names and dates, matched by ordinal), in one transaction.
  rpc CopyEvaluationPeriods(CopyEvaluationPeriodsRequest) returns (CopyEvaluationPeriodsResponse);

  // --- groups (per cycle, grade_level) ---
  // CreateGroup adds a class group within a cycle for a grade.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // GetGroup fetches a group by id.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  // ListGroups lists the groups of a cycle (scoped by cycle_id, optional grade_level_id).
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // RenameGroup fixes a group's name in place (same id, cycle and grade). A
  // name its grade already has in the cycle is AlreadyExists; an unknown
  // group is NotFound. Allowed with pupils in it: everything keys on the id.
  rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);
  // GroupUsage counts what config itself keeps of a group: teaching
  // assignments and the timetable blocks placed on them. The gateway asks
  // the other services the same question before DeleteGroup (ADR 0036).
  rpc GroupUsage(GroupUsageRequest) returns (GroupUsageResponse);
  // DeleteGroup removes a group config holds nothing of: one with teaching
  // assignments (and so timetable blocks) is AlreadyExists naming the
  // counts. Other services' references are checked by the gateway first.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  // EnsurePlacements finds or creates, in ONE transaction, the level → grade →
  // group of each placement in a cycle (legacy student import, ADR 0033). A
  // level is matched by its folded name (case, accents and spacing ignored), a
  // grade by its ordinal within the level, a group by its name within the grade
  // and cycle — so nothing is ever created twice, even by two imports at once.
  // dry_run reports what WOULD be created and writes nothing.
  rpc EnsurePlacements(EnsurePlacementsRequest) returns (EnsurePlacementsResponse);

  // --- school calendar (M16) ---
  // CreateNonWorkingPeriod adds a holiday, vacation or suspension to a cycle.
  rpc CreateNonWorkingPeriod(CreateNonWorkingPeriodRequest) returns (CreateNonWorkingPeriodResponse);
  // ListNonWorkingPeriods lists every closed day range of a cycle. This is the
  // read the collection rules make: finance asks config what days the school is
  // shut, rather than every module carrying its own idea of the calendar.
  rpc ListNonWorkingPeriods(ListNonWorkingPeriodsRequest) returns (ListNonWorkingPeriodsResponse);
  // DeleteNonWorkingPeriod removes one period. A day entered by mistake has to
  // be removable, or the calendar becomes untrustworthy and stops being used.
  rpc DeleteNonWorkingPeriod(DeleteNonWorkingPeriodRequest) returns (DeleteNonWorkingPeriodResponse);

  // --- school agenda (M16) ---
  // CreateSchoolEvent records something the school DOES: a festival, a parents'
  // meeting, an exam week. Deliberately separate from the closed days — finance
  // reads those to move a due date, and an activity must never do that.
  rpc CreateSchoolEvent(CreateSchoolEventRequest) returns (CreateSchoolEventResponse);
  // ListSchoolEvents returns a cycle's agenda, earliest first.
  rpc ListSchoolEvents(ListSchoolEventsRequest) returns (ListSchoolEventsResponse);
  // DeleteSchoolEvent removes one event.
  rpc DeleteSchoolEvent(DeleteSchoolEventRequest) returns (DeleteSchoolEventResponse);

  // --- the school's details (task 12) ---
  // GetSchoolProfile returns what a receipt prints about the school; found is
  // false until somebody fills it in.
  rpc GetSchoolProfile(GetSchoolProfileRequest) returns (GetSchoolProfileResponse);
  // SetSchoolProfile replaces the school's details (every field).
  rpc SetSchoolProfile(SetSchoolProfileRequest) returns (SetSchoolProfileResponse);

  // --- teachers (catalog person records; NOT login accounts) ---
  // CreateTeacher adds a teacher catalog record (user_id reserved, may be empty).
  rpc CreateTeacher(CreateTeacherRequest) returns (CreateTeacherResponse);
  // GetTeacher fetches a teacher by id.
  rpc GetTeacher(GetTeacherRequest) returns (GetTeacherResponse);
  // ListTeachers lists every teacher in the tenant catalog.
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
  // SetTeacherUser links a teacher catalog record to an IAM user (or unlinks it
  // when user_id is empty). config only stores the link; the caller (gateway)
  // is responsible for validating that the user exists.
  rpc SetTeacherUser(SetTeacherUserRequest) returns (SetTeacherUserResponse);

  // --- teaching_assignments (the knot: teacher ↔ group ↔ subject ↔ cycle) ---
  // CreateTeachingAssignment binds a teacher to a (group, subject); the server
  // derives cycle_id from the group and enforces the relational invariants.
  rpc CreateTeachingAssignment(CreateTeachingAssignmentRequest) returns (CreateTeachingAssignmentResponse);
  // GetTeachingAssignment fetches a teaching assignment by id.
  rpc GetTeachingAssignment(GetTeachingAssignmentRequest) returns (GetTeachingAssignmentResponse);
  // ListTeachingAssignments lists assignments, optionally filtered by
  // cycle_id / group_id / teacher_id (empty = any).
  rpc ListTeachingAssignments(ListTeachingAssignmentsRequest) returns (ListTeachingAssignmentsResponse);
  // AssignTeachingLoad gives one teacher a batch of (group, subject) slots in
  // ONE transaction ("carga académica"). Every item is validated first; one
  // invalid item (malformed id, unknown group/subject/teacher, a subject of
  // another grade level, the same slot twice) fails the whole request and names
  // it. A slot already held by this teacher is skipped; a slot held by someone
  // else is reported in `conflicts` and left untouched, unless
  // replace_conflicts is set, in which case it is reassigned to this teacher.
  // Each slot still has exactly one teacher per cycle (no co-teaching).
  rpc AssignTeachingLoad(AssignTeachingLoadRequest) returns (AssignTeachingLoadResponse);
  // DeleteTeachingAssignment frees a (group, subject) slot. NotFound if the id
  // does not exist.
  rpc DeleteTeachingAssignment(DeleteTeachingAssignmentRequest) returns (DeleteTeachingAssignmentResponse);
  // ReassignTeachingAssignment hands an existing slot to another teacher,
  // keeping the assignment id. NotFound if the assignment does not exist;
  // InvalidArgument if the teacher does not.
  rpc ReassignTeachingAssignment(ReassignTeachingAssignmentRequest) returns (ReassignTeachingAssignmentResponse);

  // --- school timetable (T16, ADR 0023) ---
  // GetScheduleBoard is the base timetable of a cycle (the active cycle when
  // cycle_id is empty; NotFound when there is none) with the catalog it is
  // drawn with and each level's grid; teacher_id narrows the classes to one
  // teacher's.
  rpc GetScheduleBoard(GetScheduleBoardRequest) returns (GetScheduleBoardResponse);
  // GetScheduleDay is the effective timetable of a date (base + changes);
  // teacher_id narrows it to the classes that teacher gives or was replaced in.
  rpc GetScheduleDay(GetScheduleDayRequest) returns (GetScheduleDayResponse);
  // GetSchoolDay says whether a group has classes on a date: a weekday inside
  // its cycle's dates that no non-working period closes (unknown group:
  // NotFound). Attendance asks it before taking a list (T14), so the rule
  // lives here once.
  rpc GetSchoolDay(GetSchoolDayRequest) returns (GetSchoolDayResponse);
  // CreateScheduleBlock places a teaching assignment on a weekday and time.
  // A double-booked teacher or group is AlreadyExists (X-Error-Code
  // SCHEDULE_TEACHER_BUSY / SCHEDULE_GROUP_BUSY) naming the class.
  rpc CreateScheduleBlock(CreateScheduleBlockRequest) returns (CreateScheduleBlockResponse);
  // UpdateScheduleBlock moves or changes a class of the base timetable.
  rpc UpdateScheduleBlock(UpdateScheduleBlockRequest) returns (UpdateScheduleBlockResponse);
  // DeleteScheduleBlock removes a class (and its date-specific changes).
  rpc DeleteScheduleBlock(DeleteScheduleBlockRequest) returns (DeleteScheduleBlockResponse);
  // CreateScheduleOverride changes one class on one date (substitute, swap,
  // cancel), judged on that date's effective timetable.
  rpc CreateScheduleOverride(CreateScheduleOverrideRequest) returns (CreateScheduleOverrideResponse);
  // DeleteScheduleOverride undoes a date-specific change.
  rpc DeleteScheduleOverride(DeleteScheduleOverrideRequest) returns (DeleteScheduleOverrideResponse);
  // ListAvailableTeachers lists the teachers free in a slot, best fits first.
  rpc ListAvailableTeachers(ListAvailableTeachersRequest) returns (ListAvailableTeachersResponse);
  // SetScheduleGrid saves the hours the calendar shows for a level.
  rpc SetScheduleGrid(SetScheduleGridRequest) returns (SetScheduleGridResponse);
  // ListScheduleEvents is the timetable's history, newest first.
  rpc ListScheduleEvents(ListScheduleEventsRequest) returns (ListScheduleEventsResponse);
  // T19 — teacher absences in the timetable (ADR 0032). An absence turns the
  // teacher's classes "uncovered" on its dates until a substitute or a
  // cancellation covers them. Never deleted: cancelled in place.
  // CreateTeacherAbsence registers one; the response counts the classes it
  // leaves uncovered (school days only).
  rpc CreateTeacherAbsence(CreateTeacherAbsenceRequest) returns (CreateTeacherAbsenceResponse);
  // UpdateTeacherAbsence changes an active absence (never its teacher).
  rpc UpdateTeacherAbsence(UpdateTeacherAbsenceRequest) returns (UpdateTeacherAbsenceResponse);
  // CancelTeacherAbsence cancels an absence, keeping the record.
  rpc CancelTeacherAbsence(CancelTeacherAbsenceRequest) returns (CancelTeacherAbsenceResponse);
  // ListTeacherAbsences lists a cycle's absences touching from..to.
  rpc ListTeacherAbsences(ListTeacherAbsencesRequest) returns (ListTeacherAbsencesResponse);
  // ListUncoveredClasses lists, date by date (at most 31 days), the classes
  // nobody gives because their teacher is absent.
  rpc ListUncoveredClasses(ListUncoveredClassesRequest) returns (ListUncoveredClassesResponse);

  // --- level deletion (ADR 0021) ---
  // PreviewLevelDeletion resolves a level's structure across ALL cycles (the
  // ids the other services need) and counts what config would archive.
  rpc PreviewLevelDeletion(PreviewLevelDeletionRequest) returns (PreviewLevelDeletionResponse);
  // ArchiveLevel moves the level and its structure into config's deletion
  // archive and records the batch in level_deletions, in ONE transaction. It is
  // the saga's LAST step. Idempotent per batch_id.
  rpc ArchiveLevel(ArchiveLevelRequest) returns (ArchiveLevelResponse);
  // RestoreLevelBatch puts the structure back (the saga's FIRST restore step).
  // A level whose name is taken now is refused whole: AlreadyExists with
  // X-Error-Code LEVEL_NAME_TAKEN, nothing restored.
  rpc RestoreLevelBatch(RestoreLevelBatchRequest) returns (RestoreLevelBatchResponse);
  // MarkLevelDeletionRestored closes a batch once every service restored it.
  rpc MarkLevelDeletionRestored(MarkLevelDeletionRestoredRequest) returns (MarkLevelDeletionRestoredResponse);
  // ListLevelDeletions lists the trash: batches still deleted (not restored,
  // not purged), newest first.
  rpc ListLevelDeletions(ListLevelDeletionsRequest) returns (ListLevelDeletionsResponse);
  // GetLevelDeletion fetches one batch. NotFound if unknown.
  rpc GetLevelDeletion(GetLevelDeletionRequest) returns (GetLevelDeletionResponse);
  // PurgeLevelArchives hard-deletes archives past the 7-day retention and marks
  // their batches purged. Superseded by the gateway's sweep (SweepLevelDeletions
  // + PurgeLevelBatch + MarkLevelDeletionPurged); kept for compatibility.
  rpc PurgeLevelArchives(PurgeLevelArchivesRequest) returns (PurgeLevelArchivesResponse);
  // BeginLevelDeletion is the saga's FIRST step and its lock: it sets the
  // level's status to DELETING (every write that resolves the level is then
  // refused with LEVEL_BEING_DELETED) and records the batch in level_deletions
  // (status deleting) with restorable_until = the database's now() + 7 days —
  // the one clock of the trash. The confirm token is single-use: its hash is
  // stored and a reuse is refused. Refusals: NotFound (unknown level),
  // AlreadyExists + X-Error-Code DELETION_IN_PROGRESS (the level is already
  // being deleted), AlreadyExists + PREVIEW_STALE (the token was used).
  // Idempotent per batch_id.
  rpc BeginLevelDeletion(BeginLevelDeletionRequest) returns (BeginLevelDeletionResponse);
  // CancelLevelDeletion closes a batch whose compensation FULLY succeeded:
  // nothing was deleted. The level (if it exists) goes back to ACTIVE.
  rpc CancelLevelDeletion(CancelLevelDeletionRequest) returns (CancelLevelDeletionResponse);
  // FailLevelDeletion records a batch whose compensation did NOT fully succeed
  // as failed_partial, naming the steps whose archives may still hold rows and
  // what was skipped. The trash lists it; restoring it recovers what was
  // deleted. The level (if it exists) stays DELETING until then.
  rpc FailLevelDeletion(FailLevelDeletionRequest) returns (FailLevelDeletionResponse);
  // SweepLevelDeletions is the retention sweep's question. It first turns every
  // batch stuck in `deleting` for longer than a saga can last (a gateway that
  // died mid-saga) into failed_partial with every step pending, then answers
  // the batches whose restorable_until has passed (database clock) and are not
  // purged yet.
  rpc SweepLevelDeletions(SweepLevelDeletionsRequest) returns (SweepLevelDeletionsResponse);
  // MarkLevelDeletionPurged closes a batch every service has purged.
  rpc MarkLevelDeletionPurged(MarkLevelDeletionPurgedRequest) returns (MarkLevelDeletionPurgedResponse);
  // PurgeLevelBatch hard-deletes config's archive rows of one batch.
  // Idempotent: an unknown or already purged batch purges nothing.
  rpc PurgeLevelBatch(PurgeLevelBatchRequest) returns (PurgeLevelBatchResponse);
  // BeginLevelRestore marks a batch RESTORING before a restore's first step —
  // compare-and-set from deleted | failed_partial | restored_partial, window
  // judged on the database's clock — so the sweep never purges it mid-way.
  // Refusals: NotFound (not in the trash), AlreadyExists + X-Error-Code
  // RESTORE_IN_PROGRESS, PermissionDenied + TRASH_EXPIRED (the level a
  // failed_partial batch still froze is let go). The answer's restoring_from is
  // the status the restore started from.
  rpc BeginLevelRestore(BeginLevelRestoreRequest) returns (BeginLevelRestoreResponse);
  // AbandonLevelRestore puts a batch whose restore failed back to its
  // restoring_from. A batch not restoring is answered as is. The sweep does
  // the same to a batch restoring for longer than 30 minutes.
  rpc AbandonLevelRestore(AbandonLevelRestoreRequest) returns (AbandonLevelRestoreResponse);
}

// --- Health ---------------------------------------------------------------

// HealthRequest is the empty liveness probe request.
message HealthRequest {}

// HealthResponse reports service liveness.
message HealthResponse {
  string status = 1;
}

// --- Enums ----------------------------------------------------------------

// EnrollmentGranularity drives the hybrid cycle model: a level enrolls per
// whole CYCLE or per TERM.
enum EnrollmentGranularity {
  ENROLLMENT_GRANULARITY_UNSPECIFIED = 0;
  ENROLLMENT_GRANULARITY_CYCLE = 1;
  ENROLLMENT_GRANULARITY_TERM = 2;
}

// AttendanceMode is how a level takes attendance (T3). DAILY: one pass list per
// group per day, which any teacher of the group may take. PER_CLASS: one pass
// list per group, subject and day, taken only by that subject's teacher.
enum AttendanceMode {
  ATTENDANCE_MODE_UNSPECIFIED = 0;
  ATTENDANCE_MODE_DAILY = 1;
  ATTENDANCE_MODE_PER_CLASS = 2;
}

// CycleStatus is a cycle's lifecycle state.
enum CycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0;
  CYCLE_STATUS_DRAFT = 1;
  CYCLE_STATUS_ACTIVE = 2;
  CYCLE_STATUS_CLOSED = 3;
}

// --- Entities -------------------------------------------------------------

// Level is a SEP education level (catalog). enrollment_granularity is the
// hybrid-model driver. tenant_id scopes RLS.
message Level {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string sep_code = 4;
  EnrollmentGranularity enrollment_granularity = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // attendance_mode is how the level's groups take attendance.
  AttendanceMode attendance_mode = 8;
  // grading is the level's numeric grading scale (T6).
  GradingScale grading = 9;
  // status is DELETING while a level deletion's saga runs (ADR 0021): writes
  // that resolve the level are refused with LEVEL_BEING_DELETED.
  LevelStatus status = 10;
  // sort_order is the level's place in the school order (1 = first);
  // ListLevels answers by it, then by name.
  int32 sort_order = 11;
}

// LevelStatus is a level's lifecycle (ADR 0021).
enum LevelStatus {
  LEVEL_STATUS_UNSPECIFIED = 0;
  LEVEL_STATUS_ACTIVE = 1;
  LEVEL_STATUS_DELETING = 2;
}

// GradingScale is how a level grades numerically. Marks are exact hundredths
// (5.00 = 500) so no float ever carries a grade boundary. enabled=false means
// the level takes no numeric capture at all (Preescolar); the numbers are then
// kept but unused. Invariant: 0 <= min < passing <= max <= 10000, decimals 0..2.
message GradingScale {
  bool enabled = 1;
  int32 min_hundredths = 2;
  int32 max_hundredths = 3;
  // decimals is how many decimal places a captured grade may carry.
  int32 decimals = 4;
  int32 passing_hundredths = 5;
}

// Cycle is a school-year umbrella (e.g. "2026-2027").
message Cycle {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  CycleStatus status = 4;
  google.protobuf.Timestamp starts_on = 5;
  google.protobuf.Timestamp ends_on = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// GradeLevel is a grade within a level (catalog). ordinal orders grades.
message GradeLevel {
  string id = 1;
  string tenant_id = 2;
  string level_id = 3;
  string name = 4;
  int32 ordinal = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Subject is a subject taught at a grade (catalog).
message Subject {
  string id = 1;
  string tenant_id = 2;
  string grade_level_id = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Term is a period within a cycle for a level (per cycle).
message Term {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string level_id = 4;
  string name = 5;
  int32 ordinal = 6;
  google.protobuf.Timestamp starts_on = 7;
  google.protobuf.Timestamp ends_on = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // months are the calendar months the term covers, "YYYY-MM", ascending.
  repeated string months = 11;
}

// Group is a class group within a cycle for a grade (per cycle).
message Group {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string grade_level_id = 4;
  string name = 5;
  int32 capacity = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Level RPC messages ---------------------------------------------------

// CreateLevelRequest creates a catalog level.
message CreateLevelRequest {
  string name = 1;
  string sep_code = 2;
  EnrollmentGranularity enrollment_granularity = 3;
}

// CreateLevelResponse returns the created level.
message CreateLevelResponse {
  Level level = 1;
}

// GetLevelRequest fetches a level by id.
message GetLevelRequest {
  string id = 1;
}

// GetLevelResponse returns the requested level.
message GetLevelResponse {
  Level level = 1;
}

// ListLevelsRequest lists all levels in the tenant.
message ListLevelsRequest {}

// ListLevelsResponse returns the tenant levels.
message ListLevelsResponse {
  repeated Level levels = 1;
}

// SetLevelAttendanceModeRequest changes one level's attendance mode.
message SetLevelAttendanceModeRequest {
  string id = 1;
  AttendanceMode attendance_mode = 2;
}

// SetLevelAttendanceModeResponse returns the updated level.
message SetLevelAttendanceModeResponse {
  Level level = 1;
}

// SetLevelGradingScaleRequest replaces one level's grading scale.
message SetLevelGradingScaleRequest {
  string id = 1;
  GradingScale grading = 2;
}

// SetLevelGradingScaleResponse returns the updated level.
message SetLevelGradingScaleResponse {
  Level level = 1;
}

// UpdateLevelRequest patches one level. attendance_mode and grading are each
// optional (absent = unchanged); at least one must be present.
message UpdateLevelRequest {
  string id = 1;
  optional AttendanceMode attendance_mode = 2;
  GradingScale grading = 3;
}

// UpdateLevelResponse returns the level after the change.
message UpdateLevelResponse {
  Level level = 1;
}

// ReorderLevelsRequest is the whole school order, first level first.
message ReorderLevelsRequest {
  repeated string level_ids = 1;
}

// ReorderLevelsResponse returns every level in its new order.
message ReorderLevelsResponse {
  repeated Level levels = 1;
}

// --- Cycle RPC messages ---------------------------------------------------

// CreateCycleRequest creates a school-year cycle.
message CreateCycleRequest {
  string name = 1;
  CycleStatus status = 2;
  google.protobuf.Timestamp starts_on = 3;
  google.protobuf.Timestamp ends_on = 4;
}

// CreateCycleResponse returns the created cycle.
message CreateCycleResponse {
  Cycle cycle = 1;
}

// GetCycleRequest fetches a cycle by id.
