// --- teachers / teaching_assignments (Phase 3) entities -------------------

// Teacher is a catalog person record, NOT a login account. user_id is a
// reserved link to a future IAM user and may be empty.
message Teacher {
  string id = 1;
  string tenant_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string user_id = 6;  // reserved IAM link; may be empty
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// TeachingAssignment is the knot binding a teacher to a (group, subject)
// within a cycle. cycle_id is derived server-side from the group.
message TeachingAssignment {
  string id = 1;
  string tenant_id = 2;
  string cycle_id = 3;
  string group_id = 4;
  string subject_id = 5;
  string teacher_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Teacher RPC messages -------------------------------------------------

// CreateTeacherRequest creates a teacher catalog record.
message CreateTeacherRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string user_id = 4;  // reserved IAM link; may be empty
}

// CreateTeacherResponse returns the created teacher.
message CreateTeacherResponse {
  Teacher teacher = 1;
}

// GetTeacherRequest fetches a teacher by id.
message GetTeacherRequest {
  string id = 1;
}

// GetTeacherResponse returns the requested teacher.
message GetTeacherResponse {
  Teacher teacher = 1;
}

// ListTeachersRequest lists all teachers in the tenant.
message ListTeachersRequest {}

// ListTeachersResponse returns the tenant teachers.
message ListTeachersResponse {
  repeated Teacher teachers = 1;
}

// SetTeacherUserRequest links a teacher to an IAM user. An empty user_id
// unlinks (stored as NULL).
message SetTeacherUserRequest {
  string teacher_id = 1;
  string user_id = 2;  // empty unlinks
}

// SetTeacherUserResponse returns the updated teacher.
message SetTeacherUserResponse {
  Teacher teacher = 1;
}

// --- TeachingAssignment RPC messages --------------------------------------

// CreateTeachingAssignmentRequest binds a teacher to a (group, subject). The
// server derives cycle_id from the group (never supplied by the client).
message CreateTeachingAssignmentRequest {
  string group_id = 1;
  string subject_id = 2;
  string teacher_id = 3;
}

// CreateTeachingAssignmentResponse returns the created assignment, including
// the server-derived cycle_id.
message CreateTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// GetTeachingAssignmentRequest fetches a teaching assignment by id.
message GetTeachingAssignmentRequest {
  string id = 1;
}

// GetTeachingAssignmentResponse returns the requested assignment.
message GetTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// ListTeachingAssignmentsRequest lists assignments filtered by any of
// cycle_id / group_id / teacher_id (empty = any).
message ListTeachingAssignmentsRequest {
  string cycle_id = 1;    // optional filter (empty = any cycle)
  string group_id = 2;    // optional filter (empty = any group)
  string teacher_id = 3;  // optional filter (empty = any teacher)
}

// ListTeachingAssignmentsResponse returns the matching assignments.
message ListTeachingAssignmentsResponse {
  repeated TeachingAssignment teaching_assignments = 1;
}

// TeachingLoadItem is one (group, subject) slot of a teaching load. The cycle
// is derived from the group.
message TeachingLoadItem {
  string group_id = 1;
  string subject_id = 2;
}

// TeachingLoadConflict is a requested slot another teacher already holds.
message TeachingLoadConflict {
  string group_id = 1;
  string subject_id = 2;
  string assignment_id = 3;  // the existing assignment occupying the slot
  string teacher_id = 4;     // the teacher currently holding it
  string teacher_name = 5;   // "first last" of that teacher
}

// AssignTeachingLoadRequest assigns every item to teacher_id. At most 500
// items per request (a technical bound on one transaction, not a limit on how
// many classes a teacher may hold).
message AssignTeachingLoadRequest {
  string teacher_id = 1;
  repeated TeachingLoadItem items = 2;
  bool replace_conflicts = 3;
}

// AssignTeachingLoadResponse reports what happened to each item, in request
// order within each list.
message AssignTeachingLoadResponse {
  repeated TeachingAssignment created = 1;
  repeated TeachingAssignment reassigned = 2;
  repeated TeachingLoadItem skipped = 3;  // already held by this teacher
  repeated TeachingLoadConflict conflicts = 4;  // left untouched (replace_conflicts=false)
}

// DeleteTeachingAssignmentRequest removes one assignment by id.
message DeleteTeachingAssignmentRequest {
  string id = 1;
}

// DeleteTeachingAssignmentResponse is empty: success means the slot is free.
message DeleteTeachingAssignmentResponse {}

// ReassignTeachingAssignmentRequest moves an assignment to another teacher.
message ReassignTeachingAssignmentRequest {
  string id = 1;
  string teacher_id = 2;
}

// ReassignTeachingAssignmentResponse returns the updated assignment.
message ReassignTeachingAssignmentResponse {
  TeachingAssignment teaching_assignment = 1;
}

// --- School calendar (M16) ------------------------------------------------

// NonWorkingPeriod is a day, or a run of days, on which the school does not
// operate. Both ends are inclusive; a single-day holiday has starts_on ==
// ends_on. Dates are plain YYYY-MM-DD strings, not timestamps: a holiday is a
// calendar day everywhere in Mexico, and a timestamp would invite a timezone
// to move it.
message NonWorkingPeriod {
  string id = 1;
  string cycle_id = 2;
  string label = 3;
  string kind = 4;  // holiday | vacation
  string starts_on = 5;
  string ends_on = 6;
}

// CreateNonWorkingPeriodRequest adds one closed period to a cycle.
message CreateNonWorkingPeriodRequest {
  string cycle_id = 1;
  string label = 2;
  string kind = 3;
  string starts_on = 4;
  string ends_on = 5;
}

// CreateNonWorkingPeriodResponse returns the created period.
message CreateNonWorkingPeriodResponse {
  NonWorkingPeriod period = 1;
}

// ListNonWorkingPeriodsRequest lists the closed periods of one cycle.
message ListNonWorkingPeriodsRequest {
  string cycle_id = 1;
}

// ListNonWorkingPeriodsResponse returns them ordered by start date.
message ListNonWorkingPeriodsResponse {
  repeated NonWorkingPeriod periods = 1;
}

// DeleteNonWorkingPeriodRequest removes one period by id.
message DeleteNonWorkingPeriodRequest {
  string id = 1;
}

// DeleteNonWorkingPeriodResponse is empty: the removal either happened or the
// call failed.
message DeleteNonWorkingPeriodResponse {}

// --- School agenda (M16) ---------------------------------------------------

// SchoolEvent is something the school does. Dates are plain YYYY-MM-DD, both
// ends inclusive, for the same reason a holiday is: a school day is a calendar
// day, and a timestamp would invite a timezone to move it.
//
// level_id and group_id are the audience: at most one is set, and neither means
// the whole school.
message SchoolEvent {
  string id = 1;
  string cycle_id = 2;
  string title = 3;
  string description = 4;
  string starts_on = 5;
  string ends_on = 6;
  string level_id = 7;
  string group_id = 8;
}

message CreateSchoolEventRequest {
  string cycle_id = 1;
  string title = 2;
  string description = 3;
  string starts_on = 4;
  string ends_on = 5;
  string level_id = 6;  // optional; empty and group_id empty = whole school
  string group_id = 7;  // optional
}

message CreateSchoolEventResponse {
  SchoolEvent event = 1;
}

message ListSchoolEventsRequest {
  string cycle_id = 1;
}

message ListSchoolEventsResponse {
  repeated SchoolEvent events = 1;
}

message DeleteSchoolEventRequest {
  string id = 1;
}

message DeleteSchoolEventResponse {}

// SchoolProfile is the school's details as a receipt prints them (task 12). The
// name is required; RFC and CCT come upper-cased, the phone as ten digits.
message SchoolProfile {
  string name = 1;
  string legal_name = 2;
  string rfc = 3;
  string cct = 4;
  string address = 5;
  string phone = 6;
  string legend = 7;
}

message GetSchoolProfileRequest {}

message GetSchoolProfileResponse {
  SchoolProfile profile = 1;
  // found is false when the school has not filled its details yet.
  bool found = 2;
}

message SetSchoolProfileRequest {
  SchoolProfile profile = 1;
}

message SetSchoolProfileResponse {
  SchoolProfile profile = 1;
}

// --- level deletion (ADR 0021) ---------------------------------------------

// LevelArchiveCount is how many rows of one kind a level deletion touches.
message LevelArchiveCount {
  string kind = 1;
  int64 count = 2;
}

// LevelRestoreSkip is rows of one kind a restore could not put back, and why.
message LevelRestoreSkip {
  string kind = 1;
  int64 count = 2;
  string reason = 3;
}

// LevelDeletion is one batch in the trash. status is deleting (saga in
// flight) | deleted | failed_partial (the deletion failed and could not be fully
// undone) | restored_partial (restored, but some rows did not fit and stay in
// the trash) | restoring (a restore in flight) | restored | cancelled (failed
// and fully undone) | purged.
// restorable_until is deleted_at + 7 days, on the database's clock.
message LevelDeletion {
  string batch_id = 1;
  string level_id = 2;
  string level_name = 3;
  repeated LevelArchiveCount counts = 4;
  string deleted_by = 5;
  string deleted_by_name = 6;
  google.protobuf.Timestamp deleted_at = 7;
  google.protobuf.Timestamp restorable_until = 8;
  string status = 9;
  // pending_steps (failed_partial only) are the services whose archives may
  // still hold rows of this batch; a restore asks exactly these.
  repeated string pending_steps = 10;
  // skipped is what a compensation or a restore could not put back.
  repeated LevelRestoreSkip skipped = 11;
  // restoring_from (status restoring only) is where the running restore began
  // and where a failed one falls back to.
  string restoring_from = 12;
}

message PreviewLevelDeletionRequest {
  string level_id = 1;
}

message PreviewLevelDeletionResponse {
  string level_id = 1;
  string level_name = 2;
  repeated LevelArchiveCount counts = 3;
  repeated string grade_level_ids = 4;
  repeated string group_ids = 5;
  repeated string subject_ids = 6;
  repeated string term_ids = 7;
  // level_status is DELETING while another deletion of it runs.
  LevelStatus level_status = 8;
}

message ArchiveLevelRequest {
  string batch_id = 1;
  string level_id = 2;
  // deleted_by / deleted_by_name are the verified principal (never the body).
  string deleted_by = 3;
  string deleted_by_name = 4;
  // summary is what the other services archived; config adds its own counts
  // and records the total in level_deletions.
  repeated LevelArchiveCount summary = 5;
}

message ArchiveLevelResponse {
  repeated LevelArchiveCount counts = 1;
  LevelDeletion deletion = 2;
}

message RestoreLevelBatchRequest {
  string batch_id = 1;
}

message RestoreLevelBatchResponse {
  repeated LevelArchiveCount restored = 1;
  repeated LevelRestoreSkip skipped = 2;
}

message MarkLevelDeletionRestoredRequest {
  string batch_id = 1;
  // partial: every service answered, but some rows did not fit; the batch
  // stays in the trash as restored_partial so a retry can finish it.
  bool partial = 2;
}

message MarkLevelDeletionRestoredResponse {
  LevelDeletion deletion = 1;
}

message ListLevelDeletionsRequest {}

message ListLevelDeletionsResponse {
  repeated LevelDeletion deletions = 1;
}

message GetLevelDeletionRequest {
  string batch_id = 1;
}

message GetLevelDeletionResponse {
  LevelDeletion deletion = 1;
}

message PurgeLevelArchivesRequest {}

message PurgeLevelArchivesResponse {
  int64 purged_rows = 1;
}

message BeginLevelDeletionRequest {
  string batch_id = 1;
  string level_id = 2;
  // token_hash is the SHA-256 (hex) of the confirm token: single use.
  string token_hash = 3;
  // deleted_by / deleted_by_name are the verified principal (never the body).
  string deleted_by = 4;
  string deleted_by_name = 5;
}

message BeginLevelDeletionResponse {
  LevelDeletion deletion = 1;
}

message CancelLevelDeletionRequest {
  string batch_id = 1;
}

message CancelLevelDeletionResponse {
  LevelDeletion deletion = 1;
}

message FailLevelDeletionRequest {
  string batch_id = 1;
  repeated string pending_steps = 2;
  repeated LevelRestoreSkip skipped = 3;
}

message FailLevelDeletionResponse {
  LevelDeletion deletion = 1;
}

message SweepLevelDeletionsRequest {}

message SweepLevelDeletionsResponse {
  repeated LevelDeletion expired = 1;
  int64 stalled = 2;
}

message MarkLevelDeletionPurgedRequest {
  string batch_id = 1;
}

message MarkLevelDeletionPurgedResponse {
  LevelDeletion deletion = 1;
}

message PurgeLevelBatchRequest {
  string batch_id = 1;
}

message PurgeLevelBatchResponse {
  int64 purged_rows = 1;
}

message BeginLevelRestoreRequest {
  string batch_id = 1;
}

message BeginLevelRestoreResponse {
  LevelDeletion deletion = 1;
}

message AbandonLevelRestoreRequest {
  string batch_id = 1;
}

message AbandonLevelRestoreResponse {
  LevelDeletion deletion = 1;
}

// --- school timetable (T16, ADR 0023) -----------------------------------------
// Times are minutes since midnight (5-minute steps); a class is [starts_at,
// ends_at). Weekdays are ISO: 1 = Monday … 5 = Friday. Dates are midnight UTC.

// ScheduleActor is who makes a change, as the gateway names them.
message ScheduleActor {
  string user_id = 1;
  string name = 2;
}

// ScheduleGrid is the hours the calendar shows for a level.
message ScheduleGrid {
  string level_id = 1;
  int32 grid_start = 2;
  int32 grid_end = 3;
}

// ScheduleBlock is one class of the base timetable: a teaching assignment on
// a weekday at a time.
message ScheduleBlock {
  string id = 1;
  string cycle_id = 2;
  string assignment_id = 3;
  string group_id = 4;
  string subject_id = 5;
  string teacher_id = 6;
  int32 weekday = 7;
  int32 starts_at = 8;
  int32 ends_at = 9;
}

// ScheduleOverride changes one class on one date.
message ScheduleOverride {
  string id = 1;
  string cycle_id = 2;
  string block_id = 3;
  google.protobuf.Timestamp date = 4;
  // kind: "substitute" | "swap" | "cancel".
  string kind = 5;
  string teacher_id = 6;
  string swap_block_id = 7;
  string reason = 8;
  ScheduleActor created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ScheduledClass is a class as it happens on a date.
message ScheduledClass {
  ScheduleBlock block = 1;
  string teacher_id = 2;
  int32 starts_at = 3;
  int32 ends_at = 4;
  // status: "regular" | "substitute" | "swapped" | "cancelled" | "uncovered".
  string status = 5;
  ScheduleOverride override = 6;
  // absence is set when status is "uncovered": why nobody gives the class.
  TeacherAbsence absence = 7;
}

// ScheduleEvent is one entry of the timetable's history.
message ScheduleEvent {
  string id = 1;
  string cycle_id = 2;
  google.protobuf.Timestamp at = 3;
  ScheduleActor by = 4;
  string action = 5;
  string block_id = 6;
  string override_id = 7;
  // date is set for entries about a date-specific change.
  google.protobuf.Timestamp date = 8;
  string reason = 9;
  string summary = 10;
  // absence_id is set for entries about a teacher absence (T19).
  string absence_id = 11;
}

// AvailableTeacher is a teacher free in a slot; match: "subject" | "grade" | "other".
message AvailableTeacher {
  Teacher teacher = 1;
  string match = 2;
}

message GetScheduleBoardRequest {
  string cycle_id = 1;
  string teacher_id = 2;
}

message GetScheduleBoardResponse {
  Cycle cycle = 1;
  repeated Cycle cycles = 2;
  bool started = 3;
  repeated ScheduleGrid grids = 4;
  repeated Level levels = 5;
  repeated GradeLevel grade_levels = 6;
  repeated Group groups = 7;
  repeated Subject subjects = 8;
  repeated Teacher teachers = 9;
  repeated TeachingAssignment assignments = 10;
  repeated ScheduleBlock blocks = 11;
}

message GetScheduleDayRequest {
  string cycle_id = 1;
  google.protobuf.Timestamp date = 2;
  string teacher_id = 3;
}

message GetScheduleDayResponse {
  google.protobuf.Timestamp date = 1;
  int32 weekday = 2;
  repeated ScheduledClass classes = 3;
  // non_working is the school-calendar label closing the date ("" on a
  // school day); a closed date has no classes.
  string non_working = 4;
}

message GetSchoolDayRequest {
  // group_id: the group whose cycle's calendar answers (one lookup for the caller).
  string group_id = 1;
  google.protobuf.Timestamp date = 2;
}

// GetSchoolDayResponse: open is false on a weekend, outside the cycle, or on a
// closed day; closed_label names the non-working period ("" otherwise).
message GetSchoolDayResponse {
  bool open = 1;
  string closed_label = 2;
}

// ScheduleBlockInput places a teaching assignment; once the cycle has started
// reason is required to change a class, optional to add one.
message ScheduleBlockInput {
  string assignment_id = 1;
  int32 weekday = 2;
  int32 starts_at = 3;
  int32 ends_at = 4;
  string reason = 5;
}

message CreateScheduleBlockRequest {
  ScheduleBlockInput block = 1;
  ScheduleActor actor = 2;
}

message CreateScheduleBlockResponse {
  ScheduleBlock block = 1;
}

message UpdateScheduleBlockRequest {
  string id = 1;
  ScheduleBlockInput block = 2;
  ScheduleActor actor = 3;
}

message UpdateScheduleBlockResponse {
  ScheduleBlock block = 1;
}

message DeleteScheduleBlockRequest {
  string id = 1;
  string reason = 2;
  ScheduleActor actor = 3;
}

message DeleteScheduleBlockResponse {}

message CreateScheduleOverrideRequest {
  string block_id = 1;
  google.protobuf.Timestamp date = 2;
  string kind = 3;
  string teacher_id = 4;
  string swap_block_id = 5;
  string reason = 6;
  ScheduleActor actor = 7;
  // replace_override_id replaces, in the same step, a substitute or a
  // cancellation of the same class that date (T19: the substitute is absent).
  string replace_override_id = 8;
}

message CreateScheduleOverrideResponse {
  ScheduleOverride override = 1;
}

message DeleteScheduleOverrideRequest {
  string id = 1;
  string reason = 2;
  ScheduleActor actor = 3;
}

message DeleteScheduleOverrideResponse {}

// ListAvailableTeachersRequest: date (effective timetable) when set,
// otherwise the base timetable of weekday.
message ListAvailableTeachersRequest {
  string cycle_id = 1;
  string group_id = 2;
  string subject_id = 3;
  int32 weekday = 4;
  google.protobuf.Timestamp date = 5;
  int32 starts_at = 6;
  int32 ends_at = 7;
  string exclude_block_id = 8;
}

message ListAvailableTeachersResponse {
  repeated AvailableTeacher teachers = 1;
}

message SetScheduleGridRequest {
  string level_id = 1;
  int32 grid_start = 2;
  int32 grid_end = 3;
}

message SetScheduleGridResponse {
  ScheduleGrid grid = 1;
}

message ListScheduleEventsRequest {
  string cycle_id = 1;
  int32 limit = 2;
}

message ListScheduleEventsResponse {
  repeated ScheduleEvent events = 1;
}

// TeacherAbsence is a teacher away on starts_on..ends_on (both inclusive),
// all day or during [start_minute, end_minute) of each date (T19). kind:
// "sick" | "vacation" | "personal" | "other"; kind and note are for
// schedule:write holders only (the gateway shapes them away for the rest).
message TeacherAbsence {
  string id = 1;
  string cycle_id = 2;
  string teacher_id = 3;
  string kind = 4;
  google.protobuf.Timestamp starts_on = 5;
  google.protobuf.Timestamp ends_on = 6;
  bool all_day = 7;
  int32 start_minute = 8;
  int32 end_minute = 9;
  string note = 10;
  ScheduleActor created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // cancelled_at is unset while the absence is active.
  google.protobuf.Timestamp cancelled_at = 14;
  ScheduleActor cancelled_by = 15;
}

// TeacherAbsenceInput: an empty cycle_id means the cycle containing
// starts_on; all_day ignores the minutes.
message TeacherAbsenceInput {
  string cycle_id = 1;
  string teacher_id = 2;
  string kind = 3;
  google.protobuf.Timestamp starts_on = 4;
  google.protobuf.Timestamp ends_on = 5;
  bool all_day = 6;
  int32 start_minute = 7;
  int32 end_minute = 8;
  string note = 9;
}

message CreateTeacherAbsenceRequest {
  TeacherAbsenceInput absence = 1;
  ScheduleActor actor = 2;
}

message CreateTeacherAbsenceResponse {
  TeacherAbsence absence = 1;
  int32 uncovered_count = 2;
}

message UpdateTeacherAbsenceRequest {
  string id = 1;
  TeacherAbsenceInput absence = 2;
  ScheduleActor actor = 3;
}

message UpdateTeacherAbsenceResponse {
  TeacherAbsence absence = 1;
  int32 uncovered_count = 2;
}

message CancelTeacherAbsenceRequest {
  string id = 1;
  ScheduleActor actor = 2;
  // caller_teacher_id is the teacher record linked to the caller ("" for
  // none): nobody cancels their own absence (SCHEDULE_ABSENCE_OWN).
  string caller_teacher_id = 3;
}

message CancelTeacherAbsenceResponse {
  TeacherAbsence absence = 1;
}

message ListTeacherAbsencesRequest {
  string cycle_id = 1;
  string teacher_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  bool include_cancelled = 5;
}

message ListTeacherAbsencesResponse {
  repeated TeacherAbsence absences = 1;
}

message ListUncoveredClassesRequest {
  string cycle_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// UncoveredClass is a class nobody gives on date.
message UncoveredClass {
  google.protobuf.Timestamp date = 1;
  ScheduledClass scheduled_class = 2;
}

message ListUncoveredClassesResponse {
  repeated UncoveredClass classes = 1;
}

// PlacementRequest is one (level, grade, group) an import needs.
message PlacementRequest {
  // level_id names an existing level; otherwise new_level_name is matched by
  // its folded name and created only when no level matches.
  string level_id = 1;
  string new_level_name = 2;
  int32 grade_ordinal = 3;   // 1..n; a created grade is named "<n>°"
  string group_name = 4;     // trimmed and upper-cased ("A")
  int32 capacity = 5;        // used only when the group is created; >= 1
}

message EnsurePlacementsRequest {
  string cycle_id = 1;
  repeated PlacementRequest placements = 2;  // at most 200
  bool dry_run = 3;
}

// Placement answers one PlacementRequest, in order. With dry_run the ids of
// what would be created are empty.
message Placement {
  string level_id = 1;
  string level_name = 2;
  bool level_created = 3;
  string grade_level_id = 4;
  string grade_name = 5;
  bool grade_created = 6;
  string group_id = 7;
  string group_name = 8;
  bool group_created = 9;
  int32 capacity = 10;       // the group's capacity after the call
  // error is a stable code when this placement cannot be honoured:
  // "level_not_found", "level_being_deleted", "invalid_placement".
  string error = 11;
}

message EnsurePlacementsResponse {
  repeated Placement placements = 1;
}
