// Scholarships / Becas (M08) — application/cancellation affecting finance.
// FASE 0 contract-first stub.
syntax = "proto3";

package garcialorca.scholarships.v1;

// ScholarshipsService is the scholarships API surface.
service ScholarshipsService {
  // Health is the liveness/ping probe present on every service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // TODO(M08): ApplyScholarship, CancelScholarship, GetScholarship.
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// Scholarship references a student. TODO(M08): percentage, status, cycle_id.
message Scholarship {
  string id = 1;
  string student_id = 2;
}

// --- Domain events (published) ---

// ScholarshipApplied fires when a scholarship is granted to a student.
// TODO(M08): percentage, effective_cycle_id, applied_at.
message ScholarshipApplied {
  string scholarship_id = 1;
  string student_id = 2;
  string tenant_id = 3;
}

// ScholarshipCancelled fires when an active scholarship is revoked.
// TODO(M08): reason, cancelled_at.
message ScholarshipCancelled {
  string scholarship_id = 1;
  string student_id = 2;
  string tenant_id = 3;
}
