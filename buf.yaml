# buf v2 configuration — single module rooted at proto/.
# Contracts live here; gen/ is 100% generated (never committed).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # Our directories already follow garcialorca/<domain>/v1/<domain>.proto and
  # packages garcialorca.<domain>.v1, so the default package layout rules hold.
breaking:
  use:
    - FILE
# NOTE: managed mode (go_package injection) is configured in buf.gen.yaml, NOT
# here — the v2 buf.yaml schema has no `managed` field (it lives in the gen
# config). Keeping it here breaks `buf lint`/`buf generate`.
